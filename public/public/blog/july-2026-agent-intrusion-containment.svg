<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The July 2026 agent intrusion chain against MVM's numbered claims</title>
<desc id="desc">The escape chain — evaluation sandbox, package registry cache proxy zero-day, external command and control, production pods — shown above the MVM conformance claims that refuse each step: MVM-SEC-10 network admission, MVM-SEC-01 host filesystem shares, MVM-SEC-13 and 16 secret substitution, MVM-SEC-15 sealed image, MVM-SEC-08 signed execution plan and audit chain.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="0.5" stop-color="#121821"/><stop offset="1" stop-color="#0b1620"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#010409" flood-opacity="0.42"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity="0.18" stroke="#30363d" stroke-width="1">
<path d="M110 200H1490M110 360H1490M110 520H1490M110 680H1490"/>
<path d="M430 150V800M750 150V800M1070 150V800"/>
</g>

<text x="110" y="108" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700" fill="#e6edf3">July 2026 agent intrusion</text>
<text x="110" y="152" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" fill="#8b949e">The escape chain, and the numbered claims that refuse each step</text>

<text x="110" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#f85149" letter-spacing="2">WHAT HAPPENED</text>

<g filter="url(#soft)">
<rect x="110" y="256" width="270" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="450" y="256" width="270" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="790" y="256" width="270" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<rect x="1130" y="256" width="270" height="104" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
</g>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#e6edf3" font-size="21" font-weight="600">
<text x="134" y="300">Evaluation sandbox</text>
<text x="474" y="300">Registry cache proxy</text>
<text x="814" y="300">External C2 host</text>
<text x="1154" y="300">Production pods</text>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8b949e" font-size="15">
<text x="134" y="330">ExploitGym run</text>
<text x="474" y="330">zero-day → internet</text>
<text x="814" y="330">17,600 actions</text>
<text x="1154" y="330">RCE + secret read</text>
</g>
<g stroke="#f85149" stroke-width="2.5" marker-end="url(#arrow)" opacity="0.9">
<path d="M382 308H444"/><path d="M722 308H784"/><path d="M1062 308H1124"/>
</g>

<text x="110" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#3fb950" letter-spacing="2">WHAT THE BOUNDARY REFUSES</text>

<g filter="url(#soft)">
<rect x="110" y="478" width="1290" height="212" rx="14" fill="#0f1620" stroke="#1f6feb" stroke-width="1.5" opacity="0.95"/>
</g>
<text x="138" y="516" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#58a6ff">model/claims.toml — every claim carries a scenario and a typed witness</text>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
<rect x="138" y="538" width="152" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="158" y="565" fill="#58a6ff">MVM-SEC-10</text>
<text x="306" y="565" fill="#8b949e" font-size="16">no NIC; metadata, link-local and loopback forbidden</text>

<rect x="138" y="590" width="152" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="158" y="617" fill="#58a6ff">MVM-SEC-01</text>
<text x="306" y="617" fill="#8b949e" font-size="16">no host-fs read beyond admitted shares</text>

<rect x="762" y="590" width="196" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="782" y="617" fill="#58a6ff">MVM-SEC-13 / 16</text>
<text x="974" y="617" fill="#8b949e" font-size="16">no raw secret in the guest</text>

<rect x="762" y="538" width="152" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="782" y="565" fill="#58a6ff">MVM-SEC-15</text>
<text x="930" y="565" fill="#8b949e" font-size="16">sealed image: no shell, no exec, no PTY</text>

<rect x="138" y="642" width="152" height="40" rx="8" fill="#161b22" stroke="#30363d"/><text x="158" y="669" fill="#58a6ff">MVM-SEC-08</text>
<text x="306" y="669" fill="#8b949e" font-size="16">signed plan; the audit chain refuses a spliced segment</text>
</g>

<text x="110" y="762" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#8b949e">Outside this surface: Kubernetes RBAC, cloud IAM, cluster admission policy — roughly half of this incident.</text>
<text x="110" y="796" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#8b949e">No MVM guest was involved. This is what the boundary is built to refuse, not a claim about what would have happened.</text>
</svg>
