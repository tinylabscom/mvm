<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PHP2Shell inside an MVM microVM</title>
  <desc id="desc">A hostile HTTP request crosses declared host-owned ingress to a compromised PHP process. The process remains inside a no-NIC microVM, and all external authority is limited by a host-owned FlowMux policy gate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#101821"/>
      <stop offset="1" stop-color="#07131b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#010409" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#30363d" stroke-width="1">
    <path d="M100 170H1500M100 310H1500M100 450H1500M100 590H1500M100 730H1500"/>
    <path d="M300 100V800M600 100V800M900 100V800M1200 100V800"/>
  </g>

  <text x="100" y="155" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" fill="#e6edf3" font-weight="650">PHP2Shell inside MVM</text>
  <text x="100" y="208" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" fill="#8b949e" font-weight="500">RCE controls the process. It does not mint authority.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="337" width="260" height="150" rx="18" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="230" y="397" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" fill="#f85149" font-weight="650" text-anchor="middle">HOSTILE HTTP</text>
    <text x="230" y="435" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#e6edf3" text-anchor="middle">crafted request</text>

    <rect x="430" y="315" width="270" height="195" rx="18" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="565" y="370" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#d29922" font-weight="650" text-anchor="middle">HOST-OWNED</text>
    <text x="565" y="404" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#e6edf3" text-anchor="middle">declared ingress</text>
    <text x="565" y="441" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8b949e" text-anchor="middle">FlowMux / vsock</text>
    <text x="565" y="473" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle">known channel ≠ safe bytes</text>

    <rect x="775" y="280" width="700" height="350" rx="28" fill="#0e1720" stroke="#58a6ff" stroke-width="4"/>
    <text x="820" y="330" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#58a6ff" font-weight="700">MVM MICROVM · NO NIC</text>
    <rect x="840" y="370" width="280" height="165" rx="18" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="980" y="427" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" fill="#e6edf3" font-weight="650" text-anchor="middle">PHP worker</text>
    <text x="980" y="466" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#f85149" text-anchor="middle">compromised</text>
    <text x="980" y="503" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#8b949e" text-anchor="middle">memory · responses · uptime</text>

    <rect x="1190" y="370" width="225" height="165" rx="18" fill="#101820" stroke="#3fb950" stroke-width="2"/>
    <text x="1302" y="415" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#3fb950" font-weight="700" text-anchor="middle">AUTHORITY CEILING</text>
    <text x="1302" y="451" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#e6edf3" text-anchor="middle">signed plan</text>
    <text x="1302" y="481" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#e6edf3" text-anchor="middle">host policy gate</text>
    <text x="1302" y="511" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#e6edf3" text-anchor="middle">verified root</text>
  </g>

  <path d="M360 412H425" stroke="#8b949e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M700 412H835" stroke="#8b949e" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1120 452H1185" stroke="#8b949e" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="100" y="685" width="1375" height="105" rx="20" fill="#0e141b" stroke="#30363d" stroke-width="2"/>
  <text x="145" y="730" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#8b949e" font-weight="700">THE CLAIM</text>
  <text x="145" y="766" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" fill="#e6edf3" font-weight="500">Patch PHP to restore process integrity. Keep the boundary to contain the next unknown RCE.</text>
</svg>
