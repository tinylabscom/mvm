<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Malicious Hugging Face model attack chain</title>
<desc id="desc">a downloaded model file whose bytes are a pickle, loaded with torch.load, triggers a __reduce__ opcode that runs attacker code in the host process — the pattern behind the ~100 malicious models JFrog found on the Hugging Face Hub.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="0.5" stop-color="#121821"/><stop offset="1" stop-color="#0b1620"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#010409" flood-opacity="0.42"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity="0.20" stroke="#30363d" stroke-width="1">
<path d="M120 160H1480M120 300H1480M120 440H1480M120 580H1480M120 720H1480"/>
<path d="M320 110V820M620 110V820M920 110V820M1220 110V820"/>
</g>
<text x="120" y="190" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" fill="#e6edf3" font-weight="650" text-anchor="start">Malicious model, on load</text>
<text x="120" y="244" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" fill="#8b949e" font-weight="500" text-anchor="start">Hugging Face Hub — ~100 pickle backdoors (JFrog, 2024)</text>
<g filter="url(#soft)">
<rect x="120" y="360" width="248" height="190" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
<text x="244.0" y="449.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#e6edf3" font-weight="500" text-anchor="middle">downloaded</text>
<text x="244.0" y="483.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#e6edf3" font-weight="500" text-anchor="middle">.pt / .bin model</text>
<path d="M370.0 442.0 l13 13 l-13 13" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="398" y="360" width="248" height="190" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2" />
<text x="522.0" y="449.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#e6edf3" font-weight="500" text-anchor="middle">torch.load</text>
<path d="M648.0 442.0 l13 13 l-13 13" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="676" y="360" width="248" height="190" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2" />
<text x="800.0" y="449.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#e6edf3" font-weight="500" text-anchor="middle">unpickle</text>
<path d="M926.0 442.0 l13 13 l-13 13" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="954" y="360" width="248" height="190" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2" />
<text x="1078.0" y="449.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#e6edf3" font-weight="500" text-anchor="middle">__reduce__</text>
<path d="M1204.0 442.0 l13 13 l-13 13" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1232" y="360" width="248" height="190" rx="18" fill="#161b22" stroke="#f85149" stroke-width="2" />
<text x="1356.0" y="437.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="27" fill="#e6edf3" font-weight="500" text-anchor="middle">host process</text>
<text x="1356.0" y="479.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="23" fill="#f85149" font-weight="500" text-anchor="middle">reverse shell</text>
</g>
<text x="800.0" y="598" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" fill="#f85149" font-weight="500" text-anchor="middle">os.system(...) runs before the first weight is read</text>
<rect x="120" y="660" width="1360" height="120" rx="20" fill="#0e141b" stroke="#30363d" stroke-width="2" />
<text x="160" y="706" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#8b949e" font-weight="600" text-anchor="start">WHERE MVM STANDS</text>
<text x="160" y="748" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#3fb950" font-weight="500" text-anchor="start">containment: shipped (inside MVM)</text>
<text x="900" y="706" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" fill="#8b949e" font-weight="600" text-anchor="start">FORMAT REFUSAL</text>
<text x="900" y="748" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" fill="#d29922" font-weight="500" text-anchor="start">designed — not built</text>
</svg>
