# Browser wasm sandbox demo. Deliberately OUTSIDE the main workspace
# (see root Cargo.toml `exclude`) so wasm-bindgen and the wasm32 target
# never enter `cargo build --workspace` or CI. All governance logic lives
# in the in-workspace `mvm-contract` crate; this is a thin
# `#[wasm_bindgen]` shim over it.
[package]
name = "mvm-demo-web"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mvm-contract = { path = "../../crates/mvm-contract" }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
# Optimize for size: this ships to a browser. The demo loop is not hot,
# so size beats speed here.
opt-level = "s"
lto = true
