# ADR-070 — browser audit-log verifier. Deliberately OUTSIDE the main
# workspace (see root Cargo.toml `exclude`) so wasm-bindgen and the
# wasm32 target never enter `cargo build --workspace` or CI. All the
# verification logic + tests live in the in-workspace `mvm-verify`
# crate; this is a thin `#[wasm_bindgen]` shim over it.
[package]
name = "mvm-audit-verify-web"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mvm-verify = { path = "../../crates/mvm-verify" }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
# Optimize for size: this ships to a browser. The verify loop is not
# hot (audit logs are small), so size beats speed here.
opt-level = "s"
lto = true
