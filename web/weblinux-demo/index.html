<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebLinux demo — mvm</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --error: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.875rem; }
    main { padding: 1rem 1.5rem; }
    .toolbar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      cursor: pointer;
    }
    button:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }
    #status {
      font-size: 0.875rem;
      color: var(--muted);
    }
    .toolbar-label {
      font-size: 0.875rem;
      color: var(--muted);
      margin-left: auto;
    }
    .toolbar input[type="text"] {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.8125rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      min-width: 10rem;
    }
    .toolbar input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    #terminal {
      background: #000;
      border-radius: 10px;
      border: none;
      height: 65vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .terminal-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.875rem;
      background: #1f242c;
      -webkit-user-select: none;
      user-select: none;
    }
    .terminal-header .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.2);
    }
    .terminal-header .dot.close { background: #ff5f56; }
    .terminal-header .dot.minimize { background: #ffbd2e; }
    .terminal-header .dot.maximize { background: #27c93f; }
    .terminal-header .title {
      margin-left: auto;
      margin-right: auto;
      padding-right: 2.5rem;
      font-size: 0.8125rem;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    #log {
      flex: 1;
      color: #e6edf3;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      line-height: 1.4;
      padding: 0.75rem 1rem;
      margin: 0;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ready { color: var(--success); font-weight: 600; }
    .error { color: var(--error); font-weight: 600; }
    .input-line {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #000;
    }
    .input-line .prompt {
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
    }
    .input-line input {
      flex: 1;
      background: #000;
      color: #e6edf3;
      border: none;
      outline: none;
      padding: 0.4rem 0.6rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
    }
    .input-line input:disabled {
      background: var(--panel);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>WebLinux demo</h1>
    <p>Browser-hosted QEMU-Wasm engine booting an mvm-built x86_64 Linux guest.</p>
  </header>
  <main>
    <div class="toolbar">
      <button id="runBtn">Run</button>
      <button id="stopBtn" disabled>Stop</button>
      <span id="status">Status: idle</span>
      <label for="allowHost" class="toolbar-label">allow-host</label>
      <input id="allowHost" type="text" value="demo.mvm.local" spellcheck="false" />
    </div>
    <div id="terminal">
      <div class="terminal-header">
        <span class="dot close" aria-hidden="true"></span>
        <span class="dot minimize" aria-hidden="true"></span>
        <span class="dot maximize" aria-hidden="true"></span>
        <span class="title">guest@weblinux:~</span>
      </div>
      <pre id="log"></pre>
      <form id="input-form" class="input-line" autocomplete="off">
        <span class="prompt">$</span>
        <input id="command" type="text" spellcheck="false" autocomplete="off" disabled />
      </form>
    </div>
  </main>
  <script type="module" src="demo.js"></script>
</body>
</html>
