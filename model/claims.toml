level = "build"
witness_kinds = ["fn"]
suite = "asset_identity"
statement = "Every workload asset and pinned host share is content-identified in the signed plan, and share drift after admission fails closed"
# The digest type boundary validates 64-hex; admission pins each directory
# share's content digest and `enforce_admitted_shares` re-verifies it at
# mount time, closing the host-dir TOCTOU window; synthesis auto-derives the
# compute environment from measured image/kernel/verity state; the emitter
# writes a chain-signed `plan.asset_identities` entry; the CLI recomputes
# the same digest offline for comparison against the log labels.
witnesses = [
    "fn:admitted_share_digest_refuses_directory_changed_after_admission",
    "fn:synthesized_plan_records_share_and_caller_asset_identities",
    "fn:asset_identities_event_carries_kind_name_digest_labels",
    "fn:asset_identity_rejects_malformed_digests",
    "fn:test_audit_asset_id_parses",
]

[[claim]]
id = "MVM-SEC-18"
level = "build"
witness_kinds = ["fn"]
suite = "admission_budget"
statement = "A workload's resource consumption is bounded at admission — per workload and across the host — and CPU-bound at spawn where the host has a mechanism"
# Preview, not shipped, and the three controls have sharply different
# strengths. Admission is strong and host-independent: an operator-configured
# per-workload ceiling plus a host-wide budget that sums each live machine's
# the balloon's current commitment. CPU is real on Linux and on the in-house
# HVF VMM: a systemd transient scope binds `cpu.max` before the payload execs
# and the achieved tier is read back and audited, while HVF enforces the share
# in-process in its run loop and reads the achieved tier from the scheduler's
# measured record; libkrun has no in-process vCPU control and stays `declared`.
# Wall clock has no mechanism at all — it is authored, ceiling-checked,
# admitted and audited, and nothing stops the workload; wasm fuel/epoch is
# likewise declared but unwired; and a warm-claimed child is bounded at
# admission by the host-wide ceiling — the weakest bound available, since a
# shared standby parent carries no grant of its own — with its host-side CPU
# control re-armed on only one of the three claim paths.
# The limits are stated in full, marked open or closed individually, in the
# ADR-001 ledger's "Preview 18 limits" note; do not read this row as enforced
# without it.
witnesses = [
    "fn:a_boot_past_the_headroom_is_refused",
    "fn:budget_ignores_dead_machines",
    "fn:budget_counts_the_configured_maximum_not_current_usage",
    "fn:an_empty_host_admits_a_boot_within_headroom",
    "fn:an_unreadable_charge_record_is_skipped_rather_than_fatal",
    "fn:a_fuel_grant_contributes_no_cpu_share",
    "fn:a_live_machine_with_no_charge_record_is_not_counted",
    "fn:admission_refuses_a_grant_over_the_ceiling",
    "fn:the_ceiling_bounds_memory_even_though_no_one_granted_it",
    "fn:prod_refuses_a_cpu_grant_on_a_backend_that_cannot_bound_cpu",
    "fn:the_libkrun_tier_cannot_bound_cpu_off_linux",
    "fn:host_cpu_mechanism_gap_honors_hvf_quota_range",
    "fn:relay_config_threads_cpu_share_to_quota_scheduler",
    "fn:apply_grants_reads_quota_record_from_state_dir",
    "fn:a_share_grant_binds_the_spawn_when_the_mechanism_is_present",
    "fn:a_vm_with_no_recorded_scope_reads_back_as_declared_not_as_an_error",
    "fn:an_admitted_boot_writes_the_achieved_tier_to_the_audit_chain",
    "fn:a_wall_clock_bound_needs_a_clock_that_can_stop_the_workload",
    "fn:a_signed_plan_from_the_launch_path_arms_the_timer",
    "fn:a_granted_cpu_share_binds_a_real_spawn_to_its_quota",
    "fn:a_restored_child_is_cpu_bounded_by_its_admitted_grant",
    "fn:a_claimed_child_over_the_host_ceiling_is_refused",
    "fn:a_claimed_child_within_the_ceiling_is_admitted",
    "fn:the_refusal_names_the_ceiling_and_the_request",
    "fn:pool_matching_is_unchanged_by_the_bound",
]

[[claim]]
id = "MVM-SEC-20"
level = "build"
witness_kinds = ["fn", "ci"]
suite = "supply_chain"
statement = "Every published release artifact is authenticated under the release workflow's identity, directly or through a signed checksum manifest, and the build and fetch paths refuse an artifact whose required signature is missing or invalid"
# `release.yml` signs archives and manifests keyless through GitHub OIDC and
# publishes bundles carrying the Fulcio certificate and Rekor inclusion proof.
# Raw kernels, root filesystems, and metadata are covered by those signed
# checksum manifests rather than by individual bundles. The `verify-release`
# job re-downloads the published set, verifies the signatures against an
# identity regexp pinned to this workflow at a tag, and checks every covered
# blob against its authenticated digest. On the consuming side the build gate
# refuses a missing or malformed bundle and the fetch gate refuses an unsigned
# manifest before parsing it, with the hash-skip hatch explicitly not waiving
# the signature.
#
# The limit, which the statement carries deliberately: the two enforcement paths
# do not share a posture. `verify_signature` on the self-update path returns Ok
# with a warning when cosign is absent, so there the signature is best-effort and
# the SHA-256 pin is what still holds. A claim that said "every path refuses"
# would be false.
#
# `a_malformed_bundle_is_refused` is deliberately NOT listed. It exists, it is a
# good test, and it passes — but it is `#[cfg(feature = "manifest-verify")]`, and
# every use of that feature in CI is `cargo run --example`, never `cargo test
# --features`. No lane executes it. `check-claim-catalog` resolves `fn:` needles
# by text search and cannot see a cfg gate, so listing it would buy a witness
# that is green because nothing runs it — the same shape as the retired
# `mvm.secret_env` witness on claim 13. Wire the feature into a test lane and it
# becomes citable.
witnesses = [
    "ci:verify-release",
    "fn:accepted_identities_are_the_versioned_release_workflow",
    "fn:a_missing_bundle_refuses_and_names_the_asset",
    "fn:fetch_expected_hashes_refuses_an_unsigned_manifest_before_parsing",
    "fn:skip_hash_verify_does_not_waive_the_manifest_signature",
]
