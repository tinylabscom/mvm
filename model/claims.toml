# model/claims.toml --- the conformance ID register.
#
# Every numbered security claim this repository asserts, in one place, so that
# nothing is referenced without being defined. `CONFORMANCE.md` is generated
# from this file. A claim whose ID is not listed here fails `check-conformance`,
# and a claim listed here with no scenario and no witness fails it too.
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# `suite` names the Gherkin file under `features/suites/` that carries the
# scenario (R3). Every claim must have a scenario and at least one witness.
#
# `independent_verifiers` records how many independent implementations of a
# format a claim rests on, each checked against one shared corpus rather than
# against input it generated for itself. Two implementations that only ever see
# their own output agree by construction and prove nothing about each other.
#
# `witness_kinds` names the witness kinds that are meaningful for this claim,
# and each named kind must have at least one live witness. It exists because
# a witness can be deleted from the list below without any gate noticing: the
# catalog check verifies that listed witnesses exist, not that a claim still
# has the kinds of evidence it is supposed to have. Declaring them makes
# giving one up an explicit, reviewable edit rather than a silent deletion.
#
# The kinds are not uniform, deliberately. Some claims are properties of a
# shipped image and need a CI artifact or conformance witness; others are
# properties of code logic with no useful CI counterpart. Requiring both
# everywhere would buy fabricated witnesses, not assurance.
#
# Witness tokens are typed:
#   fn:NAME   -- a `fn NAME(` must exist under `crates/`
#   ci:NAME   -- NAME must appear in some `.github/workflows/*` file

spec = "mvm/1"

