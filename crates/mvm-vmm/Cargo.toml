[package]
name = "mvm-vmm"
version.workspace = true
edition.workspace = true
description = "Backend-agnostic VMM device model and hypervisor seam"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[package.metadata.mvm.architecture]
substrate_server_category = "per-VM provider plumbing (host agent, console, handoff, and backend-local vsock listeners)"

[dependencies]
anyhow.workspace = true
# Egress policy types used by the vsock egress bridge.
mvm-core = { workspace = true, features = ["egress-ca"] }
# Well-known vsock port constants for the in-guest agent.
mvm-net = { workspace = true }
# Backend-agnostic error handling used by the driver seam.
mvm-agentd = { workspace = true }
# Egress-substitution plan decode shared by backends.
mvm-contract = { workspace = true }
# In-memory ext4 writer for the per-boot FlowMux identity drive.
mvm-fs = { workspace = true }
# Structured logging used by host helpers.
tracing = { workspace = true }
# JSON serialization for host-service configs.
serde_json = { workspace = true }
serde = { workspace = true }
# Host event loop for the vsock host-side I/O thread.
mio = { workspace = true, features = ["os-poll", "os-ext"] }

# virtio split-virtqueue primitive used by virtio-mmio devices.
virtio-queue = "0.18"
# virtio-vsock packet layout for the vsock device.
virtio-vsock = "0.12"
# rust-vmm guest-memory primitive for safe guest DMA access.
vm-memory = { version = "0.18", default-features = false, features = ["backend-mmap"] }

# Entropy source for virtio-rng.
rand.workspace = true
# Unix sockets / file descriptors.
libc.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
base64.workspace = true
flate2.workspace = true

[dev-dependencies]
tempfile.workspace = true
mvm-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[features]
default = []
# The test-support surface builds plan fixtures out of mvm-core, so it has to
# turn that crate's feature on itself. Leaving it off only worked while every
# consumer happened to enable mvm-core/test-support for its own reasons.
test-support = ["mvm-core/test-support"]
