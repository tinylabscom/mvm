[package]
name = "mvm-oci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "OCI image distribution client for mvm — registry resolution, manifest fetch, digest verification, layer fetch with streaming + size caps. Layer unpack to ext4 and rootfs materialization land in later plan 74 W1 PRs."

[dependencies]
async-trait = "0.1"
hex.workspace = true
# `libc::O_NOFOLLOW` for the leaf open flag on the non-Linux unpack
# fallback. On Linux the unpacker resolves and writes through an
# `openat2(RESOLVE_IN_ROOT | RESOLVE_NO_SYMLINKS)` handle (rustix), so a
# parent component swapped to a symlink can't redirect the write.
libc = { workspace = true }
reqwest.workspace = true
rustls.workspace = true
rustix = { version = "1.1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
# Layer-to-tree unpacker. We use `tar::Archive` to iterate entries
# but never call `entry.unpack()` (it bypasses our security-envelope
# allow-lists); each entry's header drives a manual write through
# our own safety-checking helpers.
tar = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
xattr = { workspace = true }

[dev-dependencies]
base64.workspace = true
# Tests build in-memory tar fixtures into a temp tree and assert
# post-unpack invariants.
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "test-util", "time"] }
# Hermetic OCI registry fixture — tests run a tiny in-repo HTTP
# server on a random localhost port and point the client at it
# with `ClientConfig { protocol: HttpsExcept(["127.0.0.1:N"]) }`
# so the same fetcher exercises the same code paths it would
# against ghcr.io / docker.io.

[lints]
workspace = true
