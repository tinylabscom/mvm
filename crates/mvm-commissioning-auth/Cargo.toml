[package]
name = "mvm-commissioning-auth"
publish = false
description = "Effect-free macOS peer verification and one-use commissioning bootstrap permits."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
mvm-contract.workspace = true
rand.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", optional = true }
security-framework = { version = "3.7", optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[features]
default = []
native-caller-identity = ["dep:core-foundation", "dep:security-framework"]
# Non-production constructors and observations for exercising permit consumers.
test-support = []

[lints]
workspace = true
