[package]
name = "mvm-policy"
publish = false
description = "Shared authored workload-policy resolution for MVM clients and host admission"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
schema = ["dep:schemars", "mvm-contract/schema"]

[dependencies]
mvm-contract.workspace = true
mvm-core = { workspace = true, features = ["host-state"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
schemars = { version = "0.8", optional = true }

[dev-dependencies]
mvm-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
