[package]
name = "mvm-vm-host"
description = "Per-VM supervisor host processes for mvm — one process per guest VM. [[bin]]s: mvm-libkrun-supervisor (libkrun; gated by the libkrun-sys feature; merged in-process bridge), mvm-vz-supervisor (Vz VMM), and the shared mvm-bridge sidecar (external-VMM gateway/audit bridge for Firecracker + vz; replaces the former mvm-firecracker-bridge / mvm-vz-drainer). The shared lib carries the unified bridge config + passt-hash parsers (fuzzed)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Architectural invariant #1 (.github/workflows/architecture.yml, category 10):
# this crate IS per-VM substrate — one supervisor process per guest VM. Its Rust
# listeners are legitimate per-VM substrate servers, not orchestration
# control-plane servers. The first such listener: the
# `mvm-libkrun-supervisor` binds the host side of the `listen=false`
# workload-exit control vsock port (`<vm_state_dir>/vsock-5251.sock`) to capture
# a one-shot workload's exit code before poweroff. The Vz supervisor hosts the
# same family — its per-port vsock proxy (`<socket_dir>/vsock-<port>.sock`)
# splices host agent-RPC into the guest's VZVirtioSocketDevice.
[package.metadata.mvm.architecture]
substrate_server_category = "per-VM supervisor host processes (workload-exit control listener + vsock proxy + future per-VM provider listeners)"

# libkrun supervisor — requires the libkrun-sys FFI feature, so the
# default `cargo build --workspace` skips it on hosts without libkrun.h
# (mirrors the pre-consolidation required-features gate).
[[bin]]
name = "mvm-libkrun-supervisor"
path = "src/bin/mvm-libkrun-supervisor.rs"
required-features = ["libkrun-sys"]

# Shared per-VM bridge sidecar — the single sidecar for both external-VMM
# backends (replaces the former mvm-firecracker-bridge / mvm-vz-drainer).
# Cross-platform (not a whole-binary cfg gate): the Passt arm is Linux-only and
# confined, the VzIngest arm is macOS; per-arm cfg gating lives inside.
[[bin]]
name = "mvm-bridge"
path = "src/bin/mvm-bridge.rs"

# Rust-native Vz supervisor — the objc2 reimplementation of the (removed)
# Swift supervisor. macOS-only at runtime; the bin self-gates
# to a stub main() on other targets so non-macOS workspace builds stay green.
# The Virtualization.framework objc2 stack lives in the macOS target table
# below and the lib's cfg(target_os="macos") `vz_objc` module.
[[bin]]
name = "mvm-vz-supervisor"
path = "src/bin/mvm-vz-supervisor.rs"

# Per-VM host process for the raw HVF macOS backend (Plan 214). cfg-gated to
# macOS/aarch64 in source; a stub elsewhere.
[[bin]]
name = "mvm-hvf-supervisor"
path = "src/bin/mvm-hvf-supervisor.rs"

[dependencies]
mvm-core = { workspace = true }
mvm-hostd = { workspace = true }
# Codesigning gate on macOS (codesign::ensure_signed) for the
# libkrun supervisor bin.
mvm-backend = { workspace = true }
# vsock port constants (WORKLOAD_EXIT_PORT) for the exit-capture thread.
mvm-guest = { workspace = true }
# SupervisorConfig — the stdin JSON contract the Vz supervisor decodes.
mvm-build = { workspace = true }
# libkrun bindings/wrapper; FFI linkage gated by the libkrun-sys feature.
libkrun-sys = { workspace = true }
anyhow = { workspace = true }
# Prelaunch attach verify: G4 validity window (`check_window`
# takes `chrono::DateTime<Utc>`) + typed `AttachVerifyError`.
chrono = { workspace = true }
thiserror = "1"
ed25519-dalek = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Vz supervisor lifecycle: serial-queue dispatch bridged to async, SIGTERM
# handling, the terminal-state watch. rt (not rt-multi-thread) — one VM per
# process, all VZ calls serialize on the VM's own dispatch queue.
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "net", "io-util"] }

# Apple Virtualization.framework objc2 stack — macOS-only, already in the
# workspace lock (mvm-backend's vz path carries the same set, so
# no new third-party dependency).
[target.'cfg(target_os = "macos")'.dependencies]
# vsock proxy: dup() the guest connection fd → AsyncFd splice.
libc = { workspace = true }
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSError", "NSData", "NSFileManager", "NSFileHandle"] }
objc2-virtualization = { version = "0.3", features = [
    "VZBootLoader",
    "VZLinuxBootLoader",
    "VZVirtualMachine",
    "VZVirtualMachineConfiguration",
    "VZGenericPlatformConfiguration",
    "VZGenericMachineIdentifier",
    "VZPlatformConfiguration",
    "VZVirtioBlockDeviceConfiguration",
    "VZStorageDeviceConfiguration",
    "VZDiskImageStorageDeviceAttachment",
    "VZDirectorySharingDeviceConfiguration",
    "VZVirtioFileSystemDeviceConfiguration",
    "VZSharedDirectory",
    "VZSingleDirectoryShare",
    "VZVirtioEntropyDeviceConfiguration",
    "VZEntropyDeviceConfiguration",
    "VZSerialPortConfiguration",
    "VZVirtioConsoleDeviceSerialPortConfiguration",
    "VZSerialPortAttachment",
    "VZFileHandleSerialPortAttachment",
    "VZMemoryBalloonDeviceConfiguration",
    "VZVirtioTraditionalMemoryBalloonDeviceConfiguration",
    "VZMemoryBalloonDevice",
    "VZVirtioTraditionalMemoryBalloonDevice",
    "VZSocketDevice",
    "VZSocketDeviceConfiguration",
    "VZVirtioSocketDevice",
    "VZVirtioSocketDeviceConfiguration",
    "VZVirtioSocketConnection",
    "VZVirtioSocketListener",
    "VZNetworkDeviceConfiguration",
    "VZVirtioNetworkDeviceConfiguration",
    "VZNetworkDeviceAttachment",
    "VZFileHandleNetworkDeviceAttachment",
    "VZMACAddress",
] }

[dev-dependencies]
tempfile = { workspace = true }
# Shared ExecutionPlan fixtures (`plan::signing::test_support::sample_plan`) for
# the prelaunch verify tests — feature-gated so it never ships in a release build.
mvm-core = { workspace = true, features = ["test-support"] }
# Prelaunch live/process integration test (tests/prelaunch_live.rs): build the
# base/attach configs, frame the attach, sign a plan. All already normal deps —
# re-listed here so the integration-test target (a separate crate) can use them.
libkrun-sys = { workspace = true }
mvm-hostd = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
# standby_pool_live test — drive the real LibkrunBackend
# spawn_standby/claim_standby through the trait (already a normal dep).
mvm-backend = { workspace = true }
# Standby liveness/reap (kill(pid,0)/SIGTERM) in the live test.
libc = { workspace = true }

[features]
default = []
# Build the libkrun supervisor bin against libkrun's FFI.
libkrun-sys = ["libkrun-sys/libkrun-sys"]
# Live-boot integration tests (dev host with libkrun). Never in CI's no-VM lanes.
libkrun-live = ["libkrun-sys"]

[lints]
workspace = true
