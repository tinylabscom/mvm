[package]
name = "mvm-storage"
version.workspace = true
edition.workspace = true
description = "Volume backend trait + LocalBackend impl for mvm. ObjectStoreBackend + EncryptedBackend live in mvmd per plan 45 §D5 (Path C)."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
bytes = "1"
chrono.workspace = true
mvm-core.workspace = true
# IR `MountSource` that MountProvider resolves (B4). Acyclic: mvm-sdk does
# not depend on mvm-storage, and its only mvm-* normal dep is mvm-core.
mvm-sdk.workspace = true
serde.workspace = true
# Content-addressed volume digests (B3).
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "macros"] }
tracing.workspace = true
# DEK held in the EncryptedStorage struct is zeroized on drop.
zeroize.workspace = true
# S3 MountProvider — OFF by default (B4 step 4). The lean object_store, not
# aws-sdk-s3 (which drags in aws-config/aws-smithy + the aws-lc-rs C crypto
# closure the dep budget rejects). Only the `s3` feature pulls it, so the
# default tree stays clean. The opendal -> object_store consolidation (plan 126
# B2) is DONE — `mvm`'s template registry now uses object_store too, and opendal
# is gone from the workspace.
object_store = { version = "0.11", optional = true, default-features = false, features = [
    "aws",
] }
# Stream adapter for object_store's list(). Already in the `s3` dep tree via
# object_store/reqwest, so gating it here adds nothing new.
futures = { version = "0.3", optional = true }
# Reading the `External` mount config in s3.rs lib code. serde_json is also a
# dev-dep (for the non-s3 tests); the optional normal dep is s3-gated so the
# default build doesn't carry it.
serde_json = { workspace = true, optional = true }

[features]
# Real S3-backed mount source. Off by default; pulls object_store + its
# reqwest/rustls closure only when enabled.
s3 = ["dep:object_store", "dep:futures", "dep:serde_json"]

# Linux-only: the LUKS2 EncryptedStorage arm stages the DEK in a 0600 tempfile
# for `cryptsetup --key-file` (byte-exact, unlike newline-truncating stdin).
# tempfile is already a workspace + dev dep; this just promotes it to a normal
# dep on Linux. Non-Linux builds keep it dev-only.
[target.'cfg(target_os = "linux")'.dependencies]
tempfile.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
# The workspace tokio dep already enables "full"; declaring it again
# here is redundant. Tests need macros + rt-multi-thread for
# `#[tokio::test]` and that's already inherited.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
