[package]
name = "libkrun-sys"
version.workspace = true
edition.workspace = true
description = "Rust bindings for the Red Hat libkrun C library (Linux KVM, macOS HVF)"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
doctest = false

# ── What this crate is ─────────────────────────────────────────────
#
# Thin Rust bindings + a safe wrapper around Red Hat libkrun's C API.
# libkrun is a library-style VMM: linked directly into the calling
# binary, no out-of-process daemon. On Linux it uses KVM; on macOS it
# uses Hypervisor.framework. mvm uses it as a Tier 2 microVM backend
# and the builder-VM substrate.
#
# Two build modes:
#
#   * default (no feature) — no FFI, no link to libkrun. `start`/`stop`
#     return `Error::NotYetWired`. The workspace builds cleanly on hosts
#     without libkrun installed.
#
#   * `libkrun-sys` — checked-in FFI bindings + `-lkrun` link. Requires
#     libkrun.h on the host (probed by build.rs at the standard install
#     locations) and a working libkrun shared library at link time.
#
# This crate stays narrowly focused on the FFI surface — backend
# dispatch lives in mvm-runtime.

[dependencies]
mvm-core.workspace = true
libc.workspace = true
tracing.workspace = true
# `serde` is always on (with `derive`) so the `KrunContext`,
# `KrunDisk`, and `SupervisorConfig` types are serializable from
# any consumer — notably `mvm-runtime::LibkrunBackend`, which
# builds the supervisor's JSON without ever enabling `libkrun-sys`
# itself. Compile cost is marginal; serde is already in nearly
# every other workspace crate's dep graph.
serde = { workspace = true }
# `SupervisorConfig` carries the per-VM ExecutionPlan + PolicyBundle as
# `Option<serde_json::Value>` so the bin (`mvm-libkrun-supervisor`) can
# feed them into the bridge factory without typed coupling to the
# `mvm_core::plan` / `mvm_core::policy` structs at this layer; the
# bridge stays a serde boundary. The bin crate, being a leaf, deserializes the Values into
# typed `ExecutionPlan` / `PolicyBundle` since it can depend on
# both. Always-on (not feature-gated) because `SupervisorConfig` is
# always-on per the comment above.
serde_json.workspace = true
# We intentionally do NOT pull `mvm-agentd` from regular deps: that
# would form a diamond (mvm-libkrun → mvm-agentd → mvm-core ← mvm-libkrun)
# that, while not a true cycle, inflates build parallelism unnecessarily.
# mvm-core is now a pure sink — it does NOT depend on mvm-libkrun (commit
# 5073268b inverted that dep). The supervisor receives the vsock port list
# via the JSON config — the symbolic `GUEST_AGENT_PORT` constant is only
# needed by callers composing the config, not the supervisor consuming it.
# The `libkrun-smoke` example keeps `mvm-agentd` as a dev-dep because
# dev-deps are excluded from cycle analysis.
#
# The `mvm-libkrun-supervisor` bin lives in its own leaf crate
# (`crates/mvm-libkrun-supervisor/`) so it can also depend on
# `mvm-supervisor` for the gateway audit substrate. The optional
# `mvm-providers` + `serde_json` deps that previously gated the bin
# moved with it. `serde_json` is still needed in `[dev-dependencies]`
# for the `SupervisorConfig` / `KrunContext` serde-roundtrip tests.
[features]
default = []
# Opt-in: generate FFI bindings and link `libkrun`. Off by default so
# the workspace builds on hosts without libkrun installed (CI fast lane,
# Linux contributors who don't run the Tier 2 backend). With the
# supervisor bin moved to `mvm-libkrun-supervisor`, this feature only
# gates the FFI surface in lib.rs (`configure_*`,
# `run_supervisor`, etc.); the bin pulls its own dep chain.
libkrun-sys = []

[dev-dependencies]
# `TestEnv` env-var guard for PATH-sensitive supervisor tests.
mvm-core = { workspace = true, features = ["test-support"] }
# The smoke example shares `GUEST_AGENT_PORT` with the production vsock
# plumbing.
mvm-agentd.workspace = true
# `ensure_signed()` is the codesigning gate. macOS rejects
# any process that calls `Hypervisor.framework` without
# `com.apple.security.hypervisor`; the smoke binary self-signs on
# first run and re-spawns, same as `mvmctl up --hypervisor hvf` does.
mvm-runtime.workspace = true
# Unit tests for `KrunContext`'s serde shape (incl. the new
# `virtio_fs_mounts` field with `#[serde(default)]`
# back-compat) exercise the JSON pipe shape the supervisor binary
# carries. serde_json is already an optional regular dep behind
# `libkrun-sys`; listing it again as a dev-dep makes the test build
# independent of feature flags.
serde_json = { workspace = true }

# Manual smoke binary that boots a Nix-built kernel + ext4 rootfs via
# libkrun and blocks until the guest exits. Gated on
# `libkrun-sys` so the example only compiles on hosts with libkrun.h
# present.
[[example]]
name = "libkrun-smoke"
path = "examples/libkrun-smoke.rs"
required-features = ["libkrun-sys"]

# Long-running supervisor process. One process per libkrun guest. The
# bin moved to its own leaf crate (`crates/mvm-libkrun-supervisor/`) so
# it can depend on `mvm-supervisor` (gateway audit substrate) without
# closing the `mvm-supervisor → mvm-backend → mvm-libkrun` cycle.

[lints]
workspace = true
