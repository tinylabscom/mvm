[package]
name = "mvm-runtime"
version.workspace = true
edition.workspace = true
description = "VM lifecycle orchestration + VmBackend implementations for mvm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
autobins = false

[package.metadata.mvm.architecture]
substrate_server_category = "per-VM provider plumbing (host agent UDS bridge + backend-local vsock listeners)"

[dependencies]
# Volume backend contract plus the IR/protocol types used by persistence.
mvm-contract = { workspace = true, features = ["local", "volume"] }
# Backend-agnostic VMM device model + hypervisor seam; split out so concrete
# backends can depend on it without circular references to mvm-runtime.
mvm-vmm = { workspace = true }
mvm-backends = { workspace = true }
# `egress-ca`: `network_endpoint_spawn::build_egress_tls_delivery`
# mints the per-VM name-constrained intermediate (`crypto::egress_ca`) so the
# guest can trust host-terminated bound-host TLS. Sync (rcgen/ring), no tokio.
mvm-core = { workspace = true, features = ["egress-ca"] }
# The L3 policy core: the address allocator and the gateway's admitted
# configuration shape. Acyclic HIGH->LOW — mvm-net deps only mvm-core and
# mvm-contract.
mvm-net.workspace = true
mvm-agentd.workspace = true
# `builder-vm`/`pure-mkfs` for the overlay-aware admission gate
# (`builder_vm::admit_overlay_aware`) called from every backend's
# `start` impl.
mvm-build = { workspace = true, default-features = false, features = [
    "builder-vm",
    "pure-mkfs",
] }
# Direct use of the pure in-process ext4 materializer
# (`mvm_fs::rootfs`) for read-only host-directory share images.
mvm-fs.workspace = true
anyhow.workspace = true
# `OverlayManager` is an async trait carrying chrono timestamps +
# thiserror'd typed errors.
async-trait.workspace = true
thiserror.workspace = true
base64.workspace = true
# `LocalBackend`/`VolumeBackend` put/get payloads + the content-addressed
# volume digest store.
bytes = "1"
chrono.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
# Folded in with the former mvm-base crate: the base substrate's ui
# (ANSI output, in-house spinners + prompts) and secret handling (secrecy).
# Crypto helpers come from mvm_core::crypto, already available via the
# mvm-core dep above.
secrecy.workspace = true
# The lean S3 client for the fleet-operated template registry. Production
# tenant object-store volume providers are constructed by the fleet
# orchestrator, which implements this crate's `VolumeBackend` contract.
object_store = { version = "0.14", optional = true, default-features = false, features = [
    "aws",
] }
# `wasm_backend`'s host engine: instantiates a user-supplied WASI module.
# Optional + off by default (`wasm-backend` feature) so the default workspace
# build carries no wasmtime — it is a large dependency tree, like
# object_store behind the template-registry feature above.
wasmtime = { version = "46", optional = true }
wasmtime-wasi = { version = "46", optional = true }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
# The Apple Container kernel's digest pin is BLAKE3 (the fetched kernel is
# multi-hundred-MB; SHA-256 stays where it is contractually locked).
blake3.workspace = true
uuid.workspace = true
# `libc` for `kill(pid, 0)` liveness probes + SIGTERM/SIGKILL signaling
# in `LibkrunBackend::{stop, status, list}`.
libc.workspace = true
ext4-view.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
# `fs`: `LocalBackend`'s atomic put (write-tmp + fsync + rename) over
# `tokio::fs`.
tokio = { workspace = true, features = ["fs"] }
# DEK held in `EncryptedStorage` is zeroized on drop.
zeroize.workspace = true
[dev-dependencies]
# Used by tests/phase3c_supervisor_dispatch.rs only; the lib never names it.
libkrun-sys.workspace = true
mvm-core = { workspace = true, features = ["test-support"] }
# The sidecar resolver proves an artifact's libc from its `DT_NEEDED`, so a
# test that seeds a sidecar cache needs a real ELF object, not a stub.
mvm-fs = { workspace = true, features = ["test-support"] }
mvm-vmm = { workspace = true, features = ["test-support"] }

# KVM backend. Pre-generated bindings + safe ioctl wrappers;
# the in-repo kvm::x86_boot logic is pure and platform-independent.
[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.21"
kvm-bindings = "0.11"
nix = { version = "0.29", features = ["mount", "sched"] }

[features]
default = []
contributor-bootstrap = ["mvm-build/contributor-bootstrap"]
manifest-verify = ["mvm-core/manifest-verify"]
template-registry-s3 = ["dep:object_store"]
# The claim-free host-wasmtime portability tier (`WasmBackend`). Off by
# default; pulls the wasmtime + wasmtime-wasi closure only when enabled.
wasm-backend = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Apple Containerization-framework tier's live-boot smoke test. Off by
# default; the guest artifacts (Apple kernel + initfs) are a separate
# fetch, so this gates only the artifact-requiring e2e hook (itself
# `#[ignore]`d behind `MVM_AC_E2E`).
apple-container = []
# The hermetic in-memory `MockBackend`/`MockGuestAgent` test double + the
# `AnyBackend::Mock` variant that selects it. Off by default so the mock — a
# Tier-3 backend satisfying none of the security claims (no guest, no
# rootfs, no isolation) — never compiles into a production `mvmctl`
# binary; only an explicit `--hypervisor mock` (itself refused outside this
# feature) or the workspace test suite reaches it.
test-support = [
    "mvm-core/test-support",
    "mvm-backends/test-support",
    "mvm-fs/test-support",
]
# Debug-only Apple Silicon validation lane. The capability also requires a
# debug macOS/aarch64 build before it can advertise warm-claim support.
hvf-live-validation = []
# Explicit opt-in to the Apple APFS immutable snapshot provider. The normal
# build remains fail-closed until live mount and tamper validation is complete.
trusted-apfs = ["mvm-fs/trusted-apfs"]

[lints]
workspace = true
