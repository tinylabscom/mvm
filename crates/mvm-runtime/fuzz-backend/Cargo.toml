[package]
name = "mvm-runtime-fuzz-backend"
version = "0.0.0"
publish = false
edition = "2024"

# Detached from the parent workspace (listed under `workspace.exclude` in the
# repo root Cargo.toml) because `libfuzzer-sys` links only under cargo-fuzz's
# sanitizer/linker wrapper. An empty `[workspace]` self-identifies this manifest.
[workspace]

# This standalone graph cannot inherit the root workspace's source patch.
[patch.crates-io]
arrayref = { path = "../../../third_party/arrayref" }

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
arbitrary = "1"

[dependencies.mvm-runtime]
path = ".."

# FUSE-server request parser. The virtio-fs device hands guest-supplied bytes to
# `FuseServer::dispatch`; this target asserts it never panics on any input (a
# guest-triggerable host DoS) and always emits a well-formed `fuse_out_header`.
[[bin]]
name = "fuse_dispatch"
path = "fuzz_targets/fuse_dispatch.rs"
test = false
doc = false
bench = false

# virtio-vsock queue-geometry + descriptor-table hardening guard. Feeds a random
# RAM image plus a random register-programming sequence into the vsock transport
# and asserts no panic / no unbounded allocation — the regression guard for the
# validated queue-geometry gate (hostile `QueueNum` truncating to a zero
# modulus) and the descriptor-chain bound (cyclic / oversized chains).
[[bin]]
name = "fuzz_virtqueue_geometry"
path = "fuzz_targets/fuzz_virtqueue_geometry.rs"
test = false
doc = false
bench = false
