[package]
name = "mvm-runtime-fuzz-backend"
version = "0.0.0"
publish = false
edition = "2024"

# Detached from the parent workspace (listed under `workspace.exclude` in the
# repo root Cargo.toml) because `libfuzzer-sys` links only under cargo-fuzz's
# sanitizer/linker wrapper. An empty `[workspace]` self-identifies this manifest.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"

[dependencies.mvm-runtime]
path = ".."

# FUSE-server request parser. The virtio-fs device hands guest-supplied bytes to
# `FuseServer::dispatch`; this target asserts it never panics on any input (a
# guest-triggerable host DoS) and always emits a well-formed `fuse_out_header`.
[[bin]]
name = "fuse_dispatch"
path = "fuzz_targets/fuse_dispatch.rs"
test = false
doc = false
bench = false

# Restore-load device-model parser. `FirecrackerIO::restored_device_model` reads
# this JSON body from Firecracker's `GET /vm/config` after a snapshot load, and
# the no-NIC guard that keeps a restored VMM off the network runs on its output —
# this target asserts the parse never panics on any input.
[[bin]]
name = "restored_device_model"
path = "fuzz_targets/restored_device_model.rs"
test = false
doc = false
bench = false
