[package]
name = "mvm-backend"
version.workspace = true
edition.workspace = true
description = "VmBackend implementations for mvm — Apple Container, Cloud Hypervisor, Docker, libkrun"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# ── What this crate owns ───────────────────────────────────────────
#
# Concrete `VmBackend` implementations that are *not* coupled to the
# Lima-era Firecracker substrate (`vm::microvm`, `vm::image`,
# `vm::firecracker` helpers, the `run_in_vm` shell shim, etc.).
# These were moved out of `mvm/src/vm/` so the alt backends can sit
# *below* `mvm` in the dependency graph, breaking the previous
# facade-only re-export pattern.
#
# Lives here:
#   - apple_container.rs   (macOS 26+ Apple Virtualization.framework)
#   - libkrun.rs           (raw libkrun shim — Linux KVM / macOS HVF)
#
# Stays in `mvm` (a later move will pull these out):
#   - firecracker.rs (Lima-era installer helpers)
#   - microvm.rs (Firecracker lifecycle via `run_in_vm`)
#   - vm/backend.rs (`AnyBackend` dispatch + `FirecrackerBackend`)
#
# `mvm`'s `vm::backend.rs` imports the alt backends from this
# crate to populate the `AnyBackend` dispatch enum. That direction —
# `mvm` → `mvm-backend` — is the invariant; the previous
# `mvm-backend` → `mvm` re-export façade is gone.
[dependencies]
# `egress-ca`: `substitution_spawn::build_egress_tls_delivery`
# mints the per-VM name-constrained intermediate (`crypto::egress_ca`) so the
# guest can trust host-terminated bound-host TLS. Sync (rcgen/ring), no tokio.
mvm-core = { workspace = true, features = ["egress-ca"] }
# The NetworkProvider seam this crate implements (BridgeTapNetworkProvider).
# Acyclic: mvm-network deps only mvm-core + mvm-sdk.
mvm-network.workspace = true
# `SnapshotUpper` materializes the disk snapshot the libkrun disk-only
# warm-start boots from. Acyclic: mvm-storage deps only mvm-core +
# mvm-sdk (both already in this crate's graph).
mvm-storage.workspace = true
mvm-guest.workspace = true
# `mvm-build` for the overlay-aware admission gate
# (`builder_vm::admit_overlay_aware`) called from every backend's
# `start` impl. The base substrate's sidecar reader already pulls
# `mvm-build`, so this doesn't widen the dependency graph.
#
# `builder-vm` is enabled because `vz.rs` reaches
# `mvm_build::host_gvproxy` (moved down from this crate so the Vz
# *builder* can also spawn gvproxy). That feature pulls `libkrun-sys`,
# which this crate already depends on non-optionally — so no new dep.
mvm-build = { workspace = true, features = ["builder-vm"] }
libkrun-sys.workspace = true
# Vz backend foundation crate (SupervisorConfig types, supervisor-binary
# path resolution). Pure data + helpers; no Swift dep.
# Folded in with the former mvm-base crate: the base substrate's ui
# (colored/indicatif/inquire spinners + prompts) and secret handling
# (secrecy). Crypto helpers come from mvm_core::crypto, already available
# via the mvm-core dep above.
colored.workspace = true
indicatif.workspace = true
inquire.workspace = true
secrecy.workspace = true

anyhow.workspace = true
thiserror = "1"
uuid.workspace = true
# `libc` for `kill(pid, 0)` liveness probes + SIGTERM/SIGKILL signaling
# in `LibkrunBackend::{stop, status, list}`. `which` for the
# supervisor-binary path resolver fallback (after env override + adjacent
# to current exe, fall back to PATH lookup).
libc.workspace = true
which.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ext4-view.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
mvm-core = { workspace = true, features = ["test-support"] }

# Apple Virtualization.framework bindings (objc2 + Swift bridge) for the
# `providers::apple_container` interface — folded in with the former
# mvm-providers crate. macOS-only; the workspace lock already carries
# these (no new third-party dep).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSError"] }
objc2-virtualization = { version = "0.3", features = [
    "VZBootLoader",
    "VZLinuxBootLoader",
    "VZVirtualMachine",
    "VZVirtualMachineConfiguration",
    "VZGenericPlatformConfiguration",
    "VZPlatformConfiguration",
    "VZVirtioBlockDeviceConfiguration",
    "VZStorageDeviceConfiguration",
    "VZDiskImageStorageDeviceAttachment",
    "VZNetworkDeviceConfiguration",
    "VZVirtioNetworkDeviceConfiguration",
    "VZNATNetworkDeviceAttachment",
    "VZNetworkDeviceAttachment",
    "VZVirtioEntropyDeviceConfiguration",
    "VZEntropyDeviceConfiguration",
    "VZSerialPortConfiguration",
    "VZVirtioConsoleDeviceSerialPortConfiguration",
    "VZSerialPortAttachment",
    "VZFileHandleSerialPortAttachment",
    "VZMemoryBalloonDeviceConfiguration",
    "VZVirtioTraditionalMemoryBalloonDeviceConfiguration",
    "VZSocketDevice",
    "VZSocketDeviceConfiguration",
    "VZVirtioSocketDevice",
    "VZVirtioSocketDeviceConfiguration",
    "VZVirtioSocketConnection",
] }

[features]
default = []
contributor-bootstrap = []

[lints]
workspace = true
