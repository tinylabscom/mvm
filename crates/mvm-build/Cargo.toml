[package]
name = "mvm-build"
publish = false
version.workspace = true
edition.workspace = true
description = "Nix builder pipeline and artifact cache for mvm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "mvm-egress-proxy"
path = "src/bin/mvm-egress-proxy.rs"

[dependencies]
# OCI layer unpack to a staging rootfs. `tar` and
# `flate2` are workspace deps already (used by `mvm-sdk`'s addon
# tarball pipeline at the same pinned versions). `oci_to_rootfs`
# in this crate stays plain-tar-on-Read; gzip and zstd decoding
# happen at the caller's boundary (the CLI orchestrator) so the
# unpacker can be exercised against in-memory fixtures without
# pulling a decompressor in for each test.
flate2.workspace = true
tar.workspace = true
# In-process xz decode of the Nix-tarball Stage 0 seed
# (`stage0::extract_nix_store_tarball`), replacing a shell-out to host
# `tar -xJf`. Pure Rust (no liblzma C dep) so host-side seed
# materialization stays self-contained on every contributor host.
lzma-rs = "0.3"

# `BuilderError`, the one error every generated input-struct builder
# returns. Already in the closure via mvm-core, so this edge costs
# nothing beyond naming it directly.
mvm-contract.workspace = true
# The builder-VM guest binaries and the contract shared with the host that
# boots them; every module they own is re-exported from this crate.
mvm-builder-guest.workspace = true
mvm-core = { workspace = true, features = ["host-state"] }
mvm-http.workspace = true
mvm-fs.workspace = true
# Reads a builder image's boot ABI marker off the ext4 image on the host.
# Already in the closure through mvm-fs.
ext4-view.workspace = true
anyhow.workspace = true
chrono.workspace = true
hex.workspace = true
# Libkrun FFI facade used by the in-tree builder VM launcher. Native C linkage
# remains behind libkrun-sys's own opt-in feature; naming the Rust facade here
# does not link libkrun.
serde.workspace = true
serde_json.workspace = true
# JCS canonicalization for the in-rootfs provenance mark and the
# in-toto DSSE sidecar — the same canonical form the audit chain uses.
serde_jcs = "0.1"
# DSSE envelope payloads and signatures are base64 on the wire.
base64.workspace = true
sha1.workspace = true
sha2.workspace = true
# `.mvm` packed artifacts carry an Ed25519
# manifest signature. We verify (and produce, when the caller
# hands us a signing key) signatures inside this crate so the
# format library is self-contained; the CLI passes the host
# signer's key bytes in.
ed25519-dalek.workspace = true
# Archive installs stage files into a
# temp dir before atomic install into the cache. Promoted from a
# dev-dep so lib code (not just tests) can reach it.
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
gix = { version = "0.87.1", default-features = false, features = ["attributes", "excludes", "sha1"] }
tracing.workspace = true
# `builder_protocol::{HostVmRequest,HostVmResponse}`
# carry a `JobId(Uuid)` to disambiguate concurrent dispatches over
# the persistent VM channel. Existing mvm-core / mvm-cli call sites
# already pull in the same version.
uuid.workspace = true
# `persistent_builder::supervisor_alive`
# pokes the recorded supervisor PID with `kill(pid, 0)` before
# routing a build through the supervisor. Unix-only; gated with
# `#[cfg(unix)]` at the call site.
libc.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
mvm-agentd.workspace = true
mvm-vmm.workspace = true
libkrun-sys = { workspace = true, optional = true }
# `LibkrunNetworkProvider` implements the optional backend's network seam.
mvm-net = { workspace = true, optional = true }

# Thin CLI wrapper for the reusable Builder-pack producer. Release CI / a
# maintainer invokes it to turn built artifacts into a signed pack.
[[example]]
name = "mvm-builder-pack-tool"
path = "examples/mvm-builder-pack-tool.rs"

# Round-trips a REAL cosign bundle through the downloader's verifier under an
# explicit identity, so `pack-signing-smoke.yml` can prove the release's bundle
# format is one this stack parses. Needs the verifier compiled in.
[[example]]
name = "verify-release-archive-signature"
path = "examples/verify-release-archive-signature.rs"
required-features = ["manifest-verify"]

# Drives the production download ladder against a staged release. `release.yml`
# runs it over its own artifacts before publishing them.
[[example]]
name = "download-release-artifact"
path = "examples/download-release-artifact.rs"
required-features = ["manifest-verify"]

[dev-dependencies]
mvm-core = { workspace = true, features = ["test-support"] }
# The sidecar resolver proves an artifact's libc from its `DT_NEEDED`, so a
# test that seeds a sidecar cache needs a real ELF object, not a stub.
mvm-fs = { workspace = true, features = ["test-support"] }
# Test-only: `PackTrustConfig` (the operator trust config the producer's output
# must verify against) stores publisher pubkeys base64-encoded, and there is no
# constructor from a raw key. Already in the build graph via mvm-core; workspace-
# pinned. Not used by any non-test code here.
base64.workspace = true
# Builder-daemon readiness-probe tests bind a real UnixListener under a
# temp dir to drive `serve_connection` end-to-end.
tempfile.workspace = true
# The pure-materialize fallback-routing test plants a real oversized xattr on
# a fixture file to prove the failure routes to the builder VM. The walk
# itself (and its xattr capture) lives in mvm-fs.

[target.'cfg(unix)'.dev-dependencies]
xattr.workspace = true

[features]
default = ["builder-libkrun"]
# The optional libkrun implementation. Generic builder orchestration remains
# unconditional; disabling defaults removes only this backend and dependency.
builder-libkrun = ["dep:libkrun-sys", "dep:mvm-net"]
# Marks an official binary distribution so artifact resolvers do not infer
# contributor behavior from the checkout that happens to launch the binary.
release-channel = []
# Forwards to mvm-core's sigstore keyless-verification feature so
# `builder_pack`'s tests can exercise `verify_pack_keyless_at` without
# every mvm-build build pulling the sigstore dependency tree.
manifest-verify = ["mvm-core/manifest-verify"]
contributor-bootstrap = []
# Exposes `published_image_set::fixture`, a signed-root-shaped image set served
# from a directory, to other crates' tests.
test-support = ["mvm-fs/test-support"]

[lints]
workspace = true
