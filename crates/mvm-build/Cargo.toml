[package]
name = "mvm-build"
version.workspace = true
edition.workspace = true
description = "Nix builder pipeline and artifact cache for mvm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Builder-VM-only Linux tools — cross-compiled to
# aarch64-unknown-linux-musl by crates/mvm-cli/build.rs and embedded.
# Linux-gated in source (stub main() elsewhere) so non-Linux workspace
# builds stay green. Bin names are load-bearing: build.rs +
# host_binaries/manifest.rs + nix/lib/mvm-host-binaries.nix all key on them.
[[bin]]
name = "mvm-host-vm-init"
path = "src/bin/mvm-host-vm-init.rs"

[[bin]]
name = "mvm-egress-proxy"
path = "src/bin/mvm-egress-proxy.rs"

# Self-hosting builder-rootfs bootstrap patcher: PID 1 from an initramfs on the
# hvf VMM. Mounts the target rootfs read-write and injects the freshly built
# mvm host binaries per /payload/manifest, then powers off. Cross-compiled to
# static aarch64-musl; never installed in a VM rootfs (initramfs-only, absent
# from the host-binaries sync gate).
[[bin]]
name = "mvm-rootfs-patcher"
path = "src/bin/mvm-rootfs-patcher.rs"

# PID 1 of the nix-tarball Stage 0 seed. Cross-compiled to
# static aarch64-musl + embedded by mvm-cli/build.rs (via SEED_BINARIES),
# same treatment as mvm-host-vm-init. Host-side only — never installed in a
# VM, absent from the nix attrset + the host-binaries sync gate.
[[bin]]
name = "stage0-init"
path = "src/bin/stage0-init.rs"

# The resident builder-VM control daemon. Linux-only AF_VSOCK
# listener over the typed `builderd_protocol`; `#[path]`-includes the
# daemon modules so it cross-compiles to static aarch64-musl without the
# full mvm-build lib, same as the other builder bins. Embedded into the
# builder/dev VM rootfs at /sbin/mvm-builderd via host_binaries/manifest.rs
# + nix/lib/mvm-host-binaries.nix (the name is load-bearing for build.rs).
[[bin]]
name = "mvm-builderd"
path = "src/bin/mvm-builderd.rs"

[dependencies]
# OCI layer unpack to a staging rootfs. `tar` and
# `flate2` are workspace deps already (used by `mvm-sdk`'s addon
# tarball pipeline at the same pinned versions). `oci_to_rootfs`
# in this crate stays plain-tar-on-Read; gzip and zstd decoding
# happen at the caller's boundary (the CLI orchestrator) so the
# unpacker can be exercised against in-memory fixtures without
# pulling a decompressor in for each test.
flate2.workspace = true
tar.workspace = true
# In-process xz decode of the Nix-tarball Stage 0 seed
# (`stage0::extract_nix_store_tarball`), replacing a shell-out to host
# `tar -xJf`. Pure Rust (no liblzma C dep) so host-side seed
# materialization stays self-contained on every contributor host.
lzma-rs = "0.3"

# `BuilderError`, the one error every generated input-struct builder
# returns. Already in the closure via mvm-core, so this edge costs
# nothing beyond naming it directly.
mvm-contract.workspace = true
mvm-core.workspace = true
mvm-http.workspace = true
mvm-fs.workspace = true
mvm-agentd.workspace = true
# `LibkrunNetworkProvider` impls the `NetworkProvider`
# seam. mvm-net deps only mvm-core + mvm-sdk, so this edge is acyclic.
# Optional + folded into `builder-vm`: the provider is gated with
# `libkrun_builder`, so a default build pulls neither.
mvm-net = { workspace = true, optional = true }
mvm-vmm = { workspace = true }
# `install_app_deps` reuses
# `mvm_sdk::compile::deps_audit::{verify_sealed_volume, VolumeError}`
# for cache-hit verification. The orchestrator owns the cache
# probe + miss-path placeholder; the audit primitives stay in
# `mvm-sdk` so the supervisor and the builder VM go through the
# same types.
mvm-sdk.workspace = true
anyhow.workspace = true
chrono.workspace = true
hex.workspace = true
# Optional libkrun FFI dep for the in-tree builder VM
# launcher (`libkrun_builder::LibkrunBuilderVm`). Gated by
# `builder-vm`; default-off until the cutover flips polarity.
libkrun-sys = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
# JCS canonicalization for the in-rootfs provenance mark and the
# in-toto DSSE sidecar — the same canonical form the audit chain uses.
serde_jcs = "0.1"
# DSSE envelope payloads and signatures are base64 on the wire.
base64.workspace = true
sha2.workspace = true
# `.mvm` packed artifacts carry an Ed25519
# manifest signature. We verify (and produce, when the caller
# hands us a signing key) signatures inside this crate so the
# format library is self-contained; the CLI passes the host
# signer's key bytes in.
ed25519-dalek.workspace = true
# `download_runtime_overlay` stages files into a
# temp dir before atomic install into the cache. Promoted from a
# dev-dep so lib code (not just tests) can reach it.
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
# `builder_protocol::{HostVmRequest,HostVmResponse}`
# carry a `JobId(Uuid)` to disambiguate concurrent dispatches over
# the persistent VM channel. Existing mvm-core / mvm-cli call sites
# already pull in the same version.
uuid.workspace = true
# `persistent_builder::supervisor_alive`
# pokes the recorded supervisor PID with `kill(pid, 0)` before
# routing a build through the supervisor. Unix-only; gated with
# `#[cfg(unix)]` at the call site.
libc.workspace = true
which.workspace = true

# Linux mount/reboot/signal/ioctl syscalls for the mvm-host-vm-init bin
# (the builder VM's PID 1) — folded in with mvm-host-vm-init.
# Linux-only so non-Linux workspace builds don't drag in the dep.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "reboot", "signal", "ioctl", "fs"] }

# Thin CLI wrapper for the reusable Builder-pack producer. Release CI / a
# maintainer invokes it to turn built artifacts into a signed pack.
[[example]]
name = "mvm-builder-pack-tool"
path = "examples/mvm-builder-pack-tool.rs"

# Round-trips a REAL cosign bundle through the downloader's verifier under an
# explicit identity, so `pack-signing-smoke.yml` can prove the release's bundle
# format is one this stack parses. Needs the verifier compiled in.
[[example]]
name = "verify-release-archive-signature"
path = "examples/verify-release-archive-signature.rs"
required-features = ["manifest-verify"]

# Drives the production download ladder against a staged release. `release.yml`
# runs it over its own artifacts before publishing them.
[[example]]
name = "download-release-artifact"
path = "examples/download-release-artifact.rs"
required-features = ["manifest-verify"]

[dev-dependencies]
mvm-core = { workspace = true, features = ["test-support"] }
# The sidecar resolver proves an artifact's libc from its `DT_NEEDED`, so a
# test that seeds a sidecar cache needs a real ELF object, not a stub.
mvm-fs = { workspace = true, features = ["test-support"] }
# Test-only: `PackTrustConfig` (the operator trust config the producer's output
# must verify against) stores publisher pubkeys base64-encoded, and there is no
# constructor from a raw key. Already in the build graph via mvm-core; workspace-
# pinned. Not used by any non-test code here.
base64.workspace = true
# `packed_artifact::tests` generate Ed25519
# keypairs for round-trip tests. ed25519-dalek's
# `SigningKey::generate` takes any `CryptoRng + RngCore`; the
# concrete `OsRng` lives in `rand`.
rand.workspace = true
# Builder-daemon readiness-probe tests bind a real UnixListener under a
# temp dir to drive `serve_connection` end-to-end.
tempfile.workspace = true
# The pure-materialize fallback-routing test plants a real oversized xattr on
# a fixture file to prove the failure routes to the builder VM. The walk
# itself (and its xattr capture) lives in mvm-fs.
xattr.workspace = true

[features]
default = []
# Marks an official binary distribution so artifact resolvers do not infer
# contributor behavior from the checkout that happens to launch the binary.
release-channel = []
# Forwards to mvm-core's sigstore keyless-verification feature so
# `builder_pack`'s tests can exercise `verify_pack_keyless_at` without
# every mvm-build build pulling the sigstore dependency tree.
manifest-verify = ["mvm-core/manifest-verify"]
# In-process, pure-Rust ext4 materialization (no builder VM / mkfs),
# delegating the walk + emission to `mvm_fs::rootfs`. Off by default so the
# mvmctl default closure keeps the pure path opt-in until it is the run-path
# default; enabled where `materialize_ext4_pure` is used.
pure-mkfs = []
# Folded in with the mvm-egress-proxy bin. Off by default;
# tests/dev enable it so the `mvm-egress-proxy` bin honors a
# `MVM_EGRESS_ALLOWLIST=host1,host2` override. Production binaries (no
# features) ship the four allowed hostnames hard-coded — no env override.
# The bin's `#[cfg(feature = "interactive")]` blocks only compile on Linux
# (inside `mod linux`), so this missing feature was a Linux-only error
# invisible on a macOS dev host.
interactive = []
# libkrun-direct builder VM launcher. Pulls the
# `mvm-libkrun` FFI crate which itself gates the underlying
# `libkrun-sys` bindings. Implies `pure-mkfs`: Stage 0 packs its `/work`
# share onto an in-process ext4 disk (`libkrun_builder::run_stage0_impl`)
# rather than virtio-fs, so any crate compiling this module needs the pure
# writer too — including an isolated `-p` build that never asks for
# `pure-mkfs` on its own (e.g. the per-VM supervisor crate).
contributor-bootstrap = []
builder-vm = ["dep:libkrun-sys", "dep:mvm-net", "pure-mkfs"]

[lints]
workspace = true
