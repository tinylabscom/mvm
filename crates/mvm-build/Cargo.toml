[package]
name = "mvm-build"
version.workspace = true
edition.workspace = true
description = "Nix builder pipeline and artifact cache for mvm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Builder-VM-only Linux tools — cross-compiled to
# aarch64-unknown-linux-musl by crates/mvm-cli/build.rs and embedded.
# Linux-gated in source (stub main() elsewhere) so non-Linux workspace
# builds stay green. Bin names are load-bearing: build.rs +
# host_binaries/manifest.rs + nix/lib/mvm-host-binaries.nix all key on them.
[[bin]]
name = "mvm-host-vm-init"
path = "src/bin/mvm-host-vm-init.rs"

[[bin]]
name = "mvm-egress-proxy"
path = "src/bin/mvm-egress-proxy.rs"

# PID 1 of the nix-tarball Stage 0 seed. Cross-compiled to
# static aarch64-musl + embedded by mvm-cli/build.rs (via SEED_BINARIES),
# same treatment as mvm-host-vm-init. Host-side only — never installed in a
# VM, absent from the nix attrset + the host-binaries sync gate.
[[bin]]
name = "stage0-init"
path = "src/bin/stage0-init.rs"

[dependencies]
# OCI layer unpack to a staging rootfs. `tar` and
# `flate2` are workspace deps already (used by `mvm-sdk`'s addon
# tarball pipeline at the same pinned versions). `oci_to_rootfs`
# in this crate stays plain-tar-on-Read; gzip and zstd decoding
# happen at the caller's boundary (the CLI orchestrator) so the
# unpacker can be exercised against in-memory fixtures without
# pulling a decompressor in for each test.
flate2.workspace = true
tar.workspace = true
# In-process xz decode of the Nix-tarball Stage 0 seed
# (`stage0::extract_nix_store_tarball`), replacing a shell-out to host
# `tar -xJf`. Pure Rust (no liblzma C dep) so host-side seed
# materialization stays self-contained on every contributor host.
lzma-rs = "0.3"

mvm-core.workspace = true
mvm-guest.workspace = true
# `LibkrunNetworkProvider` impls the `NetworkProvider`
# seam. mvm-network deps only mvm-core + mvm-sdk, so this edge is acyclic.
# Optional + folded into `builder-vm`: the provider is gated with
# `libkrun_builder`, so a default build pulls neither.
mvm-network = { workspace = true, optional = true }
# `install_app_deps` reuses
# `mvm_sdk::compile::deps_audit::{verify_sealed_volume, VolumeError}`
# for cache-hit verification. The orchestrator owns the cache
# probe + miss-path placeholder; the audit primitives stay in
# `mvm-sdk` so the supervisor and the builder VM go through the
# same types.
mvm-sdk.workspace = true
anyhow.workspace = true
chrono.workspace = true
fs2.workspace = true
hex.workspace = true
reqwest = { workspace = true, default-features = false, features = ["blocking", "rustls-tls"] }
# Optional libkrun FFI dep for the in-tree builder VM
# launcher (`libkrun_builder::LibkrunBuilderVm`). Gated by
# `builder-vm`; default-off until the cutover flips polarity.
libkrun-sys = { workspace = true, optional = true }
# `VzBuilderBackend` builds a `vz::SupervisorConfig`
# JSON document and pipes it to the Swift `mvm-vz-supervisor`. The
# crate is pure types (no C linkage, no platform-specific deps) so
# it costs nothing on non-macOS hosts; the runtime spawn bails when
# Vz isn't available.
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `.mvm` packed artifacts carry an Ed25519
# manifest signature. We verify (and produce, when the caller
# hands us a signing key) signatures inside this crate so the
# format library is self-contained; the CLI passes the host
# signer's key bytes in.
ed25519-dalek.workspace = true
# `download_runtime_overlay` stages files into a
# temp dir before atomic install into the cache. Promoted from a
# dev-dep so lib code (not just tests) can reach it.
tempfile.workspace = true
thiserror = "1"
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
# `builder_protocol::{HostVmRequest,HostVmResponse}`
# carry a `JobId(Uuid)` to disambiguate concurrent dispatches over
# the persistent VM channel. Existing mvm-core / mvm-cli call sites
# already pull in the same version.
uuid.workspace = true
# `persistent_builder::supervisor_alive`
# pokes the recorded supervisor PID with `kill(pid, 0)` before
# routing a build through the supervisor. Unix-only; gated with
# `#[cfg(unix)]` at the call site.
libc.workspace = true
which = "6"

# Linux mount/reboot/signal/ioctl syscalls for the mvm-host-vm-init bin
# (the builder VM's PID 1) — folded in with mvm-host-vm-init.
# Linux-only so non-Linux workspace builds don't drag in the dep.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "reboot", "signal", "ioctl"] }

[dev-dependencies]
mvm-core = { workspace = true, features = ["test-support"] }
# `packed_artifact::tests` generate Ed25519
# keypairs for round-trip tests. ed25519-dalek's
# `SigningKey::generate` takes any `CryptoRng + RngCore`; the
# concrete `OsRng` lives in `rand`.
rand = "0.8"

[features]
default = []
# Folded in with the mvm-egress-proxy bin. Off by default;
# tests/dev enable it so the `mvm-egress-proxy` bin honors a
# `MVM_EGRESS_ALLOWLIST=host1,host2` override. Production binaries (no
# features) ship the four allowed hostnames hard-coded — no env override.
# The bin's `#[cfg(feature = "dev-shell")]` blocks only compile on Linux
# (inside `mod linux`), so this missing feature was a Linux-only error
# invisible on a macOS dev host.
dev-shell = []
# libkrun-direct builder VM launcher. Pulls the
# `mvm-libkrun` FFI crate which itself gates the underlying
# `libkrun-sys` bindings.
contributor-bootstrap = []
builder-vm = ["dep:libkrun-sys", "dep:mvm-network"]

[lints]
workspace = true
