[package]
name = "mvm-client"
version.workspace = true
edition.workspace = true
license.workspace = true

# The `MvmClient` facade users touch. The trait + DTOs + `MockBackend` + remote
# `GatewayBackend` live in `mvm-core` behind its `client` feature (a proc-macro
# `async-trait`, no async runtime — so the foundation stays runtime-free); this
# crate re-exports them and adds the in-process `LocalBackend`, which links the
# runtime backend. `LocalBackend` stays here, above the runtime, so `mvm-core`
# never gains an `mvm-runtime` edge — that is what lets `mvm-sdk` enable
# `mvm-core/client` for the trait without dragging the backend into a cycle.

[features]
default = []
# Build as the release channel: the runtime overlay defaults to the published
# artifact instead of a source-checkout build. Forwarded from mvm-cli's
# feature of the same name.
release-channel = ["mvm-build/release-channel"]
# The remote REST `GatewayBackend` + `connect(Target::Gateway)`. Off by default
# so a pure-local consumer stays light; a fleet/studio build turns it on.
remote = ["mvm-core/client-remote"]
# Republish a workload's output stream into the consumer's own `tracing`
# subscriber (`stream_tracing`). Off by default: `tracing` is already a
# dependency here for diagnostics, but a consumer that only reads records
# should not link the base64 encoder the bridge needs to carry payload bytes
# through a field API that has no byte type. `serde_json` is no longer gated
# here: the volume and secret lifecycle services need it unconditionally.
tracing-bridge = ["dep:base64"]
# Forwards to `mvm-runtime/test-support`: the hermetic in-memory mock backend
# `LocalBackend::with_hypervisor("mock")` drives in `pause`/`resume`'s
# canned-snapshot test path. Off by default so the mock never reaches a
# production build; the crate's own pause/resume test suite turns it on.
test-support = ["mvm-runtime/test-support"]
# Forwards to `mvm-core/manifest-verify`: the in-process Sigstore verifier that
# checks keyless instruction-file signatures. Without it a keyless signature is
# reported as uncheckable rather than verified. The feature exists here so the
# tests that verify a real Sigstore bundle compile only where it is on.
manifest-verify = ["mvm-core/manifest-verify"]
# Derive `schemars::JsonSchema` on the instruction trust policy types and build
# the `emit_instruction_trust_schema` bin. Off by default so no shipped closure
# carries schemars, mirroring the other crates' `schema` features.
schema = ["dep:schemars"]

[dependencies]
mvm-core = { workspace = true, features = ["client"] }
# Persistent machine spec engine (`machine::persist::{load,overwrite,apply_patch,…}`)
# + the VmBackend implementations. mvm-runtime does NOT depend on this crate, so
# this edge is acyclic.
mvm-runtime = { workspace = true, default-features = false }
# The in-process admitted-boot seam (`run::admit_and_boot_local`). mvm-hostd is
# already in the mvmctl closure (the CLI links it), so this edge adds no crates
# to the default build; it does not form a cycle because mvm-sdk — which
# mvm-hostd pulls in — carries no dependency back on this crate.
mvm-hostd = { workspace = true }
# Boot admission reads the deploy record a build left beside the rootfs and
# verifies the booting artifact against it. Already in this crate's closure
# through mvm-hostd, so the direct edge adds no crates.
mvm-sdk.workspace = true
# The guest-agent request type agent-verb grants are keyed on, and the wire
# protocol the guest process and filesystem operations speak. Already in this
# crate's closure through mvm-hostd.
mvm-agentd.workspace = true
# The per-boot drive files the start config carries. Already in this crate's
# closure through mvm-runtime.
mvm-vmm.workspace = true
# Shared run-path orchestration (`run_image::inject_and_materialize`) and its
# unconditional pure-Rust ext4 writer — the same path the CLI's `run --image`
# uses. mvm-fs is already in the mvmctl closure via the CLI.
mvm-build = { workspace = true, default-features = false }
# OCI pull + hardened unpack for registry-ref resolution. Already in the mvmctl
# closure (the CLI links it); mvm-fs carries no back-edge to this crate.
mvm-fs = { workspace = true }
# gzip layer decode at this crate's boundary (mvm-fs's oci module stays
# decompressor-free by design; the CLI decodes at its boundary the same way).
flate2 = { workspace = true }
# `Vec<u8>` implements tokio's `AsyncWrite`, the sink for `fetch_layer`.
tokio = { workspace = true, features = ["rt"] }
tempfile = { workspace = true }
async-trait = { workspace = true }
# Verified audit reader surface: ed25519 for the trusted verifying key in
# the reader's constructor; the shared chrono/serde/serde_json/thiserror
# entries below serve its filters, DTOs, and typed refusals too. Already
# in the mvmctl closure via mvm-core/mvm-hostd.
ed25519-dalek = { workspace = true }
# Non-fatal diagnostics on the pause path (fc.paused marker best-effort write).
# Already in the mvmctl closure via mvm-runtime, so this adds no crates.
tracing = { workspace = true }
# `tracing-bridge` only: payload bytes are hash-chained and must reach an
# event unaltered, and `tracing` has no byte-typed field to carry them in.
base64 = { workspace = true, optional = true }
# The local encrypted-volume lifecycle service (`volume` module). Every entry
# below is already in the mvmctl closure via mvm-core / mvm-runtime / mvm-cli,
# so none adds new crates to the default build.
anyhow = { workspace = true }
serde = { workspace = true }
# Also `tracing-bridge`: a `Trace` record's payload is the JSON control object
# the fd-3 convention defines, and its declared level drives the emitted event.
serde_json = { workspace = true }
# Canonical JSON for the immutable volume-snapshot manifest (byte-stable at
# rest so a manifest re-serialization cannot drift its hash).
serde_jcs = "0.1"
rand = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tar = { workspace = true }
chrono = { workspace = true }
ext4-view = { workspace = true }
# The write-only secret lifecycle service (`secret` module): typed refusals
# (thiserror) and the `host_matches` destination check (mvm-contract); the
# shared serde/secrecy/chrono entries above serve it too. `StreamRecord` and
# its tags are also in this crate's re-exported public surface.
mvm-contract = { workspace = true }
thiserror = { workspace = true }
# Instruction-file provenance: include globs (already in this crate's closure
# through mvm-sdk) and the TOML trust policy (through mvm-core).
globset = { workspace = true }
toml = { workspace = true }
# Only under `schema`; 0.8 matches the version every other crate pins.
schemars = { version = "0.8", optional = true }

[[bin]]
name = "emit_instruction_trust_schema"
path = "src/bin/emit_instruction_trust_schema.rs"
required-features = ["schema"]

[dev-dependencies]
mvm-core = { workspace = true, features = ["test-support"] }
# The runtime-source tests build a shared-object fixture to check which guest
# runtime a rootfs needs.
mvm-fs = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
# The tracing bridge's tests install a capturing subscriber to assert the
# emitted event carries the payload bytes back out unaltered.
tracing-subscriber = { workspace = true }
# Inventory-record wire assertions (round-trips, no-host-path leak checks).
serde_json = { workspace = true }
# Seeded property-style loops + fresh Ed25519 test keys for the verified
# audit reader's fixture chains.
rand = { workspace = true }
