[package]
name = "mvm-hostd"
description = "Host-side daemon roles for mvm: the trusted supervisor library + the broker / host-signer / audit-signer subprocess binaries + the jailer-lite confinement helper. One crate, separate [[bin]]s so each role stays its own process (ADR-022 §3 process moat). Consolidated from mvm-supervisor + mvm-broker + mvm-host-signer + mvm-audit-signer + mvm-jailer-lite (plan 121 D1)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Architectural invariant #1 (.github/workflows/architecture.yml): mvm-hostd
# IS the host-daemon substrate — the supervisor's gateway/audit/L7 proxy
# listeners plus the broker / host-signer / audit-signer subprocess UDS
# servers are all legitimate substrate servers (was the per-crate metadata
# on mvm-broker/mvm-host-signer/mvm-audit-signer + the per-file globs on
# mvm-supervisor; consolidated here). The per-VM supervisor host processes
# (mvm-libkrun-supervisor / mvm-hvf-supervisor) are per-VM
# substrate too — one supervisor process per guest VM, not an orchestration
# control-plane server. The first such listener: mvm-libkrun-supervisor binds
# the host side of the listen=false workload-exit control vsock port
# (<vm_state_dir>/vsock-5251.sock) to capture a one-shot workload's exit code
# before poweroff.
[package.metadata.mvm.architecture]
substrate_server_category = "host daemon roles substrate (supervisor + broker + key signers) + per-VM supervisor host processes (workload-exit control listener + vsock proxy)"

# Each key subprocess is its own process — the moat. The supervisor and
# jailer are library modules; the jailer is applied in-process by each role.
[[bin]]
name = "mvm-broker"
path = "src/bin/mvm-broker.rs"

# Optional admitted extension-provider process. It owns the bounded MVEX
# transport and loads one strict operator boot configuration from its explicit
# private state root; ordinary launch never invokes it.
[[bin]]
name = "mvm-extension-provider"
path = "src/bin/mvm-extension-provider.rs"

[[bin]]
name = "mvm-host-agent"
path = "src/bin/mvm-host-agent.rs"

[[bin]]
name = "mvm-host-signer"
path = "src/bin/mvm-host-signer.rs"

[[bin]]
name = "mvm-audit-signer"
path = "src/bin/mvm-audit-signer.rs"

[[bin]]
name = "mvm-signer-helper"
path = "src/bin/mvm-signer-helper.rs"

# Per-VM secret-substitution moat (the one process holding secrets
# in the clear; opens the host stores, serves guest→host substitution).
[[bin]]
name = "mvm-network-endpoint"
path = "src/bin/mvm-network-endpoint.rs"

[[example]]
name = "network_perf_probe"
path = "examples/network_perf_probe.rs"
required-features = ["network-perf"]

# Per-VM supervisor host processes — one process per guest VM. libkrun VMM +
# merged in-process bridge; libkrun-sys-gated so a host without libkrun.h
# skips it on a default workspace build.
[[bin]]
name = "mvm-libkrun-supervisor"
path = "src/bin/mvm-libkrun-supervisor.rs"
required-features = ["libkrun-sys"]

# Per-VM host process for the raw HVF macOS backend. cfg-gated to
# macOS/aarch64 in source; a stub elsewhere.
[[bin]]
name = "mvm-hvf-supervisor"
path = "src/bin/mvm-hvf-supervisor.rs"

# Root-owned macOS APFS snapshot boundary. The client never elevates itself;
# this binary is installed and launched by the host service manager with an
# explicit state-root and client UID allowlist.
[[bin]]
name = "mvm-apfs-snapshot-helper"
path = "src/bin/mvm-apfs-snapshot-helper.rs"
required-features = ["trusted-apfs"]

[dependencies]
# `egress-ca`: the https terminator mints per-SNI leaves
# under the per-VM intermediate (`mvm_core::crypto::egress_ca`).
mvm-core = { workspace = true, features = ["egress-ca"] }
mvm-http.workspace = true
# The EgressEnforcer seam this crate's SupervisorEgressEnforcer
# implements. Acyclic HIGH->LOW: mvm-net deps only mvm-core + mvm-contract.
mvm-net.workspace = true
# `mvm_sdk::compile::deps_audit::verify_sealed_volume` — supervisor
# admission gate (security claim 9).
mvm-sdk.workspace = true
# The Workload IR (`SecretRef`, `AuthType`, `HealthCheck`, `host_matches`,
# …) the keyholder + supervisor + healthcheck modules resolve against,
# plus the audit-chain verifier. Direct dep on the no_std foundation
# crate the IR lives in.
mvm-contract.workspace = true
# `mvm-runtime` provides the `VmNameRegistry` the TTL reaper walks, plus the
# `VmBackend` implementations dispatched from `AnyBackend`.
mvm-runtime.workspace = true
mvm-vmm.workspace = true
# guest vsock exec protocol (`send_exec_streaming`, `GUEST_AGENT_PORT`) —
# the healthcheck probe's host->guest exec leg.
mvm-agentd.workspace = true
# The apfs snapshot helper bin gates its use behind `trusted-apfs`;
# `plan_admission` uses `mvm-fs::hash::hash_source` for admitted-share
# content identities on every platform, so the dep itself is not optional.
mvm-fs = { workspace = true }
# builder-vm: pulls libkrun_network_provider::vsock_egress_opt_in (Phase A egress
# server wiring in mvm-libkrun-supervisor); gated here so it only activates in the
# per-VM supervisor process, not in library users.
mvm-build = { workspace = true, features = ["builder-vm"] }
# libkrun bindings/wrapper; FFI linkage gated by the libkrun-sys feature.
libkrun-sys = { workspace = true }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
# rand_core feature for the signers' Ed25519 keygen.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
# Packet parse + payload rebuild for the endpoint transformation pipeline.
etherparse = { workspace = true }
sysinfo = { version = "0.30", default-features = false }
ipnet.workspace = true
# Evented readiness for FlowMux UDP relays.
mio = { workspace = true }
# custom-dns pulls hickory 0.26 (needs Rust 1.88); the default build
# carries no hickory and stays on the workspace 1.85 floor.
hickory-resolver = { workspace = true, features = ["tokio"], optional = true }
rand.workspace = true
regex.workspace = true
leakguard.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# RFC 8785 JSON Canonicalization Scheme — audit-signer stable bytes-to-sign.
serde_jcs = "0.1"
sha2.workspace = true
tar.workspace = true
# keyholder HMAC-SHA256 signer (webhook HMAC + AWS SigV4 key derivation).
hmac.workspace = true
# hex digests for flow-byte-log record refs.
hex.workspace = true
thiserror.workspace = true
url = "2"
# Server-side TLS termination for bound-host https egress.
rustls = { workspace = true }
httparse = "1"
zeroize.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1", features = ["fs"] }

# mvm-jailer-lite confinement: seccomp + landlock are Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
# Aya userspace loader for the vsock egress telemetry probe. The eBPF program
# itself lives in `ebpf/` and is built separately with nightly + bpf-linker.
# Optional: enabling `ebpf-telemetry` pulls Aya into the default closure; it
# is intentionally off-by-default to keep mvmctl's dependency budget tight.
aya = { version = "0.13", optional = true }
seccompiler = { workspace = true }
landlock = { workspace = true }
# DNS wire codec for the raw-egress resolver. Every consumer in
# `supervisor/raw_egress.rs` -- the four imports, the five encode/decode/query
# functions, and the test module's -- is `cfg(target_os = "linux")`; the
# `cfg(not(target_os = "linux"))` arm resolves through the host instead and
# touches none of it. Declared unconditionally this linked hickory-proto plus
# a second CSPRNG (`rand` 0.10, `rand_core` 0.10, `chacha20`) and
# `data-encoding` into a macOS `mvmctl` with no consumer at all.
hickory-proto = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
xtask = { path = "../../xtask" }
# The release-only networking probe drives the same guest FlowMux client used
# by the loopback adapters without linking their Linux AF_VSOCK binaries.
mvm-agentd = { workspace = true, features = ["flowmux-async"] }
# plan_admission bundle re-verify tests build/read `.mvmpkg` archives; verb-grant
# test decodes the signer pubkey hex.
hex.workspace = true
# `TestEnv` env-var guard for env-mutating tests (reaper / network_endpoint).
mvm-core = { workspace = true, features = ["test-support"] }
# `plan_admission`'s own tests drive `AnyBackend::from_hypervisor("mock")` —
# the hermetic in-memory backend — end-to-end through `admit_and_start`. The
# mock is gated behind `test-support` in mvm-runtime so it never ships in a
# production binary; force it on for this crate's own test build the same
# way the `mvm-core` entry above does.
mvm-runtime = { workspace = true, features = ["test-support"] }
# Session-resume fixtures install a resolver-valid runtime overlay through the
# shared ext4 and overlay helpers instead of bypassing the production contract.
mvm-fs.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "sync", "test-util"] }
# jailer property tests re-spawn under SECCOMP_PROBE=1 before main.
ctor = "0.2"

[features]
default = []
# Build the hermetic legacy-L3/FlowMux comparison producer. Never enabled by
# a production binary; it exposes only a high-level loopback fixture.
network-perf = []
# Enable the host-side eBPF/procfs egress telemetry probe in the supervisor.
# Off by default so the Aya dependency tree does not inflate mvmctl's closure.
ebpf-telemetry = ["dep:aya"]
custom-dns = ["dep:hickory-resolver"]
# Enable the wasm-container backend in the depended-on runtime crate, so the
# data-governance witness (tests/wasm_egress_witness.rs) can drive a real
# WasmBackend through this crate's real SubstitutionService/audit chain. Test-only
# in practice; forwards to mvm-runtime's own optional wasm-backend feature.
wasm-backend = ["mvm-runtime/wasm-backend"]
# Build the libkrun supervisor bin against libkrun's FFI.
libkrun-sys = ["libkrun-sys/libkrun-sys"]
# Live-boot integration tests (dev host with libkrun). Never in CI's no-VM lanes.
libkrun-live = ["libkrun-sys"]
# Propagate the debug-only HVF warm-restore validation lane to the supervisor.
hvf-live-validation = ["mvm-runtime/hvf-live-validation"]
trusted-apfs = ["mvm-runtime/trusted-apfs"]

[lints]
workspace = true
