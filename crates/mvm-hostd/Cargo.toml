[package]
name = "mvm-hostd"
description = "Host-side daemon roles for mvm: the trusted supervisor library + the broker / host-signer / audit-signer subprocess binaries + the jailer-lite confinement helper. One crate, separate [[bin]]s so each role stays its own process (ADR-022 §3 process moat). Consolidated from mvm-supervisor + mvm-broker + mvm-host-signer + mvm-audit-signer + mvm-jailer-lite (plan 121 D1)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Architectural invariant #1 (.github/workflows/architecture.yml): mvm-hostd
# IS the host-daemon substrate — the supervisor's gateway/audit/L7 proxy
# listeners plus the broker / host-signer / audit-signer subprocess UDS
# servers are all legitimate substrate servers (was the per-crate metadata
# on mvm-broker/mvm-host-signer/mvm-audit-signer + the per-file globs on
# mvm-supervisor; consolidated here). The per-VM supervisor host processes
# (mvm-libkrun-supervisor / mvm-hvf-supervisor / mvm-bridge) are per-VM
# substrate too — one supervisor process per guest VM, not an orchestration
# control-plane server. The first such listener: mvm-libkrun-supervisor binds
# the host side of the listen=false workload-exit control vsock port
# (<vm_state_dir>/vsock-5251.sock) to capture a one-shot workload's exit code
# before poweroff.
[package.metadata.mvm.architecture]
substrate_server_category = "host daemon roles substrate (supervisor + broker + key signers) + per-VM supervisor host processes (workload-exit control listener + vsock proxy)"

# Each key subprocess is its own process — the moat. The supervisor and
# jailer are library modules; the jailer is applied in-process by each role.
[[bin]]
name = "mvm-broker"
path = "src/bin/mvm-broker.rs"

[[bin]]
name = "mvm-host-agent"
path = "src/bin/mvm-host-agent.rs"

[[bin]]
name = "mvm-host-signer"
path = "src/bin/mvm-host-signer.rs"

[[bin]]
name = "mvm-audit-signer"
path = "src/bin/mvm-audit-signer.rs"

[[bin]]
name = "mvm-signer-helper"
path = "src/bin/mvm-signer-helper.rs"

# Per-VM secret-substitution moat (the one process holding secrets
# in the clear; opens the host stores, serves guest→host substitution).
[[bin]]
name = "mvm-substitution-endpoint"
path = "src/bin/mvm-substitution-endpoint.rs"

# Per-VM supervisor host processes — one process per guest VM. libkrun VMM +
# merged in-process bridge; libkrun-sys-gated so a host without libkrun.h
# skips it on a default workspace build.
[[bin]]
name = "mvm-libkrun-supervisor"
path = "src/bin/mvm-libkrun-supervisor.rs"
required-features = ["libkrun-sys"]

# Shared per-VM bridge sidecar — the single external-VMM gateway/audit bridge
# for Firecracker. Cross-platform (not a whole-binary cfg gate): the Passt arm
# is Linux-only and confined; per-arm cfg gating lives inside.
[[bin]]
name = "mvm-bridge"
path = "src/bin/mvm-bridge.rs"

# Per-VM host process for the raw HVF macOS backend. cfg-gated to
# macOS/aarch64 in source; a stub elsewhere.
[[bin]]
name = "mvm-hvf-supervisor"
path = "src/bin/mvm-hvf-supervisor.rs"

[dependencies]
# `egress-ca`: the https terminator mints per-SNI leaves
# under the per-VM intermediate (`mvm_core::crypto::egress_ca`).
mvm-core = { workspace = true, features = ["egress-ca"] }
mvm-backend.workspace = true
# The EgressEnforcer seam this crate's SupervisorEgressEnforcer
# implements. Acyclic HIGH->LOW: mvm-net deps only mvm-core + mvm-sdk.
mvm-net.workspace = true
# `mvm_sdk::compile::deps_audit::verify_sealed_volume` — supervisor
# admission gate (security claim 9).
mvm-sdk.workspace = true
# `mvm` provides the `VmNameRegistry` the TTL reaper walks.
mvm.workspace = true
# guest vsock exec protocol (`send_exec_streaming`, `GUEST_AGENT_PORT`) —
# the healthcheck probe's host->guest exec leg.
mvm-guest.workspace = true
# builder-vm: pulls libkrun_network_provider::vsock_egress_opt_in (Phase A egress
# server wiring in mvm-libkrun-supervisor); gated here so it only activates in the
# per-VM supervisor process, not in library users.
mvm-build = { workspace = true, features = ["builder-vm"] }
# libkrun bindings/wrapper; FFI linkage gated by the libkrun-sys feature.
libkrun-sys = { workspace = true }
anyhow.workspace = true
async-trait = "0.1"
base64.workspace = true
chrono.workspace = true
# rand_core feature for the signers' Ed25519 keygen.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
# Packet parse + payload rebuild for the gateway observer pipeline
# (see workspace dep comment).
etherparse = { workspace = true }
sysinfo = { version = "0.30", default-features = false }
ipnet.workspace = true
# custom-dns pulls hickory 0.26 (needs Rust 1.88); the default build
# carries no hickory and stays on the workspace 1.85 floor.
hickory-resolver = { workspace = true, features = ["tokio"], optional = true }
hickory-proto.workspace = true
rand.workspace = true
regex.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
# RFC 8785 JSON Canonicalization Scheme — audit-signer stable bytes-to-sign.
serde_jcs = "0.1"
sha2.workspace = true
# keyholder HMAC-SHA256 signer (webhook HMAC + AWS SigV4 key derivation).
hmac.workspace = true
# hex digests for flow-byte-log record refs.
hex.workspace = true
thiserror.workspace = true
toml.workspace = true
url = "2"
reqwest = { workspace = true }
# Server-side TLS termination for bound-host https egress.
rustls = { workspace = true }
zeroize.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1", features = ["fs"] }
# Userspace TCP/IP egress: terminate guest tunnel flows in an in-process stack
# and bridge each admitted flow to an ordinary host socket. One forwarder on
# every host — no unprivileged kernel NAT required anywhere. Optional + behind
# `packet-forwarder` so consumers that only spawn the worker bin (the CLI) do
# not link the stack.
smoltcp = { workspace = true, optional = true }

# mvm-jailer-lite confinement: seccomp + landlock are Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { workspace = true }
landlock = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
# plan_admission bundle re-verify tests build/read `.mvmpkg` archives; verb-grant
# test decodes the signer pubkey hex.
tar.workspace = true
hex.workspace = true
# `TestEnv` env-var guard for env-mutating tests (reaper / substitution_endpoint).
mvm-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "sync", "test-util"] }
# audit-chain drift tripwire (supervisor tests).
mvm-verify = { path = "../mvm-verify" }
# jailer property tests re-spawn under SECCOMP_PROBE=1 before main.
ctor = "0.2"

[features]
default = ["packet-forwarder"]
custom-dns = ["dep:hickory-resolver"]
# The in-process userspace egress forwarder (smoltcp) that the
# mvm-network-tunnel-worker bin runs. Default-on so the worker builds in a
# normal workspace build; a consumer that only spawns the worker (mvm-cli) sets
# default-features = false to keep the stack out of its closure.
packet-forwarder = ["dep:smoltcp"]
# Build the libkrun supervisor bin against libkrun's FFI.
libkrun-sys = ["libkrun-sys/libkrun-sys"]
# Live-boot integration tests (dev host with libkrun). Never in CI's no-VM lanes.
libkrun-live = ["libkrun-sys"]

[lints]
workspace = true
