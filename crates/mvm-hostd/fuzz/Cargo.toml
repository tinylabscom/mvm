[package]
name = "mvm-hostd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detach from the parent workspace — `crates/mvm-hostd/fuzz` is listed
# under `workspace.exclude` in the repo root Cargo.toml because
# `libfuzzer-sys` only links cleanly under cargo-fuzz's wrapper (which
# injects sanitizer + linker flags). An empty `[workspace]` table
# self-identifies this manifest as standalone.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# rcgen (pulled in transitively via mvm-hostd's egress-CA TLS path) carries
# a blanket `impl<T: Into<String>> From<T>` that collides with an impl
# `time` 0.3.48 added, breaking the build with E0119. There is no committed
# lock here (cargo-fuzz gitignores it), so the bound lives in the manifest —
# drop it once rcgen or time resolves the coherence clash.
time = ">=0.3, <0.3.48"
# The admitter's private-range list is `IpNet`, so a harness that opens one
# has to name the type.
ipnet = "2"

[dependencies.mvm-hostd]
path = ".."

[dependencies.mvm-core]
path = "../../mvm-core"

[dependencies.mvm-net]
path = "../../mvm-net"

[dependencies.mvm-contract]
path = "../../mvm-contract"

# Fuzz the gateway packet parser + payload rebuilder.
# `packet::parse` runs on every frame the guest puts on the wire (the
# first real parse on that path); `rebuild_with_payload` re-serializes
# observer-modified frames. Both sit on the untrusted-guest-bytes surface
# (claim 5). Harness goal: never panic on any input. Re-parsing the
# original payload through `rebuild_with_payload` must round-trip without
# panicking for any frame `parse` accepted.
[[bin]]
name = "fuzz_packet_parse"
path = "fuzz_targets/fuzz_packet_parse.rs"
test = false
doc = false
bench = false

[patch.crates-io]
arrayref = { git = "https://github.com/droundy/arrayref", rev = "f8d0299d863922db6c409d08098941e833b70d69" }

# Fuzz the userspace socket datapath's guest-facing ingress.
# Guest bytes off the vsock channel reach `L3Admitter::admit_outbound`
# (the first parse, IPv4 and IPv6), then the datapath's own re-read of an
# admitted packet in `send_to_network`, then the per-flow smoltcp stack via
# `deliver_from_guest`. All three sit on untrusted-guest bytes (claim 5).
# Harness goal: never panic on any input — a deny, a drop, or an `Err`, but
# never an abort and never an unwrap on a guest-written length.
[[bin]]
name = "fuzz_datapath_ingress"
path = "fuzz_targets/fuzz_datapath_ingress.rs"
test = false
doc = false
bench = false
