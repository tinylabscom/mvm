[package]
name = "mvm-gpu-cudart-shim"
description = "Guest drop-in libcudart.so shim: forwards the CUDA Runtime API to the mvm host GPU endpoint over vsock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A guest cdylib composed into the runtime overlay by mvm-images.
publish = false
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "cudart"
crate-type = ["cdylib"]

[dependencies]
mvm-gpu-shim-core = { path = "../mvm-gpu-shim-core" }
mvm-contract = { workspace = true }
libc.workspace = true

[lints]
workspace = true
