# Every published image pin `mvm` fetches, in one checked-in file.
#
# These pins used to be hand-copied across `crates/mvm-core/src/config.rs`,
# `crates/mvm-build/src/stage0_kernel.rs`, four workflows, a shell script and
# two integration tests, and kept in step by eye. A pin is spliced straight
# into a release download URL, so a copy left behind is not a type error or a
# failed test anywhere — it is a 404 on a fresh install's first boot.
#
# It lives inside `mvm-core` because `mvm-core` compiles it in, and a file
# inside the crate is inside every tree that builds the crate: the Nix
# workspace filter, the builder's source fingerprint and the SDK sidecar's all
# admit `crates/` whole. At the workspace root it would be one more top-level
# entry each of those lists had to be taught about, and a list that missed it
# would fail the guest build or serve a stale one.
#
# Rust reads this file through `mvm_core::image_set::image_train_lock()`.
# Shell and YAML read it through `scripts/locked-image-tag.sh`.
# `xtask check-image-lock` fails the build when a workflow, script or test
# names a boot-image tag that is not the one below, or selects an image asset
# by asking for the newest published release instead of this pin.
#
# Bump a `release_tag` only against a release that exists, and a `sha256` only
# against a checksum manifest whose signature has been verified: a pin inherits
# exactly the trust of the manifest it was copied out of.

schema_version = 2

# Where every artifact below is published. Part of the pin, not configuration:
# moving hosting is a trust-root change.
repository = "tinylabscom/mvm-images"

# The signed root object. The digest and identity below were verified against
# the published Sigstore bundle before this pin was advanced.
[image_set]
schema_version = 1
repository = "tinylabscom/mvm-images"
release_tag = "image-set/v0.1.0"
manifest_asset = "image-set.json"
manifest_sha256 = "9bb4f0bf01895b9ebda51f6f574cfa2902ae79e1bb4404c4665942aa4ecbf2ff"

[image_set.signing_identity]
workflow = ".github/workflows/release.yml"
tag_ref = "refs/tags/image-set/v0.1.0"

# Copied from that exact signed manifest. Consumers compare this declaration
# with the host before fetching a member; the pin-update workflow proves the
# copy agrees with the signed root.
[compatibility]
guest_agent_protocol = { min = 2, max = 2 }
builder_cache_contract = 4

# The boot image release the CLI expects. The boot image ships on its own
# counter so a rootfs or kernel fix does not have to wait for a CLI release.
# The whole tag, not a bare version, because it is a path segment in
# `https://github.com/<repository>/releases/download/<tag>/<asset>`.
[boot_image]
release_tag = "image-set/v0.1.0"

# The Stage 0 bootstrap kernel — the one kernel that can be neither built nor
# resolved by the ordinary kernel policy, because Stage 0 is what makes local
# kernel builds possible. It is a bootstrap seed: fetched and digest-verified
# even in a source checkout.
#
# It does not have to track the boot image. Stage 0 needs virtio-blk, vsock and
# ext4 from this kernel and nothing a newer release is likely to change, so the
# two tags are pinned separately even when they currently name the same release.
[stage0_kernel]
release_tag = "image-set/v0.1.0"

[stage0_kernel.artifact.aarch64]
name = "stage0-vmlinux-aarch64"
sha256 = "b73c1c6feed8722a259fae22a5a742363f73eb934627338c78c69d6e27c4c538"

[stage0_kernel.artifact.x86_64]
name = "stage0-vmlinux-x86_64"
sha256 = "ccd3bf13fd55fe90ca150053fd74d5f9b3f2633f62f5c39c28ec616d7836ac38"

# The previous producer remains explicit throughout the compatibility window.
# New consumers never select it implicitly; W7 owns mirroring and W8 owns its
# eventual removal after supported old CLIs have aged out.
[legacy]
repository = "tinylabscom/mvm"
release_tag = "boot-image/v0.1.5"

[legacy.signing_identity]
workflow = ".github/workflows/release-boot-image.yml"
tag_ref = "refs/tags/boot-image/v0.1.5"
