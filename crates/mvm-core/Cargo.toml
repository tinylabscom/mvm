[package]
name = "mvm-core"
version.workspace = true
edition.workspace = true
description = "Core types, IDs, config, and utilities for mvm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
mvm-contract = { workspace = true, default-features = false, features = ["protocol", "volume"] }
anyhow.workspace = true
base64.workspace = true
bs58.workspace = true
serde_jcs = "0.1"
unicode-normalization = "0.1"
chrono.workspace = true
# The no_std + alloc foundation crate. `plan::validity` re-exports its
# `FreshnessClaims`; `plan::{types,verb,verb_trust}` are module aliases
# onto its `plan` submodules.
# `protocol::signed_config` verifies
# subprocess startup config envelopes via Ed25519. The verify path
# is consumed by every subprocess crate at parse time; mvm-core is
# the natural home since it already owns the wire-format types.
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
# Folded in with mvm-plan: `plan::bundle` reads/writes
# tar bundle archives. Sync — adds no async/runtime dep to mvm-core.
tar.workspace = true
thiserror.workspace = true
# Optional: the only default-build async surface left is
# `protocol`'s hostd IPC transport, gated behind `hostd-transport`.
# `manifest-verify` (sigstore) pulls the rest. With both off, the default
# `mvm-core` build is runtime-free.
tokio = { workspace = true, optional = true }
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
regex.workspace = true
tempfile.workspace = true

# Folded in with the former mvm-security crate: the
# `crypto` module's AEAD (aes-gcm), HMAC, OS keychain (keyring),
# secret wrappers (secrecy/zeroize), and secret-token scanning
# (aho-corasick). All sync. `rand` is promoted from dev-only because
# key_rotation / secret_store generate keys at runtime.
aes-gcm.workspace = true
aho-corasick.workspace = true
hmac.workspace = true
keyring.workspace = true
secrecy.workspace = true
zeroize.workspace = true
rand.workspace = true
# Opt-in cosign-keyless image verification (off by default). The modular
# sigstore-verify stack checks bundles offline against an embedded trust root
# — no rsa, no OIDC client, no async TUF fetch — so the default mvm-core build
# stays runtime-free and `manifest-verify` pulls no tokio.
sigstore-verify = { version = "0.11", default-features = false, features = ["rustls"], optional = true }
sigstore-trust-root = { version = "0.11", default-features = false, optional = true }
sigstore-types = { version = "0.11", optional = true }
# Only under the `schema` feature (protocol-schema codegen);
# 0.8 matches the version mvm-sdk already pins, so no new lockfile entry.
schemars = { version = "0.8", features = ["chrono"], optional = true }
# The per-VM name-constrained egress CA lives in
# `crypto::egress_ca`, gated behind `egress-ca` so the foundation crate's default
# closure doesn't pull `rcgen`/`ring`/`yasna` for non-egress consumers. Sync, no
# tokio (runtime-free invariant unaffected).
rcgen = { workspace = true, optional = true }
# The `client` module's `MvmClient` facade. `async-trait` is a proc-macro (no
# async runtime — the runtime-free gate only forbids tokio); `mvm-http` backs the
# remote gateway. Both optional so a default/guest build pulls neither.
async-trait = { workspace = true, optional = true }
mvm-http = { workspace = true, optional = true }

# `default` is empty: the default `mvm-core` build is runtime-free.
# The hostd IPC transport pulls tokio only behind
# `hostd-transport`, which mvmd enables via the `mvmctl` facade
# (`mvmctl/hostd-transport`); `manifest-verify` pulls it independently.
# `xtask check-core-runtime-free` asserts `cargo tree -p mvm-core
# -e no-dev` carries no `tokio` so this can't silently regress.
[target.'cfg(target_os = "linux")'.dependencies]
# The shared seccomp syscall table needs libc constants on Linux.
libc.workspace = true
# TPM2 TSS bindings for the `attestation-tpm2` provider. Only resolved on
# Linux; the provider code is also `cfg(target_os = "linux")` gated so
# macOS builds never link against the TPM libraries.
tss-esapi = { version = "7", optional = true }

[features]
default = []
# Read-only PROV-O/Turtle export of chain-signed audit logs. Kept off by
# default so lean builder-VM binaries (e.g. mvm-host-vm-init) do not pay
# for the serializer or its extra dependencies.
provenance = []
# The per-VM name-constrained egress CA
# (`crypto::egress_ca`). Pulls `rcgen` (sync — ring/yasna, no tokio), so the
# runtime-free default build is unaffected. Enabled by mvm-runtime (cert
# delivery) and mvm-hostd (the TLS terminator).
egress-ca = ["dep:rcgen"]
# The `client` module (`MvmClient` trait + DTOs + `MockBackend`). Pulls
# `async-trait` only — a proc-macro, no async runtime — so the runtime-free
# invariant holds. `mvm-client` enables this to add the in-process
# `LocalBackend`; `mvm-sdk`'s `client-facade` enables it for the subprocess impl.
client = ["dep:async-trait"]
# The remote REST `GatewayBackend`. Adds `mvm-http` (which pulls tokio), so it is
# a distinct feature from `client`: only a fleet/studio consumer opts in.
client-remote = ["client", "dep:mvm-http"]
# Expose `plan::signing::test_support` (shared `ExecutionPlan` fixtures) to
# other crates' test builds without shipping the fixtures in a release build.
test-support = []
# The hostd IPC async transport in `protocol` (mvmd ↔ mvm-hostd control
# channel: read/write_frame + send/recv request/response). The only
# async surface in mvm-core besides `manifest-verify`; gated so the
# default closure carries no tokio. Pulls tokio's `io-util`.
hostd-transport = ["dep:tokio", "tokio/io-util"]
# Cosign-keyless manifest verification via the modular sigstore-verify stack.
# Verification is synchronous and offline (embedded trust root + the bundle's
# inline transparency-log inclusion proof), so this feature pulls no tokio and
# the runtime-free invariant holds with or without it.
manifest-verify = [
    "dep:sigstore-verify",
    "dep:sigstore-trust-root",
    "dep:sigstore-types",
]
# Hardware attestation provider stubs — each enables
# the corresponding `crypto::attestation::provider` impl.
attestation-tpm2 = ["dep:tss-esapi"]
attestation-sev-snp = []
attestation-tdx = []
attestation-apple-device = []
# Derive `schemars::JsonSchema` on the protocol types the
# host↔guest RPC surface embeds (`AgentProfile`, `BackpressureReason`), so
# `mvm-agentd`'s `emit_protocol_schema` bin can emit the protocol schema.
# Off by default: the schema is a build-time codegen input, never linked
# into the runtime. Keeps the default closure schemars-free. Forwards to
# `mvm-contract/schema` because the RPC surface embeds mvm-contract plan
# types (e.g. `VerbGrant`) that need their JsonSchema derive turned on too.
schema = ["dep:schemars", "mvm-contract/schema"]

# Emit the host-services broker JSON Schema (the in-guest SDK type-codegen
# input). `required-features` keeps `schemars` out of any default build — the
# bin only exists under `--features schema`, mirroring `mvm-agentd`'s
# `emit_protocol_schema`.
[[bin]]
name = "emit_broker_schema"
path = "src/bin/emit_broker_schema.rs"
required-features = ["schema"]

# Standalone cosign-bundle verifier for a pack manifest's signature payload —
# used by the pack-signing CI smoke to prove a real `cosign sign-blob` bundle
# round-trips through the sigstore-verify stack. `required-features` keeps it
# out of any default build, matching `manifest-verify`'s opt-in cosign deps.
[[example]]
name = "verify-pack-signature"
required-features = ["manifest-verify"]

# Same purpose for the image-manifest signature path (the dev-image download
# verifier), calling `image_verify::verify_manifest` directly.
[[example]]
name = "verify-signed-manifest"
required-features = ["manifest-verify"]

# Same purpose for the pack revocation list, calling
# `pack_revocation::verify_pack_revocation_list` directly.
[[example]]
name = "verify-pack-revocation-list"
required-features = ["manifest-verify"]

[dev-dependencies]
# Test-only: the mandatory-deny range test parses CIDRs to cross-check the
# generated iptables script. No production path in this crate uses it.
ipnet = { workspace = true }
# `OsRng` for generating fresh ed25519 keys in signed_config tests
# without committing static fixtures. (Also a non-dev dep above for the
# crypto module; kept here so a future dep-trim of the main `rand` does
# not silently break the signed_config tests.)
rand.workspace = true
# The `protocol` hostd-transport `#[tokio::test]`s need a runtime +
# macros regardless of which non-dev features pull tokio. Dev-only, so
# the `-e no-dev` runtime-free gate ignores it.
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
# The egress-CA tests parse minted certs (x509-parser) and
# assert nameConstraints enforcement through a real path verifier (rustls/webpki,
# ring backend). Dev-only — the egress-ca module itself only needs rcgen.
x509-parser = "0.18"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[lints]
workspace = true
