[package]
name = "mvm-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detached from the parent workspace: the root Cargo.toml excludes this
# path, but cargo also requires the excluded sub-package to self-identify
# as standalone. An empty [workspace] table is the documented fix.
[workspace]

# cargo-fuzz looks for this metadata key.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.mvm-core]
path = ".."
# fuzz_application_locator drives the registry-pack application surface,
# which is host-state-gated.
features = ["host-state"]

# libfuzzer harness only; never a bench/test/doc target.
[[bin]]
name = "fuzz_snapshot_frame"
path = "fuzz_targets/fuzz_snapshot_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_application_locator"
path = "fuzz_targets/fuzz_application_locator.rs"
test = false
doc = false
bench = false
