[package]
name = "mvm-cli"
version.workspace = true
edition.workspace = true
description = "CLI commands, UI, and bootstrap for mvm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
mvm-core = { workspace = true, features = ["client-remote", "provenance"] }
mvm-agentd.workspace = true
mvm-runtime = { workspace = true, default-features = false }
mvm-vmm = { workspace = true }
mvm-backends = { workspace = true }
mvm-build = { workspace = true, default-features = false }
libkrun-sys.workspace = true
mvm-fs.workspace = true
mvm-http.workspace = true
mvm-observability.workspace = true
mvm-hostd.workspace = true
# The networking-mode compatibility gate: a plan that needs host-side
# substitution must not be able to select the L3 tunnel, where the host
# sees only ciphertext.
# The `MvmClient` facade: read-only listing/inspect commands route through
# `mvm_client::LocalBackend` instead of reaching `mvm_runtime` internals.
mvm-client.workspace = true
mvm-mcp.workspace = true
# `mvmctl compile` reads the Workload IR (mvm_contract::ir, re-exported from
# mvm_contract::ir) and routes it through the compile pipeline.
# `deploy-remote` carries the HTTPS upload behind `mvmctl deploy`. It is off by
# default in `mvm-sdk` so the in-guest cdylib built from that crate's lib target
# links no rustls/ring/tokio; the CLI is the one consumer that needs it.
mvm-sdk = { workspace = true, features = ["deploy-remote"] }
mvm-capture.workspace = true
# Direct IR access (`mvm_contract::ir::…`) for the command surfaces that
# only need the DTOs, not the rest of the SDK's build-time tooling.
mvm-contract.workspace = true
anyhow.workspace = true
blake3.workspace = true
# Real ext4 inode lookup for the Stage 0 post-build check (replaces the
# old raw-byte substring scan over rootfs.ext4).
ext4-view.workspace = true
# `mvmctl audit verify-cert` decodes base64 destruction-cert
# signatures + pubkeys.
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
uuid.workspace = true
clap.workspace = true
rustls.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
flate2.workspace = true
hex.workspace = true
tempfile.workspace = true
toml.workspace = true
notify = { workspace = true, optional = true }
notify-debouncer-mini = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "time"] }
tracing.workspace = true
which.workspace = true

[[example]]
name = "verification_loop"
# Drives the `WarmLease`/`ExecBuilder` DX layer against the hermetic mock
# backend so the example runs on any host; needs the mock compiled in.
required-features = ["test-support"]

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["process", "signal", "ptrace"] }

[build-dependencies]
hex.workspace = true
toml.workspace = true
sha2.workspace = true

[dev-dependencies]
mvm-core = { workspace = true, features = ["test-support"] }
assert_cmd.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
# Integration tests use libc::kill(-pgid, SIGKILL) to reap a timed-out
# mvmctl process tree (supervisor + any legacy gateway helper) so the run can
# never hang.
libc.workspace = true

[[test]]
name = "wasm_run"
required-features = ["wasm-backend"]

[features]
# Cross-compile the Linux host binaries (`mvm-host-vm-init`, `stage0-init`, …)
# and `include_bytes!` them into `mvmctl`. Off by default: it is the only thing
# left in `build.rs`, it needs the pinned zig + cargo-zigbuild toolchain, and a
# dev build that is not booting a VM does not need the payload. With it off the
# build script watches four files and writes an empty table, so cargo runs it
# once and never again on the inner loop. `just embed` and the release workflow

# turn it on; `host_binaries::extract` refuses with that hint when it is off.
embed-host-bins = []
# Forward to `mvm-runtime/wasm-backend`: enables `mvmctl --hypervisor wasm`.
# Off by default so the default workspace build carries no `wasmtime` dependency.
wasm-backend = ["mvm-runtime/wasm-backend"]
# `builder-vm` is default so builds prefer the libkrun-backed builder VM
# with a persistent /nix store. Runtime gating via
# `libkrun_sys::is_available()` still falls back cleanly when libkrun
# isn't installed on the host.
default = ["builder-vm", "pure-mkfs"]
contributor-bootstrap = [
    "mvm-runtime/contributor-bootstrap",
    "mvm-build/contributor-bootstrap",
]
builder-vm = ["mvm-build/builder-vm"]
# In-process, pure-Rust rootfs materialization (no builder VM / mkfs) for the
# `run --image` path. Default: the run path builds the ext4 image with the
# memory-safe `mvm-fs` writer instead of shelling out to a builder VM. The
# `builder-vm` feature stays default for `dev up`, and `MVM_MATERIALIZE_BUILDER_VM`
# routes the run path back through the builder VM when set.
pure-mkfs = ["mvm-build/pure-mkfs"]
# Extract libkrunfw's bundled
# TSI-patched kernel at runtime so Stage 0 boots a kernel where
# libkrun's AF_INET-over-vsock (TSI) path actually works. The feature
# is opt-in because normal CI and library consumers should not require
# libkrun headers. Builds that run the native libkrun path can enable it
# on hosts where libkrunfw is installed.
libkrun-sys = ["libkrun-sys/libkrun-sys"]
# Opt-in lane for the interaction-latency gate's live libkrun probe
# test + its boot orchestration. Off by default so `cargo test
# --workspace` on stock CI stays VM-free (hosted macOS runners lack
# Hypervisor.framework nested virt for a libkrun guest). Enabled on a dev
# host / self-hosted macOS runner with the slp/krun Homebrew trio
# installed and an `mvm-libkrun-supervisor` available on the launch path.
# Pure test/codegate marker — mvm-cli spawns the supervisor as a
# subprocess and does not link libkrun itself.
libkrun-live = []
# Structural enforcement of the "no prebuilt builder VM artifact
# until release" invariant (see AGENTS.md / CLAUDE.md). When off — the default
# for every contributor build — `download_builder_vm_image` and its helpers
# are entirely cfg'd out, so a cache miss with no in-repo flake hard-errors
# at the source-checkout boundary rather than silently pulling a GitHub
# release artifact. The feature is only intended to be enabled when cutting
# an end-user-binary release that legitimately wants the download fallback.
release-artifact-bootstrap = []
# Mark an official distribution separately from the builder-image bootstrap
# capability. CI exercises the published-builder path from a source checkout;
# coupling these features makes that test refuse its local runtime overlay
# before it can boot the workload. Official artifacts also verify the signed
# builder manifest before using a published image.
release-channel = ["mvm-build/release-channel", "manifest-verify"]
custom-dns = ["mvm-hostd/custom-dns"]
dev-watch = ["dep:notify", "dep:notify-debouncer-mini"]
manifest-verify = [
    "mvm-runtime/manifest-verify",
    "mvm-core/manifest-verify",
]
template-registry-s3 = ["mvm-runtime/template-registry-s3"]
# Forwards to `mvm-runtime/test-support` + `mvm-client/test-support`: the
# hermetic in-memory `MockBackend` and the `--hypervisor mock` fast paths in
# `fs`/`proc`/`diff` that key off it. Off by default so the mock — a Tier-3
# test double with none of the security claims — never ships in a production
# `mvmctl` binary; the test suite and the `verification_loop` example turn it on.
test-support = ["mvm-runtime/test-support", "mvm-client/test-support"]
# Propagate the debug-only HVF warm-restore validation lane to the runtime.
hvf-live-validation = ["mvm-runtime/hvf-live-validation"]
trusted-apfs = ["mvm-runtime/trusted-apfs"]

[lints]
workspace = true
