[package]
name = "mvm-net"
version.workspace = true
edition.workspace = true
description = "NetworkProvider trait + provisioning/policy/registry seam for mvm. The TAP/bridge impl lives in mvm-runtime; the WireGuard/Tailscale mesh impl is mvmd's."
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
mvm-core.workspace = true
# IR `NetworkMode` the registry resolves. Direct dep on the no_std
# foundation crate now that the IR lives there — mvm-net no longer
# needs mvm-sdk's build-time tooling for this.
mvm-contract.workspace = true
# CIDR containment for the address allocator, the admitted-private
# ranges, and the ingress/DNS range guards. Same crate the shared
# claim-10 projection already uses, so the two cannot disagree.
ipnet.workspace = true
thiserror.workspace = true
# Lease serialization + the keyed MAC over its canonical bytes. Both are
# already workspace deps; the lease adds no new crate.
serde.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
