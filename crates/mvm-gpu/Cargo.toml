[package]
name = "mvm-gpu"
description = "Host-side GPU endpoint for mvm: serves the guest CUDA/NVML shim RPCs over vsock/UDS/TCP against the real driver or a deterministic stub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A host binary shipped in the release tarball, not a library anyone builds
# against; nothing in the crates.io publish set depends on it.
publish = false
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Architectural invariant #1 (.github/workflows/architecture.yml): the
# mvm-gpu-endpoint is a per-VM host process, one per guest that asked for a
# GPU — the same per-VM substrate shape as mvm-network-endpoint, never an
# orchestration control-plane server.
[package.metadata.mvm.architecture]
substrate_server_category = "per-VM host GPU endpoint (guest CUDA/NVML shim RPC server, one per GPU-enabled guest)"

[dependencies]
mvm-contract = { workspace = true }
# For the host-helper contract probe: the workload runner resolves this
# binary through `mvm_vmm::host::aux_bin::resolve_verified`, which asks for
# `helper_contract::HOST_HELPER_CONTRACT_VERSION` before spawning.
mvm-vmm = { workspace = true }
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "mvm-gpu-endpoint"
path = "src/bin/mvm-gpu-endpoint.rs"

# The guest drop-in shim cdylibs (libcuda.so.1 / libcudart.so /
# libnvidia-ml.so.1), each forwarding its API to the host endpoint over
# vsock through `src/shim.rs`. Examples rather than crates so the guest
# side lives in the same umbrella crate as the endpoint; the guest-bins
# build and nix/packages/mvm-gpu-shims.nix build one `--example` per
# invocation and pass the soname link-arg the loader resolves them by
# (an example has no build script of its own).
[[example]]
name = "cuda"
crate-type = ["cdylib"]

[[example]]
name = "cudart"
crate-type = ["cdylib"]

[[example]]
name = "nvidia_ml"
crate-type = ["cdylib"]
