[package]
name = "mvm-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Image → mountable rootfs for mvm: OCI distribution client (registry/manifest/layer fetch + allow-listed unpack) and a pure-Rust, memory-safe, deterministic ext4 writer (no mkfs, no subprocess)."

[package.metadata.mvm.architecture]
substrate_server_category = "per-workload immutable snapshot helper (privileged APFS sealing and materialization)"

[dependencies]
async-trait.workspace = true
ed25519-dalek.workspace = true
ext4-view.workspace = true
flate2.workspace = true
hex.workspace = true
libc = { workspace = true }
mvm-contract.workspace = true
mvm-http.workspace = true
rustix = { version = "1.1", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2 = { workspace = true }
tar = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }
tracing.workspace = true
uuid.workspace = true
xattr = { workspace = true }

[dev-dependencies]
am-fs-ext4 = "0.4"
base64.workspace = true
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "test-util", "time"] }

[features]
default = []
# Opt-in Apple APFS read-only snapshot provider. The provider is deliberately
# not part of the default build until its host privilege and live mount tests
# are run on the target machine.
trusted-apfs = []
# Exposes `elf::test_fixture` — a synthetic ELF64 shared object builder — to
# other crates' tests. The sidecar resolver proves an artifact's libc from its
# `DT_NEEDED` list, so any test seeding a sidecar cache needs a *real* object
# rather than a stub; without this the fixture would be copied into every crate
# that seeds one, and a copy that drifts makes those tests pass for the wrong
# reason. Off by default so it never ships in a release binary.
test-support = []

[lints]
workspace = true

[[bench]]
name = "in_memory_build"
harness = false
