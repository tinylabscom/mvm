[package]
name = "mvm-supervisor"
description = "Trusted host-side supervisor: owns egress proxy, tool gate, key release, audit signing, artifact capture, plan execution state machine. Plan 37 §7B."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
mvm-core.workspace = true
mvm-backend.workspace = true
# Plan 73 Followup A — admission gate calls
# `mvm_sdk::compile::deps_audit::verify_sealed_volume` to re-derive
# the on-disk volume hash and compare it against the plan's pinned
# `DepsVolumeBinding`. Security claim 9.
mvm-sdk.workspace = true
# `mvm` provides the `VmNameRegistry` the TTL reaper walks.
# Heavy dep, but the supervisor's eventual job is to drive runtime
# operations anyway, so we'd be importing it shortly regardless.
mvm.workspace = true
anyhow.workspace = true
async-trait = "0.1"
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
# Used by the balloon reclaim controller as a cross-platform memory-
# pressure source. PSI on Linux and `vm_pressure` on macOS are
# stronger signals — wiring those in is a follow-up.
sysinfo = { version = "0.30", default-features = false }
# Plan 60 Phase 3 Slice B — L4 egress policy CIDR matching.
ipnet.workspace = true
# Plan 60 Phase 3 Slice B — pure-Rust DNS resolver, alternative to
# the host libc's `getaddrinfo`. Opt-in; `TokioDnsResolver` stays the
# default until consumers explicitly switch.
hickory-resolver = { workspace = true, features = ["tokio-runtime"], optional = true }
# `rand` in main deps (not dev-only): the TTL reaper (G6 of the parity
# plan, "TTL reaper precision as side channel") applies ±10 s jitter
# to its tick interval via a `Rng` so observers can't use TTL expiry
# as a precise timing oracle.
rand.workspace = true
regex.workspace = true
# Plan 65 W6 — `SecretBox<String>` wraps provider API keys so they
# zeroize on drop and refuse accidental `Debug`/`Display`.
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror = "1"
# Plan 113 / ADR-064 — `ObserverAllowlist` parses the host-trusted
# observer allowlist at `~/.mvm/observers/allowlist.toml` (mode 0600).
toml.workspace = true
# Plan 60 Phase 7 — `web_fetch` tool parses RFC-3986 URLs to enforce
# scheme/host invariants before the allowlist check.
url = "2"
# Plan 60 Phase 7 — `ReqwestHttpFetcher` (the reqwest-backed
# `HttpFetcher` impl for `mvm.web_fetch`). Workspace feature set
# already includes `rustls-tls` so we don't pull openssl.
reqwest = { workspace = true }
# Wave 2.6: L7EgressProxy uses tokio::net::lookup_host for the
# production DnsResolver impl. Tests use only `macros + rt`, the
# proxy needs `net` for lookup. `rt-multi-thread` lands when the
# TCP listener loop ships in 2.6 chunk (c).
# Sprint 52 W1 follow-on: balloon_runtime spawns a periodic
# `tokio::time::sleep`-driven tick loop, hence the `time` feature.
tokio = { workspace = true, features = ["net", "rt", "time", "sync"] }
tracing.workspace = true

# Plan 60 Phase 7 staging tools: `O_NOFOLLOW` on read/write opens
# defends the upload + download path validators against a symlink
# planted inside the staging dir. Sprint 52 W1 follow-on also
# leans on this unix-wide libc dep for macOS's
# `sysctlbyname("kern.memorystatus_vm_pressure_level")` reader in
# `VmPressureLevelSource`. Unix-wide (macOS + Linux); the
# Windows branch in `staging.rs` falls back to a `symlink_metadata`
# check.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
# Plan 102 W6.A commit 2 — `FileAuditSigner::sign_and_emit` now takes
# an exclusive flock on the per-tenant chain file across the whole
# read-cursor / sign / append critical section. Without it, two
# `mvm-libkrun-supervisor` processes for the same tenant race the
# in-memory cursor cache vs. the on-disk chain — both restore the same
# prev_hash, both append, `verify_audit_chain` fails. rustix is already
# in mvm-oci's deps (workspace dep); pulling it into mvm-supervisor.
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "sync", "test-util"] }
# ADR-069 — drift tripwire: assert the wasm-clean re-implementation in
# mvm-verify accepts a chain this crate actually produced. If AuditEntry
# gains/reorders a field, mvm-verify's mirror stops matching and this
# cross-crate test fails here, not silently in the browser.
mvm-verify = { path = "../mvm-verify" }

[features]
default = []
custom-dns = ["dep:hickory-resolver"]

[lints]
workspace = true
