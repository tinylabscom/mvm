[package]
name = "mvm-agentd-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Detach this Cargo.toml from the parent workspace. The root
# `Cargo.toml` lists `crates/mvm-agentd/fuzz` in `workspace.exclude`,
# but recent cargo versions also require the excluded sub-package to
# self-identify as standalone (otherwise `cargo build --manifest-path
# crates/mvm-agentd/fuzz/Cargo.toml` errors with "current package
# believes it's in a workspace when it's not"). An empty `[workspace]`
# table is the documented fix.
[workspace]

# This standalone graph cannot inherit the root workspace's source patch.
[patch.crates-io]
arrayref = { path = "../../../third_party/arrayref" }

# cargo-fuzz looks for this metadata key; without it the harness refuses
# to drive the binaries.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
# Must track the workspace major. This harness hands a VerifyingKey across
# the mvm-agentd path dep, so a second major here is not merely a duplicate
# dependency — it is a different type, and the target stops compiling.
ed25519-dalek = "3"

[dependencies.mvm-agentd]
path = ".."

[dependencies.mvm-core]
path = "../../mvm-core"

[dependencies.mvm-contract]
path = "../../mvm-contract"

# `fuzz_builder_request` covers the
# `HostVmRequest`/`HostVmResponse` payloads in
# `mvm-build::builder_protocol`. mvm-build depends on mvm-agentd, so
# this is fine direction-wise; the fuzz crate is already detached
# from the workspace (see [workspace] above).
[dependencies.mvm-build]
path = "../../mvm-build"

# Forbid building these as bench/test/doc; they are libfuzzer harnesses
# only, driven by `cargo fuzz run <name>`.
[[bin]]
name = "fuzz_guest_request"
path = "fuzz_targets/fuzz_guest_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_sealed_frame"
path = "fuzz_targets/fuzz_sealed_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_entrypoint_event"
path = "fuzz_targets/fuzz_entrypoint_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_authed_path"
path = "fuzz_targets/fuzz_authed_path.rs"
test = false
doc = false
bench = false

# Persistent builder VM dispatch wire.
[[bin]]
name = "fuzz_builder_request"
path = "fuzz_targets/fuzz_builder_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_dns_codec"
path = "fuzz_targets/fuzz_dns_codec.rs"
test = false
doc = false
bench = false

# Host→guest workload input wire.
[[bin]]
name = "fuzz_input_frame"
path = "fuzz_targets/fuzz_input_frame.rs"
test = false
doc = false
bench = false
