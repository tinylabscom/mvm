[package]
name = "mvm-backends"
version.workspace = true
edition.workspace = true
description = "Concrete VMM backend implementations for mvm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Not a new category: this is the same "per-VM provider plumbing" mvm-runtime
# already declares. The backend-local vsock listeners moved here with the
# drivers, so only the crate that owns them changed.
[package.metadata.mvm.architecture]
substrate_server_category = "per-VM provider plumbing (backend-local vsock listeners)"

[dependencies]
mvm-vmm = { workspace = true }
mvm-core = { workspace = true }
# `CpuGrant` — the admitted CPU bound a driver hands to `mvm_core::cpu_scope`
# when it spawns its per-VM process.
mvm-contract = { workspace = true }
mvm-net = { workspace = true }
mvm-agentd = { workspace = true }
anyhow = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
libkrun-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
which = { workspace = true }

[features]
default = []
test-support = []

[lints]
workspace = true

[dev-dependencies]
mvm-vmm = { workspace = true, features = ["test-support"] }
# `TestEnv` + `cpu_scope::pretend_mechanism_present` — the driver tests assert
# the argv a CPU-bounded spawn produces, which needs the mechanism probe to
# answer the same way on every host.
mvm-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# The fork mount-namespace path (fc/fork_namespace.rs) is Linux-only: it
# unshares CLONE_NEWNS and bind-mounts the child's device paths. macOS
# compiles that module out, which is exactly how a missing dep here stays
# invisible until CI builds for Linux.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "sched"] }
