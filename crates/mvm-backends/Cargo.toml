[package]
name = "mvm-backends"
publish = false
version.workspace = true
edition.workspace = true
description = "Concrete VMM backend implementations for mvm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Not a new category: this is the same "per-VM provider plumbing" mvm-runtime
# already declares. The backend-local vsock listeners moved here with the
# drivers, so only the crate that owns them changed.
[package.metadata.mvm.architecture]
substrate_server_category = "per-VM provider plumbing (backend-local vsock listeners)"

[dependencies]
mvm-core = { workspace = true }
# `CpuGrant` — the admitted CPU bound a driver hands to `mvm_core::spawn_scope`
# when it spawns its per-VM process.
mvm-contract = { workspace = true }
anyhow = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
which = { workspace = true }

# Every driver here — Firecracker, HVF, libkrun, QEMU, and the mock that
# stands in for them — drives a VMM through Unix sockets, file descriptors
# and vsock, so the driver modules and the crates only they need build on
# Unix hosts alone. The VMM seam in mvm-vmm is part of that: it carries the
# fd-backed guest-memory and vsock device model with it. On any other host
# the crate builds as `run_sidecars` and nothing else.
[target.'cfg(unix)'.dependencies]
mvm-vmm = { workspace = true }
mvm-net = { workspace = true }
mvm-agentd = { workspace = true }
libkrun-sys = { workspace = true }
libc = { workspace = true }

[features]
default = []
test-support = []

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
mvm-vmm = { workspace = true, features = ["test-support"] }

[dev-dependencies]
# `TestEnv` + `spawn_scope::pretend_mechanism_present` — the driver tests assert
# the argv a scoped spawn produces, which needs the mechanism probe to answer
# the same way on every host.
mvm-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# The fork mount-namespace path (fc/fork_namespace.rs) is Linux-only: it
# unshares CLONE_NEWNS and bind-mounts the child's device paths. macOS
# compiles that module out, which is exactly how a missing dep here stays
# invisible until CI builds for Linux.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "sched"] }
