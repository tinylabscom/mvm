[package]
name = "mvm-hostlib"
description = "Host library C ABI (libmvm_hostlib) — the MvmClient surface, loaded in-process by the language SDKs instead of running mvmctl."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `cdylib` is the artifact the Python and TypeScript SDKs load. `lib` lets the
# SDK error taxonomy and the tests reference the status codes as constants
# instead of restating them.
crate-type = ["lib", "cdylib"]

[dependencies]
# The local backend behind the ABI. Nothing depends on this crate, so linking
# the whole client closure here cannot form a cycle.
mvm-client.workspace = true
# The guest-agent payload types the `guest.*` methods return.
mvm-agentd.workspace = true
mvm-core = { workspace = true, features = ["client"] }
# The process declarations a library embedder makes before resolving or
# spawning any helper.
mvm-vmm.workspace = true
anyhow.workspace = true
base64.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }
# Build-time only: the ABI schema and method-table emitters. The schema
# feature keeps schemars out of the shipped cdylib, mirroring mvm-agentd.
schemars = { version = "0.8", optional = true }

[features]
# Derives JsonSchema on the ABI request/reply types so the emitters can write
# the SDK-codegen input. Never enabled for the library artifact itself.
schema = ["dep:schemars", "mvm-agentd/schema", "mvm-core/schema"]

[lints]
workspace = true

[[bin]]
name = "emit_host_abi_schema"
path = "src/bin/emit_host_abi_schema.rs"
required-features = ["schema"]

[[bin]]
name = "emit_host_abi_methods"
path = "src/bin/emit_host_abi_methods.rs"
required-features = ["schema"]

