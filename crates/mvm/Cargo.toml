[package]
name = "mvm"
version.workspace = true
edition.workspace = true
description = "Shell execution and VM lifecycle for mvm"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
autobins = false

[dependencies]
mvm-core.workspace = true
mvm-guest.workspace = true
mvm-build = { workspace = true, default-features = false }
mvm-backend = { workspace = true, default-features = false }
anyhow.workspace = true
# Plan 60 Phase 7a — `OverlayManager` is an async trait carrying
# chrono timestamps + thiserror'd typed errors.
async-trait = "0.1"
thiserror = "1"
base64.workspace = true
chrono.workspace = true
colored.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
secrecy.workspace = true
indicatif.workspace = true
inquire.workspace = true
# Plan 126 B2 — the lean S3 client (consolidated with mvm-storage; replaced the
# heavier `opendal` whose ~70-crate closure the dep budget rejects). `aws` gives
# the S3 builder + its reqwest/rustls path; only `template-registry-s3` pulls it.
object_store = { version = "0.11", optional = true, default-features = false, features = [
    "aws",
] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
tokio.workspace = true
libc.workspace = true

[features]
default = []
contributor-bootstrap = [
    "mvm-build/contributor-bootstrap",
    "mvm-backend/contributor-bootstrap",
]
manifest-verify = ["mvm-core/manifest-verify"]
template-registry-s3 = ["dep:object_store"]

[lints]
workspace = true
