[package]
name = "mvm-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Dev-only cucumber-rs BDD conformance harness. Runs the Gherkin scenarios under features/suites/ against the real mvmctl binary (and, as later suites land, the mvm-client facade). Not a dependency of any shipped crate."

[[test]]
name = "conformance"
harness = false
# Opt-in: cucumber drives its own scenario loop and does not speak the
# libtest CLI (`--list`), so building this target in a plain workspace test
# run breaks `cargo nextest run --workspace` at list time and would make
# `cargo test --workspace` launch the whole BDD suite implicitly. `just bdd`
# enables the feature explicitly.
required-features = ["bdd"]

[features]
# Gates the cucumber conformance runner (see the [[test]] target above).
bdd = []

[dependencies]
serde.workspace = true
toml.workspace = true


[dev-dependencies]
# Only pulled in at test time (`just bdd` / `cargo test -p mvm-conformance
# --test conformance`) — not a normal dependency of this crate, and never a
# dependency of any shipped crate. `cargo tree -p mvm-conformance -e no-dev`
# must not list cucumber.
cucumber = "0.23"
tokio.workspace = true
# Cross-workspace `mvmctl` binary resolution — the same mechanism
# crates/mvm-cli/tests/cli.rs already uses, so a scenario keeps working
# through a crate rename as long as the produced binary is still named
# `mvmctl`.
assert_cmd.workspace = true
# Inspects the generated command tree so the BDD help-width check covers every
# visible and hidden subcommand, rather than maintaining a second command list.
clap.workspace = true
# Parses the `build address --json` report in the workload-identity steps.
# Dev-only: `cargo tree -p mvm-conformance -e no-dev` must not gain it.
serde_json.workspace = true
# Drives the real VMM-driver bootargs and libkrun kernel-mapping seams without
# starting a VM. `test-support` keeps the conformance-only inspection helpers
# out of production builds.
mvm-runtime = { workspace = true, features = ["test-support"] }
mvm-core = { workspace = true, features = ["test-support"] }
# `test-support` for `elf::test_fixture`: the sidecar resolver proves an
# artifact's libc from its `DT_NEEDED`, so a staged fixture has to be a real ELF.
mvm-fs = { workspace = true, features = ["test-support"] }
# The overlay-aware guest sidecar (`GuestSidecar`) the warm-claim scenario
# writes next to its synthetic parent rootfs, so the runner's overlay-contract
# gate admits the cloned child exactly like a cold boot would. Same feature
# set mvm-runtime already builds it with, so this adds no new closure.
mvm-build = { workspace = true, default-features = false, features = [
    "builder-vm",
    "pure-mkfs",
] }
# Signs the warm-claim scenario's synthetic child `ExecutionPlan` the same way
# `admit_plan_for_boot` does in production.
ed25519-dalek.workspace = true
# Result type for the warm-claim scenario's `CheckpointChainAnchor` /
# `NetworkEndpointSpawner` test doubles, matching the runner's own error convention.
anyhow.workspace = true
tar.workspace = true
tempfile.workspace = true
# Loading the conformance claim register for the R3 meta-gate.
toml.workspace = true
serde.workspace = true
# The SDK-sidecar scenarios exercise the real fail-closed admission gate rather
# than restating its rules, and stage a sidecar cache the resolver verifies.
# Dev-only: `cargo tree -p mvm-conformance -e no-dev` must not gain these.
mvm-hostd.workspace = true
mvm-agentd.workspace = true
# The HVF supervisor launch contract the save/restore scenarios assert on: the
# restore rewrite's output IS the security boundary, so the scenarios read the
# config type directly rather than inferring it from a booted VM.
mvm-vmm.workspace = true
# The secrets/PII scenarios drive the local SecretService to prove there is no
# reveal path for stored values.
mvm-client.workspace = true
mvm-contract.workspace = true
sha2.workspace = true
hex.workspace = true
# The apple-container scenarios pin the fake cached kernel with a BLAKE3
# sidecar, matching the backend's attestation contract.
blake3.workspace = true
# The sidecar acquire scenarios build the gzipped release tarball the
# `sdk-sidecar-image` job publishes, so the download path runs against staged
# local bytes instead of the network.
flate2.workspace = true
# The sealed-OCI initrd scenarios drive the real boot-policy decision
# (`mvm_cli::boot_policy`) in-process rather than re-stating it. Same feature
# set the `mvmctl` binary builds with, so this adds no new closure. Dev-only:
# `cargo tree -p mvm-conformance -e no-dev` must not gain it.
mvm-cli = { workspace = true, features = ["builder-vm", "pure-mkfs"] }
# The documented Rust examples are compiled by `tests/doc_rust_examples.rs`
# (bodies generated by `build.rs`). The docs teach both the SDK builder API and
# the `mvmctl` library facade, so both have to be linkable here or the examples
# cannot be type-checked at all. Dev-only.
mvm-sdk.workspace = true
mvmctl = { path = "../..", default-features = false }
# Allocates a host PTY for the interactive-console scenario. `mvmctl -t`
# refuses without a terminal on stdin, so a scenario driven through
# `Command::output()` — piped stdin — can never reach the guest's `openpty()`
# at all, which is why an interactive console that failed on every OCI image
# had no lane that could see it. `nix` is already in the workspace at this
# version for five shipped crates; only the `term` feature is new, and it is
# dev-only here.
nix = { version = "0.29", features = ["term"] }

[lints]
workspace = true
