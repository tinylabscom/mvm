[package]
name = "mvm-gpu-nvml-shim"
description = "Guest drop-in libnvidia-ml.so.1 shim: forwards NVML device queries to the mvm host GPU endpoint over vsock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A guest cdylib composed into the runtime overlay by mvm-images.
publish = false
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "nvidia_ml"
crate-type = ["cdylib"]

[dependencies]
mvm-gpu = { path = "../mvm-gpu" }
mvm-contract = { workspace = true }
libc.workspace = true

[lints]
workspace = true
