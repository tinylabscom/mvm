[package]
name = "mvm-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "no_std + alloc core for mvm: audit-log verifier (and, incrementally, the Workload IR + wire protocol + policy DTOs). The wasm/browser-capable foundation."

[dependencies]
# All no_std + alloc — pinned directly (not `workspace = true`) because
# the workspace-level entries for these five carry default features (or
# a hardcoded `std` feature) that a member can't override away. Versions
# match the workspace's resolved versions so Cargo still unifies on one
# copy of each.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "3", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true
