[project]
name = "mvm"
version = "0.15.1"
description = "Declarative microVM workloads for Python — author once, emit a Nix flake, boot under mvm."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tinylabs" }]
keywords = ["microvm", "nix", "firecracker", "iac", "infrastructure", "mvm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tinylabscom/mvm"
Repository = "https://github.com/tinylabscom/mvm"
Issues = "https://github.com/tinylabscom/mvm/issues"

[project.optional-dependencies]
# `mvm[schema]` enables pydantic-based schema auto-derivation
# from function type hints (plan-0009 v2). Without this extra,
# `mv.derive_schema(fn)` raises a clear ImportError pointing at this
# install path; explicit `mv.json_schema(...)` paths still work.
schema = ["pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel's platform tag is decided by hatch_build.py: when the
# publish workflow has embedded the per-platform host library at
# mvm/_native/, the wheel is platform-tagged so a platform's pip never
# installs a wheel without its transport; a build without the library
# (local development) stays universal and works everywhere the
# beside-mvmctl fallback reaches. The sdist stays universal — it carries
# no binary.
[tool.hatch.build.hooks.custom]
packages = ["mvm"]

[tool.hatch.build.targets.sdist]
include = [
    "mvm/**",
    "hatch_build.py",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    # The sdist is source-only: the host library is built per platform at
    # wheel time, never shipped in the source archive.
]
exclude = [
    "mvm/_native",
]

# Dev-tool versions are pinned for reproducible SDK builds.
# `datamodel-code-generator` lives in the workspace xtask, not here.
[dependency-groups]
dev = [
    "pytest==8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
