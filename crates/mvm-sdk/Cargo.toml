[package]
name = "mvm-sdk"
description = "Build-time Rust SDK for mvm — declare workloads, emit canonical IR, manage addons. Ported from mvmforge-sdk + mvmforge-addon (SDK port plan)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mvm-core = { workspace = true }
# The subprocess-backed MvmClient facade uses the trait + DTOs from
# `mvm-core`'s `client` module (behind that crate's `client` feature). Kept off
# by default so the mvmctl default closure gains no `async-trait`; the facade
# shells `mvmctl machine` and never links the runtime backend (`mvm-client`'s
# `LocalBackend`), so no `sdk -> backend -> build -> sdk` cycle forms.
async-trait = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror.workspace = true

# Runtime record mode encodes `Sandbox.files.write` bytes
# as base64 in the recording JSON so the lowering can re-emit them
# as a `before_start` shell hook.
base64 = { workspace = true }

# Addon module deps.
flate2 = { workspace = true }
hex = { workspace = true }
schemars = { version = "0.8", default-features = false, features = ["derive"] }
sha2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-nix = { workspace = true }

# Compile pipeline deps.
globset = { workspace = true }
tempfile = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }

[features]
default = []
client-facade = ["dep:async-trait", "mvm-core/client"]

[[bin]]
name = "emit_addon_schema"
path = "src/bin/emit_addon_schema.rs"

# Workload IR JSON-schema emitter.
[[bin]]
name = "emit_workload_schema"
path = "src/bin/emit_schema.rs"

[dev-dependencies]
# IR↔guest-parser contract test (runtime_json_contract): asserts the
# IR's emitted runtime.json shapes match mvm-agentd's runtime_config
# parser.
mvm-agentd = { workspace = true }
# Async tests for the subprocess MvmClient impl.
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
