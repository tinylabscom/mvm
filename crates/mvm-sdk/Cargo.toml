[package]
name = "mvm-sdk"
publish = false
description = "Rust SDK for mvm — build-time workload authoring and runtime record mode. The cdylib language SDKs load is mvm-host-services; this crate references it for the error taxonomy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mvm-core = { workspace = true }
# In-guest host-services FFI: drives `host.audit.v1` / `host.time.v1` /
# `host.cost.v1` over the vsock broker. The broker client and vsock primitives
# live in the guest-agent crate; mvm-sdk only holds the C-ABI veneer.
mvm-agentd.workspace = true
# Status codes for the error taxonomy. The C ABI itself moved to its own crate
# so the object loaded inside every guest does not carry this crate's
# host-side decorator toolchain.
mvm-host-services.workspace = true
# The Workload IR itself (`mvm_sdk::ir` re-exports `mvm_contract::ir`
# unchanged — see `src/lib.rs`). The IR's own `JsonSchema` derives come from
# `mvm-contract/schema`, which this crate's `schema` feature forwards to —
# never unconditionally. Cargo unifies features across the workspace, so
# enabling it here would switch schemars on inside `mvm-contract` for every
# consumer and defeat the gating in `mvm-core`/`mvm-contract`/`mvm-agentd`.
mvm-contract.workspace = true
mvm-compiler = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Only the remote deploy transport (`MvmdClient::ship`) speaks HTTPS, and it is
# a host-side path. Optional so the default lib build — which is what the
# in-guest `libmvm_host_services.so` cdylib is built from — carries no rustls,
# no ring and no tokio. `ring` is C plus platform assembly, which neither the
# musl cdylib target nor wasm can build.
mvm-http = { workspace = true, optional = true }
thiserror.workspace = true

# Runtime record mode encodes `Sandbox.files.write` bytes
# as base64 in the recording JSON so the lowering can re-emit them
# as a `before_start` shell hook.
base64 = { workspace = true }
blake3 = { workspace = true, optional = true }

# Addon module deps.
flate2 = { workspace = true }
hex = { workspace = true }
schemars = { version = "0.8", default-features = false, features = [
    "derive",
], optional = true }
sha2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-nix = { workspace = true }

# Deployment staging and SDK language bridges.
tempfile = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-typescript = { workspace = true }

[features]
default = []
# Opt-in compatibility facade. Host tools should use mvm-compiler directly.
compiler = ["dep:mvm-compiler"]
# Deployment assembly and records stay outside the language-neutral compiler.
deploy = ["compiler", "dep:blake3"]
# The remote half of `deploy`: `MvmdClient` and the HTTPS upload. Off by
# default; `mvm-cli` turns it on. Everything else in `deploy` — the record
# types and boot-artifact digests — requires only the local `deploy` feature.
deploy-remote = ["deploy", "dep:mvm-http"]
# Derive `schemars::JsonSchema` on the addon-manifest and runtime-record types
# and forward to the IR's own derives, for the three schema-emitter bins below.
# Off by default: nothing on the `mvmctl` runtime path reads a JSON Schema, and
# the emitters are build tooling. Mirrors `mvm-core`/`mvm-agentd`'s `schema`.
schema = ["dep:schemars", "mvm-contract/schema"]

# The schema emitters are build tooling, not product surface.
# `required-features` keeps `schemars` out of every default build.
[[bin]]
name = "emit_addon_schema"
path = "src/bin/emit_addon_schema.rs"
required-features = ["schema"]

# Workload IR JSON-schema emitter.
[[bin]]
name = "emit_workload_schema"
path = "src/bin/emit_schema.rs"
required-features = ["schema"]

[[bin]]
name = "emit_runtime_schema"
path = "src/bin/emit_runtime_schema.rs"
required-features = ["schema"]

# The SDK env-var registry emitter. Deliberately carries no
# `required-features`: it writes a JSON instance built from `serde_json`,
# which is an unconditional dependency, and never touches `schemars`.
[[bin]]
name = "emit_sdk_env"
path = "src/bin/emit_sdk_env.rs"

# The SDK error-taxonomy emitter. Same reasoning as `emit_sdk_env`:
# serde_json only, so no `required-features`.
[[bin]]
name = "emit_sdk_errors"
path = "src/bin/emit_sdk_errors.rs"

# The SDK constructor registry emitter. serde_json only.
[[bin]]
name = "emit_sdk_ctors"
path = "src/bin/emit_sdk_ctors.rs"

[[test]]
name = "compiler_facade"
required-features = ["compiler"]

[[test]]
name = "runtime_compile_e2e"
required-features = ["compiler"]

[lints]
workspace = true
