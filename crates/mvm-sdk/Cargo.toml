[package]
name = "mvm-sdk"
description = "Rust SDK for mvm — build-time workload authoring, runtime record mode, and the in-guest host-services C-ABI cdylib loaded by language SDKs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The normal Rust library (`lib`) is consumed by mvmctl and the build pipeline.
# The `cdylib` output is the in-guest host-services FFI shared object the
# Python/TypeScript SDKs dlopen; the nix package renames it to the stable
# `libmvm_host_services.so` filename.
crate-type = ["lib", "cdylib"]

[dependencies]
mvm-core = { workspace = true }
# In-guest host-services FFI: drives `host.audit.v1` / `host.time.v1` /
# `host.cost.v1` over the vsock broker. The broker client and vsock primitives
# live in the guest-agent crate; mvm-sdk only holds the C-ABI veneer.
mvm-agentd.workspace = true
# The Workload IR itself (`mvm_sdk::ir` re-exports `mvm_contract::ir`
# unchanged — see `src/lib.rs`). The IR's own `JsonSchema` derives come from
# `mvm-contract/schema`, which this crate's `schema` feature forwards to —
# never unconditionally. Cargo unifies features across the workspace, so
# enabling it here would switch schemars on inside `mvm-contract` for every
# consumer and defeat the gating in `mvm-core`/`mvm-contract`/`mvm-agentd`.
mvm-contract.workspace = true
# The subprocess-backed MvmClient facade uses the trait + DTOs from
# `mvm-core`'s `client` module (behind that crate's `client` feature). Kept off
# by default so the mvmctl default closure gains no `async-trait`; the facade
# shells `mvmctl machine` and never links the runtime backend (`mvm-client`'s
# `LocalBackend`), so no `sdk -> backend -> build -> sdk` cycle forms.
async-trait = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
mvm-http = { workspace = true, optional = true }
thiserror.workspace = true

# Runtime record mode encodes `Sandbox.files.write` bytes
# as base64 in the recording JSON so the lowering can re-emit them
# as a `before_start` shell hook.
base64 = { workspace = true }
blake3 = { workspace = true }

# Addon module deps.
flate2 = { workspace = true }
hex = { workspace = true }
schemars = { version = "0.8", default-features = false, features = [
    "derive",
], optional = true }
sha2 = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-nix = { workspace = true }

# Compile pipeline deps.
globset = { workspace = true }
tempfile = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }

[features]
default = []
client-facade = ["dep:async-trait", "mvm-core/client"]
# Authenticated host-side deployment transport. The default library is also
# built as the in-guest host-services cdylib, whose synchronous vsock C ABI
# must not inherit HTTP, TLS, or async-runtime dependencies.
remote-deploy = ["dep:mvm-http"]
# Derive `schemars::JsonSchema` on the addon-manifest and runtime-record types
# and forward to the IR's own derives, for the three schema-emitter bins below.
# Off by default: nothing on the `mvmctl` runtime path reads a JSON Schema, and
# the emitters are build tooling. Mirrors `mvm-core`/`mvm-agentd`'s `schema`.
schema = ["dep:schemars", "mvm-contract/schema"]

# The schema emitters are build tooling, not product surface.
# `required-features` keeps `schemars` out of every default build.
[[bin]]
name = "emit_addon_schema"
path = "src/bin/emit_addon_schema.rs"
required-features = ["schema"]

# Workload IR JSON-schema emitter.
[[bin]]
name = "emit_workload_schema"
path = "src/bin/emit_schema.rs"
required-features = ["schema"]

[[bin]]
name = "emit_runtime_schema"
path = "src/bin/emit_runtime_schema.rs"
required-features = ["schema"]

# The SDK env-var registry emitter. Deliberately carries no
# `required-features`: it writes a JSON instance built from `serde_json`,
# which is an unconditional dependency, and never touches `schemars`.
[[bin]]
name = "emit_sdk_env"
path = "src/bin/emit_sdk_env.rs"

# The SDK error-taxonomy emitter. Same reasoning as `emit_sdk_env`:
# serde_json only, so no `required-features`.
[[bin]]
name = "emit_sdk_errors"
path = "src/bin/emit_sdk_errors.rs"

# The SDK constructor registry emitter. serde_json only.
[[bin]]
name = "emit_sdk_ctors"
path = "src/bin/emit_sdk_ctors.rs"

[dev-dependencies]
# `TestEnv` lives behind mvm-core's `test-support`, and the compile
# pipeline's tests use it. Without this line the feature only arrives via
# workspace-wide feature unification, so `cargo test -p mvm-sdk` on its
# own does not compile — which is how mutation testing, always
# package-scoped, measured nothing here and reported it as clean.
# Matches mvm-build and mvm-runtime.
mvm-core = { workspace = true, features = ["test-support"] }
# Async tests for the subprocess MvmClient impl.
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
