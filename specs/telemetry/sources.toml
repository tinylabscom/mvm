file = "crates/mvm-vmm/src/host/spec_map.rs"
anchor = "GuestService::Telemetry"
note = "Every workload VM unconditionally carries a host-dials Telemetry vsock port beside its socket paths."

[[backend_endpoint]]
backend = "shared"
file = "crates/mvm-backends/src/driver/mod.rs"
anchor = "host_dialable_port"
note = "The host-dial allow-list admits machine control, telemetry and the dev console range; nothing else."

[[backend_endpoint]]
backend = "firecracker"
file = "crates/mvm-backends/src/driver/fc.rs"
anchor = "host_dialable_port"
note = "Host-dialed ports, telemetry included, ride the single vsock UDS CONNECT handshake."

[[backend_endpoint]]
backend = "libkrun"
file = "crates/mvm-backends/src/driver/libkrun.rs"
anchor = "vm_vsock_port_socket_at"
note = "Per-port UDS under the VM state dir, gated by the shared host-dial allow-list."

[[backend_endpoint]]
backend = "hvf"
file = "crates/mvm-backends/src/driver/hvf.rs"
anchor = "HANDOFF_TELEMETRY"
note = "Telemetry socket rides the shared host-dial bridge and survives supervisor handoff via its mask bit."

[[backend_endpoint]]
backend = "qemu"
file = "crates/mvm-backends/src/driver/qemu.rs"
anchor = "GuestService::Telemetry"
note = "Real AF_VSOCK with a per-port UNIX socket bridge under the same allow-list."

[[backend_endpoint]]
backend = "apple-container"
file = "crates/mvm-runtime/src/apple_container_backend.rs"
anchor = "HvfRunner"
note = "Holds an HvfRunner and substitutes only the kernel image, inheriting the hvf endpoint verbatim."

[[backend_endpoint]]
backend = "wasm"
file = "crates/mvm-runtime/src/wasm_backend.rs"
anchor = "no TAP/virtio/vsock"
note = "No vsock and no microVM: an equivalent bounded host adapter is separate, honestly-distinct work."
