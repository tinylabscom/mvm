# --- Rust subscriber / global diagnostic-state initialization sites ---------

[[subscriber_init]]
file = "crates/mvm-observability/src/logging.rs"
anchor = "tracing_subscriber::registry()"
scope = "global"
role = "host"
owner = "mvm-cli process startup"
gap = "Global registry assembles fmt/span-timing/OTLP layers for the CLI process only; nothing routes them to VM-lifetime host collection, and a second in-process install panics."
required_witness = "Host collector receives CLI-process diagnostics under its own producer identity without a second global-subscriber install."

[[subscriber_init]]
file = "crates/mvm-cli/src/commands/mod.rs"
anchor = "fn configure_runtime_logging"
scope = "global"
role = "host"
owner = "mvm-cli command dispatch"
gap = "Library code installs the process-global subscriber and mutates RUST_LOG; an embedder linking mvm-cli gets both as side effects."
required_witness = "Subscriber installation is an explicit, embedder-visible choice with a collector-backed capture path."

[[subscriber_init]]
file = "crates/mvm-hostd/src/panic_hook.rs"
anchor = "pub fn install"
scope = "global"
role = "host"
owner = "mvm-hostd role binaries"
gap = "Redacted panic capture reaches stderr only; no durable host-side diagnostic record survives the process."
required_witness = "Panic diagnostics reach host-local collection with the emitting role's identity."

