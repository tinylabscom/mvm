# --- Launch edges: which launcher starts which guest/builder producer --------

[[launch_edge]]
producer = "mvm-agentd/mvm-guest-agent"
launcher = "nix/images/initramfs/flake.nix"
anchor = "mvm-guest-agent"
activation = "always"

[[launch_edge]]
producer = "mvm-agentd/mvm-guest-agent"
launcher = "nix/lib/mk-guest.nix"
anchor = "MVM_AGENT_BIN"
activation = "always"

[[launch_edge]]
producer = "mvm-agentd/mvm-guest-netinit"
launcher = "crates/mvm-agentd/src/guest_bootstrap.rs"
anchor = "NETINIT_OVERLAY"
activation = "always"

[[launch_edge]]
producer = "mvm-agentd/mvm-guest-netinit"
launcher = "nix/lib/mk-guest.nix"
anchor = "mvm-guest-netinit"
