# Security-relevant controls, and whether each is reachable from production.
#
# The failure this exists for: a control that reports present and cannot fire.
# An admission gate reading an argv nobody populates, a broker nothing
# constructs, a scan whose bound set is always empty. Each of those shipped
# correct and tested, and each was caught only by review.
#
# Name the symbol by a string that identifies it uniquely — a re-exported alias
# is fine when production code actually calls through that alias, while the
# import declaration itself never counts. Avoid a bare `validate`, which every
# module has. The gate refuses an entry that matches implausibly widely, because
# a symbol that matches everything reports reachable no matter what.
#
# `dormant = false` is the normal case: the control has a production caller and
# the gate fails if it loses one. `dormant = true` says so out loud, with a
# reason — and the gate fails if it *gains* a caller, because then the
# declaration is stale and the entry should go. The list may only shrink.

[[control]]
symbol = "grants_input_for"
file = "crates/mvm-contract/src/stream/input.rs"
dormant = false
why = "The input plane's default-deny check. Losing its caller reopens claim 17's grant."

[[control]]
symbol = "report_enforced_grants"
file = "crates/mvm-cli/src/commands/vm/up/grants_report.rs"
dormant = false
why = """
Records what actually bounded a boot: the read-back tier, the \
`plan.grants_enforced` chain entry, and the operator warning when a requested \
bound did not happen. It shipped with no caller on the path `mvmctl` boots — \
correct, tested, and reachable by nothing — so a genuinely bounded run was \
indistinguishable from an unbounded one. Losing its caller in the CLI start \
path puts it straight back there."""

[[control]]
symbol = "default_sdk_uses_sidecar"
file = "crates/mvm-contract/src/plan/execution_plan.rs"
dormant = true
why = """
`ExecutionPlan::sdk_uses_sidecar` is a two-sided assertion — `true` makes \
admission *require* the SDK sidecar, `false` makes it *forbid* one — but no \
production path can produce `false`. Both construction sites hardcode `true` \
(`plan/synthesis.rs`, `admission/policy_resolver.rs`), there is no CLI flag, \
and no workload IR field feeds it, so the forbidding half is reachable only by \
hand-building a plan in a test.

That is what makes this entry worth having. The default is the only observable \
thing about the field, so it attracted four separate PRs proposing to change \
it, one of which would have flipped it to `false` and refused the sidecar for \
every signed plan predating the field. A dormant control whose only visible \
knob is its default invites exactly that.

Wiring it requires a launch-time way to declare that a workload speaks the \
broker protocol directly. This entry fails the moment that path lands and \
`false` becomes producible, which is the signal to delete it."""

[[control]]
symbol = "apply_install_gate"
file = "crates/mvm-build/src/app_deps_gate.rs"
dormant = true
why = """
The severity gate is exercised at seal time in the app-deps security lane, but
no production launch path calls it. Admission re-verifies the sealed volume's
content and manifest hashes; it does not currently refuse a validly sealed
volume because its CVE report contains a high or critical finding. Keep this
declaration until launch carries a typed dependency-volume gate posture and a
production caller applies it."""

[[control]]
symbol = "enforced_grants_after_start"
file = "crates/mvm-client/src/boot.rs"
dormant = false
why = """
The seam that calls `VmBackend::apply_grants` from the CLI's own boot. The \
backend read-back and the audit entry both existed already; the missing link \
was this one, and the whole defect was that nothing outside the supervisor's \
launch path — which no `mvmctl` invocation reaches — ever asked."""

[[control]]
symbol = "admitted_shares_for_boot"
file = "crates/mvm-client/src/admission/policy.rs"
dormant = false
why = """
Builds the host-fs grants the signed plan admits, from the volume list the \
launch config will actually attach. The transient run path built them from the \
SDK sidecar alone, so `mvmctl run --mount` handed a host directory to a guest \
under a plan that never named it and `enforce_admitted_shares` had nothing to \
check the attachment against (claim 1). The function being correct is not the \
control — being called from the admit closure is. Its unit tests pass whether \
or not anything calls it, which is the failure this file exists to catch."""

[[control]]
symbol = "declare_current_exe_features"
file = "crates/mvm-build/src/builder_vm_bootstrap.rs"
dormant = false
why = """
Carries the running `mvmctl`'s Cargo features to the builder-VM bootstrap \
helper it compiles. Without a caller the helper is built with \
`embed-host-bins` alone, dropping `release-artifact-bootstrap`, so a caller \
configured to fetch the builder image gets a helper that can only build it \
from source — a silent cold Stage 0 on a lane that asked to avoid one. Every \
unit test of the feature mirror passes whether or not anything declares."""

[[control]]
symbol = "parse_discard_ranges"
file = "crates/mvm-vmm/src/vmm/blk_discard.rs"
dormant = false
why = """
The only bound on a guest-named discard range. The device now offers \
VIRTIO_BLK_F_DISCARD on every writable backing, so the guest hands it a \
sector and a length and the host punches a hole where they point. Losing this \
call would leave the sector arithmetic unchecked against the image's own \
capacity, and the workload tier shares this device model with the builder. Its \
unit tests pass whether or not the device calls it, which is what this file \
exists to catch."""
