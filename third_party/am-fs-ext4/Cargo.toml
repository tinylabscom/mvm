[package]
name = "am-fs-ext4"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust ext4 filesystem driver."
repository = "https://github.com/christhomas/rust-fs-ext4"

[lib]
name = "fs_ext4"
crate-type = ["rlib"]

[dependencies]
crc32c = "0.6"
bitflags = "2"

[dev-dependencies]
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"

[profile.dev]
opt-level = 1
panic = "unwind"
