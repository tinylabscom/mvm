[workspace]
members = [
    # Feature-gated no_std protocol and storage contracts shared by mvm and
    # fleet orchestrators. `volume`/`local` are opt-in; the default is protocol.
    "crates/mvm-contract",
    "crates/mvm-core",
    # plan 123 Phase A — NetworkProvider trait + provisioning/policy seam.
    # Low seam crate: the TAP/bridge/native-gateway/passt impl stays in mvm-runtime
    # (where the in-VM shell lives) and the WireGuard/Tailscale mesh impl is
    # mvmd's; both register against this trait.
    "crates/mvm-net",
    "crates/deps/libkrun-sys",
    "crates/mvm-runtime",
    "crates/mvm-build",
    "crates/mvm-agentd",
    "crates/mvm-cli",
    "crates/mvm-hostd",
    # C-ABI veneer over the in-guest host-services broker clients. One
    # JSON-in/JSON-out cdylib every language SDK loads through a thin FFI
    # shim, so adding a language carries no new Rust binding code.
    "crates/mvm-host-services-ffi",
    "crates/mvm-client",
    # plan 74 W1 — OCI image distribution client (registry resolution,
    # manifest fetch, digest verification; layer fetch + ext4 unpack +
    # verity generation land in subsequent W1 PRs). Anonymous-only at
    # W1.1; private auth lands later behind the credential redaction
    # contract from ADR-023. mvmd consumes this crate as a library per
    # ADR-014 §"Runtime Ownership" — keep its dep closure small.
    "crates/mvm-fs",
    # Plan 72 W3 — PID-1 for the libkrun builder VM. Linux-only at
    # runtime; the crate compiles on macOS / Windows as an inert
    # binary so workspace builds stay green for non-Linux contributors.
    # Plan 73 Followup B.2.x — HTTP CONNECT proxy with hostname
    # allowlist for the builder VM's application-deps install.
    # Linux-only at runtime; same workspace-ergonomics rule as
    # mvm-host-vm-init.
    # Local addon developer experience: in-guest addon name resolution
    # and loopback TCP to host-vsock bridge. Distributed service mesh,
    # tenant policy, and cryptographic routing belong in mvmd.
    # plan 60 Phase 5 — build-time SDK port from ../mvmforge.
    # mvm-sdk is the builder surface; the canonical Workload IR now
    # lives in the no_std foundation crate `mvm-contract` and is
    # re-exported here unchanged as `mvm_sdk::ir`. The mvm-sdk-macros
    # proc-macro crate was removed (Plan 199 C) as an orphaned empty
    # placeholder — re-add it when the
    # `#[mvm::function]`/`#[mvm::image]`/… bodies actually land.
    "crates/mvm-sdk",
    # Plan 104 W1a — host services broker subprocess (one of three
    # per-VM subprocesses: mvm-broker, mvm-host-signer,
    # mvm-audit-signer; ADR-020 dropped mvm-secrets-dispatcher). W1a
    # ships the dispatch-loop skeleton + UDS listener + config
    # envelope for the general broker subprocess only. ADR-020 /
    # Plan 104 §"Host-side: three-subprocess architecture".
    # Plan 104 W1b.1 — the remaining two key subprocesses, each as
    # its own crate. The supervisor lifecycle + cosign-verify +
    # cgroup + seccomp + binary hardening land in W1b.2.
    # Plan 113 / ADR-003 §Decision 5 — A2 confinement helper wrapping
    # seccompiler 0.5 + landlock 0.4. Called by the per-VM
    # `mvm-bridge` sidecar just after startup so
    # the kernel-LSM ruleset + seccomp filter are installed before the
    # packet loop touches untrusted bytes. Linux-only at runtime; the
    # crate compiles as inert stubs on macOS / Windows so workspace
    # builds stay green for non-Linux contributors.
    # Plan 113 §Task 10 / ADR-003 — per-VM Vz drainer binary (legacy
    # NDJSON ingest path; superseded by the Rust supervisor's in-process
    # Vz gateway-compat splice, retained pending a dead-code sweep). Threads the
    # `FlowEventWire` stream through the chain-signing audit pipeline.
    # Parallel role to `mvm-libkrun-supervisor` for the Vz backend.
    # Plan 113 §Task 12 / ADR-003 — per-VM Firecracker bridge sidecar.
    # Linux-only at runtime; the file-level `cfg(target_os = "linux")`
    # gate in `src/main.rs` reduces non-Linux compilation to a stub
    # `main()` that prints a guard message and exits nonzero. Verifies
    # the operator-curated `passt` binary hash, installs the
    # `mvm-jailer-lite` (seccomp + Landlock) ruleset, then hands the
    # parent-inherited socketpair fds to the
    # `mvm-supervisor::gateway_bridge::BridgeEndpoints::Passt` path.
    # no_std + alloc foundation crate: the chain-signed audit-log
    # verifier today, the Workload IR + wire protocol + policy DTOs
    # incrementally. Builds on host (linted + tested here) and on
    # wasm32 (the browser transparency tool in `web/audit-verify/`,
    # which is excluded from this workspace to keep wasm-bindgen out of
    # the main build).
    # The dev-only cucumber-rs BDD conformance harness: runs the Gherkin
    # scenarios under features/suites/ against the built mvmctl binary and
    # (as later suites land) the mvm-client facade. Never a dependency of
    # any shipped crate — it stands alone like xtask, so it sits outside
    # the host/user product-surface feature aggregation.
    "crates/mvm-conformance",
    "xtask",
]
# cargo-fuzz crates have to be excluded from the main workspace because
# they depend on libfuzzer-sys, which only builds under cargo-fuzz's
# wrapper (it injects the right linker flags + sanitizer toolchain).
# Plain `cargo build --workspace` would otherwise fail with linker
# errors. ADR-001 §W4.2.
exclude = [
    "crates/mvm-agentd/fuzz",
    # Plan 214 Phase 8 — hardened snapshot-frame parser fuzz harness
    # (`parse_header` / `parse_sections`, the cap-before-alloc /
    # bounds-checked path). Same libfuzzer-sys linker-flag constraints as
    # the other fuzz crates.
    "crates/mvm-core/fuzz",
    # Plan 85 §R1 / Phase A.2 — layer-unpack fuzz harness. Same
    # libfuzzer-sys linker-flag constraints as the mvm-agentd fuzz
    # crate; CI gate at `.github/workflows/security.yml::fuzz` (the
    # `Fuzz OCI unpack_layer` step). Release-tag + nightly + manual
    # dispatch only; not run on per-PR pushes.
    "crates/mvm-fs/fuzz-oci",
    # virtio-fs FUSE-server request-parser fuzz harness. Same libfuzzer-sys
    # linker constraints; CI gate at `.github/workflows/security.yml::fuzz`.
    "crates/mvm-runtime/fuzz-backend",
    # Plan 88 W6 / ADR-003 §"New untrusted-input surfaces" —
    # supervisor-config JSON fuzz harness. CI gate at
    # `.github/workflows/security.yml::fuzz`.
    "crates/deps/libkrun-sys/fuzz",
    # Plan 97 / ADR-001 claim 5 — Vz supervisor JSON fuzz harness.
    # Parallel role to mvm-libkrun/fuzz; same libfuzzer-sys linker
    # constraints apply.
    "crates/mvm-build/fuzz",
    # Plan 113 §Task 15 / ADR-003 — `BridgeConfigJson` JSON +
    # `PasstHashesFile` TOML fuzz harnesses. Same libfuzzer-sys
    # linker-flag constraints as the mvm-libkrun/fuzz crate; the
    # CI gate at `.github/workflows/security.yml::fuzz` runs both
    # targets on release-tag pushes + nightly cron + manual
    # dispatch only (not on every PR — the lane is heavy).
    "crates/mvm-hostd/fuzz-vmhost",
    # Plan 141 / ADR-003 — gateway packet parse + payload-rebuild fuzz
    # harness (`fuzz_packet_parse`). Same libfuzzer-sys linker constraints;
    # CI gate at `.github/workflows/security.yml::fuzz`.
    "crates/mvm-hostd/fuzz",
    # Plan 186 — runtime-recording trace parser + lowering fuzz harness.
    # Same libfuzzer-sys linker-flag constraints as the other fuzz crates;
    # CI gate at `.github/workflows/security.yml::fuzz`.
    "crates/mvm-sdk/fuzz",
    # Pure-Rust ext4 writer `build_image` fuzz harness (never-panic +
    # structural invariants on the emitted image). Same libfuzzer-sys
    # linker-flag constraints; CI gate at
    # `.github/workflows/security.yml::fuzz`.
    "crates/mvm-fs/fuzz-ext4",
    # Browser audit-log verifier. Excluded so wasm-bindgen +
    # the wasm32 target stay out of `cargo build --workspace` and CI;
    # it depends on the in-workspace `mvm-contract` crate by path and is
    # built separately with `wasm-pack` (see web/audit-verify/README.md).
    "web/audit-verify",
]
resolver = "3"

[workspace.package]
# 0.14.0 — first version after the v1→v2 cutover (2026-05-11).
# v1's final release was 0.13.0 (tag v1-final, branch legacy/v1); the
# v2 rewrite ships under the same project name + binary but is
# functionally different software. Bumping the minor signals "0.x
# breaking changes" without prematurely committing to a 1.0 stability
# promise.
version = "0.18.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/tinylabscom/mvm"
homepage = "https://github.com/tinylabscom/mvm"
authors = ["mvm contributors"]

# Workspace-wide lint policy. Plan-60 Phase 0 exit criterion — every
# crate inherits this via `lints.workspace = true` in its own
# Cargo.toml. CLAUDE.md says "No `clippy::too_many_arguments`: never
# suppress this lint. Refactor into smaller functions or a config/
# params struct." The lint here enforces that workspace-wide so a
# future violator gets blocked at `cargo clippy --workspace --
# -D warnings` instead of slipping through.
[workspace.lints.clippy]
too_many_arguments = "deny"

[workspace.dependencies]
# Async runtime.
#
# Narrowed from `features = ["full"]` to the union actually used
# across the workspace. Dropping `io-std` (no `tokio::io::std*`
# consumers) and `parking_lot` (no consumers; `tokio::sync::Mutex`
# uses its own primitives). `fs`, `process`, and `signal` are no
# longer workspace-wide either: `mvm-runtime`, `mvm-hostd`, and the
# small set of signal-aware bins request them directly. `test-util`
# is dev-dep-only — the crates that need it (`mvm-oci`,
# `mvm-supervisor`, root) add it on their own `[dev-dependencies]
# tokio` line. `rt-multi-thread` stays because the bare consumers
# `mvm-addon-dns`, `mvm-addon-vsock-bridge`, and `mvm-guest-netinit`
# use `#[tokio::main]`, which expands to the multi-threaded runtime
# unless told otherwise.
#
# Per-crate consumers can extend with extra features as usual —
# Cargo unions feature sets across the workspace.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

# Pattern matching
aho-corasick = "1"
# The workspace patterns are ASCII-oriented: explicit `[A-Za-z0-9]` classes,
# ASCII word/digit boundaries, and a few explicit `\u{...}` codepoint ranges
# for steganographic Unicode. Keep `perf` + `unicode-perl` for `\b`/`\d`
# semantics without carrying the full default Unicode table set.
regex = { version = "1", default-features = false, features = ["perf", "std", "unicode-case", "unicode-perl"] }
# Supplemental high-confidence credential scanners. The host adapter keeps the
# production boundary byte-oriented and enables only explicitly reviewed kinds;
# default features are unnecessary because mvm does not ship leakguard's CLI.
leakguard = { version = "=0.8.0", default-features = false }

# Crypto
aes-gcm = "0.11"
base64 = "0.22"
ed25519-dalek = "3"
hmac = "0.13"
rand = "0.8"
x25519-dalek = { version = "3", features = ["static_secrets"] }
# Plan 129 Stage 2 (ADR-003): mint the per-VM name-constrained egress CA /
# intermediate / leaf certs for transparent https substitution. 0.13+ for the
# `nameConstraints` API. `ring` crypto backend (no cmake/C-toolchain like the
# aws-lc-rs default). Sync (no tokio) so it lives behind mvm-core's `egress-ca`
# feature without breaking the runtime-free default build.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
# `secrecy` wraps secret-carrying types so accidental `Debug`/`Display`
# becomes a compile error. Plan 63 W2 — `SecretBox<T>` pass on every
# `KeyProvider` / `WrappedKey` / snapshot-HMAC-key consumer.
secrecy = { version = "0.10", features = ["serde"] }
sha2 = "0.11"
# BLAKE3 for the Apple Container kernel's digest-pin sidecar — an order of
# magnitude faster than SHA-256 on multi-hundred-MB kernels. Default
# features (`std`) suffice for the streamed host-side hash; no rayon.
blake3 = "1.8"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Serialization
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
thiserror = "2"
toml = "0.8"

# CLI
clap = { version = "4", default-features = false, features = [
    "derive",
    "help",
    "std",
    "usage",
] }
clap_mangen = "0.2"

# HTTP client (for CLI upgrade)
reqwest = { version = "0.13", features = ["blocking", "json", "rustls-no-provider"], default-features = false }

# Plan 129 Stage 2 — the egress terminator's server-side TLS (terminate the
# guest's https to bound hosts under the per-VM name-constrained intermediate).
# `ring` backend (matches reqwest's rustls-tls + rcgen), no aws-lc-rs/cmake.
# Direct dep of mvm-hostd only; the upstream re-origination leg reuses reqwest.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Signal handling
libc = "0.2"
# Readiness-driven event loop for the in-house VMM's host↔guest vsock I/O thread
# (os-poll = kqueue/epoll + Waker; os-ext = SourceFd to register std sockets).
mio = { version = "1", features = ["os-poll", "os-ext"] }

# Seccomp BPF compilation (W2.4 — per-service syscall filtering inside
# guests, applied via the `mvm-seccomp-apply` shim before execve into
# the service binary). Plan 113 / ADR-003 also uses this for the
# `mvm-jailer-lite` A2 confinement helper that wraps the Firecracker
# bridge sidecar.
seccompiler = "0.5"

# Landlock (Linux kernel LSM) ruleset binding. Plan 113 / ADR-003 —
# `mvm-jailer-lite` uses this to constrain the per-VM Firecracker
# bridge to a small read/write-path set before entering the packet
# loop. Linux-only at runtime; the `mvm-jailer-lite` Cargo.toml gates
# the dep behind `cfg(target_os = "linux")` so workspace builds on
# macOS / Windows contributor hosts stay green.
landlock = "0.4"

# File watching (dev-watch feature only)
notify = "8"
notify-debouncer-mini = "0.7"

# IP/CIDR matching for the L4 egress proxy's allow-list rules.
# Plan 60 Phase 3 Slice B. `serde` feature serialises `IpNet` as
# the canonical CIDR string ("10.0.0.0/24"), which is the wire
# format the policy bundle TOML uses.
ipnet = { version = "2", features = ["serde"] }
# Plan 141 / ADR-003 — EthernetII/IPv4/IPv6/TCP/UDP parse + payload rebuild
# for the gateway packet-observer pipeline. Pure-Rust, zero transitive
# deps, fuzzed upstream. Lands on the untrusted-guest-bytes path (claim 5),
# so a mature parser beats a hand-rolled one.
etherparse = "0.20"
# Plan 74 W2 — mvm-guest-netinit installs kernel blackhole routes
# for `MANDATORY_DENY_RANGES` inside every microVM. rtnetlink wraps
# the AF_NETLINK socket and the RTM_NEWROUTE message construction;
# its dep tree (`netlink-packet-route`, `netlink-sys`,
# `netlink-proto`) is pure-Rust and static-linkable for the
# overlay binary. Async because the underlying socket uses
# tokio's reactor; we already pull tokio in workspace-wide.
rtnetlink = "0.14"
async-trait = "0.1"

# Pure-Rust DNS resolver, used only by the opt-in custom-dns feature.
hickory-resolver = "0.26"
# DNS protocol stack for the in-guest addon DNS resolver.
hickory-proto = "0.26"

# Utilities
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
# OS-native keystore (macOS Keychain / Linux Secret Service / Windows
# Credential Manager). Plan 63 W3 — KeyringProvider impl uses this for
# per-tenant DEK storage outside env vars or world-readable disk.
keyring = "3"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"

# Addon machinery (mvm-sdk addon module, SDK port Phase 1b — ported
# from mvmforge-addon). flate2 + tar drive the deterministic tarball
# format; hex pairs with sha2 for the canonical hex digests in the IR;
# tree-sitter + tree-sitter-nix back the Nix-body validator. Pinned at
# the same versions mvmforge-addon used so we inherit its CVE / API
# story without re-evaluation.
flate2 = "1"
hex = "0.4"
tar = "0.4"
xattr = "1"
# Read-only ext4 walker (deps bitflags + crc only). Replaces hand-rolled
# raw-byte ext4 poking in the Stage 0 validators with a real inode lookup
# (`fs.exists("/sbin/mvm-host-vm-init")`). `std` enables `load_from_path`.
ext4-view = { version = "0.9", features = ["std"] }
tree-sitter = { version = "0.26.8", default-features = false, features = ["std"] }
tree-sitter-nix = "0.0.2"

# Compile pipeline (mvm-sdk compile module, SDK port Phase 2 — ported
# from mvmforge). globset drives source-bundling include/exclude
# patterns; the three tree-sitter language grammars feed the static
# AST walker that scopes function-entrypoint workloads to reachable
# code. Pinned at mvmforge's versions to inherit its CVE story.
globset = "0.4"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"

# Internal crates.
#
# Crates with optional default features declare `default-features = false`
# here because member crates can't override that on a workspace-inherited
# dependency unless the workspace entry already carries it. The root binary
# opts back into user-facing defaults through its own `[features]` block.
mvm-contract = { path = "crates/mvm-contract", version = "0.18.0", default-features = false, features = ["protocol"] }
mvm-core = { path = "crates/mvm-core", version = "0.18.0" }
mvm-client = { path = "crates/mvm-client", version = "0.18.0" }
mvm-agentd = { path = "crates/mvm-agentd", version = "0.18.0" }
mvm-build = { path = "crates/mvm-build", version = "0.18.0", default-features = false }
mvm-runtime = { path = "crates/mvm-runtime", version = "0.18.0", default-features = false }
mvm-fs = { path = "crates/mvm-fs", version = "0.18.0" }
mvm-net = { path = "crates/mvm-net", version = "0.18.0" }
mvm-cli = { path = "crates/mvm-cli", version = "0.18.0", default-features = false }
mvm-hostd = { path = "crates/mvm-hostd", version = "0.18.0", default-features = false }

# plan 60 Phase 5 — build-time SDK port from ../mvmforge.
mvm-sdk = { path = "crates/mvm-sdk", version = "0.18.0" }
# Plan 57 W1 — libkrun FFI bindings split out of mvm-providers so the
# bindgen + libclang build cost is isolated from the Apple-VZ objc2
# stack. Default feature set is empty; consumers wanting real FFI
# enable `libkrun-sys` on a host with libkrun installed.
libkrun-sys = { path = "crates/deps/libkrun-sys", version = "0.18.0" }

# Plan 113 / ADR-003 §Decision 5 — A2 confinement helper (seccompiler +
# landlock). Consumed by the per-VM `mvm-bridge` sidecar.

# Plan 113 §Task 10 / ADR-003 — per-VM Vz drainer binary crate. Leaf
# entry consumed by `mvm-backend::vz::start()` (Task 11) via fork+exec;
# no other workspace member links it as a library.

# Plan 113 §Task 12 / ADR-003 — per-VM Firecracker bridge sidecar binary
# crate. Leaf entry resolved by Task 13's `FirecrackerBackend` at runtime
# (fork+exec, never linked as a library). Linux-only at runtime; the
# crate's `src/main.rs` cfg-gates the body so `cargo check --workspace`
# stays green on macOS / Windows contributor hosts.

# Dev dependencies
assert_cmd = "2"
predicates = "3"

# Root facade crate — re-exports all workspace libraries and provides the `mvmctl` binary
[package]
name = "mvmctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Firecracker microVM development tool"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
name = "mvmctl"
path = "src/lib.rs"

[[bin]]
name = "mvmctl"
path = "src/main.rs"

[dependencies]
mvm-core.workspace = true
mvm-runtime = { workspace = true, default-features = false }
mvm-build = { workspace = true, default-features = false }
mvm-agentd.workspace = true
mvm-cli = { workspace = true, default-features = false }
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSDate", "NSAutoreleasePool"] }
# Plan 87 W5 — enable mvm-cli's `libkrun-sys` feature on macOS so the
# `mvmctl` binary's `extract_bundled_kernel()` path is wired by
# default (libkrun is the macOS hypervisor backend; libkrunfw ships
# alongside via the same Homebrew tap). Linux CI / runtimes use
# Firecracker, which doesn't need libkrun headers — the target-gated
# dep keeps `cargo build` on Ubuntu working without `apt install
# libkrun-dev` (which doesn't ship a libkrun-dev package today).
# Cargo features can't be cfg-gated, but target-specific dep entries
# can; Cargo unions the features across all matching target entries.
#
# `builder-vm` must be repeated here because the base entry at line 272
# sets `default-features = false`, which strips mvm-cli's `default =
# ["builder-vm"]`. Without it, `extract_libkrunfw_kernel()` resolves to
# the `#[cfg(all(feature = "builder-vm", not(feature = "libkrun-sys")))]`
# bail-stub and Stage 0 falls back to the ur-seed kernel (known to
# kernel-oops; see comment at apple_container.rs:~2870).
mvm-cli = { workspace = true, default-features = false, features = ["builder-vm", "libkrun-sys"] }

[dev-dependencies]
assert_cmd.workspace = true
chrono.workspace = true
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
libkrun-sys.workspace = true
mvm-fs.workspace = true
# Plan 60 Phase 4 — `tests/audit_total_coverage.rs` walks the
# `clap::Command` tree returned by `mvm_cli::commands::cli_command()`
# to enforce that every subcommand has a declared audit posture.
clap.workspace = true
# Plan 60 Phase 7a — `tests/tenant_destroy_e2e.rs` exercises the
# operator→auditor pipeline end-to-end. `mvm` (path dep above)
# pulls these transitively at runtime; the integration test
# binary needs its own usage.
ed25519-dalek.workspace = true
predicates.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
toml.workspace = true
# Plan 73 Followup H — `tests/run_plan_mode.rs` resolves python3 from
# PATH to drive the SDK record-mode auto-exec end-to-end.
which.workspace = true

[features]
# ── The two product surfaces — the only two things this project ships ─────────
# There are exactly two: what the **host machine runs** to host sandboxes
# (`host`), and what a **user runs** to drive them (`user`). Every capability
# folds into one of the two; the individual pass-through flags that used to sit
# here (builder-vm, pure-mkfs, custom-dns, manifest-verify, dev-watch,
# contributor-bootstrap) are GONE — inlined below. `dev` is the host+user union
# (a contributor laptop is both). The only other root features are internal
# knobs that cannot be unconditional and are NOT consumer-facing product
# surfaces: the libkrun C-lib link (absent on a macOS-26 HVF host), the
# release-only prebuilt download, the optional S3 template-registry backend, and
# `hostd-transport` (a lean library knob a downstream daemon flips through the
# facade to compile mvm-core's gated hostd IPC transport without pulling all of
# `host`). `xtask check-two-surfaces` fails CI if a third consumer-facing
# *product* knob appears; internal knobs live on its allowlist.

# The default binary is the lean host-runtime core (builder VM dispatch +
# in-process rootfs materialize) — unchanged closure. mvmd builds lean with
# `default-features = false`.
default = [
    "mvm-build/builder-vm",
    "mvm-cli/builder-vm",
    "mvm-cli/pure-mkfs",
]

# `host` — everything the host machine runs to boot/manage/secure/build
# sandboxes. Platform-neutral: backends auto-detect at runtime (the `VmBackend`
# trait); a libkrun host adds `libkrun-sys`/`libkrun-live`, the macOS-26 HVF host
# needs neither. Superset of `default` plus the full host networking + hostd IPC.
host = [
    "mvm-build/builder-vm",
    "mvm-cli/builder-vm",
    "mvm-cli/pure-mkfs",
    "mvm-cli/custom-dns",
    "mvm-core/hostd-transport",
]

# `user` — everything a user runs to create/drive sandboxes: cosign manifest
# verification for `--prod` and `build --watch`.
user = [
    "mvm-runtime/manifest-verify",
    "mvm-cli/manifest-verify",
    "mvm-core/manifest-verify",
    "mvm-cli/dev-watch",
]

# `dev` — the local-development union. A contributor laptop is BOTH host and
# user, so `dev` builds an `mvmctl` that runs EVERY README/website-docs example
# on the default (HVF) backend (OCI + flake `machine run`, `machine build`/`build
# compile`, persistent-machine verbs, `dev up`/`shell`, the SDK compile path).
# Not a third surface — host + user + the source-checkout bootstrap. The
# `check-two-surfaces` lint asserts it always aggregates both surfaces.
dev = [
    "host",
    "user",
    "mvm-runtime/contributor-bootstrap",
    "mvm-build/contributor-bootstrap",
    "mvm-cli/contributor-bootstrap",
]

# Platform: link the libkrun C VMM. Absent on a macOS-26 HVF host; a libkrun
# host opts in. Cannot be unconditional (no libkrun to link against on HVF).
libkrun-sys = ["mvm-cli/libkrun-sys"]
libkrun-live = ["mvm-cli/libkrun-live"]

# Internal library knob (NOT a product surface): compile mvm-core's gated hostd
# IPC transport. `host` already includes it; exposed standalone so a downstream
# host-side daemon can flip just the transport through the facade and stay lean
# (default-features = false), without dragging in the rest of `host`.
hostd-transport = ["mvm-core/hostd-transport"]

# Release-only: let an installed binary download mvm-published prebuilt builder
# VM images on a cache miss. Off for source checkouts (they build locally); the
# release workflow turns it on.
release-artifact-bootstrap = ["mvm-cli/release-artifact-bootstrap"]

# Optional S3 storage backend for the template registry — a heavy cloud dep kept
# opt-in (not part of the local host runtime; fleet/deployment use only).
template-registry-s3 = [
    "mvm-runtime/template-registry-s3",
    "mvm-cli/template-registry-s3",
]

# Dev/test-only: the hermetic in-memory `MockBackend` + `--hypervisor mock`.
# Off by default so the shipped `mvmctl` binary never carries the Tier-3 mock
# backend; this workspace's own `tests/audit_emissions_live.rs` (which spawns
# `mvmctl --hypervisor mock` as a subprocess and drives `MockGuestAgent`
# in-process) needs it turned on. `mvm-runtime` is named directly too since
# this crate depends on it straight, not only through `mvm-cli`.
test-support = ["mvm-cli/test-support", "mvm-runtime/test-support"]

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

# Speed up `cargo test --workspace` by giving the test profile more
# parallel codegen units and dropping debug info to line tables only.
# Test binaries don't need full DWARF; we just need clean panic
# backtraces, which `line-tables-only` preserves.
#
# `incremental = true` halves rebuild time for the inner-loop
# (touch one file, re-run a focused test) without affecting cold
# CI builds.
[profile.test]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256

# The `dev` profile is what cargo compiles every LIBRARY crate under, even during
# `cargo test`/`nextest` (only the test *binaries* use `[profile.test]`). Without
# this override it defaults to `debug = 2` — full DWARF — which is the single
# biggest memory + disk cost of a workspace build: a large crate like `mvm-cli`
# burns gigabytes of rustc + linker memory emitting debug info nothing on the
# inner loop reads, and 16 of those in parallel is what makes the build a memory
# hog on a shared dev machine. Drop it to line tables (matching `[profile.test]`):
# panic backtraces keep their file:line, but the DWARF bloat — and its memory +
# disk footprint — is gone. This also lightens `cargo build`/`check`/`clippy`.
[profile.dev]
debug = "line-tables-only"

# Per-package optimisation overrides applied to the `dev` and `test`
# profiles. Build scripts + proc-macros run during compilation, so a
# tiny opt-level=3 build of these crates pays for itself many times
# over across the workspace's compile graph. The list is the
# well-known "speed dev/test builds" recipe — proc-macro engines
# (syn, quote, proc-macro2), serde derive, sha2/ring/zeroize crypto
# (used by many transitive callers), and the four tree-sitter
# grammar crates the mvm-sdk pulls in unconditionally.
[profile.dev.package."*"]
opt-level = 0

[profile.dev.package.syn]
opt-level = 3
[profile.dev.package.quote]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
[profile.dev.package.serde_derive]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.zeroize]
opt-level = 3
[profile.dev.package.tree-sitter]
opt-level = 3
[profile.dev.package.tree-sitter-nix]
opt-level = 3
[profile.dev.package.tree-sitter-python]
opt-level = 3
[profile.dev.package.tree-sitter-javascript]
opt-level = 3
[profile.dev.package.tree-sitter-typescript]
opt-level = 3

[workspace.metadata.mvm.toolchain]
# Pinned cross-compile toolchain for the embedded host-vm binaries
# baked into mvmctl. Bump in lockstep across this file and CI to keep
# the embedded payload reproducible (Plan 115 / ADR-004 claim 11).
#
# musl, not gnu: these binaries run as PID 1 / early services inside the
# builder VM, whose minimal NixOS-derived rootfs ships no FHS dynamic
# loader (/lib/ld-linux-<arch>.so.1). A static musl build has no
# interpreter dependency, so it boots in any rootfs — the same reason
# mkGuest static-links its own /init. Both binaries are libc-only (no
# TLS/ring/openssl), so the musl build is unencumbered.
zig = "0.13.0"
cargo-zigbuild = "0.20.0"

# Per-arch musl target. build.rs picks the entry for CARGO_CFG_TARGET_ARCH
# (the arch mvmctl is built for == the arch of the guest it boots, since the
# local builder/Stage 0 VM is always same-arch as the host). Plan 164.
[workspace.metadata.mvm.toolchain.targets]
aarch64 = "aarch64-unknown-linux-musl"
x86_64 = "x86_64-unknown-linux-musl"
