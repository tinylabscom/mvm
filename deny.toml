# cargo-deny configuration — ADR-002 §W5.2.
#
# Three policies enforced against the workspace's transitive Cargo
# graph on every PR:
#
#   1. RustSec advisories block merge.
#   2. License is in a vetted allowlist.
#   3. The `bans` section catches duplicate-major-version drift,
#      which both bloats the binary and makes auditing harder.
#
# False positives — typically a transitive dep whose advisory we've
# read and accepted — are addressed in this file via a per-entry
# `ignore` or `skip`. Don't suppress globally.

[graph]
all-features = false
no-default-features = false
exclude-dev = false

[output]
feature-depth = 1

# ── Advisories ────────────────────────────────────────────────────
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Each ignore is a deliberate, audited acceptance of a transitive
# unmaintained-or-similar advisory we cannot fix without ripping out
# a load-bearing dep. Re-evaluate at each Cargo.lock major bump.
ignore = [
    # `fxhash` is unmaintained but pinned as a transitive dep via
    # `notify` / file-watching infrastructure. Replacement (rustc-hash
    # or ahash) requires upstream changes. Audited 2026-04-30: the
    # crate is ~200 LoC and contains no networking, no IO, no unsafe
    # beyond basic pointer arithmetic.
    { id = "RUSTSEC-2025-0057", reason = "transitive via notify; ~200 LoC, no IO, audited 2026-04-30" },
    # `instant` is the wasm-time abstraction. Pulled in transitively
    # via a parking_lot 0.11 chain. Replaced upstream by `web-time` in
    # newer parking_lot. Track via a Cargo.lock bump.
    { id = "RUSTSEC-2024-0384", reason = "transitive via old parking_lot chain; will resolve on upstream bump" },
    # `number_prefix` is a pure-functional formatter used by indicatif.
    # Unmaintained but functionally complete; no security surface.
    { id = "RUSTSEC-2025-0119", reason = "transitive via indicatif; pure formatter, no IO, audited 2026-04-30" },
    # `rsa v0.9.x` Marvin Attack timing side-channel. Reaches the
    # shipped `mvmctl` (release builds enable `manifest-verify`) via
    # `openidconnect → sigstore`, where sigstore backs cosign-keyless
    # verification of the dev image manifest.
    #
    # Why this is not exploitable here: the Marvin Attack is a timing
    # side-channel on RSA *private-key* operations (PKCS#1 v1.5
    # decryption / signing) by which an attacker recovers the private
    # key. mvm holds no RSA private key and performs no RSA decryption
    # — its only sigstore use is bundle signature *verification* with
    # public keys (`mvm-core/src/crypto/image_verify.rs`), and cosign
    # bundles are ECDSA P-256, so the rsa path is not exercised at
    # runtime. The advisory's threat shape does not exist in mvm.
    #
    # Why we cannot drop it: in sigstore 0.13 `rsa` is a non-optional
    # dependency, so no feature trim removes it. Bumping to sigstore
    # 0.14 drops sigstore's *direct* rsa edge but leaves it reachable
    # via `openidconnect` (the `verify → fulcio → oauth` feature chain
    # hard-pulls the OIDC client, which still depends on rsa 0.9). The
    # only real fix is upstream: a constant-time `rsa` (0.10, still
    # pre-release) adopted by openidconnect. Tracking follow-up in
    # specs/plans/36. Re-evaluate when openidconnect ships on rsa 0.10.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin Attack; reaches release mvmctl via openidconnect→sigstore (manifest-verify); verification-only, no RSA private-key/decrypt ops, cosign bundles are ECDSA P-256; non-optional in sigstore 0.13 and 0.14 only relocates the edge to openidconnect; fix is upstream rsa 0.10; audited 2026-06-21" },
    # `proc-macro-error v1` is unmaintained — replaced upstream by
    # `proc-macro-error2`. Transitive via
    # `sigstore → json-syntax → locspan-derive`. This is a
    # build-time proc-macro dep only; it produces no runtime code in
    # the shipped binary. Will resolve when sigstore (or its
    # json-syntax dep) bumps to proc-macro-error2.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error v1 unmaintained; build-time-only via sigstore→json-syntax; no runtime surface; audited 2026-05-01" },
    # `async-std` discontinued. DEV-DEPENDENCY ONLY: pulled via httpmock
    # (test HTTP mock) → async-object-pool → async-std. Absent from every
    # shipped artifact (mvmctl, guest agents, supervisors); no production
    # surface. Follow-up: migrate httpmock → wiremock to drop it entirely.
    { id = "RUSTSEC-2025-0052", reason = "async-std discontinued; DEV-ONLY via httpmock test mock; absent from all shipped artifacts; audited 2026-06-03" },
    # `paste` unmaintained. Build-time proc-macro only — produces no
    # runtime code in the shipped binary, same class as proc-macro-error
    # above. No runtime/IO surface.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; build-time proc-macro, no runtime surface; audited 2026-06-03" },
    # `proc-macro-error2` — the maintained fork of `proc-macro-error`
    # (RUSTSEC-2024-0370) is now itself unmaintained. Transitive via
    # `oci-client → oci-spec → getset` (a derive-macro crate). Build-time
    # proc-macro only: produces no runtime code in any shipped artifact,
    # same class as the proc-macro-error v1 / paste entries above. Will
    # resolve when oci-spec's getset dep drops it.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; build-time-only via oci-client→oci-spec→getset; no runtime surface; audited 2026-06-12" },
    # `rustls-pemfile` unmaintained — its PEM parsing was folded into
    # `rustls-pki-types` upstream. Direct dep of mvm-hostd, used only to
    # parse CA/cert/key PEM the host itself mints for the Plan 129 TLS
    # termination path (operator-controlled material, never
    # attacker-influenced bytes). Unmaintained, not vulnerable; the
    # crate is a small, functionally-complete parser. Follow-up: migrate
    # to `rustls_pki_types::pem` to drop it (tracked in plan 126).
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; parses host-minted CA/cert PEM only, no untrusted input; migrate to rustls-pki-types; audited 2026-06-12" },
]

# ── Licenses ──────────────────────────────────────────────────────
[licenses]
# Confidence threshold for SPDX detection. 0.8 is the cargo-deny
# default; bumping it past 0.9 starts to flag legitimate licenses
# that ship with slightly non-standard headers.
confidence-threshold = 0.8

# Allowlist mirrors the licenses present in the current dep tree
# (verified by an initial `cargo deny check licenses --hide-inclusion-graph`
# pass). New deps with licenses outside this list need explicit
# review and an addition here — the discipline is the point.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
]

# Per-crate exception for crates whose license cannot be detected
# from the repo (no LICENSE file, custom header). Each entry is a
# deliberate decision, not a blanket pass.
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ── Bans ──────────────────────────────────────────────────────────
[bans]
# Multiple major versions of the same crate inflate the binary,
# fragment audit attention, and frequently mask transitive
# duplication of cryptographic primitives. We deny by default and
# add a `skip` only with a reason.
multiple-versions = "deny"
wildcards = "deny"
# A versionless `{ path = "../x" }` dep reads as a wildcard to
# cargo-deny, but a local path dep is first-party source, not an
# unvetted registry `*` — it carries none of the supply-chain risk
# the wildcard ban exists to catch. Exempt path/git deps so the ban
# stays strict for registry crates (the real risk) without flagging
# intra-workspace links.
allow-wildcard-paths = true
highlight = "all"

# A "skip" allows multiple versions of a single crate; a "skip-tree"
# allows them under a specific subtree. Use sparingly; each entry
# is a place auditors must reason about by hand.
#
# This list is the audited *baseline* of duplicate-major crates the
# current transitive graph already carries. Freezing it turns the
# previously-advisory `multiple-versions` check into a ratchet: a
# brand-new duplicated crate (the usual regression — a fresh dep that
# drags a second major of something) now fails CI and forces a
# conscious decision, while none of the cuts already landed (tokio
# drop, opendal→object_store, Alpine seed removal) can silently
# regress. Entries are grouped by why they duplicate; shrink the list
# as upstream majors converge or a dep is replaced — never grow it
# without a recorded reason.
skip = [
    # Windows host-target shim families. The windows-sys / -core /
    # -targets umbrellas and their per-arch link shims legitimately
    # coexist at several majors across the graph; they are host/build
    # only and carry no runtime surface on the Linux guest path.
    "windows-core",
    "windows-sys",
    "windows-targets",
    "windows_aarch64_gnullvm",
    "windows_aarch64_msvc",
    "windows_i686_gnu",
    "windows_i686_gnullvm",
    "windows_i686_msvc",
    "windows_x86_64_gnu",
    "windows_x86_64_gnullvm",
    "windows_x86_64_msvc",

    # Host syscall layer mid-migration. rustix's move to linux-raw-sys
    # 0.12, the nix 0.29→0.31 churn, and mio/redox_syscall sit at two
    # majors because different deps track different releases. mvm pins
    # a single major where it depends directly; the rest is transitive.
    "linux-raw-sys",
    "mio",
    "nix",
    "redox_syscall",
    "rustix",

    # Foundational crates mid v1→v2 ecosystem migration. mvm pins one
    # major for each it uses directly (e.g. which = 7); the other major
    # is dragged in by deps that have not finished migrating. Not
    # collapsible without forking those deps.
    "bitflags",
    "getrandom",
    "thiserror",
    "thiserror-impl",
    "unicode-width",
    "which",

    # reqwest 0.12 (mvm) vs 0.13 (oci-client). Unifying was evaluated
    # and rejected: oci-client hard-pins 0.13 (and forces aws-lc-rs —
    # see the B4 block), a transitive 0.12 holdout remains regardless,
    # and the bump collapses no transitive duplicates. Revisit when
    # oci-client is forked.
    "reqwest",
]
skip-tree = []

deny = []

# ── Sources ───────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
