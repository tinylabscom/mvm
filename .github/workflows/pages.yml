name: Deploy GitHub Pages

# Deploys happen when a GitHub Release is published, with manual
# dispatch available for operator-triggered docs publishes. The
# previous `push: branches: [main] paths: [public/**]` trigger was
# dropped in the ecosystem-wide CI cost reduction (no push-to-branch
# triggers anywhere).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: public/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: public/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          # Two targets, two crates: `wasm-pack` builds the browser shim for
          # wasm32-unknown-unknown, and `web/mvm-demo-guest/build.sh` builds the
          # demo guest for wasm32-wasip1. Installing only the first fails the
          # second with `can't find crate for std`, which reads like a toolchain
          # problem rather than a missing target.
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          extra-conf: |
            extra-system-paths = /usr/bin

      - name: Build weblinux demo assets
        run: |
          nix build .#qemu-wasm-smoke-pack
          ./web/weblinux-demo/build.sh result

      - name: Build wasm demo
        working-directory: web/mvm-demo
        run: ./build.sh

      - name: Install dependencies
        working-directory: public
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        working-directory: public
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
