name: Deploy site to Cloudflare Pages

# Deploys happen when a GitHub Release is published or a version tag is
# pushed, with manual dispatch available for operator-triggered docs
# publishes. The previous `push: branches: [main] paths: [public/**]`
# trigger was dropped in the ecosystem-wide CI cost reduction (no
# push-to-branch triggers anywhere).
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: public/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: public/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          # Two targets, two crates: `wasm-pack` builds the browser shim for
          # wasm32-unknown-unknown, and `web/mvm-demo-guest/build.sh` builds the
          # demo guest for wasm32-wasip1. Installing only the first fails the
          # second with `can't find crate for std`, which reads like a toolchain
          # problem rather than a missing target.
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          determinate: false
          extra-conf: |
            extra-system-paths = /usr/bin

      - name: Build weblinux demo assets
        run: |
          nix build ./nix#qemu-wasm-smoke-pack
          ./web/weblinux-demo/build.sh result

      - name: Build wasm demo
        working-directory: web/mvm-demo
        run: ./build.sh

      - name: Install dependencies
        working-directory: public
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        working-directory: public
        run: pnpm build

      - name: Verify cross-origin isolation headers are staged
        run: |
          if [ ! -f public/dist/_headers ]; then
            echo "ERROR: public/dist/_headers is missing; Cloudflare Pages will not send COOP/COEP headers." >&2
            exit 1
          fi
          echo "OK: public/dist/_headers present"

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create mvm --production-branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public/dist --project-name=mvm --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # `_headers` is inert unless the host reads it, so the only proof that
      # this deployment is cross-origin isolated — and therefore that the
      # WebLinux demo has a SharedArrayBuffer — is the wire. Checked against
      # the deployment URL rather than the production domain: this step can
      # only speak for what it just published. Whether users reach it is a DNS
      # question, which "Site isolation watch" answers on its own schedule.
      - name: Verify the deployment is cross-origin isolated
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: ./scripts/check-site-isolation-headers.sh "$DEPLOYMENT_URL"
