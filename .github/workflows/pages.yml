name: Deploy site to Cloudflare Pages

# Deploys happen when a GitHub Release is published, with manual
# dispatch available for operator-triggered docs publishes. The
# previous `push: branches: [main] paths: [public/**]` trigger was
# dropped in the ecosystem-wide CI cost reduction (no push-to-branch
# triggers anywhere).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: public/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: public/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          # Two targets, two crates: `wasm-pack` builds the browser shim for
          # wasm32-unknown-unknown, and `web/mvm-demo-guest/build.sh` builds the
          # demo guest for wasm32-wasip1. Installing only the first fails the
          # second with `can't find crate for std`, which reads like a toolchain
          # problem rather than a missing target.
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download verified WebLinux runtime pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_IDENTITY_REGEXP: "^https://github.com/${{ github.repository }}/.github/workflows/release-boot-image.yml@refs/tags/boot-image/v.*$"
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          BOOT_TAG="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
            --json tagName --jq -r '
              [ .[].tagName
                | select(test("^boot-image/v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                | {tag: ., v: (ltrimstr("boot-image/v") | split(".") | map(tonumber))} ]
              | sort_by(.v) | last | .tag // empty')"
          if [ -z "${BOOT_TAG}" ]; then
            echo "::error::no boot-image/v* release contains the WebLinux runtime pack" >&2
            exit 1
          fi
          gh release download "${BOOT_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'qemu-wasm-smoke-pack.tar.gz*'
          cosign verify-blob \
            --bundle qemu-wasm-smoke-pack.tar.gz.sha256.bundle \
            --certificate-identity-regexp "${COSIGN_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            qemu-wasm-smoke-pack.tar.gz.sha256
          sha256sum -c qemu-wasm-smoke-pack.tar.gz.sha256
          mkdir qemu-wasm-smoke-pack
          tar -xzf qemu-wasm-smoke-pack.tar.gz -C qemu-wasm-smoke-pack
          ./web/weblinux-demo/build.sh qemu-wasm-smoke-pack

      - name: Build wasm demo
        working-directory: web/mvm-demo
        run: ./build.sh

      - name: Install dependencies
        working-directory: public
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        working-directory: public
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Create a Cloudflare Pages project named `mvm` (or change this).
          command: pages deploy public/dist --project-name=mvm --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
