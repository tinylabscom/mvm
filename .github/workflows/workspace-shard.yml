name: Workspace shard worker
run-name: workspace-shard / ${{ inputs.correlation }} / ${{ inputs.runner_kind }}

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      shard:
        required: true
        type: string
      runner_kind:
        required: true
        type: string
      archive_run_id:
        required: false
        type: string
        default: ''
      # How many hash partitions the caller fans the suite out over. The
      # caller's matrix and this number must agree, or tests go unrun.
      shard_count:
        required: false
        type: string
        default: '2'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit to test
        required: true
        type: string
      shard:
        description: One-based nextest shard
        required: true
        type: choice
        options: ["1", "2"]
      runner_kind:
        description: Runner pool for this shard
        required: true
        type: choice
        options: [github, hetzner]
      correlation:
        description: Parent run/shard correlation key
        required: true
        type: string
      archive_run_id:
        description: Parent run containing a shared workspace test archive
        required: false
        type: string
      inventory_only:
        description: Read-only Hetzner host inventory instead of running tests (runner_kind must be hetzner)
        required: false
        type: boolean
        default: false
      live_boot:
        description: One guest-agent-ready, NIC-less Firecracker boot on the recovered Debian runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    name: Read-only runner inventory
    if: github.event_name == 'workflow_dispatch' && inputs.inventory_only && !inputs.live_boot
    permissions: {}
    # Invalid selectors fail on a hosted runner, never silently skip.
    runs-on: ${{ inputs.runner_kind == 'hetzner' && fromJSON('["self-hosted","Linux","X64","mvm","hetzner","kvm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Inventory provisioned host
        shell: bash
        env:
          RUNNER_KIND: ${{ inputs.runner_kind }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_KIND" != hetzner ]]; then
            echo "inventory_only requires runner_kind=hetzner" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # No checkout, compiler shims, installs, or persistent test state.
          # Only the Actions-owned summary is written; no cleanup is needed.
          {
            printf '## Read-only runner inventory\n\n```text\n'
            printf '\nArchitecture\n'
            uname -m
            printf '\nCPU model and count\n'
            LC_ALL=C lscpu | awk -F: '/^(Architecture|CPU\(s\)|Model name|Socket\(s\)|Core\(s\) per socket|Thread\(s\) per core):/ { print }'
            printf 'Available CPUs: '
            nproc
            printf '\nRAM\n'
            free -h
            printf '\nDisk capacity (root and runner workspace)\n'
            df -h / "$GITHUB_WORKSPACE"
            printf '\nBlock device capacity\n'
            lsblk -o NAME,TYPE,SIZE
            printf '\nInstalled Rust toolchains (no compiler shims invoked)\n'
            if command -v rustup >/dev/null 2>&1; then
              rustup toolchain list
            else
              printf 'rustup not installed\n'
            fi
            printf '\nProvisioned tool paths (presence only; no executables invoked)\n'
            for tool in rustc cargo gcc clang cc zig cargo-zigbuild cargo-nextest ld.lld nix go python3 node; do
              command -v "$tool" || printf '%s: not on PATH\n' "$tool"
            done
            printf '\nKVM device (metadata only; not opened)\n'
            if [[ -e /dev/kvm ]]; then
              ls -l /dev/kvm
              if [[ -r /dev/kvm && -w /dev/kvm ]]; then
                printf 'Runner has read/write access to /dev/kvm\n'
              else
                printf 'Runner lacks read/write access to /dev/kvm\n'
              fi
            else
              printf '/dev/kvm is absent\n'
            fi
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    name: Workspace shard ${{ inputs.shard }} (${{ inputs.runner_kind }})
    if: github.event_name != 'workflow_dispatch' || (!inputs.inventory_only && !inputs.live_boot)
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ${{ inputs.runner_kind == 'hetzner' && fromJSON('["self-hosted","Linux","X64","mvm","hetzner","kvm"]') || 'ubuntu-24.04' }}
    # Archive workers on one persistent host share the build-time source path.
    # Serialize that pool; GitHub-hosted workers have separate filesystems.
    concurrency:
      group: ${{ inputs.runner_kind == 'hetzner' && inputs.archive_run_id != '' && format('workspace-archive-{0}', inputs.archive_run_id) || format('workspace-shard-{0}-{1}', github.run_id, inputs.shard) }}
      cancel-in-progress: false
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Prepare archived workspace
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid archive run ID" >&2; exit 1; }
          # Kept under RUNNER_TEMP, outside the /tmp tree the tests share.
          archive_root="$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          rm -rf -- "$archive_root"
          mkdir -p -- "$archive_root"
          cp -a "$GITHUB_WORKSPACE/." "$archive_root/"

      - uses: ./.github/actions/free-disk
        if: inputs.runner_kind == 'github' && inputs.archive_run_id == ''

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: ./.github/actions/apt-deps
        if: inputs.runner_kind == 'github'
        with:
          packages: attr cryptsetup-bin lld

      - name: Verify provisioned self-hosted dependencies
        if: inputs.runner_kind == 'hetzner'
        run: |
          set -euo pipefail
          command -v cryptsetup
          command -v getfattr
          command -v ld.lld
          command -v zig
          command -v cargo-zigbuild

      - uses: ./.github/actions/rust-cache
        if: inputs.archive_run_id == ''
        with:
          key: ${{ inputs.runner_kind == 'hetzner' && 'hetzner-workspace' || 'workspace' }}

      - uses: ./.github/actions/install-zigbuild
        if: inputs.runner_kind == 'github'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Isolate test state
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ && "$SHARD" =~ ^[1-9]$ ]]
          base="/tmp/mvm-w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}"
          mkdir -m 700 -- "$base"
          mkdir -m 700 -- "$base/home" "$base/mvm" "$base/tmp"
          runner_home="${HOME:-}"
          if [[ -z "$runner_home" ]]; then
            runner_home="$(getent passwd "$(id -u)" | cut -d: -f6)"
          fi
          [[ -n "$runner_home" && -d "$runner_home" ]] || {
            echo "cannot determine the runner home directory" >&2
            exit 1
          }
          rustup_home="${RUSTUP_HOME:-$(rustup show home)}"
          {
            printf 'RUNNER_ORIGINAL_HOME=%s\n' "$runner_home"
            printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "${CARGO_HOME:-$runner_home/.cargo}" "$rustup_home"
            printf 'HOME=%s\nMVM_HOME=%s\nTMPDIR=%s\n' "$base/home" "$base/mvm" "$base/tmp"
          } >> "$GITHUB_ENV"

      # Nextest builds the exact workspace selection itself. Queue-owned
      # doctests, feature suites and filter validation live in the extras job.
      - name: Run tests
        if: inputs.archive_run_id == ''
        env:
          SHARD: ${{ inputs.shard }}
          SHARD_COUNT: ${{ inputs.shard_count || '2' }}
        run: |
          set -euo pipefail
          [[ "$SHARD" =~ ^[1-9]$ && "$SHARD_COUNT" =~ ^[1-9]$ && "$SHARD" -le "$SHARD_COUNT" ]] || {
            echo "Invalid shard $SHARD of $SHARD_COUNT" >&2
            exit 1
          }
          cargo nextest run --workspace --all-targets --partition "hash:${SHARD}/${SHARD_COUNT}"

      - name: Download shared workspace test archive
        if: inputs.archive_run_id != ''
        # Bound the action's retries so a stalled blob download cannot hold a
        # runner for the whole job; slow runners moved the 3.6 GB archive in over 5 min.
        timeout-minutes: 10
        uses: actions/download-artifact@v8
        with:
          name: workspace-tests
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}

      # Dependency-boundary tests run `cargo tree --offline`, which needs the
      # registry sources the build job had. The archive carries only test
      # binaries, so fetch the locked sources onto this runner first.
      - name: Fetch locked dependency sources
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          cd "$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          cargo fetch --locked

      - name: Run archived workspace tests
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          SHARD: ${{ inputs.shard }}
          SHARD_COUNT: ${{ inputs.shard_count || '2' }}
        run: |
          set -euo pipefail
          [[ "$SHARD" =~ ^[1-9]$ && "$SHARD_COUNT" =~ ^[1-9]$ && "$SHARD" -le "$SHARD_COUNT" ]] || {
            echo "Invalid shard $SHARD of $SHARD_COUNT" >&2
            exit 1
          }
          archive_root="$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          cd "$archive_root"
          cargo nextest run \
            --archive-file "$RUNNER_TEMP/workspace-tests.tar.zst" \
            --workspace-remap "$archive_root" \
            --extract-to "$archive_root" \
            --partition "hash:${SHARD}/${SHARD_COUNT}" || {
              status=$?
              ls -ld "$archive_root" "$archive_root/target" \
                "$archive_root/target/debug/build" \
                "$archive_root/target/debug/build/mvmctl" || true
              find "$archive_root/target/debug/build/mvmctl" -maxdepth 3 \
                -name 'audit_emissions_live-*' -print 2>/dev/null || true
              exit "$status"
            }

      # Last step, always: kill by PID whatever this job started (a VMM
      # launched through `sudo setsid` outlives the job's process tree), then
      # remove the isolated HOME/MVM_HOME/TMPDIR, the extracted archive and
      # the test state. tests/github_actions_self_hosted_runner.rs requires
      # this step on every job that can run on the KVM pool.
      - name: Clean isolated state
        if: always()
        env:
          SHARD: ${{ inputs.shard }}
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -uo pipefail
          if [ -n "${RUNNER_ORIGINAL_HOME:-}" ]; then
            printf 'HOME=%s\n' "$RUNNER_ORIGINAL_HOME" >> "$GITHUB_ENV"
          fi
          if [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]]; then
            export ARCHIVE_ROOT="$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          fi
          bash nix/ops/hetzner/job-cleanup.sh "/tmp/mvm-w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}"

  debian-live-boot:
    name: Debian KVM live Firecracker boot
    if: github.event_name == 'workflow_dispatch' && inputs.live_boot
    runs-on: [self-hosted, Linux, X64, mvm, hetzner, kvm, debian-kvm-boot]
    timeout-minutes: 55
    steps:
      - name: Validate target and check out exact source
        env:
          RUNNER_KIND: ${{ inputs.runner_kind }}
          INVENTORY_ONLY: ${{ inputs.inventory_only }}
        run: |
          set -euo pipefail
          test "$RUNNER_KIND" = hetzner
          test "$INVENTORY_ONLY" = false
          test "$RUNNER_NAME" = mvm-hetzner
          test -r /dev/kvm && test -w /dev/kvm
          test "$(id -u)" -ne 0

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Isolate boot state
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/mvm-w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-1"
          mkdir -m 700 -- "$base"
          mkdir -m 700 -- "$base/home" "$base/tmp" "$base/images"
          printf 'BOOT_DIR=%s\nHOME=%s\nMVM_HOME=%s\nTMPDIR=%s\n' \
            "$base/images" "$base/home" "$base/home" "$base/tmp" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' \
            "${CARGO_HOME:-$HOME/.cargo}" "${RUSTUP_HOME:-$(rustup show home)}" >> "$GITHUB_ENV"

      - name: Require an existing systemd user session
        run: |
          set -euo pipefail
          uid="$(id -u)"
          test -S "/run/user/${uid}/bus" || {
            echo "::error::no existing systemd user bus; refusing to change linger or host services" >&2
            exit 1
          }
          printf 'XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' \
            "$uid" "$uid" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - uses: sigstore/cosign-installer@v3

      - uses: ./.github/actions/install-firecracker

      - name: Resolve the locked image set
        run: |
          set -euo pipefail
          {
            echo "IMAGE_TAG=$(./scripts/locked-image-tag.sh)"
            echo "IMAGE_REPO=$(./scripts/locked-image-tag.sh image_set repository)"
            echo "IMAGE_MANIFEST=$(./scripts/locked-image-tag.sh image_set manifest_asset)"
            echo "IMAGE_MANIFEST_SHA256=$(./scripts/locked-image-tag.sh image_set manifest_sha256)"
            echo "IMAGE_WORKFLOW=$(./scripts/locked-image-tag.sh image_set workflow)"
            echo "IMAGE_TAG_REF=$(./scripts/locked-image-tag.sh image_set tag_ref)"
            echo "IMAGE_BUILDER_CACHE_CONTRACT=$(./scripts/locked-image-tag.sh compatibility builder_cache_contract)"
          } >> "$GITHUB_ENV"

      - name: Fetch and verify the pinned bootable image
        env:
          COSIGN_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          cd "$BOOT_DIR"
          base="https://github.com/${IMAGE_REPO}/releases/download/${IMAGE_TAG}"
          curl -fL --retry 3 -o image-set.json "$base/${IMAGE_MANIFEST}"
          curl -fL --retry 3 -o image-set.json.bundle "$base/${IMAGE_MANIFEST}.bundle"
          printf '%s  %s\n' "$IMAGE_MANIFEST_SHA256" image-set.json | sha256sum -c -
          cosign verify-blob \
            --bundle image-set.json.bundle \
            --certificate-identity "https://github.com/${IMAGE_REPO}/${IMAGE_WORKFLOW}@${IMAGE_TAG_REF}" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            image-set.json
          jq -e --argjson contract "$IMAGE_BUILDER_CACHE_CONTRACT" '
            (.compatibility.base_image_contract // 0) <= 1 and
            .compatibility.builder_cache_contract == $contract
          ' image-set.json >/dev/null
          for f in default-microvm-vmlinux-x86_64 default-microvm-rootfs-x86_64.ext4; do
            curl -fL --retry 3 -o "$f" "$base/$f"
            jq -r --arg name "$f" '
              .members[] | select(.target.arch? == "x86_64") | .artifacts[] |
              select(.name == $name) | "\(.sha256)  \(.name)"
            ' image-set.json > expected.txt
            test -s expected.txt
            sha256sum -c expected.txt
          done
          protocol="$(sed -n 's/^pub const PROTOCOL_VERSION: u32 = \([0-9][0-9]*\);$/\1/p' \
            "$GITHUB_WORKSPACE/crates/mvm-agentd/src/vsock/mod.rs")"
          test -n "$protocol"
          jq -n --arg rev "$(jq -r .mvm_source_commit image-set.json)" \
            --argjson protocol "$protocol" \
            '{name:"mvm-default-microvm",accessible:false,sealed:true,entrypointKind:"command",entrypointArgv:[],initSystem:"busybox",expectedBootMs:300,agentBinary:"real",rootlessEntrypoint:true,hypervisor:"firecracker",overlayAware:true,runtimeLean:true,imageTag:"",source:"fetched",builtAt:"",protocolVersion:$protocol,generatorRev:$rev,libc:"unknown"}' \
            > mvm-meta.json

      - name: Assemble this tree's runtime overlay
        env:
          MVM_RUNTIME_OVERLAY_ACQUIRE_MODE: build
        run: |
          set -euo pipefail
          cargo run -q --bin mvmctl -- dev runtime-overlay build --source build --arch x86_64
          mapfile -t dirs < <(find "$MVM_HOME/cache/runtime-overlay" -mindepth 2 -maxdepth 2 -type d -name x86_64)
          test "${#dirs[@]}" -eq 1
          mkdir -m 700 "$BOOT_DIR/overlay"
          for f in overlay.ext4 overlay.verity overlay.roothash; do
            cp -L "${dirs[0]}/$f" "$BOOT_DIR/overlay/$f"
          done
          echo "MVM_RUNTIME_BOOT_RUNTIME_VERSION=$(basename "$(dirname "${dirs[0]}")")" >> "$GITHUB_ENV"

      - name: Boot to guest-agent readiness and inspect the live NIC-less device model
        env:
          MVM_RUNTIME_BOOT_BENCH: "1"
          MVM_RUNTIME_BOOT_BACKEND: firecracker
          MVM_RUNTIME_BOOT_READY: guest-agent
          MVM_RUNTIME_BOOT_GRANT: "1"
          MVM_RUNTIME_BOOT_RUNS: "1"
          MVM_RUNTIME_BOOT_CONCURRENT: "1"
          MVM_RUNTIME_BOOT_BUDGET_MS: "60000"
        run: |
          set -euo pipefail
          export MVM_RUNTIME_BOOT_KERNEL="$BOOT_DIR/default-microvm-vmlinux-x86_64"
          export MVM_RUNTIME_BOOT_ROOTFS="$BOOT_DIR/default-microvm-rootfs-x86_64.ext4"
          export MVM_RUNTIME_BOOT_OVERLAY="$BOOT_DIR/overlay/overlay.ext4"
          export MVM_RUNTIME_BOOT_OVERLAY_VERITY="$BOOT_DIR/overlay/overlay.verity"
          MVM_RUNTIME_BOOT_OVERLAY_ROOTHASH="$(tr -d '[:space:]' < "$BOOT_DIR/overlay/overlay.roothash")"
          export MVM_RUNTIME_BOOT_OVERLAY_ROOTHASH
          cargo test --test runtime_boot_bench \
            prebuilt_runtime_image_boots_within_budget -- --exact --nocapture

      - name: Clean isolated state
        if: always()
        run: |
          bash nix/ops/hetzner/job-cleanup.sh \
            "$RUNNER_TEMP/mvm-w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-1"
