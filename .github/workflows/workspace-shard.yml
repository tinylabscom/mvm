name: Workspace shard worker
run-name: workspace-shard / ${{ inputs.correlation }} / ${{ inputs.runner_kind }}

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      shard:
        required: true
        type: string
      runner_kind:
        required: true
        type: string
      archive_run_id:
        required: false
        type: string
        default: ''
      # How many hash partitions the caller fans the suite out over. The
      # caller's matrix and this number must agree, or tests go unrun.
      shard_count:
        required: false
        type: string
        default: '2'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit to test
        required: true
        type: string
      shard:
        description: One-based nextest shard
        required: true
        type: choice
        options: ["1", "2"]
      runner_kind:
        description: Runner pool for this shard
        required: true
        type: choice
        options: [github, hetzner]
      correlation:
        description: Parent run/shard correlation key
        required: true
        type: string
      archive_run_id:
        description: Parent run containing a shared workspace test archive
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Workspace shard ${{ inputs.shard }} (${{ inputs.runner_kind }})
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ${{ inputs.runner_kind == 'hetzner' && fromJSON('["self-hosted","Linux","X64","mvm","hetzner","kvm"]') || 'ubuntu-24.04' }}
    # Archive workers on one persistent host share the build-time source path.
    # Serialize that pool; GitHub-hosted workers have separate filesystems.
    concurrency:
      group: ${{ inputs.runner_kind == 'hetzner' && inputs.archive_run_id != '' && format('workspace-archive-{0}', inputs.archive_run_id) || format('workspace-shard-{0}-{1}', github.run_id, inputs.shard) }}
      cancel-in-progress: false
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Prepare archived workspace
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid archive run ID" >&2; exit 1; }
          # Kept under RUNNER_TEMP, outside the /tmp tree the tests share.
          archive_root="$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          rm -rf -- "$archive_root"
          mkdir -p -- "$archive_root"
          cp -a "$GITHUB_WORKSPACE/." "$archive_root/"

      - uses: ./.github/actions/free-disk
        if: inputs.runner_kind == 'github' && inputs.archive_run_id == ''

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25

      - uses: ./.github/actions/apt-deps
        if: inputs.runner_kind == 'github'
        with:
          packages: attr cryptsetup-bin lld

      - name: Verify provisioned self-hosted dependencies
        if: inputs.runner_kind == 'hetzner'
        run: |
          set -euo pipefail
          command -v cryptsetup
          command -v getfattr
          command -v ld.lld
          command -v zig
          command -v cargo-zigbuild

      - uses: ./.github/actions/rust-cache
        if: inputs.archive_run_id == ''
        with:
          key: ${{ inputs.runner_kind == 'hetzner' && 'hetzner-workspace' || 'workspace' }}

      - uses: ./.github/actions/install-zigbuild
        if: inputs.runner_kind == 'github'

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Isolate test state
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ && "$SHARD" =~ ^[1-9]$ ]]
          base="${RUNNER_TEMP}/mvm-w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}"
          mkdir -m 700 -- "$base"
          mkdir -m 700 -- "$base/home" "$base/mvm" "$base/tmp"
          {
            printf 'RUNNER_ORIGINAL_HOME=%s\n' "$HOME"
            printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "${CARGO_HOME:-$HOME/.cargo}" "${RUSTUP_HOME:-$HOME/.rustup}"
            printf 'HOME=%s\nMVM_HOME=%s\nTMPDIR=%s\n' "$base/home" "$base/mvm" "$base/tmp"
          } >> "$GITHUB_ENV"

      # Nextest builds the exact workspace selection itself. Queue-owned
      # doctests, feature suites and filter validation live in the extras job.
      - name: Run tests
        if: inputs.archive_run_id == ''
        env:
          SHARD: ${{ inputs.shard }}
          SHARD_COUNT: ${{ inputs.shard_count || '2' }}
        run: |
          set -euo pipefail
          [[ "$SHARD" =~ ^[1-9]$ && "$SHARD_COUNT" =~ ^[1-9]$ && "$SHARD" -le "$SHARD_COUNT" ]] || {
            echo "Invalid shard $SHARD of $SHARD_COUNT" >&2
            exit 1
          }
          cargo nextest run --workspace --all-targets --partition "hash:${SHARD}/${SHARD_COUNT}"

      - name: Download shared workspace test archive
        if: inputs.archive_run_id != ''
        # A healthy transfer takes under a minute; bound the action's retries
        # so a stalled blob download cannot hold a runner for the whole job.
        timeout-minutes: 5
        uses: actions/download-artifact@v8
        with:
          name: workspace-tests
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}

      # Dependency-boundary tests run `cargo tree --offline`, which needs the
      # registry sources the build job had. The archive carries only test
      # binaries, so fetch the locked sources onto this runner first.
      - name: Fetch locked dependency sources
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          cd "$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          cargo fetch --locked

      - name: Run archived workspace tests
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          SHARD: ${{ inputs.shard }}
          SHARD_COUNT: ${{ inputs.shard_count || '2' }}
        run: |
          set -euo pipefail
          [[ "$SHARD" =~ ^[1-9]$ && "$SHARD_COUNT" =~ ^[1-9]$ && "$SHARD" -le "$SHARD_COUNT" ]] || {
            echo "Invalid shard $SHARD of $SHARD_COUNT" >&2
            exit 1
          }
          archive_root="$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          cd "$archive_root"
          cargo nextest run \
            --archive-file "$RUNNER_TEMP/workspace-tests.tar.zst" \
            --workspace-remap "$archive_root" \
            --extract-to "$archive_root" \
            --partition "hash:${SHARD}/${SHARD_COUNT}" || {
              status=$?
              ls -ld "$archive_root" "$archive_root/target" \
                "$archive_root/target/debug/build" \
                "$archive_root/target/debug/build/mvmctl" || true
              find "$archive_root/target/debug/build/mvmctl" -maxdepth 3 \
                -name 'audit_emissions_live-*' -print 2>/dev/null || true
              exit "$status"
            }

      # Last step, always: kill by PID whatever this job started (a VMM
      # launched through `sudo setsid` outlives the job's process tree), then
      # remove the isolated HOME/MVM_HOME/TMPDIR, the extracted archive and
      # the test state. tests/github_actions_self_hosted_runner.rs requires
      # this step on every job that can run on the KVM pool.
      - name: Clean isolated state
        if: always()
        env:
          SHARD: ${{ inputs.shard }}
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -uo pipefail
          if [ -n "${RUNNER_ORIGINAL_HOME:-}" ]; then
            printf 'HOME=%s\n' "$RUNNER_ORIGINAL_HOME" >> "$GITHUB_ENV"
          fi
          if [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]]; then
            export ARCHIVE_ROOT="$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          fi
          bash nix/ops/hetzner/job-cleanup.sh "${RUNNER_TEMP}/mvm-w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}"
