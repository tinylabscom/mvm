name: Workspace shard worker
run-name: workspace-shard / ${{ inputs.correlation }} / ${{ inputs.runner_kind }}

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      shard:
        required: true
        type: string
      runner_kind:
        required: true
        type: string
      archive_run_id:
        required: false
        type: string
        default: ''
      # The hosted runner architecture. `aarch64` runs the shard on the arm64
      # pool against the aarch64 archive; the self-hosted pool is x86_64 only.
      arch:
        required: false
        type: string
        default: x86_64
      # How many hash partitions the caller fans the archive out over. The
      # caller's matrix and this number must agree, or tests go unrun.
      shard_count:
        required: false
        type: string
        default: '2'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit to test
        required: true
        type: string
      shard:
        description: One-based nextest shard
        required: true
        type: choice
        options: ["1", "2"]
      runner_kind:
        description: Runner pool for this shard
        required: true
        type: choice
        options: [github, hetzner]
      correlation:
        description: Parent run/shard correlation key
        required: true
        type: string
      archive_run_id:
        description: Parent run containing a shared workspace test archive
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Workspace shard ${{ inputs.shard }} (${{ inputs.runner_kind }}${{ inputs.arch == 'aarch64' && ', aarch64' || '' }})
    runs-on: ${{ inputs.runner_kind == 'hetzner' && fromJSON('["self-hosted","Linux","X64","mvm","hetzner","kvm"]') || inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Archive workers on one persistent host share the build-time source path.
    # Serialize that pool; GitHub-hosted workers have separate filesystems.
    # The architecture is part of the hosted key: x86_64 and aarch64 shards
    # with the same number run in the same workflow run, and sharing a group
    # would queue one behind the other (or cancel a pending one).
    concurrency:
      group: ${{ inputs.runner_kind == 'hetzner' && inputs.archive_run_id != '' && format('workspace-archive-{0}', inputs.archive_run_id) || format('workspace-shard-{0}-{1}-{2}', github.run_id, inputs.arch || 'x86_64', inputs.shard) }}
      cancel-in-progress: false
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Prepare archived workspace
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid archive run ID" >&2; exit 1; }
          # The cleanup CLI test clears /tmp on Linux while this shard runs.
          archive_root="$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          rm -rf -- "$archive_root"
          mkdir -p -- "$archive_root"
          cp -a "$GITHUB_WORKSPACE/." "$archive_root/"

      - uses: ./.github/actions/free-disk
        if: inputs.runner_kind == 'github' && inputs.archive_run_id == ''

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25

      - uses: ./.github/actions/apt-deps
        if: inputs.runner_kind == 'github'
        with:
          packages: ${{ inputs.arch == 'aarch64' && 'attr cryptsetup-bin libcap-ng-dev lld' || 'attr cryptsetup-bin lld' }}

      - name: Verify provisioned self-hosted dependencies
        if: inputs.runner_kind == 'hetzner'
        run: |
          set -euo pipefail
          command -v cryptsetup
          command -v getfattr
          command -v ld.lld

      - uses: ./.github/actions/rust-cache
        if: inputs.archive_run_id == ''
        with:
          key: ${{ inputs.runner_kind == 'hetzner' && 'hetzner-workspace' || 'workspace' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Isolate test state
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ && "$SHARD" =~ ^[1-9]$ ]]
          base="/tmp/mvm-w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}"
          mkdir -m 700 -- "$base"
          mkdir -m 700 -- "$base/home" "$base/mvm" "$base/tmp"
          {
            printf 'RUNNER_ORIGINAL_HOME=%s\n' "$HOME"
            printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "${CARGO_HOME:-$HOME/.cargo}" "${RUSTUP_HOME:-$HOME/.rustup}"
            printf 'HOME=%s\nMVM_HOME=%s\nTMPDIR=%s\n' "$base/home" "$base/mvm" "$base/tmp"
          } >> "$GITHUB_ENV"

      - name: Build
        if: inputs.archive_run_id == ''
        run: cargo build --all-targets

      - name: Validate nextest override filters
        if: inputs.archive_run_id == ''
        run: cargo run -p xtask -- check-nextest-groups

      - name: xtask man-page tests
        if: inputs.archive_run_id == ''
        run: cargo nextest run -p xtask --features man

      - name: Run tests
        if: inputs.archive_run_id == ''
        run: cargo nextest run --workspace --all-targets --partition hash:${{ inputs.shard }}/2

      - name: Run addon/egress helper tests
        if: inputs.archive_run_id == '' && inputs.shard == '1'
        run: cargo nextest run -p mvm-agentd --features addons

      - name: Run doctests
        if: inputs.archive_run_id == '' && inputs.shard == '1'
        run: cargo test --workspace --doc

      - name: Download shared workspace test archive
        if: inputs.archive_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.arch == 'aarch64' && 'workspace-tests-aarch64' || 'workspace-tests' }}
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}

      - name: Run archived workspace tests
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
          SHARD: ${{ inputs.shard }}
          SHARD_COUNT: ${{ inputs.shard_count || '2' }}
        run: |
          set -euo pipefail
          [[ "$SHARD" =~ ^[1-9]$ && "$SHARD_COUNT" =~ ^[1-9]$ && "$SHARD" -le "$SHARD_COUNT" ]] || {
            echo "Invalid shard $SHARD of $SHARD_COUNT" >&2
            exit 1
          }
          archive_root="$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          cd "$archive_root"
          cargo nextest run \
            --archive-file "$RUNNER_TEMP/workspace-tests.tar.zst" \
            --workspace-remap "$archive_root" \
            --extract-to "$archive_root" \
            --partition "hash:${SHARD}/${SHARD_COUNT}" || {
              status=$?
              ls -ld "$archive_root" "$archive_root/target" \
                "$archive_root/target/debug/build" \
                "$archive_root/target/debug/build/mvmctl" || true
              find "$archive_root/target/debug/build/mvmctl" -maxdepth 3 \
                -name 'audit_emissions_live-*' -print 2>/dev/null || true
              exit "$status"
            }

      - name: Remove archived workspace
        if: always() && inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          rm -rf -- "$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"

      - name: Clean isolated state
        if: always()
        env:
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          if [ -n "${RUNNER_ORIGINAL_HOME:-}" ]; then
            printf 'HOME=%s\n' "$RUNNER_ORIGINAL_HOME" >> "$GITHUB_ENV"
          fi
          if [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ && "$SHARD" =~ ^[1-9]$ ]]; then
            base="/tmp/mvm-w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SHARD}"
            if [ -d "$base" ] && [ ! -L "$base" ]; then
              chmod -R u+rwX -- "$base"
              rm -rf -- "$base"
            fi
            fi
