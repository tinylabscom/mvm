name: Workspace shard worker
run-name: workspace-shard / ${{ inputs.correlation }} / ${{ inputs.runner_kind }}

on:
  workflow_call:
    inputs:
      maintenance_mode:
        required: false
        type: string
        default: none
      commit_sha:
        required: true
        type: string
      shard:
        required: true
        type: string
      runner_kind:
        required: true
        type: string
      archive_run_id:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      maintenance_mode:
        description: Inspect or reclaim generated files on the persistent Hetzner runner
        required: false
        type: choice
        default: none
        options: [none, inspect, cleanup]
      commit_sha:
        description: Exact commit to test
        required: true
        type: string
      shard:
        description: One-based nextest shard
        required: true
        type: choice
        options: ["1", "2"]
      runner_kind:
        description: Runner pool for this shard
        required: true
        type: choice
        options: [github, hetzner]
      correlation:
        description: Parent run/shard correlation key
        required: true
        type: string
      archive_run_id:
        description: Parent run containing a shared workspace test archive
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    if: inputs.maintenance_mode == 'none'
    name: Workspace shard ${{ inputs.shard }} (${{ inputs.runner_kind }})
    runs-on: ${{ inputs.runner_kind == 'hetzner' && fromJSON('["self-hosted","Linux","X64","mvm","hetzner","kvm"]') || 'ubuntu-latest' }}
    # Archive workers on one persistent host share the build-time source path.
    # Serialize that pool; GitHub-hosted workers have separate filesystems.
    concurrency:
      group: ${{ inputs.runner_kind == 'hetzner' && inputs.archive_run_id != '' && format('workspace-archive-{0}', inputs.archive_run_id) || format('workspace-shard-{0}-{1}', github.run_id, inputs.shard) }}
      cancel-in-progress: false
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Prepare archived workspace
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid archive run ID" >&2; exit 1; }
          archive_root="/tmp/mvm-workspace-${ARCHIVE_RUN_ID}"
          rm -rf -- "$archive_root"
          mkdir -p -- "$archive_root"
          cp -a "$GITHUB_WORKSPACE/." "$archive_root/"

      - uses: ./.github/actions/free-disk
        if: inputs.runner_kind == 'github' && inputs.archive_run_id == ''

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25

      - uses: ./.github/actions/apt-deps
        if: inputs.runner_kind == 'github'
        with:
          packages: attr cryptsetup-bin lld

      - name: Verify provisioned self-hosted dependencies
        if: inputs.runner_kind == 'hetzner'
        run: |
          set -euo pipefail
          command -v cryptsetup
          command -v getfattr
          command -v ld.lld

      - uses: ./.github/actions/rust-cache
        if: inputs.archive_run_id == ''
        with:
          key: ${{ inputs.runner_kind == 'hetzner' && 'hetzner-workspace' || 'workspace' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build
        if: inputs.archive_run_id == ''
        run: cargo build --all-targets

      - name: Validate nextest override filters
        if: inputs.archive_run_id == ''
        run: cargo run -p xtask -- check-nextest-groups

      - name: xtask man-page tests
        if: inputs.archive_run_id == ''
        run: cargo nextest run -p xtask --features man

      - name: Run tests
        if: inputs.archive_run_id == ''
        run: cargo nextest run --workspace --all-targets --partition hash:${{ inputs.shard }}/2

      - name: Run addon/egress helper tests
        if: inputs.archive_run_id == '' && inputs.shard == '1'
        run: cargo nextest run -p mvm-agentd --features addons

      - name: Run doctests
        if: inputs.archive_run_id == '' && inputs.shard == '1'
        run: cargo test --workspace --doc

      - name: Download shared workspace test archive
        if: inputs.archive_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: workspace-tests
          run-id: ${{ inputs.archive_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}

      - name: Run archived workspace tests
        if: inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -euo pipefail
          archive_root="/tmp/mvm-workspace-${ARCHIVE_RUN_ID}"
          cd "$archive_root"
          cargo nextest run \
            --archive-file "$RUNNER_TEMP/workspace-tests.tar.zst" \
            --workspace-remap "$archive_root" \
            --extract-to "$archive_root" \
            --partition hash:${{ inputs.shard }}/2

      - name: Remove archived workspace
        if: always() && inputs.archive_run_id != ''
        env:
          ARCHIVE_RUN_ID: ${{ inputs.archive_run_id }}
        run: |
          set -euo pipefail
          [[ "$ARCHIVE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          rm -rf -- "/tmp/mvm-workspace-${ARCHIVE_RUN_ID}"

  maintenance:
    if: inputs.maintenance_mode != 'none' && github.event_name == 'workflow_dispatch'
    name: Maintain Hetzner disk
    runs-on: [self-hosted, Linux, X64, mvm, hetzner, kvm]
    timeout-minutes: 20
    steps:
      - name: Measure runner disk usage
        shell: bash
        run: |
          set -euo pipefail
          echo 'Filesystem space:'
          df -h / "$HOME" "$RUNNER_TEMP" /tmp
          echo 'Top-level usage:'
          for root in "$HOME" "$RUNNER_WORKSPACE" "$RUNNER_TEMP" /tmp; do
            if [ -d "$root" ]; then
              echo "$root"
              du -x -h -d 1 -- "$root" 2>/dev/null | sort -h | tail -30 || true
            fi
          done
          echo 'Known generated paths:'
          for path in \
            "$GITHUB_WORKSPACE/target" \
            "$GITHUB_WORKSPACE/.mvm-test/target" \
            "$HOME/.cargo/registry/cache" \
            "$HOME/.cache/sccache"; do
            if [ -d "$path" ]; then
              du -s -h -- "$path"
            fi
          done
          find /tmp "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -type d \
            -name 'mvm-workspace-*' -print0 | xargs -0 -r du -s -h --

      - name: Reclaim generated files
        if: inputs.maintenance_mode == 'cleanup'
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(realpath -e -- "$GITHUB_WORKSPACE")
          runner_workspace=$(realpath -e -- "$RUNNER_WORKSPACE")
          home=$(realpath -e -- "$HOME")
          runner_temp=$(realpath -e -- "$RUNNER_TEMP")
          [[ "$workspace" == "$runner_workspace/mvm" ]] || exit 1
          [[ "$home" != / && "$runner_temp" != / ]] || exit 1

          remove_generated_dir() {
            local path=$1
            if [[ ! -e "$path" && ! -L "$path" ]]; then
              return
            fi
            [[ -d "$path" && ! -L "$path" ]] || exit 1
            [[ "$(stat -c %u -- "$path")" == "$(id -u)" ]] || exit 1
            echo "Removing $path"
            chmod -R u+rwX -- "$path"
            rm -rf -- "$path"
          }

          remove_generated_dir "$workspace/target"
          remove_generated_dir "$workspace/.mvm-test/target"
          remove_generated_dir "$home/.cargo/registry/cache"
          remove_generated_dir "$home/.cache/sccache"

          for root in /tmp "$runner_temp"; do
            while IFS= read -r -d '' path; do
              name=${path##*/}
              [[ "$name" =~ ^mvm-workspace-[0-9]+(-[0-9]+-[12])?$ ]] || exit 1
              remove_generated_dir "$path"
            done < <(find "$root" -mindepth 1 -maxdepth 1 -type d \
              -name 'mvm-workspace-*' -print0)
          done
          df -h / "$home" "$runner_temp" /tmp
