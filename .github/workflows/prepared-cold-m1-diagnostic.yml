name: M1 physical-cold diagnostic

# Manual, trusted-main measurement only. One self-hosted runner accepts one
# Actions job at a time; a shared Actions concurrency group would instead
# replace pending jobs and silently drop coverage.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepared-cold-m1:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, m1]
    timeout-minutes: 90
    env:
      MVM_RUNTIME_OVERLAY_SOURCE_ROOT: ${{ github.workspace }}
      MVM_RUNTIME_OVERLAY_ACQUIRE_MODE: build
      MVM_RESIDENCY: cold
      MVM_BUILDER_BACKEND: hvf
      MVM_BOOT_IMAGE: fetch
      MVM_KERNEL_SOURCE: download
      CARGO_BUILD_JOBS: "4"
      CI: "1"
      TERM: dumb
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-zigbuild

      - name: Record the source and host
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          RESULTS_DIR="${RUNNER_TEMP}/mvm-physical-cold-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          MVM_HOME="${RUNNER_TEMP}/mvm-physical-cold-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$RESULTS_DIR" "$MVM_HOME"
          printf 'RESULTS_DIR=%s\nMVM_HOME=%s\n' "$RESULTS_DIR" "$MVM_HOME" >> "$GITHUB_ENV"
          {
            printf 'source_commit='
            git rev-parse HEAD
            uname -a
            sw_vers
          } > "$RESULTS_DIR/provenance.txt"

      - name: Build the release CLI and its actual HVF supervisor
        run: |
          set -euo pipefail
          cargo build --locked --release --bin mvmctl --features embed-host-bins
          cargo build --locked --release -p mvm-hostd --bins
          shasum -a 256 target/release/mvmctl target/release/mvm-hvf-supervisor \
            >> "$RESULTS_DIR/provenance.txt"

      - name: Prepare the guest and selected Alpine image
        run: |
          set -euo pipefail
          target/release/mvmctl image pull --builder hvf docker.io/library/alpine:latest
          target/release/mvmctl bootstrap

      - name: Preflight the exact launch outside the benchmark
        run: |
          set -euo pipefail
          # Two launches, a few seconds apart. The first signs the helper and
          # records its probe memo within the timestamp margin of the signing,
          # so the next launch has to hash the helper once and renew the memo.
          # The lane rejects a hash in any launch it runs, warm-ups included,
          # so that one hash belongs here and not in the benchmark.
          for attempt in 1 2; do
            MVM_LAUNCH_SAMPLE_JSON="$RESULTS_DIR/preflight-${attempt}.json" \
              target/release/mvmctl run --no-detect \
                --image docker.io/library/alpine:latest --hypervisor hvf \
                --no-build --fresh -- /bin/true
            sleep 3
          done
          cp "$RESULTS_DIR/preflight-2.json" "$RESULTS_DIR/preflight.json"

      - name: Measure physical-cold launches
        run: |
          set -euo pipefail
          # This catches a leftover build or VM process, not arbitrary host load.
          # Do not call these results an exclusive-host reference measurement.
          python3 - <<'PY'
          import subprocess
          import sys

          processes = subprocess.check_output(["ps", "-axo", "pid=,comm="], text=True)
          busy = []
          for line in processes.splitlines():
              pid, command = line.strip().split(maxsplit=1)
              if command.rsplit("/", 1)[-1] in {
                  "cargo", "rustc", "mvmctl", "mvm-hvf-supervisor"
              }:
                  busy.append((pid, command))
          if busy:
              print(f"competing build or VM process: {busy}", file=sys.stderr)
              sys.exit(1)
          PY
          uptime >> "$RESULTS_DIR/provenance.txt"
          status=0
          target/release/mvmctl bench --lane prepared-cold --runs 20 --warmup 2 \
            --json --out "$RESULTS_DIR/bench.json" -- \
            run --no-detect --image docker.io/library/alpine:latest \
              --hypervisor hvf --no-build --fresh -- /bin/true \
            > "$RESULTS_DIR/bench.log" 2>&1 || status=$?
          cat "$RESULTS_DIR/bench.log"
          uptime >> "$RESULTS_DIR/provenance.txt"
          exit "$status"

      # Evidence only, never a gate: the lane above stops at its first sample
      # over the ceiling and keeps only that sample, so this records twenty
      # more launches with no ceiling to show how they are distributed.
      - name: Survey twenty launches without a ceiling
        if: always()
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            MVM_LAUNCH_SAMPLE_JSON="$RESULTS_DIR/survey-${i}.json" \
              target/release/mvmctl run --no-detect \
                --image docker.io/library/alpine:latest --hypervisor hvf \
                --no-build --fresh -- /bin/true > /dev/null 2>&1 || true
            sleep 1
          done
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY" "$RESULTS_DIR/survey-summary.txt"
          import glob, json, os, statistics

          rows = []
          for path in sorted(glob.glob(os.path.join(os.environ["RESULTS_DIR"], "survey-[0-9]*.json"))):
              try:
                  doc = json.load(open(path))
              except (OSError, ValueError):
                  continue
              sample = doc.get("sample", doc)
              phases = sample.get("phases") or {}
              if "startup_ms" in phases:
                  hashed = (sample.get("work") or {}).get("artifact_bytes_hashed", 0)
                  rows.append((phases["startup_ms"], hashed))
          startups = sorted(row[0] for row in rows)
          print("### Launch survey (no ceiling, evidence only)")
          print(f"samples: {len(startups)} of 20")
          if startups:
              p95 = startups[min(len(startups) - 1, int(len(startups) * 0.95))]
              print(f"min {startups[0]:.1f} ms, median {statistics.median(startups):.1f} ms, "
                    f"p95 {p95:.1f} ms, max {startups[-1]:.1f} ms")
              print(f"over 300 ms: {sum(1 for value in startups if value >= 300.0)}")
              print(f"launches that hashed artifacts: {sum(1 for row in rows if row[1])}")
              print("startup_ms, sorted: " + ", ".join(f"{value:.0f}" for value in startups))
          PY

      # A report-level failure leaves report JSON; a sampled warm-up refusal
      # leaves separate invalid-sample JSON. A launch with no sample leaves
      # only the CLI transcript. Never call any failure a passing sample.
      - name: Upload available evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: physical-cold-m1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mvm-physical-cold-${{ github.run_id }}-${{ github.run_attempt }}/provenance.txt
            ${{ runner.temp }}/mvm-physical-cold-${{ github.run_id }}-${{ github.run_attempt }}/preflight.json
            ${{ runner.temp }}/mvm-physical-cold-${{ github.run_id }}-${{ github.run_attempt }}/preflight-1.json
            ${{ runner.temp }}/mvm-physical-cold-${{ github.run_id }}-${{ github.run_attempt }}/survey-summary.txt
            ${{ runner.temp }}/mvm-physical-cold-${{ github.run_id }}-${{ github.run_attempt }}/survey-*.json
            ${{ runner.temp }}/mvm-physical-cold-${{ github.run_id }}-${{ github.run_attempt }}/bench.json
            ${{ runner.temp }}/mvm-physical-cold-${{ github.run_id }}-${{ github.run_attempt }}/bench.log
          if-no-files-found: warn
          retention-days: 30
