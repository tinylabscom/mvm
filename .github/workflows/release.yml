name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write   # Required for cosign keyless signing via OIDC
  actions: write    # Required to dispatch publish-crates workflow

env:
  CARGO_TERM_COLOR: always
  MVMCTL_RELEASE_FEATURES: template-registry-s3,dev-watch,custom-dns,manifest-verify

jobs:
  build:
    strategy:
      # Each target publishes independently — one target's failure must not
      # cancel the others, or a single flaky job strands the whole release.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # x86_64-apple-darwin (Intel mac) is DEFERRED. The macOS mvmctl
          # links libkrun (Plan 87 W5), so an x86_64 binary must build on a
          # native Intel runner — but GitHub's macos-13 Intel runners are
          # unavailable to this org (jobs sit queued for hours, never
          # starting), which blocked the whole release. Apple Silicon is the
          # product baseline (macOS 26+); restore this when an Intel runner
          # is available (hosted capacity or self-hosted) or via a libkrun
          # cross-link. install.sh / the Homebrew on_intel arm still point at
          # the (currently absent) asset.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    # Backstop: a cold release build is ~15-25 min. Without a cap a hung
    # build (e.g. the nested-cargo target-lock deadlock fixed in build.rs)
    # runs to the 6h default, burning runner minutes silently.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ADR-065: mvm-cli's build.rs cross-compiles the embedded host-vm
      # binaries (mvm-host-vm-init, mvm-egress-proxy) as static
      # aarch64-unknown-linux-musl via cargo-zigbuild — so zig +
      # cargo-zigbuild must be present at `cargo build`-of-mvmctl time, the
      # same as the ci.yml Lint job. Without this the release binary build
      # fails at "cargo zigbuild failed for mvm-host-vm-init".
      - uses: ./.github/actions/install-zigbuild

      # macOS mvmctl links libkrun directly (Plan 87 W5): build.rs runs
      # bindgen against libkrun.h and emits `-lkrun`, and the runtime
      # kernel-extraction path needs libkrunfw. Both ship via the slp/krun
      # Homebrew tap. Without them the build panics in libkrun-sys/build.rs
      # ("libkrun.h was not found"). Linux uses Firecracker — no libkrun.
      - name: Install libkrun (macOS backend FFI)
        if: runner.os == 'macOS'
        run: brew install slp/krun/libkrun slp/krun/libkrunfw

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set linker for aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          # Use vendored OpenSSL for cross-compilation to avoid linking issues
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        run: cargo build --release --target "${TARGET}" --features "${MVMCTL_RELEASE_FEATURES}"

      - name: Smoke test binary (native targets only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          BIN="target/${TARGET}/release/mvmctl"
          "$BIN" --version
          "$BIN" --help > /dev/null
          "$BIN" metrics --json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # metrics JSON is sectioned: counters live under 'global'.
          assert 'requests_total' in d.get('global', {}), 'metrics JSON missing global.requests_total'
          print('smoke test passed')
          "

      - name: Generate man pages
        shell: bash
        # gen-man lives behind xtask's off-by-default `man` feature (it pulls
        # mvm-cli + its heavy build.rs); release is the only caller.
        run: cargo run --package xtask --features man -- gen-man --output-dir man/

      - name: Package binary and generate checksums
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          BIN_NAME="mvmctl"
          ARCHIVE_NAME="mvmctl-${TARGET}"

          mkdir -p "staging/${ARCHIVE_NAME}"
          cp "target/${TARGET}/release/${BIN_NAME}" "staging/${ARCHIVE_NAME}/"
          cp -r resources "staging/${ARCHIVE_NAME}/" 2>/dev/null || true
          cp README.md "staging/${ARCHIVE_NAME}/" 2>/dev/null || true
          # Include generated man pages
          if [ -d man ] && ls man/*.1 2>/dev/null; then
            cp -r man "staging/${ARCHIVE_NAME}/"
          fi

          cd staging
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          # Generate SHA256 checksum for the tarball
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvmctl-${{ matrix.target }}
          path: |
            staging/*.tar.gz
            staging/*.sha256

  # Plan 72 W5 / ADR-046: the Layer-1 builder VM image that
  # `LibkrunBuilderVm::run_build` boots into to run `nix build` on
  # behalf of mvmctl. Plan 72 W2 ships the flake at
  # `nix/images/builder-vm/`; this job publishes the per-arch
  # artifacts so installed-binary users (no source checkout) can
  # download them via `download_builder_vm_image`.
  #
  # This is the development-time builder VM that runs `nix build`
  # against the user's dev-shell flake. (Plan 115 / ADR-064 folded the
  # old separate dev-shell + sealed-builder images — `nix/images/builder`
  # — into this one; the sealed runtime builder for mvmd's pool-build
  # pipeline, if still needed, is sourced from mvmd, not built here.)
  builder-vm-image:
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build builder VM image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/builder-vm#packages.${SYSTEM}.default" \
            --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          mkdir -p staging
          cp "$STORE_PATH/vmlinux"       "staging/builder-vm-vmlinux-${ARCH}"
          cp "$STORE_PATH/rootfs.ext4"   "staging/builder-vm-rootfs-${ARCH}.ext4"
          # Optional sidecars the flake emits. `cp -L` so symlinks
          # resolve; ignore-missing so older flake snapshots that
          # predate these outputs still produce a valid release.
          if [ -f "$STORE_PATH/cmdline.txt" ]; then
            cp -L "$STORE_PATH/cmdline.txt" "staging/builder-vm-${ARCH}.cmdline.txt"
          fi
          if [ -f "$STORE_PATH/manifest.json" ]; then
            cp -L "$STORE_PATH/manifest.json" "staging/builder-vm-${ARCH}.manifest.json"
          fi
          cd staging
          # Build the checksums list dynamically — sidecars are
          # optional, so only include what's actually present.
          FILES="builder-vm-vmlinux-${ARCH} builder-vm-rootfs-${ARCH}.ext4"
          [ -f "builder-vm-${ARCH}.cmdline.txt" ]   && FILES="$FILES builder-vm-${ARCH}.cmdline.txt"
          [ -f "builder-vm-${ARCH}.manifest.json" ] && FILES="$FILES builder-vm-${ARCH}.manifest.json"
          sha256sum $FILES > "builder-vm-${ARCH}-checksums-sha256.txt"

      - name: Upload builder VM image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: builder-vm-image-${{ matrix.arch }}
          path: |
            staging/builder-vm-vmlinux-${{ matrix.arch }}
            staging/builder-vm-rootfs-${{ matrix.arch }}.ext4
            staging/builder-vm-${{ matrix.arch }}.cmdline.txt
            staging/builder-vm-${{ matrix.arch }}.manifest.json
            staging/builder-vm-${{ matrix.arch }}-checksums-sha256.txt

  # Plan 74 W1.4b / ADR-051: the verity-sealed mvm runtime overlay
  # disk. Attached as `/dev/vdc` at every microVM boot;
  # `mvm-verity-init` mounts it at `/mvm/runtime` so the guest agent,
  # seccomp shim, and per-language SDK runtime libraries live in a
  # single mvm-controlled blob instead of being baked into every
  # per-image rootfs. Built per-arch from `nix/images/runtime-overlay/`.
  #
  # The host-side `RuntimeOverlayResolver`
  # (`crates/mvm-build/src/runtime_overlay.rs`) installs these into
  # `~/.cache/mvm/runtime-overlay/<mvmctl-version>/<arch>/` under the
  # canonical names (`overlay.ext4`, `overlay.verity`,
  # `overlay.roothash`, `VERSION`); the release artifact names carry
  # the arch suffix so the combined release-asset pool doesn't
  # collide between aarch64 and x86_64.
  runtime-overlay-image:
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build runtime overlay image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/runtime-overlay#packages.${SYSTEM}.default" \
            --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          mkdir -p staging
          # cp -L so `overlay.*` resolve through nix-store symlinks
          # into the actual blobs; the artifact uploader doesn't
          # follow symlinks.
          cp -L "$STORE_PATH/overlay.ext4"     "staging/runtime-overlay-${ARCH}.ext4"
          cp -L "$STORE_PATH/overlay.verity"   "staging/runtime-overlay-${ARCH}.verity"
          cp -L "$STORE_PATH/overlay.roothash" "staging/runtime-overlay-${ARCH}.roothash"
          cp -L "$STORE_PATH/VERSION"          "staging/runtime-overlay-${ARCH}.VERSION"
          cd staging
          sha256sum "runtime-overlay-${ARCH}.ext4" \
                    "runtime-overlay-${ARCH}.verity" \
                    "runtime-overlay-${ARCH}.roothash" \
                    "runtime-overlay-${ARCH}.VERSION" \
            > "runtime-overlay-${ARCH}-checksums-sha256.txt"

      - name: Upload runtime overlay image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: runtime-overlay-image-${{ matrix.arch }}
          path: |
            staging/runtime-overlay-${{ matrix.arch }}.ext4
            staging/runtime-overlay-${{ matrix.arch }}.verity
            staging/runtime-overlay-${{ matrix.arch }}.roothash
            staging/runtime-overlay-${{ matrix.arch }}.VERSION
            staging/runtime-overlay-${{ matrix.arch }}-checksums-sha256.txt

  # Plan 158: the bundled default microVM image `mvmctl up`/`exec` boots when
  # no --flake/--template/--image is given. Ships the PROD variant only
  # (sealed + verity-sealed rootfs); the dev variant is built locally in dev
  # mode, never published. `download_default_microvm_image` fetches these five
  # assets + the checksums.
  default-microvm:
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build default microVM image (prod variant)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/default-tenant#packages.${SYSTEM}.default" \
            --impure --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          mkdir -p staging
          cp -L "$STORE_PATH/vmlinux"         "staging/default-microvm-vmlinux-${ARCH}"
          cp -L "$STORE_PATH/rootfs.ext4"     "staging/default-microvm-rootfs-${ARCH}.ext4"
          cp -L "$STORE_PATH/rootfs.verity"   "staging/default-microvm-rootfs-${ARCH}.verity"
          cp -L "$STORE_PATH/rootfs.roothash" "staging/default-microvm-rootfs-${ARCH}.roothash"
          cp -L "$STORE_PATH/mvm-meta.json"   "staging/default-microvm-meta-${ARCH}.json"
          cd staging
          sha256sum "default-microvm-vmlinux-${ARCH}" \
                    "default-microvm-rootfs-${ARCH}.ext4" \
                    "default-microvm-rootfs-${ARCH}.verity" \
                    "default-microvm-rootfs-${ARCH}.roothash" \
                    "default-microvm-meta-${ARCH}.json" \
            > "default-microvm-${ARCH}-checksums-sha256.txt"

      - name: Upload default microVM image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: default-microvm-${{ matrix.arch }}
          path: |
            staging/default-microvm-vmlinux-${{ matrix.arch }}
            staging/default-microvm-rootfs-${{ matrix.arch }}.ext4
            staging/default-microvm-rootfs-${{ matrix.arch }}.verity
            staging/default-microvm-rootfs-${{ matrix.arch }}.roothash
            staging/default-microvm-meta-${{ matrix.arch }}.json
            staging/default-microvm-${{ matrix.arch }}-checksums-sha256.txt

  release:
    needs: [build, builder-vm-image, runtime-overlay-image, default-microvm]
    # Gate the published release on the mvmctl binary build ONLY. The Nix
    # image jobs still run and their artifacts are attached when present,
    # but an image-build failure must not block the binary download
    # (mvmctl tarballs + checksums) that install.sh / `mvmctl update` /
    # the Homebrew tap consume. `!cancelled()` lets this run after image
    # jobs fail; the result check keeps the binary build a hard requirement.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx --format json --all --override-filename sbom.cdx

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksum file
        shell: bash
        run: |
          cd artifacts
          # Combine per-platform checksums into one file
          cat *.sha256 > checksums-sha256.txt
          echo "Combined checksums:"
          cat checksums-sha256.txt

      - name: Sign release tarballs and SBOM
        shell: bash
        run: |
          # Sign each tarball — keyless OIDC, no secret key needed.
          # Produces a .bundle file per tarball containing signature + certificate chain.
          for tarball in artifacts/*.tar.gz; do
            cosign sign-blob \
              --yes \
              --bundle "${tarball}.bundle" \
              "${tarball}"
            echo "Signed: ${tarball}"
          done

          # Sign the SBOM
          cosign sign-blob \
            --yes \
            --bundle sbom.cdx.json.bundle \
            sbom.cdx.json
          echo "Signed: sbom.cdx.json"

      # Plan 36 / ADR 005: cosign-keyless-sign each per-(arch, variant)
      # SignedManifest JSON. The bundle (.bundle) carries the signature,
      # the Fulcio short-lived cert, and the Rekor inclusion proof —
      # mvm-security::image_verify consumes exactly this format.
      - name: Sign image manifests (plan 36)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(artifacts/*-image-*.manifest.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            # Images are best-effort: an image-build failure must not block
            # the binary release. Warn and skip rather than fail.
            echo "::warning::no image manifests in artifacts/ — image jobs likely failed; publishing the binary release without image signatures" >&2
            ls -la artifacts/ >&2 || true
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            cosign sign-blob \
              --yes \
              --bundle "${manifest}.bundle" \
              "${manifest}"
            echo "Signed: ${manifest}"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # nullglob: image globs that matched nothing (their job failed)
          # drop out of the list instead of being passed literally and
          # erroring `gh release create`. The binary tarballs, the combined
          # checksums, and the SBOM are always present (the job gates on the
          # binary build), so the download path is always published; images
          # attach only when their jobs succeeded.
          shopt -s nullglob
          assets=(
            artifacts/*.tar.gz
            artifacts/*.tar.gz.bundle
            artifacts/checksums-sha256.txt
            artifacts/builder-vm-vmlinux-*
            artifacts/builder-vm-rootfs-*
            artifacts/builder-vm-*.cmdline.txt
            artifacts/builder-vm-*.manifest.json
            artifacts/builder-vm-*-checksums-sha256.txt
            artifacts/runtime-overlay-*.ext4
            artifacts/runtime-overlay-*.verity
            artifacts/runtime-overlay-*.roothash
            artifacts/runtime-overlay-*.VERSION
            artifacts/runtime-overlay-*-checksums-sha256.txt
            artifacts/default-microvm-vmlinux-*
            artifacts/default-microvm-rootfs-*
            artifacts/default-microvm-meta-*
            artifacts/default-microvm-*-checksums-sha256.txt
            sbom.cdx.json
            sbom.cdx.json.bundle
          )
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            "${assets[@]}"

      # The "release: published" event fired by `gh release create` runs under
      # GITHUB_TOKEN, which by design does not trigger downstream workflows.
      # workflow_dispatch is exempt from that rule, so chain publish-crates
      # explicitly here. This keeps crates.io in sync with GitHub releases.
      - name: Trigger crates.io publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh workflow run publish-crates.yml \
            --ref "${TAG_NAME}" \
            -f tag="${TAG_NAME}" \
            -f dry_run=false

  # Plan 199 B2: post-publish gate. Download the just-created release and assert
  # every binary target has a tarball + matching SHA256 + cosign signature bundle
  # + an entry in the combined checksums manifest, and that the SBOM is signed.
  # Fail-closed — a release missing a checksum/signature or whose bytes don't
  # match their recorded hash fails here, surfacing it instead of shipping silently.
  verify-release:
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets

      - name: Verify release asset set (checksums + signatures + SBOM + version)
        env:
          # Keyless GitHub-OIDC signing identity for this workflow's blobs.
          COSIGN_IDENTITY_REGEXP: "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/.*$"
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bash packaging/release/verify-release-assets.sh \
            --assets-dir release-assets \
            --cosign \
            --expect-version "${TAG_NAME#v}"
