name: Release

on:
  push:
    tags:
      - "v*"
  # Manual dry-run: validate the release build + packaging (binaries, host-bin
  # bundling, Linux cross-build) on the real CI runners WITHOUT publishing.
  # `dry_run=true` (the default) runs only the `build` job and skips the Nix
  # image jobs, the publishing `release` job, and `verify-release`. A real
  # release still happens via a `v*` tag push; an explicit `dry_run=false`
  # dispatch publishes too (escape hatch).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + package only; do NOT publish (no GitHub release, no crates.io)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write   # Required for cosign keyless signing via OIDC
  actions: write    # Required to dispatch publish-crates workflow

env:
  CARGO_TERM_COLOR: always
  # `embed-host-bins` is what makes a released binary self-sufficient: it
  # cross-compiles the Linux host binaries and embeds them, so a downloaded
  # mvmctl can bootstrap a builder VM with nothing else installed. It is off by
  # default (a dev build does not need the payload and should not pay the
  # cross-compile), which means the *only* place it gets turned on for a shipped
  # artifact is here.
  MVMCTL_RELEASE_FEATURES: host,user,template-registry-s3,release-artifact-bootstrap,release-channel,embed-host-bins

jobs:
  bdd:
    uses: ./.github/workflows/bdd.yml

  # Every documented example, booted on both backends, before anything is
  # published. The hermetic `bdd` lane above drives `--help` and refusal paths
  # and boots no guest, so on its own it cannot see a documented command that
  # parses and then fails at runtime — which is exactly what `machine run -it`
  # did, on every OCI image, while the README told readers to run it.
  #
  # This is a release blocker on purpose. It is the slowest thing here; a tag
  # that cannot wait for it is a tag published without evidence that its own
  # README works.
  e2e-docs:
    uses: ./.github/workflows/e2e-docs.yml

  build:
    strategy:
      # Each target publishes independently — one target's failure must not
      # cancel the others, or a single flaky job strands the whole release.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # x86_64-apple-darwin (Intel mac) is DEFERRED. The macOS mvmctl
          # links libkrun (Plan 87 W5), so an x86_64 binary must build on a
          # native Intel runner — but GitHub's macos-13 Intel runners are
          # unavailable to this org (jobs sit queued for hours, never
          # starting), which blocked the whole release. Apple Silicon is the
          # product baseline (macOS 26+); restore this when an Intel runner
          # is available (hosted capacity or self-hosted) or via a libkrun
          # cross-link. install.sh / the Homebrew on_intel arm still point at
          # the (currently absent) asset.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    # Backstop: a cold release build is ~15-25 min. Without a cap a hung
    # build (e.g. the nested-cargo target-lock deadlock fixed in build.rs)
    # runs to the 6h default, burning runner minutes silently.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      # ADR-065: mvm-cli's build.rs cross-compiles the embedded host-vm
      # binaries (mvm-host-vm-init, mvm-egress-proxy) as static
      # aarch64-unknown-linux-musl via cargo-zigbuild — so zig +
      # cargo-zigbuild must be present at `cargo build`-of-mvmctl time, the
      # same as the ci.yml Lint job. Without this the release binary build
      # fails at "cargo zigbuild failed for mvm-host-vm-init".
      - uses: ./.github/actions/install-zigbuild

      # macOS mvmctl links libkrun directly (Plan 87 W5): build.rs runs
      # bindgen against libkrun.h and emits `-lkrun`, and the runtime
      # kernel-extraction path needs libkrunfw. Both ship via the slp/krun
      # Homebrew tap. Without them the build panics in libkrun-sys/build.rs
      # ("libkrun.h was not found"). Linux uses Firecracker — no libkrun.
      #
      # `brew trust` is required since Homebrew began refusing to auto-load
      # formulae from third-party ("untrusted") taps: installing
      # `slp/krun/libkrun` pulls a transitive formula (`virglrenderer`) from the
      # same tap, and without trust the install fails with "Refusing to load
      # formula ... from untrusted tap slp/krun". Tap + trust before installing.
      - name: Install libkrun (macOS backend FFI)
        if: runner.os == 'macOS'
        uses: ./.github/actions/install-libkrun

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set linker for aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          # Use vendored OpenSSL for cross-compilation to avoid linking issues
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        run: cargo build --profile release-min --target "${TARGET}" --features "${MVMCTL_RELEASE_FEATURES}"

      # The per-VM host processes mvmctl spawns at runtime (one process per
      # guest). They are SEPARATE bin targets in `mvm-hostd` — the root
      # `cargo build` above only produces `mvmctl` — so they are built here and
      # ship next to `mvmctl` in the tarball, where the backend's
      # adjacent-to-exe resolver finds them on a downloaded install. On a
      # downloaded install that resolver has no `target/` dir to fall back to,
      # so a binary missing here is a spawn failure at run time.
      #
      # This list is the `PerVmScope::Always` half of `PER_VM_HOST_BINARIES` in
      # crates/mvm-cli/src/host_binaries/manifest.rs, and
      # `xtask check-per-vm-host-binaries-sync` fails the build if the two
      # drift. Add a binary there, not here.
      #
      # macOS additionally gets the two supervisors. mvm-libkrun-supervisor is
      # macOS-only INTENTIONALLY — it has `required-features = ["libkrun-sys"]`
      # and the released Linux mvmctl deliberately does not link libkrun (see
      # the rationale in the top-level Cargo.toml): Linux workloads use
      # Firecracker, so the supervisor is neither buildable nor needed there.
      - name: Build per-VM host binaries
        env:
          TARGET: ${{ matrix.target }}
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        shell: bash
        run: |
          if [[ "${TARGET}" == *apple-darwin ]]; then
            cargo build --release --target "${TARGET}" -p mvm-hostd \
              --bin mvm-hvf-supervisor
            cargo build --release --target "${TARGET}" -p mvm-hostd \
              --bin mvm-libkrun-supervisor --features libkrun-sys
          fi
          # Ships on every target — see the note above.
          cargo build --release --target "${TARGET}" -p mvm-hostd \
            --bin mvm-host-agent \
            --bin mvm-signer-helper \
            --bin mvm-network-endpoint \
            --bin mvm-broker \
            --bin mvm-audit-signer

      - name: Smoke test binary (native targets only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          BIN="target/${TARGET}/release-min/mvmctl"
          "$BIN" --version
          "$BIN" --help > /dev/null
          "$BIN" ops metrics --json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # metrics JSON is sectioned: counters live under 'global'.
          assert 'requests_total' in d.get('global', {}), 'metrics JSON missing global.requests_total'
          print('smoke test passed')
          "

      - name: Binary size within budget (measured targets only)
        # Per-target byte budget for the release `mvmctl`. Only targets with a
        # measured baseline are gated; add a branch here once a new target is
        # measured. aarch64-apple-darwin measured 19,206,160 bytes with the
        # `release-min` profile at v0.18.0 (2026-08-20). Budget 25,165,824
        # (24 MiB) for headroom while keeping the size ratchet tight.
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cargo run --package xtask -- check-binary-size \
            --path "target/${TARGET}/release-min/mvmctl" \
            --budget-bytes 25165824

      - name: Generate man pages
        shell: bash
        # gen-man lives behind xtask's off-by-default `man` feature (it pulls
        # mvm-cli + its heavy build.rs); release is the only caller.
        run: cargo run --package xtask --features man -- gen-man --output-dir man/

      - name: Package binary and generate checksums
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          BIN_NAME="mvmctl"
          ARCHIVE_NAME="mvmctl-${TARGET}"

          mkdir -p "staging/${ARCHIVE_NAME}"
          cp "target/${TARGET}/release-min/${BIN_NAME}" "staging/${ARCHIVE_NAME}/"
          # Per-VM host processes (built in the prior step), shipped next to
          # mvmctl so the backend's adjacent-to-exe resolver finds them on a
          # downloaded install. Kept in step with PER_VM_HOST_BINARIES by
          # `xtask check-per-vm-host-binaries-sync`.
          #
          # Fail closed rather than copy-if-exists: a binary that failed to
          # build would otherwise be silently dropped from the tarball and
          # surface much later as a spawn failure on a user's machine.
          REQUIRED_HOSTBINS="mvm-host-agent mvm-signer-helper mvm-network-endpoint mvm-broker mvm-audit-signer"
          if [[ "${TARGET}" == *apple-darwin ]]; then
            REQUIRED_HOSTBINS="${REQUIRED_HOSTBINS} mvm-hvf-supervisor mvm-libkrun-supervisor"
          fi
          for hostbin in ${REQUIRED_HOSTBINS}; do
            src="target/${TARGET}/release/${hostbin}"
            if [ ! -f "$src" ]; then
              echo "::error::${hostbin} was not built for ${TARGET}; mvmctl spawns it at run time and the adjacent-to-exe resolver has no fallback on a downloaded install" >&2
              exit 1
            fi
            cp "$src" "staging/${ARCHIVE_NAME}/"
            echo "bundled ${hostbin}"
          done
          cp -r assets "staging/${ARCHIVE_NAME}/" 2>/dev/null || true
          cp README.md "staging/${ARCHIVE_NAME}/" 2>/dev/null || true
          # Include generated man pages
          if [ -d man ] && ls man/*.1 2>/dev/null; then
            cp -r man "staging/${ARCHIVE_NAME}/"
          fi

          cd staging
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          # Generate SHA256 checksum for the tarball
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvmctl-${{ matrix.target }}
          path: |
            staging/*.tar.gz
            staging/*.sha256

  # The universal initramfs, without which a published prod image cannot be
  # sealed-booted from its own release assets.
  #
  # the universal initramfs agent runs from this as PID 1: it sets up the dm-verity target
  # over the rootfs, mounts the runtime overlay at /sysroot/mvm/runtime, and
  # switch_roots. A source checkout builds one locally
  # (`resolve_or_build_local_initramfs`); an installed binary calls
  # `download_initramfs`, which fetches `initramfs-<arch>.tar.gz` from this
  # release. That download has never once succeeded, because nothing published
  # the file — so every installed mvmctl has been unable to boot the sealed path
  # its own rootfs is built for.
  #
  # This train, not `boot-image/v*`: `release_base_url` builds `{base}/v{version}`,
  # and the initramfs bundles this workspace's guest agent, so it versions with
  # the CLI rather than with the image.
  initramfs-image:
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    strategy:
      # One arch must not cancel the other; the completeness check in `release`
      # refuses a partial set, so letting both finish tells the truth about
      # which one failed.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build the universal initramfs
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SYSTEM="${ARCH}-linux"
          STORE_PATH=$(nix build "./nix/images/initramfs#packages.${SYSTEM}.default" \
            --no-link --print-out-paths | head -1)
          mkdir -p "staging/initramfs-${ARCH}"
          # cp -L so each file resolves through its nix-store symlink.
          for f in initramfs.cpio.gz initramfs.hash initramfs.size VERSION; do
            cp -L "$STORE_PATH/$f" "staging/initramfs-${ARCH}/$f"
          done
          # The derivation emits four of the five members `download_initramfs`
          # requires; the manifest over them is packaging's job, exactly as it
          # is for the runtime overlay.
          (
            cd "staging/initramfs-${ARCH}"
            sha256sum initramfs.cpio.gz initramfs.hash initramfs.size VERSION \
              > checksums-sha256.txt
          )
          tar -C "staging/initramfs-${ARCH}" \
            -czf "staging/initramfs-${ARCH}.tar.gz" \
            initramfs.cpio.gz initramfs.hash initramfs.size VERSION checksums-sha256.txt
          (
            cd staging
            sha256sum "initramfs-${ARCH}.tar.gz" > "initramfs-${ARCH}.tar.gz.sha256"
          )

      - name: Upload initramfs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: initramfs-image-${{ matrix.arch }}
          path: |
            staging/initramfs-${{ matrix.arch }}.tar.gz
            staging/initramfs-${{ matrix.arch }}.tar.gz.sha256

  release:
    needs: [bdd, e2e-docs, build, initramfs-image]
    # The CLI binary and universal initramfs form one usable release. Waiting
    # for the job is not enough under `!cancelled()`: its result must be a hard
    # success requirement or a failed initramfs build can still publish a tag
    # whose sealed-boot downloader always returns 404.
    # Dry-run guard: a `workflow_dispatch` with dry_run=true builds + packages
    # (the `build` job) but never reaches this publish job — only a tag push or
    # an explicit dry_run=false dispatch publishes.
    if: ${{ !cancelled() && needs.bdd.result == 'success' && needs.build.result == 'success' && needs.initramfs-image.result == 'success' && (github.event_name == 'push' || github.event.inputs.dry_run == 'false') }}
    # This job mints the one keyless identity every installed mvmctl trusts:
    # `release.yml@refs/tags/v{version}`, the sole entry in
    # RELEASE_IDENTITY_TEMPLATES. The environment's policy admits `v*` tags and
    # nothing else, so a branch push or a workflow_dispatch from an arbitrary
    # ref cannot produce a signature the shipped verifier accepts. The boot
    # image train is gated the same way against `boot-image/v*`, and
    # revocations against its own tag; this was the last of the three trusted
    # identities that anything could mint.
    environment: release-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx --format json --all --override-filename sbom.cdx

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Dual-publish: attach the newest boot image train's assets to this CLI
      # release too. It re-uploads bytes, never rebuilds them — the images are
      # built exactly once, by release-boot-image.yml.
      #
      # This direction, rather than having that workflow push into the CLI
      # release, because of who signs. An installed mvmctl trusts one keyless
      # identity, this workflow's at a `v*` tag, so the bundles it verifies
      # have to be minted here. Pulling the raw bytes in before the signing
      # step below means they are re-signed under that identity and the
      # consumer-path check a few steps down exercises them for real; the
      # boot-image release's own bundles are provenance for that train and are
      # simply overwritten here.
      #
      # The window closes when the download side reads DEFAULT_BOOT_IMAGE_TAG
      # instead of the CLI version. Until then this step is the only reason a
      # fresh install still finds its boot image. A CLI release with no image
      # assets is therefore not a degraded release, it is a broken one: every
      # fresh install 404s on first boot. So a missing boot image release stops
      # the publish rather than warning past it — the whole point of this gate
      # family is that nothing ships that can only be validated afterwards.
      - name: Attach the boot image release assets to this release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Highest version, not most recently created. `gh release list`
          # orders by creation date, so `.[0]` picks whichever release was cut
          # last — and the two disagree the moment one is re-cut out of order.
          # That is not hypothetical: v0.1.1 published, then v0.1.0 was re-cut
          # after a fix landed, leaving the newer release at the lower version.
          # Sorting by parsed semver makes which image a CLI release ships a
          # property of the version, not of the order someone happened to push.
          # The strict N.N.N match also drops anything that is not a plain
          # release tag rather than trying to order it.
          # No `-r`: `gh --jq` already prints a string result raw, and gh has no
          # such flag. Passing one consumes `--jq`'s value, demoting the real
          # expression to a positional argument, and gh rejects the whole
          # invocation with `unknown command "<the entire jq program>"`.
          BOOT_TAG="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
            --json tagName --jq '
              [ .[].tagName
                | select(test("^boot-image/v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                | {tag: ., v: (ltrimstr("boot-image/v") | split(".") | map(tonumber))} ]
              | sort_by(.v) | last | .tag // empty')"
          if [ -z "${BOOT_TAG}" ]; then
            echo "::error::no boot-image/v* release exists, so this release would ship with no boot image assets and every fresh install would 404 on first boot. Publish a boot-image/v* tag first, then re-run this release." >&2
            exit 1
          fi
          echo "Attaching boot image assets from ${BOOT_TAG}"
          mkdir -p artifacts
          gh release download "${BOOT_TAG}" --repo "${GITHUB_REPOSITORY}" --dir artifacts --clobber

          # Existence is not usability. The producing side refuses to publish an
          # incomplete set, but it cannot retract one published before that gate
          # existed, and this step would attach it without comment. A CLI release
          # missing these is green and unusable: no x86_64 image means every
          # x86_64 fresh install 404s on first boot, and no builder-vm assets
          # means download_builder_vm_image 404s for everyone. The consumer-path
          # check further down covers only runtime-overlay and sdk-sidecar, and
          # skips whatever is absent, so nothing else in this job would notice.
          missing=()
          for arch in aarch64 x86_64; do
            for f in \
              "default-microvm-vmlinux-${arch}" \
              "default-microvm-rootfs-${arch}.ext4" \
              "default-microvm-meta-${arch}.json" \
              "default-microvm-${arch}-checksums-sha256.txt" \
              "builder-vm-vmlinux-${arch}" \
              "builder-vm-rootfs-${arch}.ext4" \
              "builder-vm-${arch}-checksums-sha256.txt" \
              "runtime-overlay-${arch}.tar.gz"; do
              [ -s "artifacts/${f}" ] || missing+=("${f}")
            done
            for libc in glibc musl; do
              for f in \
                "sdk-sidecar-${arch}-${libc}.tar.gz" \
                "sdk-sidecar-${arch}-${libc}.tar.gz.sha256"; do
                [ -s "artifacts/${f}" ] || missing+=("${f}")
              done
            done
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::${BOOT_TAG} is incomplete — refusing to ship a CLI release whose boot image would 404 on first boot. Missing: ${missing[*]}" >&2
            exit 1
          fi
          # Drop the bundles this job re-mints. The signing step below writes
          # its bundle with create-new semantics, so leaving the boot image
          # train's copy in place would fail that step outright rather than be
          # overwritten. The pack-manifest bundles are not re-signed here and
          # stay.
          rm -f artifacts/runtime-overlay-*.tar.gz.bundle \
                artifacts/sdk-sidecar-*.tar.gz.bundle \
                artifacts/builder-vm-*-checksums-sha256.txt.bundle \
                artifacts/default-microvm-*-checksums-sha256.txt.bundle
          ls -la artifacts/

      - name: Generate combined checksum file
        shell: bash
        run: |
          cd artifacts
          # Combine per-platform checksums into one file
          # ./ prefix: a file named like an option must stay a filename.
          cat ./*.sha256 > checksums-sha256.txt
          echo "Combined checksums:"
          cat checksums-sha256.txt

      - name: Sign release tarballs, checksum manifests, and SBOM
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # One bundle format for every signed blob in this release:
          # --new-bundle-format, the Sigstore bundle carrying
          # verificationMaterial. Both consumers read it — the in-binary Rust
          # sigstore stack (mvm_build::release_signature -> image_verify) parses
          # ONLY this shape, and `cosign verify-blob --bundle` documents it as
          # the preferred input, so install.sh / `mvmctl update` /
          # verify-release-assets.sh keep working unchanged.
          #
          # Requires cosign >= v2.4 on any host that verifies by hand; that is
          # the floor this project targets and there is no legacy fallback.
          #
          # The checksum manifests are in this list because they are what
          # actually gates boot bytes: every downloader hashes the artifact and
          # compares it against the manifest, so an unsigned manifest lets
          # whoever can swap an artifact swap its recorded hash too and the
          # comparison still passes. Signing the tarball alone does not close
          # that — the image blobs (kernel, rootfs, verity sidecar) are not
          # tarballs and carry no per-file signature of their own; the manifest
          # is their only integrity anchor.
          #
          # The two image manifests are globs, so nullglob drops them when the
          # image job that would have produced them failed — image signing stays
          # best-effort exactly as image publication is. The combined binary
          # manifest is a literal because the preceding step always writes it
          # and this job hard-gates on the binary build.
          for blob in \
            artifacts/*.tar.gz \
            artifacts/builder-vm-*-checksums-sha256.txt \
            artifacts/default-microvm-*-checksums-sha256.txt \
            artifacts/checksums-sha256.txt \
            sbom.cdx.json; do
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${blob}.bundle" \
              "${blob}"
            echo "Signed: ${blob}"
          done

      # Consume what we are about to publish, before publishing it.
      #
      # The runtime overlay and SDK sidecar are acquired by an installed mvmctl
      # through a fail-closed ladder: checksum, cosign signature, safe-extract,
      # inner-manifest re-check, atomic install, resolve. Every rung refuses
      # rather than degrades, so an artifact this pipeline builds slightly wrong
      # does not degrade the user experience — it strands every download.
      #
      # This runs that exact production path over the staged artifacts via a
      # file:// URL. It is the only place the identity genuinely is this tagged
      # release workflow's, so it needs no trust override and proves the whole
      # chain rather than one rung. A missing artifact is skipped (image jobs
      # are best-effort and the release gates only on the binary build); a
      # PRESENT artifact that cannot be consumed fails the release here.
      - name: Verify the published artifacts survive the consumer path
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="${TAG_NAME#v}"
          STAGE="consumer-check/v${VERSION}"
          mkdir -p "${STAGE}"

          checked=0
          verify_archive() {
            local kind="$1"
            local arch="$2"
            local libc="${3:-}"
            local archive example_kind
            if [ "${kind}" = sdk-sidecar ]; then
              archive="artifacts/sdk-sidecar-${arch}-${libc}.tar.gz"
              example_kind=sidecar
            else
              archive="artifacts/runtime-overlay-${arch}.tar.gz"
              example_kind=overlay
            fi
            [ -f "${archive}" ] || return 0
            for suffix in "" ".sha256" ".bundle"; do
              src="${archive}${suffix}"
              if [ ! -f "${src}" ]; then
                echo "::error::${src} is missing — a published archive without its checksum and signature cannot be acquired" >&2
                exit 1
              fi
              cp "${src}" "${STAGE}/"
            done

            consumer_args=(
              --kind "${example_kind}"
              --base-url "file://$(pwd)/consumer-check"
              --version "${VERSION}"
              --arch "${arch}"
              --cache "$(mktemp -d)"
            )
            if [ -n "${libc}" ]; then
              consumer_args+=(--libc "${libc}")
            fi
            echo "Consuming ${kind}-${arch}${libc:+-${libc}} through the production download path..."
            cargo run --release -p mvm-build --example download-release-artifact \
              --features manifest-verify -- "${consumer_args[@]}"
            checked=$((checked + 1))
          }

          for arch in aarch64 x86_64; do
            verify_archive runtime-overlay "${arch}"
            for libc in glibc musl; do
              verify_archive sdk-sidecar "${arch}" "${libc}"
            done
          done

          if [ "${checked}" -eq 0 ]; then
            echo "::warning::no runtime-overlay or sdk-sidecar archives present — image jobs likely failed; publishing without them" >&2
          else
            echo "ok: ${checked} artifact(s) verified through the end-user acquisition path."
          fi

      # Plan 36 / ADR 005: cosign-keyless-sign each per-(arch, variant)
      # SignedManifest JSON. The bundle (.bundle) carries the signature,
      # the Fulcio short-lived cert, and the Rekor inclusion proof —
      # mvm-security::image_verify consumes exactly this format.
      - name: Sign image manifests (plan 36)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(artifacts/*-image-*.manifest.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            # Images are best-effort: an image-build failure must not block
            # the binary release. Warn and skip rather than fail.
            echo "::warning::no image manifests in artifacts/ — image jobs likely failed; publishing the binary release without image signatures" >&2
            ls -la artifacts/ >&2 || true
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            # --new-bundle-format emits the Sigstore bundle (with
            # verificationMaterial) that the in-binary Rust verifier
            # (image_verify::verify_manifest) parses; the legacy --bundle
            # format is rejected by that stack, which would hard-fail the
            # dev-image download's signature check.
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${manifest}.bundle" \
              "${manifest}"
            echo "Signed: ${manifest}"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # nullglob: image globs that matched nothing (their job failed)
          # drop out of the list instead of being passed literally and
          # erroring `gh release create`. The binary tarballs, the combined
          # checksums, and the SBOM are always present (the job gates on the
          # binary build), so the download path is always published; images
          # attach only when their jobs succeeded.
          shopt -s nullglob
          assets=(
            artifacts/*.tar.gz
            artifacts/*.tar.gz.bundle
            artifacts/checksums-sha256.txt
            artifacts/checksums-sha256.txt.bundle
            artifacts/builder-vm-vmlinux-*
            artifacts/builder-vm-rootfs-*
            artifacts/builder-vm-*.cmdline.txt
            artifacts/builder-vm-*.manifest.json
            artifacts/builder-vm-*.pack-manifest.json
            artifacts/builder-vm-*.pack-manifest.json.bundle
            artifacts/builder-vm-*.sbom.txt
            artifacts/builder-vm-*-checksums-sha256.txt
            artifacts/builder-vm-*-checksums-sha256.txt.bundle
            artifacts/runtime-overlay-*.tar.gz
            artifacts/runtime-overlay-*.tar.gz.sha256
            artifacts/initramfs-*.tar.gz
            artifacts/initramfs-*.tar.gz.sha256
            artifacts/sdk-sidecar-*-glibc.tar.gz
            artifacts/sdk-sidecar-*-glibc.tar.gz.sha256
            artifacts/sdk-sidecar-*-musl.tar.gz
            artifacts/sdk-sidecar-*-musl.tar.gz.sha256
            artifacts/runtime-overlay-*.tar.gz.bundle
            artifacts/sdk-sidecar-*-glibc.tar.gz.bundle
            artifacts/sdk-sidecar-*-musl.tar.gz.bundle
            artifacts/default-microvm-vmlinux-*
            artifacts/default-microvm-rootfs-*
            artifacts/default-microvm-meta-*
            artifacts/default-microvm-*.pack-manifest.json
            artifacts/default-microvm-*.pack-manifest.json.bundle
            artifacts/default-microvm-*.sbom.txt
            artifacts/default-microvm-*-checksums-sha256.txt
            artifacts/default-microvm-*-checksums-sha256.txt.bundle
            sbom.cdx.json
            sbom.cdx.json.bundle
          )
          RELEASE_NOTES_PREFIX="$(cat nix/packaging/release/runtime-overlay-operational-note.md)"
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            --notes "${RELEASE_NOTES_PREFIX}" \
            "${assets[@]}"

      # The "release: published" event fired by `gh release create` runs under
      # GITHUB_TOKEN, which by design does not trigger downstream workflows.
      # workflow_dispatch is exempt from that rule, so chain publish-crates
      # explicitly here. This keeps crates.io in sync with GitHub releases.
      - name: Trigger crates.io publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh workflow run publish-crates.yml \
            --ref "${TAG_NAME}" \
            -f tag="${TAG_NAME}" \
            -f dry_run=false

      # Same rule, same fix, for the kernels. `kernel-build.yml` declares
      # `on.push.tags: v*` and has never once run from it: whatever creates the
      # tag does so under GITHUB_TOKEN, which emits no `push` event, so the
      # publish arm has never fired on a release. The result is releases whose
      # `mvmctl kernel build --source download` 404s — the only supported
      # acquisition path for a host that cannot compile kernels. Chain it
      # explicitly rather than relying on an event that demonstrably does not
      # arrive.
      - name: Trigger kernel build + publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # No `-f` inputs: kernel-build.yml declares `workflow_dispatch: {}`,
          # and `--ref <tag>` already gives it the `refs/tags/v*` github.ref its
          # publish steps gate on.
          gh workflow run kernel-build.yml --ref "${TAG_NAME}"

  # Plan 199 B2: post-publish gate. Download the just-created release and assert
  # every binary target has a tarball + matching SHA256 + cosign signature bundle
  # + an entry in the combined checksums manifest, and that the SBOM is signed.
  # Fail-closed — a release missing a checksum/signature or whose bytes don't
  # match their recorded hash fails here, surfacing it instead of shipping silently.
  verify-release:
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets

      - name: Verify release asset set (checksums + signatures + SBOM + version)
        env:
          # Keyless GitHub-OIDC signing identity for this workflow's blobs.
          COSIGN_IDENTITY_REGEXP: "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/.*$"
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bash nix/packaging/release/verify-release-assets.sh \
            --assets-dir release-assets \
            --cosign \
            --expect-version "${TAG_NAME#v}"
