name: Release

on:
  push:
    tags:
      - "v*"
  # Manual dry-run: validate the release build + packaging (binaries, host-bin
  # bundling, Linux cross-build) on the real CI runners WITHOUT publishing.
  # `dry_run=true` (the default) runs only the `build` job and skips the
  # publishing `release` job and `verify-release`. A real
  # release still happens via a `v*` tag push; an explicit `dry_run=false`
  # dispatch publishes too (escape hatch).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + package only; do NOT publish (no GitHub release, no crates.io)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write        # Required for cosign keyless signing via OIDC
  actions: write         # Required to dispatch publish-crates workflow
  attestations: write    # Required to record build provenance for the release binaries

env:
  CARGO_TERM_COLOR: always
  # `embed-host-bins` is what makes a released binary self-sufficient: it
  # cross-compiles the Linux host binaries and embeds them, so a downloaded
  # mvmctl can bootstrap a builder VM with nothing else installed. It is off by
  # default (a dev build does not need the payload and should not pay the
  # cross-compile), which means the *only* place it gets turned on for a shipped
  # artifact is here.
  MVMCTL_RELEASE_FEATURES: host,user,template-registry-s3,release-artifact-bootstrap,release-channel,embed-host-bins

jobs:
  bdd:
    uses: ./.github/workflows/bdd.yml

  # Every documented example, booted on both backends, before anything is
  # published. The hermetic `bdd` lane above drives `--help` and refusal paths
  # and boots no guest, so on its own it cannot see a documented command that
  # parses and then fails at runtime — which is exactly what `machine run -it`
  # did, on every OCI image, while the README told readers to run it.
  #
  # This is a release blocker on purpose. It is the slowest thing here; a tag
  # that cannot wait for it is a tag published without evidence that its own
  # README works.
  e2e-docs:
    uses: ./.github/workflows/e2e-docs.yml
    with:
      # Stated rather than inherited. A tag must not be cut without live macOS
      # evidence, so a macOS host that cannot boot a guest fails this workflow
      # here even though Extended CI tolerates it nightly.
      macos_blocks_on_unusable_host: true

  build:
    strategy:
      # Each target publishes independently — one target's failure must not
      # cancel the others, or a single flaky job strands the whole release.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            build_target: aarch64-apple-darwin
            os: macos-latest
          # x86_64-apple-darwin (Intel mac) is DEFERRED. GitHub's macos-13
          # Intel runners are
          # unavailable to this org (jobs sit queued for hours, never
          # starting), which blocked the whole release. Apple Silicon is the
          # product baseline (macOS 26+); restore this only when the native HVF
          # path supports Intel and an Intel runner is available. install.sh /
          # the Homebrew on_intel arm still point at
          # the (currently absent) asset.
          # Keep the historical `*-unknown-linux-gnu` value in `target`: it is
          # part of the public asset name that already-installed mvmctl
          # versions request. `build_target` is deliberately musl so the
          # payload inside that compatibly named archive runs on older glibc
          # distributions too.
          - target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-musl
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    # Backstop: a cold release build is ~15-25 min. Without a cap a hung
    # build (e.g. the nested-cargo target-lock deadlock fixed in build.rs)
    # runs to the 6h default, burning runner minutes silently.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.build_target }}

      # ADR-065: mvm-cli's build.rs cross-compiles the embedded host-vm
      # binaries (mvm-host-vm-init, mvm-builderd) as static
      # aarch64-unknown-linux-musl via cargo-zigbuild — so zig +
      # cargo-zigbuild must be present at `cargo build`-of-mvmctl time, the
      # same as the ci.yml Lint job. Without this the release binary build
      # fails at "cargo zigbuild failed for mvm-host-vm-init".
      - uses: ./.github/actions/install-zigbuild

      - name: Build release binary
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
          # Use vendored OpenSSL for cross-compilation to avoid linking issues
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        shell: bash
        run: |
          if [[ "${BUILD_TARGET}" == *-unknown-linux-musl ]]; then
            cargo zigbuild --profile release-min --target "${BUILD_TARGET}" --features "${MVMCTL_RELEASE_FEATURES}"
          else
            cargo build --profile release-min --target "${BUILD_TARGET}" --features "${MVMCTL_RELEASE_FEATURES}"
          fi

      # The per-VM host processes mvmctl spawns at runtime (one process per
      # guest). They are SEPARATE bin targets in `mvm-hostd` — the root
      # `cargo build` above only produces `mvmctl` — so they are built here and
      # ship next to `mvmctl` in the tarball, where the backend's
      # adjacent-to-exe resolver finds them on a downloaded install. On a
      # downloaded install that resolver has no `target/` dir to fall back to,
      # so a binary missing here is a spawn failure at run time.
      #
      # This list is the `PerVmScope::Always` half of `PER_VM_HOST_BINARIES` in
      # crates/mvm-cli/src/host_binaries/manifest.rs, and
      # `xtask check-per-vm-host-binaries-sync` fails the build if the two
      # drift. Add a binary there, not here.
      #
      # Apple Silicon macOS additionally gets the native HVF supervisor. The
      # optional libkrun integration is not part of standard release artifacts.
      - name: Build per-VM host binaries
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        shell: bash
        run: |
          if [[ "${BUILD_TARGET}" == *apple-darwin ]]; then
            cargo build --release --target "${BUILD_TARGET}" -p mvm-hostd \
              --bin mvm-hvf-supervisor
          fi
          # Ships on every target — see the note above.
          if [[ "${BUILD_TARGET}" == *-unknown-linux-musl ]]; then
            cargo zigbuild --release --target "${BUILD_TARGET}" -p mvm-hostd \
              --bin mvm-host-agent \
              --bin mvm-signer-helper \
              --bin mvm-network-endpoint \
              --bin mvm-broker \
              --bin mvm-audit-signer
            cargo zigbuild --release --target "${BUILD_TARGET}" -p mvm-gpu \
              --bin mvm-gpu-endpoint
          else
            cargo build --release --target "${BUILD_TARGET}" -p mvm-hostd \
              --bin mvm-host-agent \
              --bin mvm-signer-helper \
              --bin mvm-network-endpoint \
              --bin mvm-broker \
              --bin mvm-audit-signer
            cargo build --release --target "${BUILD_TARGET}" -p mvm-gpu \
              --bin mvm-gpu-endpoint
          fi

      - name: Verify Linux release payloads are statically linked
        if: endsWith(matrix.build_target, '-unknown-linux-musl')
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
        shell: bash
        run: |
          binaries=(
            "target/${BUILD_TARGET}/release-min/mvmctl"
            "target/${BUILD_TARGET}/release/mvm-host-agent"
            "target/${BUILD_TARGET}/release/mvm-signer-helper"
            "target/${BUILD_TARGET}/release/mvm-network-endpoint"
            "target/${BUILD_TARGET}/release/mvm-broker"
            "target/${BUILD_TARGET}/release/mvm-audit-signer"
          )
          for binary in "${binaries[@]}"; do
            description="$(file --brief "${binary}")"
            echo "${binary}: ${description}"
            if [[ "${description}" != *"statically linked"* ]]; then
              echo "::error::${binary} is not statically linked; publishing it would restore a host glibc dependency" >&2
              exit 1
            fi
          done

      - name: Smoke test binary (native targets only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
        shell: bash
        run: |
          BIN="target/${BUILD_TARGET}/release-min/mvmctl"
          "$BIN" --version
          "$BIN" --help > /dev/null
          "$BIN" ops metrics --json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # metrics JSON is sectioned: counters live under 'global'.
          assert 'requests_total' in d.get('global', {}), 'metrics JSON missing global.requests_total'
          print('smoke test passed')
          "

      - name: Binary size within budget (measured targets only)
        # Per-target byte budget for the release `mvmctl`. Only targets with a
        # measured baseline are gated; add a branch here once a new target is
        # measured. aarch64-apple-darwin measured 19,206,160 bytes with the
        # `release-min` profile at v0.18.0 (2026-08-20). Budget 25,165,824
        # (24 MiB) for headroom while keeping the size ratchet tight.
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
        shell: bash
        run: |
          cargo run --package xtask -- check-binary-size \
            --path "target/${BUILD_TARGET}/release-min/mvmctl" \
            --budget-bytes 25165824

      - name: Generate man pages
        shell: bash
        # gen-man lives behind xtask's off-by-default `man` feature (it pulls
        # mvm-cli + its heavy build.rs); release is the only caller.
        run: cargo run --package xtask --features man -- gen-man --output-dir man/

      - name: Package binary and generate checksums
        env:
          TARGET: ${{ matrix.target }}
          BUILD_TARGET: ${{ matrix.build_target }}
        shell: bash
        run: |
          BIN_NAME="mvmctl"
          ARCHIVE_NAME="mvmctl-${TARGET}"

          mkdir -p "staging/${ARCHIVE_NAME}"
          cp "target/${BUILD_TARGET}/release-min/${BIN_NAME}" "staging/${ARCHIVE_NAME}/"
          # Per-VM host processes (built in the prior step), shipped next to
          # mvmctl so the backend's adjacent-to-exe resolver finds them on a
          # downloaded install. Kept in step with PER_VM_HOST_BINARIES by
          # `xtask check-per-vm-host-binaries-sync`.
          #
          # Fail closed rather than copy-if-exists: a binary that failed to
          # build would otherwise be silently dropped from the tarball and
          # surface much later as a spawn failure on a user's machine.
          REQUIRED_HOSTBINS="mvm-host-agent mvm-signer-helper mvm-network-endpoint mvm-broker mvm-audit-signer mvm-gpu-endpoint"
          if [[ "${TARGET}" == *apple-darwin ]]; then
            REQUIRED_HOSTBINS="${REQUIRED_HOSTBINS} mvm-hvf-supervisor"
          fi
          for hostbin in ${REQUIRED_HOSTBINS}; do
            src="target/${BUILD_TARGET}/release/${hostbin}"
            if [ ! -f "$src" ]; then
              echo "::error::${hostbin} was not built for ${TARGET}; mvmctl spawns it at run time and the adjacent-to-exe resolver has no fallback on a downloaded install" >&2
              exit 1
            fi
            cp "$src" "staging/${ARCHIVE_NAME}/"
            echo "bundled ${hostbin}"
          done
          cp -r assets "staging/${ARCHIVE_NAME}/" 2>/dev/null || true
          cp README.md "staging/${ARCHIVE_NAME}/" 2>/dev/null || true
          # Include generated man pages
          if [ -d man ] && ls man/*.1 2>/dev/null; then
            cp -r man "staging/${ARCHIVE_NAME}/"
          fi

          cd staging
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          # Generate SHA256 checksum for the tarball
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvmctl-${{ matrix.target }}
          path: |
            staging/*.tar.gz
            staging/*.sha256

  release:
    needs: [bdd, e2e-docs, build]
    # `e2e-docs` was added to `needs` above when the documented-surface gate
    # landed, and its result was never added here. `!cancelled()` overrides the
    # implicit all-needs-succeeded rule, so for as long as that was true the
    # release published whether or not a single documented example booted —
    # the gate existed, was listed, was asserted by a test that only read the
    # `needs` list, and enforced nothing. Every entry in `needs` must appear in
    # this condition; a job listed and not checked is worse than one that was
    # never added, because it reads as covered.
    #
    # Dry-run guard: a `workflow_dispatch` with dry_run=true builds + packages
    # (the `build` job) but never reaches this publish job — only a tag push or
    # an explicit dry_run=false dispatch publishes.
    if: ${{ !cancelled() && needs.bdd.result == 'success' && needs.e2e-docs.result == 'success' && needs.build.result == 'success' }}
    # This job mints the one keyless identity every installed mvmctl trusts:
    # `release.yml@refs/tags/v{version}`, the sole entry in
    # RELEASE_IDENTITY_TEMPLATES. The environment's policy admits `v*` tags and
    # nothing else, so a branch push or a workflow_dispatch from an arbitrary
    # ref cannot produce a signature the shipped verifier accepts. Revocations
    # are gated the same way against their own tag.
    environment: release-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx --format json --all --override-filename sbom.cdx

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksum file
        shell: bash
        run: |
          cd artifacts
          # Combine per-platform checksums into one file
          # ./ prefix: a file named like an option must stay a filename.
          cat ./*.sha256 > checksums-sha256.txt
          echo "Combined checksums:"
          cat checksums-sha256.txt

      - name: Sign release tarballs, checksum manifests, and SBOM
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # One bundle format for every signed blob in this release:
          # --new-bundle-format, the Sigstore bundle carrying
          # verificationMaterial. Both consumers read it — the in-binary Rust
          # sigstore stack (mvm_build::release_signature -> image_verify) parses
          # ONLY this shape, and `cosign verify-blob --bundle` documents it as
          # the preferred input, so install.sh / `mvmctl update` /
          # verify-release-assets.sh keep working unchanged.
          #
          # Requires cosign >= v2.4 on any host that verifies by hand; that is
          # the floor this project targets and there is no legacy fallback.
          #
          # The combined checksum manifest is in this list because it is what
          # the installer and `mvmctl update` anchor on: they hash the archive
          # and compare it against the manifest, so an unsigned manifest lets
          # whoever can swap an archive swap its recorded hash too and the
          # comparison still passes. It is a literal because the preceding step
          # always writes it and this job hard-gates on the binary build.
          #
          # Boot images are not in this release: they are members of the
          # signed image set `images.lock` pins, verified against that root's
          # own signature, so nothing here re-signs them.
          for blob in \
            artifacts/*.tar.gz \
            artifacts/checksums-sha256.txt \
            sbom.cdx.json; do
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${blob}.bundle" \
              "${blob}"
            echo "Signed: ${blob}"
          done

      # Build provenance for the binary tarballs, recorded in the GitHub
      # attestation store and verifiable with `gh attestation verify`.
      #
      # This is SLSA Build L2, not L3. The attestation is produced by the same
      # workflow that produces the artifact, so a compromised release job forges
      # both. What it adds over the cosign signature is the commit and the build
      # inputs in a machine-readable predicate a downstream policy engine can
      # consume; it is not evidence that the build itself was uncorrupted. The
      # reproducibility double-build is the control that speaks to that, because
      # an independent rebuild landing on the same bytes needs no trust in this
      # builder at all.
      #
      # Subjects are the tarballs, matching the direct-signature set.
      - name: Attest build provenance for the release tarballs (release-provenance)
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          # A tag push is the only real publish. Everything else — a manual
          # dispatch, dry_run either way — is a rehearsal, and rehearses against
          # a draft.
          DRY_RUN: ${{ github.event_name != 'push' }}
        run: |
          set -euo pipefail
          # nullglob: the signature bundles exist only on a tag push, so a dry
          # run's `*.bundle` globs match nothing and must drop out of the list
          # rather than reach `gh release create` literally. The binary
          # tarballs, the combined checksums, and the SBOM are always present
          # (the job gates on the binary build).
          shopt -s nullglob
          assets=(
            artifacts/*.tar.gz
            artifacts/*.tar.gz.bundle
            artifacts/checksums-sha256.txt
            artifacts/checksums-sha256.txt.bundle
            sbom.cdx.json
            sbom.cdx.json.bundle
          )
          # A file named twice is rejected by GitHub with `ReleaseAsset.name
          # already exists` — a 422 that arrives *after* `gh release create` has
          # already created the release, so the run goes red having published a
          # partially populated release. Deduplicate so an entry added later
          # that overlaps a catch-all cannot do that. Sorting is incidental —
          # upload order does not matter.
          mapfile -t assets < <(printf '%s\n' "${assets[@]}" | sort -u)

          RELEASE_NOTES_PREFIX="$(cat nix/packaging/release/runtime-overlay-operational-note.md)"
          # Every tag publishes as a prerelease. `mvmctl update` follows
          # `/repos/<repo>/releases/latest` and install.sh the newest
          # non-prerelease, so whatever is published as a full release reaches
          # every user who did not ask for anything newer. A release candidate
          # (`v0.18.0-rc.1`) stays a prerelease. A stable tag is only staged as
          # one: `promote-release` makes it a full release once a fresh install
          # of it has booted a microVM on each backend, and not before.
          prerelease=(--prerelease)
          if [[ "${TAG_NAME#v}" == *-* ]]; then
            echo "::notice::${TAG_NAME} carries a prerelease segment — publishing it as a prerelease, not as latest"
          else
            echo "::notice::${TAG_NAME} is staged as a prerelease until its first-run smoke passes"
          fi
          # A dry run publishes to a throwaway draft under a scratch tag and
          # deletes it in the next step. This is the same `gh release create`
          # with the same asset list, deliberately: the defects worth catching
          # here are properties of that list and of GitHub's reaction to it — a
          # duplicate asset name is a 422 from the upload endpoint, not
          # something a local check can produce. A separate mock publish would
          # be free to drift from this one, and the drift is exactly the class
          # of bug it would be built to find.
          #
          # A draft is not listed as a release and is not resolved by
          # `/releases/latest`, so it is invisible to `mvmctl update` for the
          # seconds it exists.
          publish_tag="${TAG_NAME}"
          draft=()
          if [ "${DRY_RUN}" = "true" ]; then
            publish_tag="dry-run-${GITHUB_RUN_ID}"
            draft=(--draft)
            prerelease=()
            echo "::notice::dry run — publishing ${publish_tag} as a draft, then deleting it"
          fi
          gh release create "${publish_tag}" \
            --title "${publish_tag}" \
            "${draft[@]}" \
            "${prerelease[@]}" \
            --generate-notes \
            --notes "${RELEASE_NOTES_PREFIX}" \
            "${assets[@]}"

      # Always, even if the publish failed: `gh release create` can create the
      # release and then fail uploading an asset, which is how the duplicate
      # name surfaced. Leaving that draft behind would accumulate one per dry
      # run and leave the next one reasoning about a tag it did not create.
      - name: Delete the dry-run draft release
        if: ${{ always() && github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="dry-run-${GITHUB_RUN_ID}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
            echo "deleted dry-run draft ${tag}"
          else
            echo "no dry-run draft ${tag} to delete"
          fi

      # The "release: published" event fired by `gh release create` runs under
      # GITHUB_TOKEN, which by design does not trigger downstream workflows.
      # workflow_dispatch is exempt from that rule, so chain publish-crates
      # explicitly here. This keeps crates.io in sync with GitHub releases.
      - name: Trigger crates.io publish workflow
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh workflow run publish-crates.yml \
            --ref "${TAG_NAME}" \
            -f tag="${TAG_NAME}" \
            -f dry_run=false

  # Plan 199 B2: post-publish gate. Download the just-created release and assert
  # every binary target has a tarball + matching SHA256 + cosign signature bundle
  # + an entry in the combined checksums manifest, and that the SBOM is signed.
  # Fail-closed — a release missing a checksum/signature or whose bytes don't
  # match their recorded hash fails here, surfacing it instead of shipping silently.
  verify-release:
    needs: [release]
    # Tag pushes only. A dry run publishes a draft and deletes it, so there is
    # no release left to download, and the signatures this asserts are minted
    # under a `refs/tags/*` identity a dispatch cannot produce. Running it there
    # would fail for reasons that say nothing about the release.
    if: ${{ github.event_name == 'push' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets

      - name: Verify release asset set (checksums + signatures + SBOM + version)
        env:
          # Keyless GitHub-OIDC signing identity for this workflow's blobs.
          COSIGN_IDENTITY_REGEXP: "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/.*$"
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bash nix/packaging/release/verify-release-assets.sh \
            --assets-dir release-assets \
            --cosign \
            --expect-version "${TAG_NAME#v}"

  # What a new user gets from the release just published: its own install.sh,
  # pinned to the tag, installing into a throwaway HOME — builder bootstrap
  # included — and then the README's first command, `machine run --image
  # alpine`, with stdin closed and a time budget. `verify-release` proves the
  # asset set is complete and signed; nothing before this proves a user can
  # run it. v0.17.0 is a published, signed release that cannot start a
  # microVM on a fresh host.
  #
  # After publication rather than before, because the first run installs
  # the published release, and `verify-release` is what proves its asset set
  # complete and signed. The release is still a
  # prerelease at this point, so no user reaches it by default until
  # `promote-release`.
  #
  # Both backends a new user boots: HVF on the self-hosted Apple Silicon
  # runner `e2e-docs` uses (no hosted macOS runner can boot a guest), and
  # Firecracker on a hosted Linux runner with KVM. The lanes live in
  # first-run-smoke.yml so they can be dispatched against a release candidate
  # before a tag depends on them.
  first-run-smoke:
    needs: [verify-release]
    if: ${{ github.event_name == 'push' && needs.verify-release.result == 'success' }}
    uses: ./.github/workflows/first-run-smoke.yml
    with:
      tag: ${{ github.ref_name }}

  # The only step that makes a release reach users who did not ask for it:
  # GitHub's latest marker (`mvmctl update`), install.sh's default (the newest
  # full release), and the installer runmvm.com serves, whose baked fallback
  # names this tag. A release candidate passes the smoke and stays a
  # prerelease. A red smoke leaves the tag staged; fix forward with a new tag.
  promote-release:
    name: Promote the release once a fresh install boots
    needs: [first-run-smoke]
    if: ${{ github.event_name == 'push' && needs.first-run-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The release event emitted by GITHUB_TOKEN does not start workers.yml,
      # so the site is dispatched explicitly, after the release is promoted.
      - name: Mark a stable tag as the latest release and publish its installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${TAG_NAME#v}" == *-* ]]; then
            echo "::notice::${TAG_NAME} is a release candidate — it stays a prerelease and the installer default is unchanged"
            exit 0
          fi
          gh release edit "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --prerelease=false --latest
          gh workflow run workers.yml --repo "${GITHUB_REPOSITORY}" \
            --ref "${TAG_NAME}" \
            -f install_version="${TAG_NAME}"

  propose-prebuilt-pin:
    name: Propose verified Nix prebuilt pin
    needs: [promote-release]
    if: ${{ github.event_name == 'push' && needs.promote-release.result == 'success' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PIN_WORKTREE: ${{ github.workspace }}/../.worktrees/mvm-prebuilt-pin
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: sigstore/cosign-installer@v3

      - name: Create the pin worktree
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PIN_WORKTREE")"
          git worktree add -B "chore/prebuilt-pin-${TAG_NAME}" "$PIN_WORKTREE" main

      - name: Pin the promoted release from its signed checksum manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: sh scripts/pin-installer-default.sh "${TAG_NAME}" "$PIN_WORKTREE/install.sh" "$PIN_WORKTREE/nix/prebuilt-release.nix"

      - name: Propose the pin update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git -C "$PIN_WORKTREE" diff --quiet -- install.sh nix/prebuilt-release.nix; then
            echo "The installer and Nix package already pin ${TAG_NAME}"
            exit 0
          fi
          branch="chore/prebuilt-pin-${TAG_NAME}"
          git -C "$PIN_WORKTREE" config user.name "github-actions[bot]"
          git -C "$PIN_WORKTREE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PIN_WORKTREE" add install.sh nix/prebuilt-release.nix
          git -C "$PIN_WORKTREE" commit -m "chore: propose ${TAG_NAME} prebuilt archive pins"
          git -C "$PIN_WORKTREE" push --force-with-lease origin "$branch"
          body="Pins the installer and Nix prebuilt package to ${TAG_NAME}. The archive hashes came from the checksum manifest signed by this repository's release workflow for that exact tag, after the release passed its first-run smoke and was promoted. Dispatch CI for this branch before merge; a PR opened with the workflow token does not start pull-request workflows."
          existing="$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "chore: propose ${TAG_NAME} prebuilt archive pins" --body "$body"
          fi
