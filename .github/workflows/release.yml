name: Release

on:
  push:
    tags:
      - "v*"
  # Manual dry-run: validate the release build + packaging (binaries, host-bin
  # bundling, Linux cross-build) on the real CI runners WITHOUT publishing.
  # `dry_run=true` (the default) runs only the `build` job and skips the Nix
  # image jobs, the publishing `release` job, and `verify-release`. A real
  # release still happens via a `v*` tag push; an explicit `dry_run=false`
  # dispatch publishes too (escape hatch).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + package only; do NOT publish (no GitHub release, no crates.io)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write   # Required for cosign keyless signing via OIDC
  actions: write    # Required to dispatch publish-crates workflow

env:
  CARGO_TERM_COLOR: always
  MVMCTL_RELEASE_FEATURES: host,user,template-registry-s3,release-artifact-bootstrap

jobs:
  bdd:
    uses: ./.github/workflows/bdd.yml

  build:
    strategy:
      # Each target publishes independently — one target's failure must not
      # cancel the others, or a single flaky job strands the whole release.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # x86_64-apple-darwin (Intel mac) is DEFERRED. The macOS mvmctl
          # links libkrun (Plan 87 W5), so an x86_64 binary must build on a
          # native Intel runner — but GitHub's macos-13 Intel runners are
          # unavailable to this org (jobs sit queued for hours, never
          # starting), which blocked the whole release. Apple Silicon is the
          # product baseline (macOS 26+); restore this when an Intel runner
          # is available (hosted capacity or self-hosted) or via a libkrun
          # cross-link. install.sh / the Homebrew on_intel arm still point at
          # the (currently absent) asset.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    # Backstop: a cold release build is ~15-25 min. Without a cap a hung
    # build (e.g. the nested-cargo target-lock deadlock fixed in build.rs)
    # runs to the 6h default, burning runner minutes silently.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      # ADR-065: mvm-cli's build.rs cross-compiles the embedded host-vm
      # binaries (mvm-host-vm-init, mvm-egress-proxy) as static
      # aarch64-unknown-linux-musl via cargo-zigbuild — so zig +
      # cargo-zigbuild must be present at `cargo build`-of-mvmctl time, the
      # same as the ci.yml Lint job. Without this the release binary build
      # fails at "cargo zigbuild failed for mvm-host-vm-init".
      - uses: ./.github/actions/install-zigbuild

      # macOS mvmctl links libkrun directly (Plan 87 W5): build.rs runs
      # bindgen against libkrun.h and emits `-lkrun`, and the runtime
      # kernel-extraction path needs libkrunfw. Both ship via the slp/krun
      # Homebrew tap. Without them the build panics in libkrun-sys/build.rs
      # ("libkrun.h was not found"). Linux uses Firecracker — no libkrun.
      #
      # `brew trust` is required since Homebrew began refusing to auto-load
      # formulae from third-party ("untrusted") taps: installing
      # `slp/krun/libkrun` pulls a transitive formula (`virglrenderer`) from the
      # same tap, and without trust the install fails with "Refusing to load
      # formula ... from untrusted tap slp/krun". Tap + trust before installing.
      - name: Install libkrun (macOS backend FFI)
        if: runner.os == 'macOS'
        run: |
          brew tap slp/krun
          brew trust slp/krun
          brew install slp/krun/libkrun slp/krun/libkrunfw

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set linker for aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          # Use vendored OpenSSL for cross-compilation to avoid linking issues
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        run: cargo build --release --target "${TARGET}" --features "${MVMCTL_RELEASE_FEATURES}"

      # The per-VM host processes mvmctl spawns at runtime (one process per
      # guest). They are SEPARATE bin targets in `mvm-hostd` — the root
      # `cargo build` above only produces `mvmctl` — so they are built here and
      # ship next to `mvmctl` in the tarball, where the backend's
      # adjacent-to-exe resolver finds them on a downloaded install.
      #   - mvm-network-endpoint: the per-VM egress gate. Every VM spawns
      #     one, on both the FC (Linux) and HVF (macOS) paths, so it ships on
      #     every target.
      #   - mvm-hvf-supervisor (macOS only): the raw-HVF VMM supervisor.
      #   - mvm-libkrun-supervisor (macOS only, and INTENTIONALLY so — not a
      #     follow-up): it has `required-features = ["libkrun-sys"]`, and the
      #     released Linux mvmctl deliberately does NOT link libkrun — the
      #     `libkrun-sys` feature is a macOS-only target dep (see the rationale
      #     at the top-level Cargo.toml, `[target.'cfg(target_os="macos")']`:
      #     "Linux CI/runtimes use Firecracker … no libkrun-dev package exists").
      #     So on Linux the supervisor can't be built here (no libkrun to link)
      #     and isn't needed at runtime: workloads use Firecracker and the
      #     builder VM uses libkrun-if-genuinely-available-else-QEMU (ADR-093),
      #     with libkrun's FFI stubbed out in a no-feature build so it never
      #     spawns this supervisor.
      - name: Build per-VM host binaries
        env:
          TARGET: ${{ matrix.target }}
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
        shell: bash
        run: |
          if [[ "${TARGET}" == *apple-darwin ]]; then
            cargo build --release --target "${TARGET}" -p mvm-hostd \
              --bin mvm-hvf-supervisor \
              --bin mvm-libkrun-supervisor --features libkrun-sys
          fi
          # Ships on every target — see the note above.
          cargo build --release --target "${TARGET}" -p mvm-hostd \
            --bin mvm-network-endpoint

      - name: Smoke test binary (native targets only)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          BIN="target/${TARGET}/release/mvmctl"
          "$BIN" --version
          "$BIN" --help > /dev/null
          "$BIN" ops metrics --json | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          # metrics JSON is sectioned: counters live under 'global'.
          assert 'requests_total' in d.get('global', {}), 'metrics JSON missing global.requests_total'
          print('smoke test passed')
          "

      - name: Binary size within budget (measured targets only)
        # Per-target byte budget for the release `mvmctl`. Only targets with a
        # measured baseline are gated; add a branch here once a new target is
        # measured. aarch64-apple-darwin measured 30,007,616 bytes at v0.17.0
        # (2026-07-08) — the 0.16→0.17 feature arc (guest RAM, healthcheck,
        # signing, docs) grew it past the old 28 MiB budget. Budget 33,554,432
        # (32 MiB) for headroom.
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cargo run --package xtask -- check-binary-size \
            --path "target/${TARGET}/release/mvmctl" \
            --budget-bytes 33554432

      - name: Generate man pages
        shell: bash
        # gen-man lives behind xtask's off-by-default `man` feature (it pulls
        # mvm-cli + its heavy build.rs); release is the only caller.
        run: cargo run --package xtask --features man -- gen-man --output-dir man/

      - name: Package binary and generate checksums
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          BIN_NAME="mvmctl"
          ARCHIVE_NAME="mvmctl-${TARGET}"

          mkdir -p "staging/${ARCHIVE_NAME}"
          cp "target/${TARGET}/release/${BIN_NAME}" "staging/${ARCHIVE_NAME}/"
          # Per-VM host processes (built in the prior step), shipped next to
          # mvmctl so the backend's adjacent-to-exe resolver finds them on a
          # downloaded install. copy-if-exists: the set differs by OS (macOS also
          # gets the hvf/libkrun supervisors), but the substitution endpoint
          # ships on every target.
          for hostbin in mvm-hvf-supervisor mvm-libkrun-supervisor mvm-network-endpoint; do
            src="target/${TARGET}/release/${hostbin}"
            [ -f "$src" ] && cp "$src" "staging/${ARCHIVE_NAME}/" && echo "bundled ${hostbin}"
          done
          cp -r assets "staging/${ARCHIVE_NAME}/" 2>/dev/null || true
          cp README.md "staging/${ARCHIVE_NAME}/" 2>/dev/null || true
          # Include generated man pages
          if [ -d man ] && ls man/*.1 2>/dev/null; then
            cp -r man "staging/${ARCHIVE_NAME}/"
          fi

          cd staging
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          # Generate SHA256 checksum for the tarball
          shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvmctl-${{ matrix.target }}
          path: |
            staging/*.tar.gz
            staging/*.sha256

  # Plan 72 W5 / ADR-046: the Layer-1 builder VM image that
  # `LibkrunBuilderVm::run_build` boots into to run `nix build` on
  # behalf of mvmctl. Plan 72 W2 ships the flake at
  # `nix/images/builder-vm/`; this job publishes the per-arch
  # artifacts so installed-binary users (no source checkout) can
  # download them via `download_builder_vm_image`.
  #
  # This is the development-time builder VM that runs `nix build`
  # against the user's dev-shell flake. (Plan 115 / ADR-064 folded the
  # old separate dev-shell + sealed-builder images — `nix/images/builder`
  # — into this one; the sealed runtime builder for mvmd's pool-build
  # pipeline, if still needed, is sourced from mvmd, not built here.)
  builder-vm-image:
    # Skipped on a dry-run dispatch — Nix image builds are slow and unchanged by
    # the binary-packaging path a dry-run validates. Runs on tag push / dry_run=false.
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    # This job mints a keyless (OIDC/Fulcio) signature over the attested
    # builder pack manifest, and the resulting certificate's SAN is derived
    # from the workflow ref that ran it. Gating the job on a protected
    # environment means the ref that can produce a valid signing identity is
    # constrained by the environment's deployment branch/tag rule (restricted
    # to version tags in repo settings), with an optional required-reviewer
    # gate on top of the tag-push trigger already enforced above — so the
    # identity a released binary trusts can't be minted from an arbitrary
    # branch or workflow_dispatch run.
    environment: release-signing
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build builder VM image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/builder-vm#packages.${SYSTEM}.default" \
            --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          mkdir -p staging
          cp "$STORE_PATH/vmlinux"       "staging/builder-vm-vmlinux-${ARCH}"
          cp "$STORE_PATH/rootfs.ext4"   "staging/builder-vm-rootfs-${ARCH}.ext4"
          # Optional sidecars the flake emits. `cp -L` so symlinks
          # resolve; ignore-missing so older flake snapshots that
          # predate these outputs still produce a valid release.
          if [ -f "$STORE_PATH/cmdline.txt" ]; then
            cp -L "$STORE_PATH/cmdline.txt" "staging/builder-vm-${ARCH}.cmdline.txt"
          fi
          if [ -f "$STORE_PATH/manifest.json" ]; then
            cp -L "$STORE_PATH/manifest.json" "staging/builder-vm-${ARCH}.manifest.json"
          fi

      - name: Generate builder image SBOM
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Real store-path bill of materials for the builder image closure —
          # not a stub. The attested pack manifest's SBOM reference hashes
          # this file's bytes.
          nix-store --query --requisites "$STORE_PATH" > "staging/builder-vm-${ARCH}.sbom.txt"

      - name: Produce and keyless-sign attested builder pack manifest
        # The pack is an accelerator, never a hard dependency. A Fulcio/Rekor/OIDC
        # hiccup must not block the plain vmlinux/rootfs publish below, so a
        # signing failure here is tolerated: the job continues, no pack ships, and
        # installed binaries fall back to the plain checksum download.
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # On a tag push, REF is refs/tags/vX.Y.Z — exactly the SAN cosign
          # embeds in the certificate and exactly what a released mvmctl
          # (version X.Y.Z) reconstructs when verifying the pack. Skip pack
          # production unless the ref is a version tag whose version equals the
          # crate version; anything else yields an identity no installed binary
          # can reconstruct, so it would silently fail-open to the plain download.
          # Skipping keeps that outcome explicit and still ships the plain image.
          if [[ "${REF}" != refs/tags/v* ]]; then
            echo "::notice::${REF} is not a version tag; skipping attested builder pack."
            exit 0
          fi
          TAG_VERSION="${REF#refs/tags/v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="mvm-cli") | .version')"
          if [[ "${TAG_VERSION}" != "${CRATE_VERSION}" ]]; then
            echo "::warning::tag ${REF} does not match crate version v${CRATE_VERSION}; installed binaries could not verify this pack — skipping attested builder pack."
            exit 0
          fi
          IDENTITY="https://github.com/${REPOSITORY}/.github/workflows/release.yml@${REF}"
          REVOCATION_CHANNEL="https://github.com/${REPOSITORY}/releases/download/revocations/builder-vm-revocations.json"
          # The published location of the SBOM this release ships, so the
          # manifest's SBOM reference points at a real download instead of a
          # path that only exists on the runner that built it.
          SBOM_URI="https://github.com/${REPOSITORY}/releases/download/${REF#refs/tags/}/builder-vm-${ARCH}.sbom.txt"
          cargo run --release -p mvm-build --example mvm-builder-pack-tool -- \
            --vmlinux "$STORE_PATH/vmlinux" --rootfs "$STORE_PATH/rootfs.ext4" \
            --arch "$ARCH" --channel stable --keyless \
            --identity "$IDENTITY" \
            --out-dir staging \
            --sbom "staging/builder-vm-${ARCH}.sbom.txt" \
            --sbom-uri "$SBOM_URI" \
            --revocation-channel "$REVOCATION_CHANNEL"
          mv staging/manifest.json "staging/builder-vm-${ARCH}.pack-manifest.json"

          # Keyless OIDC sign — no secret key needed. --new-bundle-format emits
          # the Sigstore bundle (with verificationMaterial) that the installed
          # binary's Rust verifier parses; the legacy --bundle format is not
          # accepted by that stack. The bundle carries the signature, the
          # short-lived cert, and the transparency-log inclusion proof.
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle "staging/builder-vm-${ARCH}.pack-manifest.json.bundle" \
            "staging/builder-vm-${ARCH}.pack-manifest.json"

      - name: Generate builder VM checksums
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd staging
          # Build the checksums list dynamically — sidecars are
          # optional, so only include what's actually present.
          # An array, not a space-joined string: the string form relies on word
          # splitting to become arguments, so a name containing a space would
          # split into two paths that do not exist.
          FILES=("builder-vm-vmlinux-${ARCH}" "builder-vm-rootfs-${ARCH}.ext4")
          [ -f "builder-vm-${ARCH}.cmdline.txt" ]   && FILES+=("builder-vm-${ARCH}.cmdline.txt")
          [ -f "builder-vm-${ARCH}.manifest.json" ] && FILES+=("builder-vm-${ARCH}.manifest.json")
          # The attested pack is optional (signing may be skipped or fail); only
          # checksum its files when they are actually present.
          if [ -f "builder-vm-${ARCH}.pack-manifest.json.bundle" ]; then
            FILES+=("builder-vm-${ARCH}.pack-manifest.json" "builder-vm-${ARCH}.pack-manifest.json.bundle" "builder-vm-${ARCH}.sbom.txt")
          fi
          sha256sum "${FILES[@]}" > "builder-vm-${ARCH}-checksums-sha256.txt"

      - name: Upload builder VM image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: builder-vm-image-${{ matrix.arch }}
          path: |
            staging/builder-vm-vmlinux-${{ matrix.arch }}
            staging/builder-vm-rootfs-${{ matrix.arch }}.ext4
            staging/builder-vm-${{ matrix.arch }}.cmdline.txt
            staging/builder-vm-${{ matrix.arch }}.manifest.json
            staging/builder-vm-${{ matrix.arch }}.pack-manifest.json
            staging/builder-vm-${{ matrix.arch }}.pack-manifest.json.bundle
            staging/builder-vm-${{ matrix.arch }}.sbom.txt
            staging/builder-vm-${{ matrix.arch }}-checksums-sha256.txt

  # Plan 74 W1.4b / ADR-018: the verity-sealed mvm runtime overlay
  # disk. Attached as `/dev/vdc` at every microVM boot;
  # `mvm-verity-init` mounts it at `/mvm/runtime` so the guest agent,
  # seccomp shim, and per-language SDK runtime libraries live in a
  # single mvm-controlled blob instead of being baked into every
  # per-image rootfs. Built per-arch from `nix/images/runtime-overlay/`.
  #
  # The host-side `RuntimeOverlayResolver`
  # (`crates/mvm-build/src/runtime_overlay.rs`) downloads one
  # arch-qualified tarball plus a tarball sha256 sidecar, then
  # installs the extracted canonical names (`overlay.ext4`,
  # `overlay.verity`, `overlay.roothash`, `VERSION`,
  # `checksums-sha256.txt`) into
  # `~/.mvm/cache/runtime-overlay/<mvmctl-version>/<arch>/`.
  runtime-overlay-image:
    # Skipped on a dry-run dispatch (see builder-vm-image).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build runtime overlay image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/runtime-overlay#packages.${SYSTEM}.default" \
            --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          mkdir -p "staging/runtime-overlay-${ARCH}"
          # cp -L so `overlay.*` resolve through nix-store symlinks
          # into the actual blobs; the artifact uploader doesn't
          # follow symlinks.
          cp -L "$STORE_PATH/overlay.ext4"     "staging/runtime-overlay-${ARCH}/overlay.ext4"
          cp -L "$STORE_PATH/overlay.verity"   "staging/runtime-overlay-${ARCH}/overlay.verity"
          cp -L "$STORE_PATH/overlay.roothash" "staging/runtime-overlay-${ARCH}/overlay.roothash"
          cp -L "$STORE_PATH/VERSION"          "staging/runtime-overlay-${ARCH}/VERSION"
          (
            cd "staging/runtime-overlay-${ARCH}"
            sha256sum overlay.ext4 overlay.verity overlay.roothash VERSION \
              > checksums-sha256.txt
          )
          tar -C "staging/runtime-overlay-${ARCH}" \
            -czf "staging/runtime-overlay-${ARCH}.tar.gz" \
            overlay.ext4 overlay.verity overlay.roothash VERSION checksums-sha256.txt
          (
            cd staging
            sha256sum "runtime-overlay-${ARCH}.tar.gz" \
              > "runtime-overlay-${ARCH}.tar.gz.sha256"
          )

      - name: Upload runtime overlay image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: runtime-overlay-image-${{ matrix.arch }}
          path: |
            staging/runtime-overlay-${{ matrix.arch }}.tar.gz
            staging/runtime-overlay-${{ matrix.arch }}.tar.gz.sha256

  # ADR-018: the optional glibc SDK-sidecar disk. Mounted read-only at
  # /mvm/sdk, and only for workloads whose signed plan binds an SDK-served
  # host service — so a workload that never calls one never pays for the glibc
  # closure. Built per-arch from the same `nix/images/runtime-overlay/` flake
  # as the overlay.
  #
  # The host-side downloader (`mvm_build::sdk_sidecar::download_sdk_sidecar`)
  # fetches one arch-qualified tarball plus its sha256 sidecar, and installs the
  # extracted canonical names (`sdk.ext4`, `VERSION`, `checksums-sha256.txt`)
  # into `~/.mvm/cache/sdk-sidecar/<mvmctl-version>/<arch>/`. The asset names
  # here are pinned against that Rust constructor by `tests/release_assets.rs`.
  #
  # Unlike the overlay job this does NOT regenerate the manifest: the
  # `sdk-sidecar-image` derivation writes its own `checksums-sha256.txt`, so
  # copying it through keeps the bytes the resolver verifies byte-identical to
  # the bytes Nix produced.
  sdk-sidecar-image:
    # Skipped on a dry-run dispatch (see builder-vm-image).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build SDK sidecar image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/runtime-overlay#packages.${SYSTEM}.sdk-sidecar-image" \
            --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          mkdir -p "staging/sdk-sidecar-${ARCH}"
          # cp -L so the payload resolves through nix-store symlinks into the
          # actual blobs; the artifact uploader doesn't follow symlinks.
          cp -L "$STORE_PATH/sdk.ext4"             "staging/sdk-sidecar-${ARCH}/sdk.ext4"
          cp -L "$STORE_PATH/VERSION"              "staging/sdk-sidecar-${ARCH}/VERSION"
          cp -L "$STORE_PATH/checksums-sha256.txt" "staging/sdk-sidecar-${ARCH}/checksums-sha256.txt"
          tar -C "staging/sdk-sidecar-${ARCH}" \
            -czf "staging/sdk-sidecar-${ARCH}.tar.gz" \
            sdk.ext4 VERSION checksums-sha256.txt
          (
            cd staging
            sha256sum "sdk-sidecar-${ARCH}.tar.gz" \
              > "sdk-sidecar-${ARCH}.tar.gz.sha256"
          )

      - name: Upload SDK sidecar image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sdk-sidecar-image-${{ matrix.arch }}
          path: |
            staging/sdk-sidecar-${{ matrix.arch }}.tar.gz
            staging/sdk-sidecar-${{ matrix.arch }}.tar.gz.sha256

  # Plan 158: the bundled default microVM image `mvmctl up`/`exec` boots when
  # no --flake/--template/--image is given. Ships the PROD variant only
  # (sealed + verity-sealed rootfs); the dev variant is built locally in dev
  # mode, never published. `download_default_microvm_image` fetches these five
  # assets + the checksums.
  default-microvm:
    # Skipped on a dry-run dispatch (see builder-vm-image).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    # This job mints a keyless (OIDC/Fulcio) signature over the attested
    # runtime pack manifest under the same release.yml@<tag> identity class as
    # builder-vm-image — gating it behind the same protected environment
    # constrains which ref can mint a valid signing identity.
    environment: release-signing
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build default microVM image (prod variant)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/default-tenant#packages.${SYSTEM}.default" \
            --impure --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          mkdir -p staging
          cp -L "$STORE_PATH/vmlinux"         "staging/default-microvm-vmlinux-${ARCH}"
          cp -L "$STORE_PATH/rootfs.ext4"     "staging/default-microvm-rootfs-${ARCH}.ext4"
          cp -L "$STORE_PATH/rootfs.verity"   "staging/default-microvm-rootfs-${ARCH}.verity"
          cp -L "$STORE_PATH/rootfs.roothash" "staging/default-microvm-rootfs-${ARCH}.roothash"
          cp -L "$STORE_PATH/mvm-meta.json"   "staging/default-microvm-meta-${ARCH}.json"

      - name: Generate default microVM SBOM
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Real store-path bill of materials for the default microVM closure —
          # the attested runtime pack manifest's SBOM reference hashes this
          # file's bytes.
          nix-store --query --requisites "$STORE_PATH" > "staging/default-microvm-${ARCH}.sbom.txt"

      - name: Produce and keyless-sign attested runtime pack manifest
        # The runtime pack is an instant-launch accelerator, never a hard
        # dependency. A Fulcio/Rekor/OIDC hiccup must not block the plain
        # vmlinux/rootfs/verity publish above, so a signing failure here is
        # tolerated: the job continues, no pack ships, and installed binaries
        # fall back to the plain hash-verified download + verity-sealed boot.
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # A runtime pack's keyless identity is the version tag ref cosign
          # embeds in the certificate SAN and a released mvmctl reconstructs
          # when verifying. Skip production unless the ref is a version tag
          # whose version equals the crate version; anything else yields an
          # identity no installed binary can reconstruct, so it would fail-open
          # to the plain download. Skipping keeps that explicit.
          if [[ "${REF}" != refs/tags/v* ]]; then
            echo "::notice::${REF} is not a version tag; skipping attested runtime pack."
            exit 0
          fi
          TAG_VERSION="${REF#refs/tags/v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="mvm-cli") | .version')"
          if [[ "${TAG_VERSION}" != "${CRATE_VERSION}" ]]; then
            echo "::warning::tag ${REF} does not match crate version v${CRATE_VERSION}; installed binaries could not verify this pack — skipping attested runtime pack."
            exit 0
          fi
          IDENTITY="https://github.com/${REPOSITORY}/.github/workflows/release.yml@${REF}"
          REVOCATION_CHANNEL="https://github.com/${REPOSITORY}/releases/download/revocations/runtime-pack-revocations.json"
          SBOM_URI="https://github.com/${REPOSITORY}/releases/download/${REF#refs/tags/}/default-microvm-${ARCH}.sbom.txt"
          cargo run --release -p mvm-build --example mvm-builder-pack-tool -- \
            --kind runtime \
            --vmlinux "$STORE_PATH/vmlinux" --rootfs "$STORE_PATH/rootfs.ext4" \
            --verity "$STORE_PATH/rootfs.verity" --roothash "$STORE_PATH/rootfs.roothash" \
            --arch "$ARCH" --channel stable --keyless \
            --identity "$IDENTITY" \
            --out-dir staging \
            --sbom "staging/default-microvm-${ARCH}.sbom.txt" \
            --sbom-uri "$SBOM_URI" \
            --revocation-channel "$REVOCATION_CHANNEL"
          mv staging/manifest.json "staging/default-microvm-${ARCH}.pack-manifest.json"

          # Keyless OIDC sign — --new-bundle-format emits the Sigstore bundle
          # (with verificationMaterial) the installed binary's Rust verifier
          # parses; the legacy --bundle format is not accepted by that stack.
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle "staging/default-microvm-${ARCH}.pack-manifest.json.bundle" \
            "staging/default-microvm-${ARCH}.pack-manifest.json"

      - name: Generate default microVM checksums
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd staging
          FILES=(
            "default-microvm-vmlinux-${ARCH}"
            "default-microvm-rootfs-${ARCH}.ext4"
            "default-microvm-rootfs-${ARCH}.verity"
            "default-microvm-rootfs-${ARCH}.roothash"
            "default-microvm-meta-${ARCH}.json"
          )
          # The attested pack is optional (signing may be skipped or fail); only
          # checksum its files when they are actually present.
          if [ -f "default-microvm-${ARCH}.pack-manifest.json.bundle" ]; then
            FILES+=("default-microvm-${ARCH}.pack-manifest.json" "default-microvm-${ARCH}.pack-manifest.json.bundle" "default-microvm-${ARCH}.sbom.txt")
          fi
          sha256sum "${FILES[@]}" > "default-microvm-${ARCH}-checksums-sha256.txt"

      - name: Upload default microVM image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: default-microvm-${{ matrix.arch }}
          path: |
            staging/default-microvm-vmlinux-${{ matrix.arch }}
            staging/default-microvm-rootfs-${{ matrix.arch }}.ext4
            staging/default-microvm-rootfs-${{ matrix.arch }}.verity
            staging/default-microvm-rootfs-${{ matrix.arch }}.roothash
            staging/default-microvm-meta-${{ matrix.arch }}.json
            staging/default-microvm-${{ matrix.arch }}.pack-manifest.json
            staging/default-microvm-${{ matrix.arch }}.pack-manifest.json.bundle
            staging/default-microvm-${{ matrix.arch }}.sbom.txt
            staging/default-microvm-${{ matrix.arch }}-checksums-sha256.txt

  release:
    needs: [bdd, build, builder-vm-image, runtime-overlay-image, sdk-sidecar-image, default-microvm]
    # Gate the published release on the mvmctl binary build ONLY. The Nix
    # image jobs still run and their artifacts are attached when present,
    # but an image-build failure must not block the binary download
    # (mvmctl tarballs + checksums) that install.sh / `mvmctl update` /
    # the Homebrew tap consume. `!cancelled()` lets this run after image
    # jobs fail; the result check keeps the binary build a hard requirement.
    # Dry-run guard: a `workflow_dispatch` with dry_run=true builds + packages
    # (the `build` job) but never reaches this publish job — only a tag push or
    # an explicit dry_run=false dispatch publishes.
    if: ${{ !cancelled() && needs.bdd.result == 'success' && needs.build.result == 'success' && (github.event_name == 'push' || github.event.inputs.dry_run == 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx --format json --all --override-filename sbom.cdx

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksum file
        shell: bash
        run: |
          cd artifacts
          # Combine per-platform checksums into one file
          # ./ prefix: a file named like an option must stay a filename.
          cat ./*.sha256 > checksums-sha256.txt
          echo "Combined checksums:"
          cat checksums-sha256.txt

      - name: Sign release tarballs and SBOM
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # One bundle format for every signed blob in this release:
          # --new-bundle-format, the Sigstore bundle carrying
          # verificationMaterial. Both consumers read it — the in-binary Rust
          # sigstore stack (mvm_build::release_signature -> image_verify) parses
          # ONLY this shape, and `cosign verify-blob --bundle` documents it as
          # the preferred input, so install.sh / `mvmctl update` /
          # verify-release-assets.sh keep working unchanged.
          #
          # Requires cosign >= v2.4 on any host that verifies by hand; that is
          # the floor this project targets and there is no legacy fallback.
          for blob in artifacts/*.tar.gz sbom.cdx.json; do
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${blob}.bundle" \
              "${blob}"
            echo "Signed: ${blob}"
          done

      # Consume what we are about to publish, before publishing it.
      #
      # The runtime overlay and SDK sidecar are acquired by an installed mvmctl
      # through a fail-closed ladder: checksum, cosign signature, safe-extract,
      # inner-manifest re-check, atomic install, resolve. Every rung refuses
      # rather than degrades, so an artifact this pipeline builds slightly wrong
      # does not degrade the user experience — it strands every download.
      #
      # This runs that exact production path over the staged artifacts via a
      # file:// URL. It is the only place the identity genuinely is this tagged
      # release workflow's, so it needs no trust override and proves the whole
      # chain rather than one rung. A missing artifact is skipped (image jobs
      # are best-effort and the release gates only on the binary build); a
      # PRESENT artifact that cannot be consumed fails the release here.
      - name: Verify the published artifacts survive the consumer path
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="${TAG_NAME#v}"
          STAGE="consumer-check/v${VERSION}"
          mkdir -p "${STAGE}"

          checked=0
          for kind in runtime-overlay sdk-sidecar; do
            for arch in aarch64 x86_64; do
              archive="artifacts/${kind}-${arch}.tar.gz"
              [ -f "${archive}" ] || continue
              for suffix in "" ".sha256" ".bundle"; do
                src="${archive}${suffix}"
                if [ ! -f "${src}" ]; then
                  echo "::error::${src} is missing — a published archive without its checksum and signature cannot be acquired" >&2
                  exit 1
                fi
                cp "${src}" "${STAGE}/"
              done

              case "${kind}" in
                runtime-overlay) example_kind=overlay ;;
                sdk-sidecar)     example_kind=sidecar ;;
              esac
              echo "Consuming ${kind}-${arch} through the production download path..."
              cargo run --release -p mvm-build --example download-release-artifact \
                --features manifest-verify -- \
                --kind "${example_kind}" \
                --base-url "file://$(pwd)/consumer-check" \
                --version "${VERSION}" \
                --arch "${arch}" \
                --cache "$(mktemp -d)"
              checked=$((checked + 1))
            done
          done

          if [ "${checked}" -eq 0 ]; then
            echo "::warning::no runtime-overlay or sdk-sidecar archives present — image jobs likely failed; publishing without them" >&2
          else
            echo "ok: ${checked} artifact(s) verified through the end-user acquisition path."
          fi

      # Plan 36 / ADR 005: cosign-keyless-sign each per-(arch, variant)
      # SignedManifest JSON. The bundle (.bundle) carries the signature,
      # the Fulcio short-lived cert, and the Rekor inclusion proof —
      # mvm-security::image_verify consumes exactly this format.
      - name: Sign image manifests (plan 36)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(artifacts/*-image-*.manifest.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            # Images are best-effort: an image-build failure must not block
            # the binary release. Warn and skip rather than fail.
            echo "::warning::no image manifests in artifacts/ — image jobs likely failed; publishing the binary release without image signatures" >&2
            ls -la artifacts/ >&2 || true
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            # --new-bundle-format emits the Sigstore bundle (with
            # verificationMaterial) that the in-binary Rust verifier
            # (image_verify::verify_manifest) parses; the legacy --bundle
            # format is rejected by that stack, which would hard-fail the
            # dev-image download's signature check.
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${manifest}.bundle" \
              "${manifest}"
            echo "Signed: ${manifest}"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # nullglob: image globs that matched nothing (their job failed)
          # drop out of the list instead of being passed literally and
          # erroring `gh release create`. The binary tarballs, the combined
          # checksums, and the SBOM are always present (the job gates on the
          # binary build), so the download path is always published; images
          # attach only when their jobs succeeded.
          shopt -s nullglob
          assets=(
            artifacts/*.tar.gz
            artifacts/*.tar.gz.bundle
            artifacts/checksums-sha256.txt
            artifacts/builder-vm-vmlinux-*
            artifacts/builder-vm-rootfs-*
            artifacts/builder-vm-*.cmdline.txt
            artifacts/builder-vm-*.manifest.json
            artifacts/builder-vm-*.pack-manifest.json
            artifacts/builder-vm-*.pack-manifest.json.bundle
            artifacts/builder-vm-*.sbom.txt
            artifacts/builder-vm-*-checksums-sha256.txt
            artifacts/runtime-overlay-*.tar.gz
            artifacts/runtime-overlay-*.tar.gz.sha256
            artifacts/sdk-sidecar-*.tar.gz
            artifacts/sdk-sidecar-*.tar.gz.sha256
            artifacts/runtime-overlay-*.tar.gz.bundle
            artifacts/sdk-sidecar-*.tar.gz.bundle
            artifacts/default-microvm-vmlinux-*
            artifacts/default-microvm-rootfs-*
            artifacts/default-microvm-meta-*
            artifacts/default-microvm-*.pack-manifest.json
            artifacts/default-microvm-*.pack-manifest.json.bundle
            artifacts/default-microvm-*.sbom.txt
            artifacts/default-microvm-*-checksums-sha256.txt
            sbom.cdx.json
            sbom.cdx.json.bundle
          )
          RELEASE_NOTES_PREFIX="$(cat nix/packaging/release/runtime-overlay-operational-note.md)"
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            --notes "${RELEASE_NOTES_PREFIX}" \
            "${assets[@]}"

      # The "release: published" event fired by `gh release create` runs under
      # GITHUB_TOKEN, which by design does not trigger downstream workflows.
      # workflow_dispatch is exempt from that rule, so chain publish-crates
      # explicitly here. This keeps crates.io in sync with GitHub releases.
      - name: Trigger crates.io publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh workflow run publish-crates.yml \
            --ref "${TAG_NAME}" \
            -f tag="${TAG_NAME}" \
            -f dry_run=false

  # Plan 199 B2: post-publish gate. Download the just-created release and assert
  # every binary target has a tarball + matching SHA256 + cosign signature bundle
  # + an entry in the combined checksums manifest, and that the SBOM is signed.
  # Fail-closed — a release missing a checksum/signature or whose bytes don't
  # match their recorded hash fails here, surfacing it instead of shipping silently.
  verify-release:
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets

      - name: Verify release asset set (checksums + signatures + SBOM + version)
        env:
          # Keyless GitHub-OIDC signing identity for this workflow's blobs.
          COSIGN_IDENTITY_REGEXP: "^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/.*$"
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          bash nix/packaging/release/verify-release-assets.sh \
            --assets-dir release-assets \
            --cosign \
            --expect-version "${TAG_NAME#v}"
