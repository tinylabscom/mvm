name: Publish SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Local build rehearsal, NOT release acceptance"
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      dry_run:
        description: "Local build rehearsal, NOT release acceptance"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: read

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  bdd:
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'sdk-v') }}
    uses: ./.github/workflows/bdd.yml

  preflight:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'sdk-v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check release orchestration refusal and retry paths
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/test-sdk-release-preflight.py
          node --test scripts/test-publish-npm-packages.mjs
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'release'
      - name: Validate SDK compatibility and signed published CLI runtime
        env:
          SDK_EVENT_NAME: ${{ github.event_name }}
          SDK_RELEASE_TAG: ${{ github.event.release.tag_name }}
          SDK_DRY_RUN: ${{ github.event_name != 'release' && inputs.dry_run && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sdk-release-preflight.py

  publish_pypi_release:
    if: ${{ github.event_name == 'release' }}
    needs: [preflight, bdd]
    uses: ./.github/workflows/publish-pypi.yml
    with:
      dry_run: false
    secrets: inherit

  publish_pypi_dry_run:
    if: ${{ github.event_name != 'release' }}
    needs: preflight
    uses: ./.github/workflows/publish-pypi.yml
    with:
      dry_run: true
    secrets: inherit

  publish_npm_release:
    if: ${{ github.event_name == 'release' }}
    needs: [preflight, bdd]
    uses: ./.github/workflows/publish-npm.yml
    with:
      dry_run: false
    secrets: inherit

  publish_npm_dry_run:
    if: ${{ github.event_name != 'release' }}
    needs: preflight
    uses: ./.github/workflows/publish-npm.yml
    with:
      dry_run: true
    secrets: inherit

  registry_evidence:
    needs: [publish_pypi_release, publish_npm_release]
    uses: ./.github/workflows/sdk-registry-smoke.yml
