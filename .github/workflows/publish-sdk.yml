name: Publish SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Local build rehearsal, NOT release acceptance"
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      dry_run:
        description: "Local build rehearsal, NOT release acceptance"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: read

concurrency:
  group: ${{ github.event_name == 'release' && 'publish-sdk' || format('publish-sdk-rehearsal-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  bdd:
    if: ${{ github.event_name == 'release' && startsWith(github.event.release.tag_name, 'sdk-v') }}
    uses: ./.github/workflows/bdd.yml

  preflight:
    if: ${{ github.event_name != 'release' || startsWith(github.event.release.tag_name, 'sdk-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Check release orchestration refusal and retry paths
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/test-sdk-release-preflight.py
          node --test scripts/test-publish-npm-packages.mjs
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name == 'release'
      - name: Validate SDK compatibility and signed published CLI runtime
        env:
          SDK_EVENT_NAME: ${{ github.event_name }}
          SDK_RELEASE_TAG: ${{ github.event.release.tag_name }}
          SDK_DRY_RUN: ${{ github.event_name != 'release' && inputs.dry_run && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sdk-release-preflight.py

  publish_pypi_release:
    if: ${{ github.event_name == 'release' }}
    needs: [preflight, bdd]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-pypi.yml
    with:
      dry_run: false
    secrets: inherit

  publish_pypi_dry_run:
    if: ${{ github.event_name != 'release' }}
    needs: preflight
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-pypi.yml
    with:
      dry_run: true
    secrets: inherit

  publish_npm_release:
    if: ${{ github.event_name == 'release' }}
    needs: [preflight, bdd]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      dry_run: false
    secrets: inherit

  publish_npm_dry_run:
    if: ${{ github.event_name != 'release' }}
    needs: preflight
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      dry_run: true
    secrets: inherit

  registry_evidence:
    needs: [publish_pypi_release, publish_npm_release]
    uses: ./.github/workflows/sdk-registry-smoke.yml
