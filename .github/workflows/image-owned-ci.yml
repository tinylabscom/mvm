name: Image-owned CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  image-nix-checks:
    name: Image Nix checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: Install just (command runner)
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64) tarball="just-x86_64-unknown-linux-musl.tar.gz" ;;
            aarch64) tarball="just-aarch64-unknown-linux-musl.tar.gz" ;;
            *) echo "unsupported arch $arch"; exit 1 ;;
          esac
          curl -fSL "https://github.com/casey/just/releases/latest/download/$tarball" -o /tmp/just.tgz
          tar -C /tmp -xzf /tmp/just.tgz
          sudo install -m0755 /tmp/just /usr/local/bin/just
      - name: Build image derivations (fast subset)
        run: |
          set -euo pipefail
          # Build the runtime overlay and default-tenant derivations (x86_64)
          just build runtime-overlay default
      - name: Run image tests (QEMU smoke)
        run: |
          set -euo pipefail
          # The repo exposes a qemu smoke harness; run the smoke for x86_64
          just bdd

  boot-witness-qemu:
    name: Boot witness (QEMU)
    runs-on: ubuntu-latest
    needs: image-nix-checks
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run QEMU boot witness
        run: |
          set -euo pipefail
          just e2e-qemu ./result
      - name: Upload witness
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-witness
          path: /tmp/qemu-boot-witness.json
