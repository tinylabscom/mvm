name: Linux documented surface evidence
run-name: Linux documented surface evidence at ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    # Admit only reviewed main code before scheduling the live lane.
    if: github.repository == 'tinylabscom/mvm' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e-docs.yml
    with:
      run_linux: true
      run_macos: false
      allow_runtime_candidate_skip: true
