name: Source host helpers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase main-ancestor commit to backfill (empty uses this workflow commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: source-host-helpers-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact source commit
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(python3 scripts/resolve-source-helper-commit.py \
            --source "${SOURCE_SHA}" --workflow "${WORKFLOW_SHA}")
          printf 'sha=%s\n' "${sha}" >> "${GITHUB_OUTPUT}"

  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            build_target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            build_target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            build_target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          path: helper-source
          persist-credentials: false
      - name: Verify checked-out source
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C helper-source rev-parse HEAD)" = "${SOURCE_SHA}"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.build_target }}
      - uses: ./.github/actions/install-zigbuild
      - name: Build launch helpers
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
        shell: bash
        run: |
          set -euo pipefail
          cd helper-source
          if [[ "${BUILD_TARGET}" == *apple-darwin ]]; then
            cargo build --release --target "${BUILD_TARGET}" -p mvm-hostd \
              --bin mvm-network-endpoint \
              --bin mvm-hvf-supervisor
            cargo build --release --target "${BUILD_TARGET}" -p mvm-client \
              --bin mvm-hvf-run-owner
          else
            cargo zigbuild --release --target "${BUILD_TARGET}" -p mvm-hostd \
              --bin mvm-network-endpoint
          fi
      - name: Package commit-addressed helpers
        env:
          TARGET: ${{ matrix.target }}
          BUILD_TARGET: ${{ matrix.build_target }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          name="mvm-host-helpers-${SOURCE_SHA}-${TARGET}"
          mkdir -p "dist/${name}"
          printf '%s\n' "${SOURCE_SHA}" > "dist/${name}/SOURCE_COMMIT"
          cp "helper-source/target/${BUILD_TARGET}/release/mvm-network-endpoint" "dist/${name}/"
          if [[ "${BUILD_TARGET}" == *apple-darwin ]]; then
            cp "helper-source/target/${BUILD_TARGET}/release/mvm-hvf-supervisor" "dist/${name}/"
            cp "helper-source/target/${BUILD_TARGET}/release/mvm-hvf-run-owner" "dist/${name}/"
            python3 helper-source/scripts/release/sign_macos.py \
              --producer-adhoc \
              --payload "dist/${name}" \
              --report "dist/${name}-producer-signing.json"
            VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("helper-source/Cargo.toml","rb"))["workspace"]["package"]["version"])')"
            python3 helper-source/scripts/release/owner_component_manifest.py \
              --binary "dist/${name}/mvm-hvf-run-owner" \
              --output "dist/${name}/owner-component.json" \
              --version "${VERSION}" \
              --target "${BUILD_TARGET}" \
              --source-commit "${SOURCE_SHA}"
          fi
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          if [[ "${BUILD_TARGET}" == *apple-darwin ]]; then
            python3 helper-source/scripts/release/verify_macos_package.py \
              --archive "dist/${name}.tar.gz" \
              --envelope "${name}" \
              --require-owner-inventory \
              --owner-version "${VERSION}" \
              --owner-target "${BUILD_TARGET}" \
              --owner-source-commit "${SOURCE_SHA}" \
              --producer-report "dist/${name}-producer-signing.json" \
              --report "dist/${name}-final-package.json"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-host-helpers-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: source-host-helpers-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign exact helper bundles
        shell: bash
        run: |
          set -euo pipefail
          # `mvmctl bootstrap` verifies these with the in-binary sigstore
          # verifier, which reads only the Sigstore bundle format carrying
          # `verificationMaterial`. Without --new-bundle-format, cosign v2
          # writes its legacy bundle and every source build refuses it.
          for archive in dist/*.tar.gz; do
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${archive}.bundle" \
              "${archive}"
          done
      - name: Publish immutable per-commit source helpers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish-source-host-helpers.py \
            --repo "${GH_REPO}" --commit "${SOURCE_SHA}" --directory dist
