name: CI

on:
  # Keep ordinary pushes cheap and predictable. This workflow is the
  # day-to-day signal and is intentionally capped at four jobs:
  # lint, test, MCP smoke, and Nix eval. Expensive platform, live-VM,
  # OCI ratification, security, Windows, and release artifact jobs live
  # in release/manual workflows.
  push:
    # Exclude the merge-queue transient branches — covered by merge_group below.
    branches: ["**", "!gh-readonly-queue/**"]
  # Required for the merge queue: checks must run against the merge_group event.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint (fmt + clippy + policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev lld

      # SDK stub codegen (check-stubs) shells out to `uvx datamodel-codegen`
      # (Python) + `npx json-schema-to-typescript` (TS). The pinned generator
      # versions live in xtask, so the host node/python versions don't change
      # the output (verified byte-identical macOS node22/py3.12 vs Linux
      # node18/py3.11) — these just provide the runners.
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: ./.github/actions/install-zigbuild

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Shellcheck install.sh
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: ADR coverage (informational)
        continue-on-error: true
        run: cargo run -p xtask -- check-adr-coverage

      - name: No Debug/Display on secret-named types
        run: cargo run -p xtask -- check-no-display-on-secret-types

      - name: No positional audit::emit / event-chain calls
        run: cargo run -p xtask -- check-audit-positional

      - name: No forbidden dependency families
        run: cargo run -p xtask -- check-forbidden-deps

      - name: Gated doc claims
        run: cargo run -p xtask -- check-doc-claims

      - name: No overclaiming
        run: cargo run -p xtask -- check-no-overclaim

      - name: Unique spec numbers
        run: cargo run -p xtask -- check-spec-numbers

      - name: No spec refs in source comments
        run: cargo run -p xtask -- check-no-spec-refs-in-comments

      - name: Conformance claim catalog
        run: cargo run -p xtask -- check-claim-catalog

      - name: host-binaries manifest parity
        run: cargo run -p xtask -- check-mvm-host-binaries-sync

      - name: mvm-core default build is runtime-free
        run: cargo run -p xtask -- check-core-runtime-free

      - name: mvmctl default closure within budget
        run: cargo run -p xtask -- check-closure-budget

      - name: mvm-guest agent closure is runtime-free
        run: cargo run -p xtask -- check-guest-agent-runtime-free

      - name: guest agent forked in every bootable image
        run: cargo run -p xtask -- check-guest-agent-in-all-images

      - name: runtime-overlay version pinned to workspace
        run: cargo run -p xtask -- check-runtime-overlay-version

      - name: SDK stubs match the Rust schemas (no drift)
        run: cargo run -p xtask -- check-stubs

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev lld

      - uses: ./.github/actions/install-zigbuild

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo nextest run --workspace --all-targets

      - name: hostd-transport feature tests (mvm-core)
        # `hostd-transport` is off by default (plan 126 B5), so the
        # workspace run above skips the protocol transport tests. Run them
        # explicitly so the gated surface stays covered.
        run: cargo nextest run -p mvm-core --features hostd-transport

      - name: xtask man-page tests
        # gen-man lives behind xtask's off-by-default `man` feature (it pulls
        # mvm-cli + its heavy build.rs out of the default xtask graph), so the
        # workspace run above skips its tests. Exercise the man-page path here;
        # the mvm-cli rlib it links was already built by the workspace run.
        run: cargo nextest run -p xtask --features man

      - name: Run doctests
        # nextest does not run doctests; gate them separately.
        run: cargo test --workspace --doc

      - name: Assert auto-detect on Linux picks libkrun
        run: |
          cargo test -p mvm-build --features builder-vm --lib \
            builder_backend_select::tests::auto_detect_default_for_everything_else_picks_libkrun

  mcp-server-smoke:
    name: MCP server stdio roundtrip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/install-zigbuild

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mcp-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mcp-smoke-

      - name: Build mvmctl + run MCP roundtrip smoke
        run: ./scripts/test-mcp-roundtrip.sh

  passt-framing:
    name: Passt framing (real passt, no KVM)
    runs-on: ubuntu-latest
    # Plan 141 — lock in the gateway bridge's qemu-socket framing assumption
    # against the real passt binary. passt is userspace (no KVM, no microVM),
    # so this is a fast per-PR regression gate: it confirms passt's `--fd`
    # transport frames each ethernet frame with a 4-byte big-endian length
    # (what `gateway_bridge::{read,write}_one_frame` assume) by round-tripping
    # a DHCP DISCOVER -> OFFER. The full Firecracker-boot E2E (needs /dev/kvm)
    # remains a tracked deferred follow-up in specs/plans/141.
    steps:
      - uses: actions/checkout@v6
      - name: Install passt
        run: sudo apt-get update && sudo apt-get install -y passt
      - name: Confirm real passt uses the 4-byte-BE qemu-socket framing
        run: python3 scripts/passt-framing-check.py

  nix-flake-check:
    name: Nix flake check (Linux eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Eval-check every flake
        run: |
          set -euo pipefail
          find nix -name flake.nix -type f -print0 | sort -z | while IFS= read -r -d '' flake; do
            d="$(dirname "$flake")"
            echo "=== $d ==="
            nix flake check --no-build "./$d"
          done
