name: CI

on:
  # Keep pull-request validation cheap and predictable. On a pull request this
  # workflow runs parallel lint/test lanes plus the stable aggregate checks
  # required by branch protection. The merge queue also runs Nix eval.
  # Expensive platform, live-VM, OCI ratification, security, Windows, and
  # release artifact jobs live in release/manual workflows.
  pull_request:
  # Required for the merge queue: all checks must run against the merge_group event.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Pull-request refs are stable across updates, so a new commit cancels only the
# superseded run for that PR. Merge-group refs identify exact queue commits and
# must finish; manual dispatches receive a unique key so independent diagnostics
# do not block each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-core:
    name: Lint core (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install system build deps
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list; sudo apt-get update && sudo apt-get install -y libcap-ng-dev lld

      - uses: ./.github/actions/install-zigbuild

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Shellcheck install.sh + release-asset verifier
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh
          shellcheck nix/packaging/release/verify-release-assets.sh \
                     nix/packaging/release/verify-release-assets.test.sh

      - name: Release-asset verifier gate tests
        run: bash nix/packaging/release/verify-release-assets.test.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The cucumber runner is `harness = false`, so it sits behind the `bdd`
      # feature to keep it out of `cargo nextest run --workspace` — nextest
      # enumerates tests with `--list`, which that target cannot answer. The
      # step above does not reach it either, since `--all-targets` still honors
      # `required-features`. Nothing else on a pull request builds it, so a
      # struct or signature change anywhere in the workspace can break the BDD
      # suite unnoticed and only surface in a release run. Compile it here.
      - name: Clippy (BDD conformance target)
        run: cargo clippy -p mvm-conformance --tests --features bdd -- -D warnings

  lint-policy:
    name: Lint policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # Policy checks invoke xtask, and the stub/parity checks invoke the
      # pinned Python and TypeScript generators. They are independent of the
      # compiler lint lane, so start them on their own runner.
      - name: Install system build deps
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list; sudo apt-get update && sudo apt-get install -y libcap-ng-dev lld shellcheck

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: ./.github/actions/install-zigbuild

      - name: ADR coverage (informational)
        continue-on-error: true
        run: cargo run -p xtask -- check-adr-coverage

      - name: No Debug/Display on secret-named types
        run: cargo run -p xtask -- check-no-display-on-secret-types

      - name: No positional audit::emit / event-chain calls
        run: cargo run -p xtask -- check-audit-positional

      - name: Broad-egress constructor stays builder-only
        run: cargo run -p xtask -- check-build-egress-callers

      - name: No host-nix invocation (builds route through the builder VM)
        run: cargo run -p xtask -- check-no-host-nix

      - name: No Virtualization.framework / Containerization Swift (Apple Container rides the in-house HVF VMM)
        run: cargo run -p xtask -- check-no-vz

      - name: No forbidden dependency families
        run: cargo run -p xtask -- check-forbidden-deps

      - name: Gated doc claims
        run: cargo run -p xtask -- check-doc-claims

      - name: Machine docs guards
        run: cargo run -p xtask -- check-machine-doc-guards

      - name: No overclaiming
        run: cargo run -p xtask -- check-no-overclaim

      - name: Two product surfaces only (host + user)
        run: cargo run -p xtask -- check-two-surfaces

      - name: No spec refs in source comments
        run: cargo run -p xtask -- check-no-spec-refs-in-comments

      - name: No stringly backend-name dispatch
        run: cargo run -p xtask -- check-no-string-backend-dispatch

      - name: Single MVM_HOME root (no resolver bypass)
        run: cargo run -p xtask -- check-single-home

      - name: Tests that move MVM_HOME also isolate HOME
        run: cargo run -p xtask -- check-test-home-isolation

      - name: No baked network literals (IPs/ports/tmp-sockets)
        run: cargo run -p xtask -- check-no-network-literals

      - name: mvm-cli drives machines through the mvm-client facade
        run: cargo run -p xtask -- check-cli-runtime-surface

      - name: repr(C) types carry a layout contract (check-abi-layout)
        run: cargo run -p xtask -- check-abi-layout

      - name: Conformance claim catalog
        run: cargo run -p xtask -- check-claim-catalog

      - name: Claim mutation surface is pinned
        run: cargo run -p xtask -- check-mutation-witnesses

      - name: Prose cites witnesses that exist
        run: cargo run -p xtask -- check-witness-citations

      - name: Security controls declare their reachability
        run: cargo run -p xtask -- check-dormant-controls

      - name: Conformance model is the single source (R1)
        run: cargo run -p xtask -- check-conformance

      - name: No deferred markers (R4)
        run: cargo run -p xtask -- check-deferrals

      - name: Honesty levels respected in docs (R2)
        run: cargo run -p xtask -- check-honesty

      - name: Trust-gradient ledger
        run: cargo run -p xtask -- check-trust-gradient

      - name: vsock-only egress (no guest NIC on the vmm/HVF path, ADR-100)
        run: cargo run -p xtask -- check-vsock-only-egress

      - name: uniform vsock egress (Firecracker + libkrun + HVF use the WorkloadRunner seam)
        run: cargo run -p xtask -- check-uniform-vsock-egress

      - name: one stream redaction seam (every StreamBroker is built over the curated ruleset)
        run: cargo run -p xtask -- check-stream-redaction-seam

      - name: guest init parity (both inits share one post-mount bootstrap)
        run: cargo run -p xtask -- check-guest-init-parity

      - name: require-grant token confined to allowlist (guards mvmd no-brick invariant)
        run: cargo run -p xtask -- check-require-grant-token-allowlist

      - name: host-binaries manifest parity
        run: cargo run -p xtask -- check-mvm-host-binaries-sync

      - name: mvm-core default build is runtime-free
        run: cargo run -p xtask -- check-core-runtime-free

      - name: content-address digests stay deterministic
        run: cargo run -p xtask -- check-content-address-determinism

      - name: mvmctl default closure within budget
        run: cargo run -p xtask -- check-closure-budget

      - name: no new duplicate-major dependencies
        run: cargo run -p xtask -- check-duplicate-majors

      - name: workflow paths and fuzz targets still exist
        run: cargo run -p xtask -- check-workflow-paths

      - name: Detect fuzz-crate changes
        id: fuzz_changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
          if git diff --name-only "$BASE_SHA"...HEAD 2>/dev/null | grep -qE '(^|/)fuzz[^/]*/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo-fuzz crates still compile
        if: steps.fuzz_changed.outputs.changed == 'true'
        run: |
          set -uo pipefail
          fail=0
          for manifest in crates/*/fuzz*/Cargo.toml crates/deps/*/fuzz*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            echo "::group::$manifest"
            cargo check --manifest-path "$manifest" --all-targets || fail=1
            echo "::endgroup::"
          done
          exit "$fail"

      - name: mvm-guest agent closure is runtime-free
        run: cargo run -p xtask -- check-guest-agent-runtime-free

      - name: guest agent forked in every bootable image
        run: cargo run -p xtask -- check-guest-agent-in-all-images

      - name: workload guest images bake no host/builder tools
        run: cargo run -p xtask -- check-guest-images-no-builder-tools

      - name: OCI guest-binary name lists agree
        run: cargo run -p xtask -- check-guest-binary-lists

      - name: no new builder shell-job dispatch sites
        run: cargo run -p xtask -- check-builder-shell-job-sites

      - name: every VMM boot path seeds the guest CSPRNG
        run: cargo run -p xtask -- check-guest-entropy-seed

      - name: runtime-overlay version pinned to workspace
        run: cargo run -p xtask -- check-runtime-overlay-version

      - name: no oversized production file bodies (≤1500 non-test lines)
        run: cargo run -p xtask -- check-file-size

      - name: SDK stubs match the Rust schemas (no drift)
        run: cargo run -p xtask -- check-stubs

      - name: Python and TypeScript IR fixtures match the Rust semantic address
        run: cargo run -p xtask -- check-ir-parity

  lint-features:
    name: Lint feature coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - name: Install system build deps
        run: sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list; sudo apt-get update && sudo apt-get install -y libcap-ng-dev lld

      - uses: ./.github/actions/install-zigbuild

      - name: Clippy (mvm-client tracing-bridge)
        run: cargo clippy -p mvm-client --all-targets --features tracing-bridge -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: hostd-transport feature tests (mvm-core)
        run: cargo nextest run -p mvm-core --features hostd-transport

      - name: client facade tests (mvm-core)
        run: cargo nextest run -p mvm-core --features client-remote

      - name: Assert auto-detect still picks libkrun off Linux/HVF
        run: |
          cargo test -p mvm-build --features builder-vm --lib \
            builder_backend_select::tests::auto_detect_default_for_everything_else_picks_libkrun

      - name: In-process pure-mkfs materialize tests
        run: cargo test -p mvm-build --features pure-mkfs --lib rootfs::tests::pure

      - name: test-support feature tests (mock backend)
        run: |
          cargo nextest run -p mvm-backends --features test-support --lib
          cargo nextest run -p mvm-runtime --features test-support --lib
          cargo nextest run -p mvm-client --features test-support --lib
          cargo nextest run -p mvm-cli --features test-support --lib
          cargo nextest run -p mvmctl --features test-support --test audit_emissions_live
          cargo nextest run -p mvm-backends --features test-support --lib
          cargo nextest run -p mvm-vmm --features test-support --lib
          cargo check -p mvm-cli --features test-support --example verification_loop

  lint:
    name: Lint (fmt + clippy + policy)
    if: ${{ always() }}
    needs: [lint-core, lint-policy, lint-features]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lint lane to pass
        env:
          CORE_RESULT: ${{ needs.lint-core.result }}
          POLICY_RESULT: ${{ needs.lint-policy.result }}
          FEATURES_RESULT: ${{ needs.lint-features.result }}
        run: |
          set -euo pipefail
          for result in "$CORE_RESULT" "$POLICY_RESULT" "$FEATURES_RESULT"; do
            if [ "$result" != success ]; then
              echo "A lint lane did not pass: $result"
              exit 1
            fi
          done

  test:
    name: Test
    if: ${{ always() }}
    needs: [test-workspace, test-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test lane to pass
        env:
          WORKSPACE_RESULT: ${{ needs.test-workspace.result }}
          LINUX_RESULT: ${{ needs.test-linux.result }}
        run: |
          set -euo pipefail
          for result in "$WORKSPACE_RESULT" "$LINUX_RESULT"; do
            if [ "$result" != success ]; then
              echo "A test lane did not pass: $result"
              exit 1
            fi
          done

  test-workspace:
    name: Test workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system build deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list; sudo apt-get update
          sudo apt-get install -y attr cryptsetup-bin libcap-ng-dev lld

      - uses: ./.github/actions/install-zigbuild

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build
        run: cargo build --all-targets

      - name: xtask man-page tests
        # gen-man lives behind xtask's off-by-default `man` feature. It pulls
        # mvm-cli and its build script, so exercise it on Test's already-warm
        # test-profile graph instead of rebuilding that graph in Lint.
        run: cargo nextest run -p xtask --features man

      - name: Run tests
        run: cargo nextest run --workspace --all-targets

      - name: Run universal agent handler tests
        # DevOnly handlers are runtime-gated, so the default build now
        # compiles and exercises them for every artifact tier.
        run: cargo nextest run -p mvm-agentd --all-targets

      - name: Run addon/egress helper tests
        # The async loopback helper bins (mvm-addon-dns, mvm-addon-vsock-bridge,
        # mvm-egress-client) and their shared vsock session helper live behind
        # the off-by-default `addons` feature, so the default workspace run
        # skips their tests. Run mvm-agentd with the feature on so they stay
        # exercised on every PR.
        run: cargo nextest run -p mvm-agentd --features addons

      - name: Run doctests
        # nextest does not run doctests; gate them separately.
        run: cargo test --workspace --doc

  test-linux:
    name: Test Linux and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system build deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list; sudo apt-get update
          sudo apt-get install -y attr cryptsetup-bin libcap-ng-dev lld

      - uses: ./.github/actions/install-zigbuild

      - name: Install pinned no_std toolchain and targets
        run: |
          rustup toolchain install 1.96.0 --profile minimal \
            --target wasm32-unknown-unknown,wasm32-wasip1,riscv32imac-unknown-none-elf

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run Linux, no_std, filesystem, and conformance coverage
        run: bash scripts/ci-linux-coverage.sh

  test-ebpf-telemetry:
    name: Test eBPF telemetry load/attach
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly Rust toolchain for eBPF build
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install system build deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list; sudo apt-get update
          sudo apt-get install -y libcap-ng-dev lld

      - name: Install bpf-linker
        run: cargo +nightly install --locked bpf-linker

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build the eBPF object
        run: just build-ebpf

      - name: Run mvm-hostd eBPF telemetry load/attach test
        run: cargo test -p mvm-hostd --features ebpf-telemetry --lib

  nix-flake-check:
    name: Nix flake check (Linux eval)
    # Nix eval/build is heavy; run it in the merge queue and on manual dispatch,
    # not on every PR update.
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Eval-check every flake
        run: |
          set -euo pipefail
          find nix -name flake.nix -type f -print0 | sort -z | while IFS= read -r -d '' flake; do
            d="$(dirname "$flake")"
            echo "=== $d ==="
            nix flake check --no-build "./$d"
          done

      # This runner is x86_64, so only the x86_64-linux check variant builds
      # here; the aarch64-linux variant stays defined for parity and for a
      # future arm64 runner.
      - name: Baked guest rootfs closure stays lean and glibc-free
        run: |
          set -euo pipefail
          nix build --print-build-logs \
            ./nix#checks.x86_64-linux.guest-rootfs-no-glibc \
            ./nix#checks.x86_64-linux.guest-rootfs-package-budget

      - name: Runtime overlay uses static-musl guest binaries
        run: |
          set -euo pipefail
          nix build --print-build-logs \
            ./nix/images/runtime-overlay#packages.x86_64-linux.default \
            ./nix/images/runtime-overlay#packages.x86_64-linux.sdk-sidecar \
            ./nix/images/runtime-overlay#packages.x86_64-linux.sdk-sidecar-image

      # Both directions, together, over the artifacts the step above already
      # built — a closure query, not a second build of the same binaries.
      #
      # The overlay's ext4 is an opaque image with no store references, so
      # querying the *image* would be vacuously empty; these query the
      # executables staged into it, and the cdylib the sidecar ships. The greps
      # are hash-anchored (`/nix/store/<hash>-glibc…`) so they match the glibc
      # package's own store path, never a derivation whose name merely contains
      # "glibc".
      #
      # The positive direction is what makes the split meaningful: without it, a
      # change that deleted the SDK cdylib outright would satisfy every
      # no-glibc assertion and read as a footprint win.
      - name: Runtime overlay is glibc-free and the SDK closure moved to the sidecar
        run: |
          set -euo pipefail
          overlay=./nix/images/runtime-overlay
          glibc_re='/nix/store/[a-z0-9]+-glibc(-|$)'

          staged_closure=$(mktemp)
          for binary in guest runner egressClient addonDns exitReport; do
            path=$(nix eval --raw "$overlay#packages.x86_64-linux.default.passthru.$binary")
            nix path-info -r "$path" >> "$staged_closure"
          done
          if grep -Eq -- "$glibc_re" "$staged_closure"; then
            echo "glibc present in the runtime overlay's staged-executable closure:" >&2
            grep -E -- "$glibc_re" "$staged_closure" >&2
            exit 1
          fi
          echo "ok: runtime overlay staged executables carry no glibc"

          hostsvc=$(nix eval --raw "$overlay#packages.x86_64-linux.sdk-sidecar.passthru.hostsvc")
          if ! nix path-info -r "$hostsvc" | grep -Eq -- "$glibc_re"; then
            echo "the SDK host-services cdylib no longer depends on glibc — the" >&2
            echo "sidecar split is only meaningful while it does:" >&2
            nix path-info -r "$hostsvc" >&2
            exit 1
          fi
          sidecar=$(nix build --no-link --print-out-paths \
            "$overlay#packages.x86_64-linux.sdk-sidecar")
          for required in libmvm_host_services.so libc.so.6 libgcc_s.so.1; do
            test -e "$sidecar/lib/$required" \
              || { echo "SDK sidecar is missing $required" >&2; exit 1; }
          done
          echo "ok: the glibc SDK closure lives in the sidecar"


      - name: Nix-built guest artifacts fit the 50 MB footprint
        run: |
          set -euo pipefail
          nix build --print-build-logs --impure --no-link --print-out-paths \
            ./nix/images/default-tenant#packages.x86_64-linux.default \
            > /tmp/default-tenant-path.txt
          image_path=$(head -1 /tmp/default-tenant-path.txt)
          nix build --print-build-logs --no-link --print-out-paths \
            ./nix/images/runtime-overlay#packages.x86_64-linux.default \
            > /tmp/runtime-overlay-path.txt
          overlay_path=$(head -1 /tmp/runtime-overlay-path.txt)
          # The optional SDK sidecar is measured against its own ceiling and
          # reported on its own ledger line — never folded into the base total.
          nix build --print-build-logs --no-link --print-out-paths \
            ./nix/images/runtime-overlay#packages.x86_64-linux.sdk-sidecar-image \
            > /tmp/sdk-sidecar-path.txt
          sidecar_path=$(head -1 /tmp/sdk-sidecar-path.txt)
          cargo run -p xtask -- perf footprint \
            --rootfs "$image_path/rootfs.ext4" \
            --rootfs-verity "$image_path/rootfs.verity" \
            --kernel "$image_path/vmlinux" \
            --overlay "$overlay_path/overlay.ext4" \
            --overlay-verity "$overlay_path/overlay.verity" \
            --closure-paths "$image_path/rootfs-closure-paths" \
            --sdk-sidecar "$sidecar_path/sdk.ext4" \
            --json
