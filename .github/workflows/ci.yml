name: CI

on:
  # Keep pull-request validation cheap and predictable. On a pull request this
  # workflow runs parallel lint/test lanes plus the stable aggregate checks
  # required by branch protection. The merge queue also runs Nix eval.
  # Expensive platform, live-VM, OCI ratification, security, Windows, and
  # release artifact jobs live in release/manual workflows.
  pull_request:
  # Required for the merge queue: all checks must run against the merge_group event.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Pull-request refs are stable across updates, so a new commit cancels only the
# superseded run for that PR. Merge-group refs identify exact queue commits and
# must finish; manual dispatches receive a unique key so independent diagnostics
# do not block each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Classify the exact commit range once, before allocating expensive runners.
  # Pull-request and merge-group events expose different SHA fields, so keeping
  # this in one fail-closed job prevents lane-specific path filters drifting.
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.validate.outputs.code }}
      bdd: ${{ steps.validate.outputs.bdd }}
      nix: ${{ steps.validate.outputs.nix }}
      architecture: ${{ steps.validate.outputs.architecture }}
      kernel: ${{ steps.validate.outputs.kernel }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          set_all() {
            for output in code bdd nix architecture kernel; do
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            done
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            set_all
            echo "manual dispatch — running every lane"
            exit 0
          fi

          case "$EVENT" in
            merge_group)  BASE="$MG_BASE"; HEAD="$MG_HEAD" ;;
            pull_request) BASE="$PR_BASE"; HEAD="$PR_HEAD" ;;
            *) echo "::error::unhandled event $EVENT" >&2; exit 1 ;;
          esac

          CHANGED_FILE=$(mktemp)
          trap 'rm -f "$CHANGED_FILE"' EXIT
          if ! git diff --name-only -z "$BASE" "$HEAD" > "$CHANGED_FILE" 2>/dev/null; then
            set_all
            echo "could not diff $BASE..$HEAD — running every lane to stay safe"
            exit 0
          fi

          # Anything that can change a compiled target, generated artifact, or
          # the commands used by a Rust lane keeps the full compiler/test
          # matrix. Prose, site assets, and process-only specs do not.
          #
          # `nix/` is here whole, replacing a narrow
          # `nix/packaging/release/*.sh` entry, because the guest image
          # generator has Rust guards that only run under this flag and
          # tests/nix_flake_structure.rs reads across lib/, images/,
          # packages/ and profiles/. `mk_guest_init_shebang_lands_at_byte_zero`
          # renders `initText` out of nix/lib/mk-guest.nix and asserts the
          # shebang lands on byte 0 — no Nix needed, well under a second. It
          # was written for the defect that shipped a rootfs the kernel could
          # not exec, and a PR touching only mk-guest.nix used to resolve
          # code=false, so the one test that would have caught that change
          # never ran on it.
          if grep -zE '^(crates/|src/|tests/|xtask/|scripts/|features/|schema/|model/|assets/|\.cargo/|\.config/|\.github/actions/|\.github/workflows/|nix/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|build\.rs$|install\.sh$|[Jj]ustfile$)' "$CHANGED_FILE" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -zE '^(nix/|flake\.(nix|lock)$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|crates/|src/|\.github/workflows/(ci|cache-warm)\.yml$)' "$CHANGED_FILE" >/dev/null; then
            echo "nix=true" >> "$GITHUB_OUTPUT"
          else
            echo "nix=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -zE '^(crates/|src/|tests/|Cargo\.|\.cargo/|rust-toolchain|scripts/check-no-orchestration-server\.sh$|\.github/workflows/(ci|architecture)\.yml$)' "$CHANGED_FILE" >/dev/null; then
            echo "architecture=true" >> "$GITHUB_OUTPUT"
          else
            echo "architecture=false" >> "$GITHUB_OUTPUT"
          fi

          # default-tenant and nix/lib/ join the kernel paths because the
          # image flake imports both — nix/images/kernel/{base,workload}.nix
          # for the vmlinux and lib.mkGuest for the rootfs — so a change to
          # either alters what this lane builds.
          if grep -zE '^(nix/images/kernel/|nix/images/default-tenant/|nix/lib/|nix/images/builder-vm/flake\.(nix|lock)$|xtask/src/check_kernel_config_budget\.rs$|\.github/workflows/(ci|kernel-build)\.yml$)' "$CHANGED_FILE" >/dev/null; then
            echo "kernel=true" >> "$GITHUB_OUTPUT"
          else
            echo "kernel=false" >> "$GITHUB_OUTPUT"
          fi

          # The Gherkin scenarios drive the real `mvmctl` binary and the built
          # language SDKs, so the drift they catch lives in four places: the SDK
          # sources, the CLI surface those SDKs shell to, the scenarios and
          # their fixtures, and the golden argv corpus binding the two.
          #
          # Deliberately narrower than the full suite's reach: scenarios over
          # egress, snapshots and verified boot are driven by crates outside
          # this filter and remain covered only by the release-tag `bdd` lane.
          # Widening that is a separate call about PR latency, not an oversight.
          if grep -zE '^(crates/mvm-sdk/|crates/mvm-cli/|crates/mvm-conformance/|features/|tests/machine-fixtures/|\.github/workflows/(ci|bdd)\.yml$|[Jj]ustfile$)' "$CHANGED_FILE" >/dev/null; then
            echo "bdd=true" >> "$GITHUB_OUTPUT"
          else
            echo "bdd=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate classification
        id: validate
        env:
          CODE: ${{ steps.decide.outputs.code }}
          BDD: ${{ steps.decide.outputs.bdd }}
          NIX: ${{ steps.decide.outputs.nix }}
          ARCHITECTURE: ${{ steps.decide.outputs.architecture }}
          KERNEL: ${{ steps.decide.outputs.kernel }}
        run: |
          set -euo pipefail
          validate() {
            local name="$1" value="$2"
            case "$value" in
              true|false) echo "${name}=${value}" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::invalid or missing ${name} scope: ${value}" >&2; exit 1 ;;
            esac
          }
          validate code "$CODE"
          validate bdd "$BDD"
          validate nix "$NIX"
          validate architecture "$ARCHITECTURE"
          validate kernel "$KERNEL"

  lint-core:
    name: Lint core (fmt + clippy)
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Shellcheck install.sh + release-asset verifier
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh
          shellcheck nix/packaging/release/verify-release-assets.sh \
                     nix/packaging/release/verify-release-assets.test.sh \
                     nix/packaging/release/assert-init-shebang.sh \
                     nix/packaging/release/assert-kernel-format.sh \
                     scripts/check-no-orchestration-server.sh \
                     scripts/check-no-orchestration-server.test.sh \
                     scripts/security-lane-verdict.sh \
                     scripts/security-lane-verdict.test.sh

      - name: Release-asset verifier gate tests
        run: bash nix/packaging/release/verify-release-assets.test.sh


      - name: Clippy
        run: ./scripts/cargo-stable.sh clippy --all-targets -- -D warnings

      # The cucumber runner is `harness = false`, so it sits behind the `bdd`
      # feature to keep it out of `cargo nextest run --workspace` — nextest
      # enumerates tests with `--list`, which that target cannot answer. The
      # step above does not reach it either, since `--all-targets` still honors
      # `required-features`. Nothing else on a pull request builds it, so a
      # struct or signature change anywhere in the workspace can break the BDD
      # suite unnoticed and only surface in a release run. Compile it here.
      - name: Clippy (BDD conformance target)
        run: ./scripts/cargo-stable.sh clippy -p mvm-conformance --tests --features bdd -- -D warnings

  lint-policy:
    # This real policy lane publishes the existing required `Invariant`
    # context. The architecture scan used to occupy a separate workflow plus
    # an aggregate runner; keeping it here preserves the gate without that
    # merge-group fan-out.
    name: Invariant
    needs: [scope]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # Policy checks invoke xtask, and the stub/parity checks invoke the
      # pinned Python and TypeScript generators. They are independent of the
      # compiler lint lane, so start them on their own runner.
      - uses: ./.github/actions/apt-deps
        with:
          packages: lld ripgrep shellcheck

      # Nothing else validates the workflow files. A wrong `if:`, a typo'd
      # `needs:` job name, or a bad `${{ }}` reference does not fail a PR — it
      # silently disables the lane, which still reads as covered to anyone
      # auditing the file. Runs over every workflow, not just changed ones,
      # because a changed job can break a reference in a file it did not touch.
      # Placed after shellcheck is installed (actionlint shells out to it) but
      # before the slow toolchain steps, so a workflow error fails fast.
      # Pinned + checksum-verified rather than an installer action: actionlint
      # is a Go binary, so `install-action` has no recipe for it and its
      # cargo-binstall fallback looks for a crate that does not exist.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fL --retry 3 --retry-all-errors --retry-delay 2 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint workflow files
        run: actionlint .github/workflows/*.yml

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache

      - name: No orchestration server outside declared substrate categories
        if: needs.scope.outputs.architecture == 'true'
        run: bash scripts/check-no-orchestration-server.sh

      - name: Orchestration-server gate tests
        run: bash scripts/check-no-orchestration-server.test.sh

      # The nightly security lanes do not run on a PR, so this is the only
      # place their failure reporting is exercised before it has to work.
      - name: Security lane verdict tests
        run: bash scripts/security-lane-verdict.test.sh

      - name: Architecture scan not required for this diff
        if: needs.scope.outputs.architecture == 'false'
        run: echo "No architecture-relevant paths changed."

      # One driver, not sixty steps. It runs every gate and reports all
      # of them: the old shape stopped at the first failure, so a branch
      # breaking four gates cost four pushes and four full lanes to find
      # that out. `cargo run -p xtask -- <gate>` still runs any one of
      # them on its own.
      - name: Policy gates (check-abi-layout) (single-network-path)
        run: cargo run -p xtask -- check-all










      # Runs its own self-test first: a gate nobody has watched fail is a gate
      # nobody knows works, and this one is the relief valve for the exclusion
      # that let fabricated witness names live in specs/ for months.
      - name: Claim-bearing prose declares what backs it
        run: |
          cargo run -p xtask -- check-declared-backing --self-test
          cargo run -p xtask -- check-declared-backing






















      # The in-guest toolbox is deliberately ungoverned — the microVM boundary
      # bounds it. What the boundary cannot bound is the guest originating a
      # connection outward, so that is what this checks.

      # The other half of the same rule. The gate above says a guest has only
      # the vsock channel; this one says it speaks exactly one protocol over
      # it. A guest made FlowMux-only while the host still served the old
      # protocol is what killed egress on main with every test green.

      # An image's declared environment is resolved once. The console used to
      # assemble its own, which is why `machine run --image rust:latest -it`
      # opened a shell with the image's own toolchain missing from PATH.
      - name: one workload-env resolver (console and entrypoint agree on the image)
        run: cargo run -p xtask -- check-single-workload-env

      # A wall-clock bound is declared once, as a grant. `exec_secs` is that
      # grant's projection into the plan's older encoding; a second writer is a
      # second declaration of one decision, and the two can disagree.

      # Whether a destination is bound by a secret's `allowed_hosts` is decided
      # by `host_is_bound` and nowhere else. A second copy is a second decision,
      # and the disagreement surfaces as a credential reaching a destination it
      # should not.





      # release.yml runs on tags, so a per-VM binary added to the registry but
      # not to the release job is invisible until a user's downloaded mvmctl
      # fails to spawn it. Resolve it here, on the PR that adds it.




      # Manifest-level sibling to the closure budgets, which resolve trees and
      # therefore cannot see a member pinning a version behind the workspace
      # table's back, or a table entry nobody inherits.

      # Sibling to the default-closure budget: bounds what any *feature* can
      # pull in, which is where an off-by-default tree (wasm-backend's
      # wasmtime/cranelift family) would otherwise grow unobserved.



      - name: Detect fuzz-crate changes
        id: fuzz_changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
          if git diff --name-only "$BASE_SHA" HEAD 2>/dev/null | grep -qE '(^|/)fuzz[^/]*/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo-fuzz crates still compile
        if: steps.fuzz_changed.outputs.changed == 'true'
        run: |
          set -uo pipefail
          fail=0
          for manifest in crates/*/fuzz*/Cargo.toml crates/deps/*/fuzz*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            echo "::group::$manifest"
            cargo check --locked --manifest-path "$manifest" --all-targets || fail=1
            echo "::endgroup::"
          done
          exit "$fail"











  lint-features:
    name: Lint feature coverage
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache

      - name: Clippy (mvm-client tracing-bridge)
        run: ./scripts/cargo-stable.sh clippy -p mvm-client --all-targets --features tracing-bridge -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: hostd-transport feature tests (mvm-core)
        run: cargo nextest run -p mvm-core --features hostd-transport

      - name: client facade tests (mvm-core)
        run: cargo nextest run -p mvm-core --features client-remote

      # `schema` is off by default so the shipped closure carries no schemars;
      # the schema-shape tests and the three emitter bins only exist under it.
      - name: schema feature tests (mvm-sdk)
        run: |
          cargo nextest run -p mvm-sdk --features schema
          cargo check -p mvm-sdk --features schema --bins

      # `addons` is off by default so the sealed agent's request path stays
      # synchronous and tokio-free (`check-guest-agent-runtime-free` enforces
      # that, so this must stay a feature rather than move into default). But
      # the feature also gates the entire guest egress data path — `flowmux`,
      # `flowmux_egress`, `egress_client` — which every builder VM's networking
      # runs through. Nothing in the default lane compiles it, and a run of
      # defects shipped inside it as a result, each one only reachable by
      # booting a real VM. `--bins` because the loopback proxy is a `[[bin]]`
      # and a lib-only run would not build its entrypoint.
      - name: addons feature tests (guest egress data path)
        run: |
          cargo nextest run -p mvm-agentd --features addons
          cargo check -p mvm-agentd --features addons --bins

      # End-user release builds enable a bootstrap path that contributor builds
      # deliberately omit. Keep that source compiled with warnings denied on
      # every code-changing pull request so the nightly reproducibility lane is
      # evidence, not the first compiler to see it.
      - name: release-artifact bootstrap feature compiles
        run: cargo check -p mvm-cli --features release-artifact-bootstrap --lib

      - name: Assert auto-detect still picks libkrun off Linux/HVF
        run: |
          cargo test -p mvm-build --features builder-vm --lib \
            builder_backend_select::tests::auto_detect_default_for_everything_else_picks_libkrun

      - name: In-process pure-mkfs materialize tests
        run: cargo test -p mvm-build --features pure-mkfs --lib rootfs::tests::pure

      - name: test-support feature tests (mock backend)
        # One invocation, not one per package. Cargo resolves features per
        # invocation, so selecting a different package each time produced
        # different fingerprints and rebuilt most of the same graph seven
        # times over — 28 of this job's 35 minutes, and the critical path for
        # every pull request. These packages form one feature subtree
        # (mvm-cli -> mvm-runtime -> mvm-backends, mvm-vmm -> mvm-core), so a
        # single resolution covers all of them and compiles once.
        run: |
          cargo nextest run --features test-support --lib \
            -p mvm-backends -p mvm-runtime -p mvm-client -p mvm-cli -p mvm-vmm
          cargo nextest run -p mvmctl --features test-support --test audit_emissions_live
          cargo check -p mvm-cli --features test-support --example verification_loop

  lint:
    name: Lint (fmt + clippy + policy)
    if: ${{ always() }}
    needs: [scope, lint-core, lint-policy, lint-features]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lint lane to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CODE: ${{ needs.scope.outputs.code }}
          CORE_RESULT: ${{ needs.lint-core.result }}
          POLICY_RESULT: ${{ needs.lint-policy.result }}
          FEATURES_RESULT: ${{ needs.lint-features.result }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != success ] || [ "$POLICY_RESULT" != success ]; then
            echo "CI scope or policy did not pass: scope=$SCOPE_RESULT policy=$POLICY_RESULT"
            exit 1
          fi
          case "$SCOPE_CODE" in
            true) required=success ;;
            false) required=skipped ;;
            *) echo "Invalid code scope: $SCOPE_CODE"; exit 1 ;;
          esac
          for result in "$CORE_RESULT" "$FEATURES_RESULT"; do
            if [ "$result" != "$required" ]; then
              echo "A lint lane did not match scope $SCOPE_CODE: $result"
              exit 1
            fi
          done

  # The Gherkin scenarios previously ran only from release-tag workflows, so a
  # PR could break a scenario and merge green. Same reusable workflow the
  # release path calls, gated on the narrower `bdd` scope.
  bdd-conformance:
    name: BDD conformance
    needs: [scope]
    if: needs.scope.outputs.bdd == 'true'
    uses: ./.github/workflows/bdd.yml

  test:
    name: Test
    if: ${{ always() }}
    needs: [scope, test-workspace, test-workspace-aarch64, test-linux, test-release-witness, test-ebpf-telemetry, bdd-conformance, kernel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test lane to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CODE: ${{ needs.scope.outputs.code }}
          WORKSPACE_RESULT: ${{ needs.test-workspace.result }}
          WORKSPACE_AARCH64_RESULT: ${{ needs.test-workspace-aarch64.result }}
          LINUX_RESULT: ${{ needs.test-linux.result }}
          RELEASE_WITNESS_RESULT: ${{ needs.test-release-witness.result }}
          EBPF_RESULT: ${{ needs.test-ebpf-telemetry.result }}
          SCOPE_BDD: ${{ needs.scope.outputs.bdd }}
          BDD_RESULT: ${{ needs.bdd-conformance.result }}
          KERNEL_SCOPE: ${{ needs.scope.outputs.kernel }}
          KERNEL_RESULT: ${{ needs.kernel.result }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != success ]; then
            echo "CI scope did not pass: $SCOPE_RESULT"
            exit 1
          fi
          case "$SCOPE_CODE" in
            true) required=success ;;
            false) required=skipped ;;
            *) echo "Invalid code scope: $SCOPE_CODE"; exit 1 ;;
          esac
          for result in "$WORKSPACE_RESULT" "$WORKSPACE_AARCH64_RESULT" "$LINUX_RESULT" "$RELEASE_WITNESS_RESULT" "$EBPF_RESULT"; do
            if [ "$result" != "$required" ]; then
              echo "A test lane did not match scope $SCOPE_CODE: $result"
              exit 1
            fi
          done
          # The BDD and kernel lanes key off their own narrower scopes, so they
          # are matched separately rather than folded into the loop above.
          case "$SCOPE_BDD" in
            true) bdd_required=success ;;
            false) bdd_required=skipped ;;
            *) echo "Invalid bdd scope: $SCOPE_BDD"; exit 1 ;;
          esac
          if [ "$BDD_RESULT" != "$bdd_required" ]; then
            echo "BDD conformance did not match scope $SCOPE_BDD: $BDD_RESULT"
            exit 1
          fi
          # The kernel job carries no job-level `if:` — a skipped matrix job
          # cannot expand its arch, so it would report a single check still
          # carrying the un-expanded matrix placeholder in its name, matching
          # neither required context and leaving every PR unmergeable. It
          # therefore always runs and always reports `success`,
          # skipping its steps individually when out of scope. So `success` is
          # the required result in both scopes: an out-of-scope run skips its
          # steps and succeeds, an in-scope run actually builds. Requiring
          # `skipped` when out of scope — as this did before the job-level `if:`
          # was removed — failed every PR that does not touch a kernel path.
          if [ "$KERNEL_RESULT" != success ]; then
            echo "Kernel validation did not succeed (scope $KERNEL_SCOPE): $KERNEL_RESULT"
            exit 1
          fi

  test-workspace:
    name: Test workspace
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin lld

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build
        run: cargo build --all-targets

      - name: Validate nextest override filters
        run: cargo run -p xtask -- check-nextest-groups

      - name: xtask man-page tests
        # gen-man lives behind xtask's off-by-default `man` feature. It pulls
        # mvm-cli and its build script, so exercise it on Test's already-warm
        # test-profile graph instead of rebuilding that graph in Lint.
        run: cargo nextest run -p xtask --features man

      - name: Run tests
        run: cargo nextest run --workspace --all-targets

      - name: Run universal agent handler tests
        # DevOnly handlers are runtime-gated, so the default build now
        # compiles and exercises them for every artifact tier.
        run: cargo nextest run -p mvm-agentd --all-targets

      - name: Run addon/egress helper tests
        # The async loopback helper bins (mvm-addon-dns, mvm-addon-vsock-bridge,
        # mvm-egress-client) and their shared vsock session helper live behind
        # the off-by-default `addons` feature, so the default workspace run
        # skips their tests. Run mvm-agentd with the feature on so they stay
        # exercised on every PR.
        run: cargo nextest run -p mvm-agentd --features addons

      - name: Run doctests
        # nextest does not run doctests; gate them separately.
        run: cargo test --workspace --doc

  test-workspace-aarch64:
    name: Test workspace (aarch64)
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    # The only lane that executes mvm's aarch64 code paths. Everything else in
    # this workflow runs on x86_64, so arch-gated code compiles here for the
    # first time and its tests run for the first time. The sharpest example is
    # `jailer::seccomp::CONFINED_ROLE_SYSCALLS`, which is a *separate table* per
    # architecture: a wrong or missing entry in the aarch64 half SIGSYS-kills a
    # confined role at the moment it starts working, and no x86_64 runner can
    # see it. `GuestArch::host()`, the bundle arch gate, and the aarch64
    # `mvm-seccomp-apply` arm are in the same position.
    #
    # SCOPE, honestly: this proves the suite passes natively on aarch64. It does
    # NOT prove a guest boots — GitHub's arm64 runners expose no nested KVM, so
    # `backend.start()` is unreachable here exactly as it is in every other lane.
    # A green run here is not a Tier-1 boot witness; that still needs real
    # hardware.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin libcap-ng-dev lld

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # `mvm-fs` is excluded, and only on this lane. Its dev-dependency
      # `am-fs-ext4` (the independent ext4 read oracle `tests/oracle.rs` and
      # `tests/xattr.rs` check our writer against) does not compile for
      # aarch64-linux: it assumes `c_char == i8`, which holds on x86_64-linux
      # and on aarch64-*darwin* but not on aarch64-linux, where `c_char` is
      # `u8`. That is upstream's bug, in a dev-only oracle, and it is load
      # bearing on x86_64 — so the oracle stays an x86_64 oracle rather than
      # being dropped. `mvm-fs`'s own library still builds here as a dependency
      # of everything else; it is only its test targets that are skipped.
      - name: Build
        run: cargo build --workspace --exclude mvm-fs --all-targets

      - name: Run tests
        # The workspace suite only. The arch-independent extras Test workspace
        # also runs (man pages, the addons feature, doctests) are covered on
        # x86_64 and would only duplicate cost here.
        run: cargo nextest run --workspace --exclude mvm-fs --all-targets

  test-release-witness:
    name: Test release profile (overflow + no debug assertions)
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin lld

      - uses: ./.github/actions/install-zigbuild

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests under the release profile
        # Every other lane runs in a debug profile: debug assertions on,
        # integer overflow trapped by the profile default. The shipped binary
        # is neither of those things, so a test suite that only ever runs in
        # debug cannot witness the behaviour users get.
        #
        # `release-witness` is `release` minus fat LTO and single-codegen-unit
        # linking, which keeps the semantics under test (trapping overflow, no
        # debug assertions) without the link times.
        #
        # Deliberately scoped rather than workspace-wide: these are the crates
        # doing length arithmetic over bytes an attacker chooses — the ext4
        # writer and OCI unpacker, the plan/crypto core, the audit-log
        # verifier, the datapath and supervisor, and the vsock frame parser.
        # The rest of the workspace is covered in debug by `test-workspace`;
        # widening this lane costs CI minutes for code that does not parse
        # hostile input.
        run: |
          cargo nextest run --cargo-profile release-witness \
            -p mvm-fs -p mvm-core -p mvm-contract -p mvm-hostd -p mvm-agentd

  test-linux:
    name: Test Linux and conformance
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-wasip1

      - uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin lld

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache

      - name: Install pinned no_std toolchain and targets
        run: |
          rustup toolchain install 1.96.0 --profile minimal \
            --target wasm32-unknown-unknown,wasm32-wasip1,riscv32imac-unknown-none-elf

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run Linux, no_std, filesystem, and conformance coverage
        run: bash scripts/ci-linux-coverage.sh

  test-ebpf-telemetry:
    name: Test eBPF telemetry load/attach
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly Rust toolchain for eBPF build
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      # This lane compiles a different crate set from the shared workspace key
      # and builds bpf-linker from source, so it gets its own entry rather than
      # diluting the one every other lane restores.
      - uses: ./.github/actions/rust-cache
        with:
          key: ebpf

      # Pinned deliberately. `--locked` only honors the crate's own bundled
      # lockfile; it does not pin which version gets installed, so an upstream
      # release silently changes this lane's toolchain. 0.11.0 did exactly that
      # on 2026-08-12, requiring an LLVM newer than the runner image ships and
      # breaking the build script. This version must move together with the
      # `aya` version in Cargo.lock.
      - name: Install bpf-linker
        run: cargo +nightly install --locked --version 0.10.4 bpf-linker

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build the eBPF object
        run: just build-ebpf

      - name: Run mvm-hostd eBPF telemetry load/attach test
        run: cargo test -p mvm-hostd --features ebpf-telemetry --lib

  # ── Lane: cold-boot latency ceiling ──────────────────────────────
  # A launch-latency regression is otherwise found by hand, months late:
  # Firecracker guest boot drifted to 447ms against 58.6ms on the same image
  # and was noticed only when someone profiled a launch for another reason.
  #
  # This is the coarse half of the gate deliberately. A shared runner's
  # variance is large, so the budget is loose enough to be immune to it and
  # therefore too loose to catch a 20% drift. It catches the multiple-x class,
  # which is the class that has actually happened. The precise, tight-tolerance
  # comparison belongs on a dedicated host where run-to-run spread is small
  # enough for a percentage to mean something — that is a separate lane, not
  # this one, because one threshold cannot do both jobs: loose enough to
  # survive shared-runner noise is too loose to catch drift, and tight enough
  # to catch drift will flake here and get switched off.
  boot-latency:
    name: Boot latency ceiling
    # Merge queue and manual dispatch, not every PR push. This lane needs a KVM
    # runner and takes ~11 minutes, and at the 20-concurrent-job cap six of them
    # were queued at once across open PRs — it was a material share of the wait
    # before any PR's own jobs could start.
    #
    # Safe to move because of what this lane is: it pins a *published* image on
    # purpose, as a control variable, so a regression it catches is in host-side
    # code and is caught in the queue before anything reaches main. The budget is
    # a ceiling with roughly 3x headroom over the observed median, not a
    # tolerance — it exists to catch multiple-x regressions, and one merge-queue
    # run catches those exactly as well as one run per push.
    #
    # `nix-flake-check` below makes the same trade for the same reason.
    needs: [scope]
    if: >-
      needs.scope.outputs.code == 'true'
      && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pinned, not `latest`. Auto-tracking a moving release is how this lane
      # would surprise-break on an unrelated image cut, and it would look like
      # a latency regression when it is not.
      # The boot image train, not the CLI train. `v0.18.0` was a workspace
      # version bump, never a cut release, so this lane 404'd on an asset
      # nobody had published. Boot images get their own tags precisely so
      # this pin stops moving with the CLI's version — keep it in step with
      # `DEFAULT_BOOT_IMAGE_TAG` in mvm-core's config.
      IMAGE_TAG: boot-image/v0.1.3
      # Must track `crates/mvm-core/src/config.rs::FC_VERSION_DEFAULT`. The
      # launch path passes `--enable-pci`, which older Firecracker rejects
      # outright: it exits before creating its API socket, and the only symptom
      # is a socket-wait timeout that says nothing about the cause.
      FC_VERSION: v1.14.1
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      # This lane anchors on a checksum manifest it downloads. Whoever could
      # swap the artifact could swap its recorded digest too, so the manifest
      # is only worth anchoring on once its signature is checked — which is the
      # same reasoning that made these manifests signed in the first place.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Building the root package runs `crates/mvm-cli/build.rs`, which
      # cross-compiles the embedded host binaries and needs the pinned zig.
      # Without it the lane fails before it ever boots anything.
      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache
        with:
          key: boot-latency

      - name: Install firecracker
        run: |
          set -euo pipefail
          curl -fL -o firecracker.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          tar -xzf firecracker.tgz
          sudo install -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" /usr/bin/firecracker
          /usr/bin/firecracker --version

      - name: Grant /dev/kvm access for the job
        # ubuntu-latest's /dev/kvm is root:kvm 0660 and the runner user is not
        # in the kvm group. The runner is ephemeral, so the looser mode is
        # confined to this job.
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing on this runner — the boot gate cannot run." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Fetch and verify the pinned bootable image
        # Signature-verified, then hash-verified against the release's own
        # checksum manifest — the same posture every other artifact fetch in
        # this repo uses. A corrupted download must fail here rather than
        # surface as a boot-time mystery, and a substituted one must fail here
        # rather than boot.
        env:
          # The boot image ships on its own train, so its manifests are signed
          # by release-boot-image.yml rather than release.yml. Pinning the
          # wrong workflow here would accept a signature from any other
          # workflow in this repo.
          COSIGN_IDENTITY_REGEXP: "^https://github.com/${{ github.repository }}/.github/workflows/release-boot-image.yml@refs/tags/.*$"
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          mkdir -p /tmp/boot-image && cd /tmp/boot-image
          base="https://github.com/tinylabscom/mvm/releases/download/${IMAGE_TAG}"
          for f in default-microvm-vmlinux-x86_64 default-microvm-rootfs-x86_64.ext4 \
                   default-microvm-meta-x86_64.json; do
            curl -fL --retry 3 -o "$f" "$base/$f"
          done
          # The prod rootfs has no baked agent — /init resolves it from
          # /mvm/runtime, the runtime overlay attached as a second virtio-blk
          # drive. Fetching kernel and rootfs alone boots a guest that panics at
          # `Attempted to kill init!` before the agent binds vsock, which reads
          # as a broken image rather than an incomplete fetch.
          curl -fL --retry 3 -o runtime-overlay-x86_64.tar.gz \
            "$base/runtime-overlay-x86_64.tar.gz"
          curl -fL --retry 3 -o checksums.txt \
            "$base/default-microvm-x86_64-checksums-sha256.txt"
          # Both signature bundles, published beside what they sign.
          curl -fL --retry 3 -o checksums.txt.bundle \
            "$base/default-microvm-x86_64-checksums-sha256.txt.bundle"
          curl -fL --retry 3 -o runtime-overlay-x86_64.tar.gz.bundle \
            "$base/runtime-overlay-x86_64.tar.gz.bundle"
          # Signature before digest, in that order and not the other way round:
          # a digest comparison only says the bytes match what the manifest
          # claims, and an attacker who can replace the artifact can replace the
          # manifest beside it. `release-boot-image.yml` cosign-signs both of
          # these on the tag push that publishes them, so the identity below is
          # that workflow at a tag ref — the same keyless-OIDC check
          # `verify-release-assets.sh` applies to every other manifest in this
          # repo. Nothing here is verified against a signature this lane fetched
          # from the same place as the thing it signs *without* pinning who
          # signed it.
          cosign verify-blob \
            --bundle checksums.txt.bundle \
            --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            checksums.txt
          cosign verify-blob \
            --bundle runtime-overlay-x86_64.tar.gz.bundle \
            --certificate-identity-regexp "$COSIGN_IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            runtime-overlay-x86_64.tar.gz
          grep -E ' (default-microvm-vmlinux-x86_64|default-microvm-rootfs-x86_64\.ext4|default-microvm-meta-x86_64\.json)$' \
            checksums.txt > expected.txt
          test -s expected.txt
          sha256sum -c expected.txt
          # The runtime-overlay admission gate reads `mvm-meta.json` from the
          # rootfs's own directory and refuses to boot without it. The release
          # publishes that sidecar under an arch-qualified asset name, so it has
          # to be put back under the name the gate looks for. Verified above
          # under its asset name before being renamed.
          cp default-microvm-meta-x86_64.json mvm-meta.json
          # The overlay tarball carries its own checksum manifest; verify
          # against that rather than trusting the archive.
          mkdir -p overlay && tar -C overlay -xzf runtime-overlay-x86_64.tar.gz
          ( cd overlay && sha256sum -c checksums-sha256.txt )
          ls -la overlay
          ls -la

      - name: Boot within the ceiling
        # The budget is a ceiling, not a target. A dedicated KVM host measures
        # this image cold-boot-to-agent-ready at a median of ~2.1s, so 6s
        # leaves roughly 3x headroom for a shared runner while still failing
        # the multiple-x regressions this lane exists to catch. p50/p95/max are
        # printed on every run, so tightening it later is a reading exercise
        # rather than a guess.
        env:
          MVM_RUNTIME_BOOT_BENCH: "1"
          MVM_RUNTIME_BOOT_BACKEND: firecracker
          MVM_RUNTIME_BOOT_KERNEL: /tmp/boot-image/default-microvm-vmlinux-x86_64
          MVM_RUNTIME_BOOT_ROOTFS: /tmp/boot-image/default-microvm-rootfs-x86_64.ext4
          MVM_RUNTIME_BOOT_OVERLAY: /tmp/boot-image/overlay/overlay.ext4
          MVM_RUNTIME_BOOT_OVERLAY_VERITY: /tmp/boot-image/overlay/overlay.verity
          MVM_RUNTIME_BOOT_READY: guest-agent
          MVM_RUNTIME_BOOT_RUNS: "5"
          MVM_RUNTIME_BOOT_CONCURRENT: "3"
          MVM_RUNTIME_BOOT_BUDGET_MS: "6000"
        run: |
          MVM_RUNTIME_BOOT_OVERLAY_ROOTHASH="$(tr -d '[:space:]' \
            < /tmp/boot-image/overlay/overlay.roothash)" \
          cargo test --test runtime_boot_bench \
            prebuilt_runtime_image_boots_within_budget -- --exact --nocapture

      - name: Dump VMM diagnostics on failure
        if: failure()
        # Firecracker's stderr goes to `firecracker.log` in the per-VM state
        # dir and its console to `console.log`; neither reaches the job output.
        # Without this a launch failure surfaces only as "API socket did not
        # appear", which is a symptom and never the cause.
        run: |
          for d in "$HOME"/.mvm/vms/*/; do
            echo "===== $d ====="
            ls -la "$d" || true
            for f in firecracker.log console.log; do
              if [ -s "$d$f" ]; then
                echo "--- $f ---"; tail -50 "$d$f"
              fi
            done
          done
  # Publish the existing required kernel contexts from the shared scope graph.
  # The dedicated workflow remains responsible for release/manual artifact
  # builds, but no longer allocates its own scope runner on every queue entry.
  kernel:
    name: Build kernels (${{ matrix.arch }})
    needs: [scope]
    # No job-level `if:`. A skipped matrix job cannot expand `matrix.arch`, so
    # it reports one check literally named `Build kernels (${{ matrix.arch }})`
    # — which matches neither required context, leaving every PR that does not
    # touch kernel paths permanently unmergeable. Every step below carries the
    # scope condition instead, so an out-of-scope run costs a few seconds and
    # still reports both names.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Report scope
        run: |
          if [ "${{ needs.scope.outputs.kernel }}" = "true" ]; then
            echo "Kernel inputs changed — building and enforcing the symbol budget."
          else
            echo "No kernel-relevant paths changed."
          fi

      - uses: actions/checkout@v6
        if: needs.scope.outputs.kernel == 'true'

      - name: Install Nix
        if: needs.scope.outputs.kernel == 'true'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build builder and workload kernels
        if: needs.scope.outputs.kernel == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-kernel-artifacts.sh "$ARCH"

      - name: Assert the lane built what its scope demanded
        # Replaces what the `test` aggregate used to get from the job's own
        # conclusion. Gating the steps rather than the job means a
        # mis-gated step would leave the job green and empty, so the check
        # has to look at the bytes.
        if: needs.scope.outputs.kernel == 'true'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for f in "staging/vmlinux-${ARCH}-builder" "staging/vmlinux-${ARCH}-workload"; do
            if [ ! -s "$f" ]; then
              echo "::error::kernel scope is true but $f is missing or empty" >&2
              exit 1
            fi
          done

      - name: Upload kernel artifacts
        if: ${{ always() && needs.scope.outputs.kernel == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: kernels-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            staging/vmlinux-${{ matrix.arch }}-builder
            staging/vmlinux-${{ matrix.arch }}-workload
            staging/kernel-${{ matrix.arch }}-checksums-sha256.txt
            staging/kernel-${{ matrix.arch }}.json
            staging/kernel-metrics-${{ matrix.arch }}.json
            staging/workload-config-${{ matrix.arch }}

  guest-image-boot:
    name: Guest image boots (tree-built)
    # The gap #2635 names: nothing builds the guest image generator's output and
    # starts it before the change is on main. The only lane that boots a
    # tree-built image runs on a `boot-image/v*` tag, which is after the merge.
    # That is how a rootfs whose /init the kernel could not exec shipped for five
    # weeks with every checksum verifying clean, and how five successive release
    # runs each surfaced exactly one more layer — an unattached overlay, a guest
    # never told where the overlay was, a sidecar field the serializer dropped —
    # none of which any static check can see, because each one needs a guest that
    # actually runs.
    #
    # Merge queue, not per-PR, and the cost argument is wall-clock rather than
    # runner-minutes: this job takes ~33 minutes, and the merge-group CI it joins
    # already takes 32-36, so running in parallel it adds close to nothing to how
    # long a merge takes. Per-PR it would be pure addition on every push.
    # `nix-flake-check` above sets the same precedent for the same reason.
    needs: [scope]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk
        if: needs.scope.outputs.nix == 'true'

      - name: Install Nix
        if: needs.scope.outputs.nix == 'true'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install Rust toolchain
        if: needs.scope.outputs.nix == 'true'
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: ./.github/actions/apt-deps
        if: needs.scope.outputs.nix == 'true'
        with:
          packages: lld

      # `cargo test` below builds mvmctl, whose build.rs cross-compiles the
      # embedded host binaries as static musl and needs the pinned zig. Without
      # it this dies at compile time, before it starts a guest — which reads as
      # "the image does not boot" and is nothing of the kind.
      - uses: ./.github/actions/install-zigbuild
        if: needs.scope.outputs.nix == 'true'

      - name: Build the guest image from this tree
        if: needs.scope.outputs.nix == 'true'
        run: |
          set -euo pipefail
          nix build "./nix/images/default-tenant#packages.x86_64-linux.default" \
            --impure --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          mkdir -p staging
          # cp -L so each artifact resolves through its nix-store symlink.
          cp -L "$STORE_PATH/vmlinux"       staging/vmlinux
          cp -L "$STORE_PATH/rootfs.ext4"   staging/rootfs.ext4
          cp -L "$STORE_PATH/mvm-meta.json" staging/mvm-meta.json

      - name: Assert the tree-built rootfs has an exec'able /init
        if: needs.scope.outputs.nix == 'true'
        run: |
          set -euo pipefail
          # The cheap half, and the one that catches the defect that actually
          # shipped. Runs before the boot so a rootfs the kernel cannot exec
          # fails here, where the message says so, rather than as a panic.
          command -v debugfs >/dev/null 2>&1 \
            || { sudo apt-get update && sudo apt-get install -y e2fsprogs; }
          bash nix/packaging/release/assert-init-shebang.sh \
            staging/rootfs.ext4 "tree-built x86_64"
          bash nix/packaging/release/assert-kernel-format.sh \
            staging/vmlinux x86_64 "tree-built x86_64 kernel"

      # The prod rootfs bakes no agent — /init resolves it from /mvm/runtime,
      # the runtime overlay attached as a second virtio-blk drive. The nix store
      # is warm from the image build, so this is usually a store lookup rather
      # than a build.
      - name: Build the runtime overlay
        if: needs.scope.outputs.nix == 'true'
        run: |
          set -euo pipefail
          OVERLAY_PATH=$(nix build "./nix/images/runtime-overlay#packages.x86_64-linux.default" \
            --no-link --print-out-paths | head -1)
          mkdir -p overlay-staging
          cp -L "$OVERLAY_PATH/overlay.ext4"     overlay-staging/overlay.ext4
          cp -L "$OVERLAY_PATH/overlay.verity"   overlay-staging/overlay.verity
          cp -L "$OVERLAY_PATH/overlay.roothash" overlay-staging/overlay.roothash
          echo "MVM_RUNTIME_BOOT_OVERLAY_ROOTHASH=$(tr -d '[:space:]' < overlay-staging/overlay.roothash)" \
            >> "$GITHUB_ENV"

      - name: Install firecracker
        if: needs.scope.outputs.nix == 'true'
        env:
          # Tracks `crates/mvm-core/src/config.rs::FC_VERSION_DEFAULT`.
          FC_VERSION: v1.14.1
        run: |
          set -euo pipefail
          curl -fL -o firecracker.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          tar -xzf firecracker.tgz
          sudo install -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" /usr/bin/firecracker
          /usr/bin/firecracker --version

      - name: Grant /dev/kvm access for the job
        if: needs.scope.outputs.nix == 'true'
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing on this runner — the boot gate cannot run." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Boot the tree-built image
        if: needs.scope.outputs.nix == 'true'
        # Not a latency assertion. The budget is an order of magnitude above the
        # observed median and RUNS/CONCURRENT are 1, because the only question
        # here is whether this tree's image reaches userspace and binds its
        # agent. Latency belongs to `boot-latency`, which pins a *published*
        # image deliberately so a regression is unambiguous between host code
        # and image — the two lanes answer different questions and neither
        # substitutes for the other.
        env:
          MVM_RUNTIME_BOOT_BENCH: "1"
          MVM_RUNTIME_BOOT_BACKEND: firecracker
          MVM_RUNTIME_BOOT_KERNEL: staging/vmlinux
          MVM_RUNTIME_BOOT_ROOTFS: staging/rootfs.ext4
          MVM_RUNTIME_BOOT_OVERLAY: overlay-staging/overlay.ext4
          MVM_RUNTIME_BOOT_OVERLAY_VERITY: overlay-staging/overlay.verity
          MVM_RUNTIME_BOOT_READY: guest-agent
          MVM_RUNTIME_BOOT_RUNS: "1"
          MVM_RUNTIME_BOOT_CONCURRENT: "1"
          MVM_RUNTIME_BOOT_BUDGET_MS: "60000"
        run: |
          set -euo pipefail
          # No copy needed: the runtime-overlay admission gate reads
          # `mvm-meta.json` from the rootfs's own directory, and the build step
          # already staged it beside `rootfs.ext4`.
          test -f staging/mvm-meta.json
          cargo test --test runtime_boot_bench \
            prebuilt_runtime_image_boots_within_budget -- --exact --nocapture

      - name: Guest console on failure
        if: ${{ failure() && needs.scope.outputs.nix == 'true' }}
        run: |
          for d in "$HOME"/.mvm/vms/*/; do
            echo "===== $d ====="
            ls -la "$d" || true
            # `if`, not `A && B || C`: with the latter the `|| true` also runs
            # when `cat` itself fails, which would hide a console.log that
            # exists but cannot be read — the one case worth seeing here.
            if [ -f "$d/console.log" ]; then
              cat "$d/console.log"
            fi
          done

  nix-flake-check:
    name: Nix flake check (Linux eval)
    # Nix eval/build is heavy; run it in the merge queue and on manual dispatch,
    # not on every PR update.
    needs: [scope]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        if: needs.scope.outputs.nix == 'true'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore Nix binary cache
        if: needs.scope.outputs.nix == 'true'
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""

      - name: Install Rust toolchain
        if: needs.scope.outputs.nix == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Eval-check every flake
        if: needs.scope.outputs.nix == 'true'
        run: |
          set -euo pipefail
          find nix -name flake.nix -type f -print0 | sort -z | while IFS= read -r -d '' flake; do
            d="$(dirname "$flake")"
            echo "=== $d ==="
            nix flake check --no-build "./$d"
          done

      # This runner is x86_64, so only the x86_64-linux check variant builds
      # here; the aarch64-linux variant stays defined for parity and for a
      # future arm64 runner.
      - name: Baked guest rootfs closure stays lean and glibc-free
        if: needs.scope.outputs.nix == 'true'
        run: |
          set -euo pipefail
          nix build --print-build-logs \
            ./nix#checks.x86_64-linux.guest-rootfs-no-glibc \
            ./nix#checks.x86_64-linux.guest-rootfs-package-budget

      - name: Runtime overlay uses static-musl guest binaries
        if: needs.scope.outputs.nix == 'true'
        run: |
          set -euo pipefail
          nix build --print-build-logs \
            ./nix/images/runtime-overlay#packages.x86_64-linux.default \
            ./nix/images/runtime-overlay#packages.x86_64-linux.sdk-sidecar \
            ./nix/images/runtime-overlay#packages.x86_64-linux.sdk-sidecar-image

      # Both directions, together, over the artifacts the step above already
      # built — a closure query, not a second build of the same binaries.
      #
      # The overlay's ext4 is an opaque image with no store references, so
      # querying the *image* would be vacuously empty; these query the
      # executables staged into it, and the cdylib the sidecar ships. The greps
      # are hash-anchored (`/nix/store/<hash>-glibc…`) so they match the glibc
      # package's own store path, never a derivation whose name merely contains
      # "glibc".
      #
      # The positive direction is what makes the split meaningful: without it, a
      # change that deleted the SDK cdylib outright would satisfy every
      # no-glibc assertion and read as a footprint win.
      - name: Runtime overlay is glibc-free and the SDK closure moved to the sidecar
        if: needs.scope.outputs.nix == 'true'
        run: |
          set -euo pipefail
          overlay=./nix/images/runtime-overlay
          glibc_re='/nix/store/[a-z0-9]+-glibc(-|$)'

          staged_closure=$(mktemp)
          for binary in guest runner egressClient addonDns exitReport; do
            path=$(nix eval --raw "$overlay#packages.x86_64-linux.default.passthru.$binary")
            nix path-info -r "$path" >> "$staged_closure"
          done
          if grep -Eq -- "$glibc_re" "$staged_closure"; then
            echo "glibc present in the runtime overlay's staged-executable closure:" >&2
            grep -E -- "$glibc_re" "$staged_closure" >&2
            exit 1
          fi
          echo "ok: runtime overlay staged executables carry no glibc"

          hostsvc=$(nix eval --raw "$overlay#packages.x86_64-linux.sdk-sidecar.passthru.hostsvc")
          if ! nix path-info -r "$hostsvc" | grep -Eq -- "$glibc_re"; then
            echo "the SDK host-services cdylib no longer depends on glibc — the" >&2
            echo "sidecar split is only meaningful while it does:" >&2
            nix path-info -r "$hostsvc" >&2
            exit 1
          fi
          sidecar=$(nix build --no-link --print-out-paths \
            "$overlay#packages.x86_64-linux.sdk-sidecar")
          for required in libmvm_host_services.so libc.so.6 libgcc_s.so.1; do
            test -e "$sidecar/lib/$required" \
              || { echo "SDK sidecar is missing $required" >&2; exit 1; }
          done
          echo "ok: the glibc SDK closure lives in the sidecar"


      - name: Nix-built guest artifacts fit the 50 MB footprint
        if: needs.scope.outputs.nix == 'true'
        run: |
          set -euo pipefail
          nix build --print-build-logs --impure --no-link --print-out-paths \
            ./nix/images/default-tenant#packages.x86_64-linux.default \
            > /tmp/default-tenant-path.txt
          image_path=$(head -1 /tmp/default-tenant-path.txt)
          nix build --print-build-logs --no-link --print-out-paths \
            ./nix/images/runtime-overlay#packages.x86_64-linux.default \
            > /tmp/runtime-overlay-path.txt
          overlay_path=$(head -1 /tmp/runtime-overlay-path.txt)
          # The optional SDK sidecar is measured against its own ceiling and
          # reported on its own ledger line — never folded into the base total.
          nix build --print-build-logs --no-link --print-out-paths \
            ./nix/images/runtime-overlay#packages.x86_64-linux.sdk-sidecar-image \
            > /tmp/sdk-sidecar-path.txt
          sidecar_path=$(head -1 /tmp/sdk-sidecar-path.txt)
          cargo run -p xtask -- perf footprint \
            --rootfs "$image_path/rootfs.ext4" \
            --rootfs-verity "$image_path/rootfs.verity" \
            --kernel "$image_path/vmlinux" \
            --overlay "$overlay_path/overlay.ext4" \
            --overlay-verity "$overlay_path/overlay.verity" \
            --closure-paths "$image_path/rootfs-closure-paths" \
            --sdk-sidecar "$sidecar_path/sdk.ext4" \
            --json

  # aarch64 no-KVM smoke test. GitHub's ubuntu-24.04-arm runners expose no
  # nested KVM, so this exercises the same QEMU TCG fallback path a Raspberry
  # Pi without /dev/kvm would take: build the workload flake through the Linux
  # Stage 0 QEMU builder, seal it as a signed .mvmpkg, install it, and boot the
  # installed bundle with the QEMU backend.
  aarch64-no-kvm-smoke:
    name: Aarch64 no-KVM bundle smoke (QEMU TCG)
    needs: [scope]
    if: >-
      needs.scope.outputs.code == 'true'
      && (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04-arm
    # Cold paths may compile the workload kernel inside Stage 0 under TCG.
    timeout-minutes: 300
    env:
      CARGO_TERM_COLOR: always
      MVM_HOME: ${{ github.workspace }}/.mvm-ci
      # A cold no-KVM build compiles the workload under TCG and can exceed
      # the normal 30-minute builder deadline while still making progress.
      MVM_BUILDER_VM_TIMEOUT_SECS: 7200
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/apt-deps
        with:
          # qemu-system-arm provides qemu-system-aarch64; e2fsprogs provides the
          # mkfs.ext4/debugfs tools the Stage 0 builder uses to pack images.
          packages: qemu-system-arm ipxe-qemu e2fsprogs attr jq virtiofsd

      - uses: ./.github/actions/rust-cache
        with:
          key: aarch64-no-kvm-smoke

      - name: Grant QEMU access to vhost-vsock
        run: |
          test -c /dev/vhost-vsock
          sudo chown "$USER" /dev/vhost-vsock
          sudo chmod 0600 /dev/vhost-vsock

      # The release-cut bootstrap path can download a published builder VM
      # image; the default source-checkout path would rebuild it from scratch
      # inside Stage 0 under TCG, which is far too slow for a CI gate. Build
      # with the release bootstrap feature and hide the in-repo builder VM
      # flake so `mvmctl` treats this as an installed binary and downloads the
      # published image instead.
      - name: Build mvmctl
        env:
          # This witness boots embedded builder-guest code. A restored Cargo
          # cache may contain binaries built from an older source tree, which
          # would make the live gate validate stale mvm-host-vm-init behavior.
          MVM_EMBED_NO_CACHE: 1
        run: cargo build --release -p mvmctl --features release-artifact-bootstrap,release-channel

      - name: Use published builder VM bootstrap path
        run: mv nix/images/builder-vm nix/images/builder-vm.hidden

      - name: Build and boot the sealed exit_code workload under QEMU TCG
        id: first-boot
        env:
          MVM_KERNEL_SOURCE: auto
        run: |
          set -euo pipefail
          mkdir -p "$MVM_HOME"
          set +e
          ./target/release/mvmctl machine run \
            --flake examples/exit_code \
            --builder qemu \
            --hypervisor qemu \
            -v \
            -- /bin/true \
            > /tmp/mvmctl-first-boot.log 2>&1
          actual=$?
          set -e
          if [ "$actual" -ne 7 ]; then
            echo "::error::expected guest exit code 7 from first boot, got $actual"
            tail -250 /tmp/mvmctl-first-boot.log
            exit 1
          fi
          echo "ok: sealed aarch64 workload built and exited $actual under QEMU TCG"

      - name: Export, install, and re-run the bundle
        id: bundle-roundtrip
        run: |
          set -euo pipefail
          slot_hash=$(./target/release/mvmctl manifest ls --json 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | jq -r '.[0].slot_hash')
          ./target/release/mvmctl bundle export "$slot_hash" \
            --out /tmp/exit-code-aarch64.mvmpkg \
            > /tmp/mvmctl-export.log 2>&1
          ./target/release/mvmctl trust add "$MVM_HOME/keys/host-signer.pub"
          install_output=$(./target/release/mvmctl bundle install /tmp/exit-code-aarch64.mvmpkg 2>&1 | tee /tmp/mvmctl-install.log)
          installed_sha=$(printf '%s' "$install_output" | sed 's/\x1b\[[0-9;]*m//g' | awk '/Installed bundle / {print $3}')
          echo "installed bundle content address: $installed_sha"
          set +e
          ./target/release/mvmctl machine run \
            --manifest "$installed_sha" \
            --hypervisor qemu \
            -v \
            -- /bin/true \
            > /tmp/mvmctl-bundle-run.log 2>&1
          actual=$?
          set -e
          if [ "$actual" -ne 7 ]; then
            echo "::error::expected guest exit code 7 from installed bundle, got $actual"
            tail -250 /tmp/mvmctl-bundle-run.log
            exit 1
          fi
          echo "ok: installed aarch64 bundle exited $actual under QEMU TCG"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          for log in /tmp/mvmctl-first-boot.log /tmp/mvmctl-export.log \
                     /tmp/mvmctl-install.log /tmp/mvmctl-bundle-run.log; do
            if [ -f "$log" ]; then
              echo "===== $log ====="
              tail -250 "$log" || true
            fi
          done
          echo "===== VM state dirs ====="
          for d in "$MVM_HOME"/vms/*/ "$MVM_HOME"/cache/builder-vm/vms/*/; do
            echo "--- $d ---"
            ls -la "$d" || true
            for f in console.log firecracker.log qemu.log; do
              if [ -s "$d$f" ]; then
                echo "--- $f ---"; tail -100 "$d$f" || true
              fi
            done
          done
