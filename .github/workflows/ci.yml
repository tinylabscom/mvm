name: CI

on:
  # Two tiers. A pull request runs the fast gate: formatting, clippy over the
  # core build and the feature combinations, the policy gates, a compile of
  # every workspace test target, and the sharded x86_64 workspace suite. Those
  # are the deterministic failures a PR has to expose before it is admitted,
  # because a batched merge group inherits every failure of the entries ahead
  # of it. The merge queue then runs the full matrix — every fast-gate lane
  # plus the slow ones (feature test suites, BDD, aarch64, release-profile and
  # musl witnesses, eBPF, Linux coverage, Nix evaluation and the boot ceiling)
  # — against the integrated commit, which is the only commit that merges.
  # Platform, live-VM, OCI ratification, security, and release artifact jobs
  # live in release/manual workflows. The Windows lane cross-compiles portable
  # crates; it does not run a Windows host.
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A pull request's ref is stable across pushes, so a new commit cancels the
# superseded run for that PR. Each merge group has its own ref, and the queue
# builds several groups at once, so a group never shares a key with — or
# cancels — another group's run; GitHub retires an invalidated group itself.
# Manual dispatches receive a unique key so diagnostics do not block each
# other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Classify each pull request, or the merge-group head against its target
  # branch, once. Keeping classification in one fail-closed job prevents
  # lane-specific path filters drifting.
  scope:
    name: CI scope
    # Merge groups only need git/grep classification, so avoid waiting for a
    # full hosted image while PR matrices occupy the standard runner pool.
    runs-on: ${{ github.event_name == 'merge_group' && 'ubuntu-slim' || 'ubuntu-24.04' }}
    outputs:
      code: ${{ steps.validate.outputs.code }}
      docs: ${{ steps.validate.outputs.docs }}
      nix: ${{ steps.validate.outputs.nix }}
      architecture: ${{ steps.validate.outputs.architecture }}
      guest_image: ${{ steps.validate.outputs.guest_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The queue is either a singleton or the one batched shape that
      # scripts/check-merge-queue-policy.sh names. Batching is safe only
      # because every group runs the full matrix and the fast gate already
      # caught the deterministic failures on each pull request.
      - name: Enforce merge queue policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/check-merge-queue-policy.test.sh

          rulesets="$RUNNER_TEMP/merge-queue-rulesets.json"
          gh api "repos/${REPO}/rulesets" > "$rulesets"
          matches=$(jq '[.[] | select(.name == "main merge queue" and .enforcement == "active")] | length' "$rulesets")
          if [ "$matches" != 1 ]; then
            echo "::error::Expected exactly one active 'main merge queue' ruleset; found $matches."
            exit 1
          fi
          ruleset_id=$(jq -er '[.[] | select(.name == "main merge queue" and .enforcement == "active")][0].id' "$rulesets")

          policy="$RUNNER_TEMP/merge-queue-policy.json"
          gh api "repos/${REPO}/rulesets/${ruleset_id}" > "$policy"
          bash scripts/check-merge-queue-policy.sh "$policy"

      - name: Classify changed paths
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          set_all() {
            for output in code docs nix architecture guest_image; do
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            done
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            set_all
            echo "manual dispatch — running every lane"
            exit 0
          fi

          case "$EVENT" in
            merge_group)
              case "$MG_BASE_REF" in
                refs/heads/*) TARGET_BRANCH="${MG_BASE_REF#refs/heads/}" ;;
                *)
                  set_all
                  echo "invalid merge-group base ref $MG_BASE_REF — running every lane to stay safe"
                  exit 0
                  ;;
              esac
              if ! git fetch --no-tags origin "$TARGET_BRANCH"; then
                set_all
                echo "could not fetch $MG_BASE_REF — running every lane to stay safe"
                exit 0
              fi
              if ! BASE=$(git merge-base "origin/$TARGET_BRANCH" "$MG_HEAD"); then
                set_all
                echo "could not find the merge base for $MG_BASE_REF..$MG_HEAD — running every lane to stay safe"
                exit 0
              fi
              HEAD="$MG_HEAD"
              ;;
            pull_request)
              if ! BASE=$(git merge-base "$PR_BASE" "$PR_HEAD"); then
                set_all
                echo "could not find the pull-request merge base — running every lane to stay safe"
                exit 0
              fi
              HEAD="$PR_HEAD"
              ;;
            *) echo "::error::unhandled event $EVENT" >&2; exit 1 ;;
          esac

          CHANGED_FILE=$(mktemp)
          trap 'rm -f "$CHANGED_FILE"' EXIT
          if ! git diff --name-only -z "$BASE" "$HEAD" > "$CHANGED_FILE" 2>/dev/null; then
            set_all
            echo "could not diff $BASE..$HEAD — running every lane to stay safe"
            exit 0
          fi

          # Anything that can change a compiled target, generated artifact, or
          # the commands used by a Rust lane keeps the full compiler/test
          # matrix. Prose, site assets, and process-only specs do not.
          #
          # `nix/` is here whole, replacing a narrow
          # `nix/packaging/release/*.sh` entry, because the guest image
          # generator has Rust guards that only run under this flag and
          # tests/nix_flake_structure.rs reads across lib/, packages/ and
          # profiles/. `mk_guest_init_shebang_lands_at_byte_zero`
          # renders `initText` out of nix/lib/mk-guest.nix and asserts the
          # shebang lands on byte 0 — no Nix needed, well under a second. It
          # was written for the defect that shipped a rootfs the kernel could
          # not exec, and a PR touching only mk-guest.nix used to resolve
          # code=false, so the one test that would have caught that change
          # never ran on it.
          #
          # Prose is out of scope only where no Rust test reads it. The files
          # named below are prose that tests do read, so an edit to one alone
          # can turn the workspace suite red: the claims ledger under
          # specs/adrs/ (xtask's ledger tests), the instruction files and their
          # signatures (claude_md_cli_claims, justfile_top_level, instruction
          # trust), the published pages a sync test compares against code
          # (perf_doc_sync, release_assets, justfile_top_level), examples/
          # (example and conformance tests), and the flake and deny policy the
          # structure tests parse. Everything else under public/, specs/ and
          # the root markdown still skips the Rust lanes.
          if grep -zE '^(crates/|src/|tests/|xtask/|scripts/|features/|schema/|model/|assets/|just/|third_party/|examples/|specs/adrs/|\.cargo/|\.config/|\.githooks/|\.github/actions/|\.github/scripts/|\.github/workflows/|nix/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|build\.rs$|install\.sh$|uninstall\.sh$|[Jj]ustfile$|flake\.(nix|lock)$|deny\.toml$|\.gitignore$|(AGENTS|CLAUDE|README|CONFORMANCE|SECURITY)\.md$|(AGENTS|CLAUDE)\.md\.sigstore\.json$|public/src/content/docs/(reference/performance|security/cve-demonstrations|contributing/development|contributing/ai-coding-workflow)\.md$)' "$CHANGED_FILE" >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          # The documentation corpus the README-contract and documented-example
          # scenarios read. Without its own scope a change confined to these
          # files resolved code=false and merged without the suite that checks
          # it. `documentation_files()` in
          # crates/mvm-conformance/src/doc_examples.rs walks the same roots,
          # and a test there fails when the two lists differ.
          if grep -zE '^(README\.md$|AGENTS\.md$|public/src/content/docs/|crates/mvm-sdk/sdks/|examples/)' "$CHANGED_FILE" >/dev/null; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -zE '^(nix/(lib|packaging|packages|profiles)/|flake\.(nix|lock)$|scripts/check-devshell-tiers\.sh$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|crates/|src/|third_party/|\.github/workflows/(ci|cache-warm)\.yml$)' "$CHANGED_FILE" >/dev/null; then
            echo "nix=true" >> "$GITHUB_OUTPUT"
          else
            echo "nix=false" >> "$GITHUB_OUTPUT"
          fi

          # What the guest-image-boot lane builds: the guest binaries (the
          # same crates the SDK sidecar fingerprint hashes), the guest
          # recipes under nix/, and the workspace toolchain/lock that pin
          # their build. Host-only Rust (CLI, hostd, client) changes nothing
          # the lane compiles, so it skips — the lane still runs for every
          # change that can alter the guest bytes.
          if grep -zE '^(crates/(mvm-contract|mvm-core|mvm-agentd|mvm-host-services|mvm-setpriv)/|third_party/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|nix/|build\.rs$)' "$CHANGED_FILE" >/dev/null; then
            echo "guest_image=true" >> "$GITHUB_OUTPUT"
          else
            echo "guest_image=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -zE '^(crates/|src/|tests/|Cargo\.|\.cargo/|rust-toolchain|scripts/check-no-orchestration-server\.sh$|\.github/workflows/(ci|architecture)\.yml$)' "$CHANGED_FILE" >/dev/null; then
            echo "architecture=true" >> "$GITHUB_OUTPUT"
          else
            echo "architecture=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate classification
        id: validate
        env:
          CODE: ${{ steps.decide.outputs.code }}
          DOCS: ${{ steps.decide.outputs.docs }}
          NIX: ${{ steps.decide.outputs.nix }}
          ARCHITECTURE: ${{ steps.decide.outputs.architecture }}
          GUEST_IMAGE: ${{ steps.decide.outputs.guest_image }}
        run: |
          set -euo pipefail
          validate() {
            local name="$1" value="$2"
            case "$value" in
              true|false) echo "${name}=${value}" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::invalid or missing ${name} scope: ${value}" >&2; exit 1 ;;
            esac
          }
          validate code "$CODE"
          validate docs "$DOCS"
          validate nix "$NIX"
          validate architecture "$ARCHITECTURE"
          validate guest_image "$GUEST_IMAGE"

  # Decide, before the heavy lanes start, whether the x86_64 workspace suite
  # runs on the idle self-hosted KVM box or on hosted runners. Checkout cleans
  # the box's target directory; source workers must budget for a cold build.
  # When it is busy, or the picker cannot see it, the suite stays hosted.
  #
  # Routing is opt-in through the repository variable
  # `RUNNER_PICKER_WORKSPACE=true`. The box's first run of the suite was
  # slower than the hosted shards (34 minutes, a third of it listing the suite
  # for the nextest filters) and failed three tests that pass on hosted
  # runners, so the suite stays hosted until the box is fixed.
  #
  # This job never fails a run. A missing, expired or rejected token, an API
  # error, or unparseable output all resolve to `github`. A pull request from a
  # fork always resolves to `github` before the token is read: this repository
  # is public, and the box is a persistent machine.
  runners:
    name: Pick runners
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      workspace: ${{ steps.pick.outputs.workspace }}
    steps:
      - name: Pick a runner for the workspace suite
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PICKER_TOKEN: ${{ secrets.RUNNER_PICKER_TOKEN }}
          WORKSPACE_ROUTING: ${{ vars.RUNNER_PICKER_WORKSPACE }}
        run: |
          set -uo pipefail
          workspace=github
          labels='["self-hosted","Linux","X64","mvm","hetzner","kvm"]'
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" != "$REPO" ]; then
            reason="pull request from a fork ($HEAD_REPO) never runs on a self-hosted runner"
          elif [ "$WORKSPACE_ROUTING" != true ]; then
            reason="self-hosted routing is off (repository variable RUNNER_PICKER_WORKSPACE is not true)"
          elif [ -z "$PICKER_TOKEN" ]; then
            reason="RUNNER_PICKER_TOKEN is not available"
          elif ! listing=$(GH_TOKEN="$PICKER_TOKEN" gh api "repos/${REPO}/actions/runners?per_page=100" 2>&1); then
            reason="listing self-hosted runners failed: $(head -c 200 <<<"$listing")"
          elif ! idle=$(jq --argjson want "$labels" \
              '[.runners[] | select(.status == "online" and .busy == false)
                | select([.labels[].name] as $have | $want | all(. as $l | $have | index($l)))]
               | length' <<<"$listing" 2>/dev/null) || ! [[ "$idle" =~ ^[0-9]+$ ]]; then
            reason="could not parse the runner listing"
          elif [ "$idle" -eq 0 ]; then
            reason="no idle runner carries $labels"
          else
            workspace=hetzner
            reason="$idle idle runner(s) carry $labels"
          fi
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "Workspace suite → $workspace: $reason"
          printf '### Runner picker\n\n| lane | runner | why |\n|---|---|---|\n| x86_64 workspace suite | %s | %s |\n' \
            "$workspace" "$reason" >> "$GITHUB_STEP_SUMMARY"
          exit 0

  lint-core:
    name: Lint core (fmt + clippy)
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/rust-cache

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Verify locked Cargo metadata
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Shellcheck install.sh + uninstall.sh + release-asset verifier
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh uninstall.sh
          shellcheck nix/packaging/release/verify-release-assets.sh \
                     nix/packaging/release/verify-release-assets.test.sh \
                     nix/packaging/release/assert-init-shebang.sh \
                     nix/packaging/release/assert-kernel-format.sh \
                     scripts/check-no-orchestration-server.sh \
                     scripts/check-no-orchestration-server.test.sh \
                     scripts/security-lane-verdict.sh \
                     scripts/security-lane-verdict.test.sh \
                     scripts/cargo-fast.sh \
                     scripts/cargo-stable.sh \
                     scripts/e2e-phase-timings.sh \
                     scripts/dev-run-guard.test.sh \
                     scripts/cargo-target-dir-guard.sh \
                     scripts/cargo-target-dir-guard.test.sh \
                     scripts/run-gcp-kvm-test.sh \
                     scripts/run-gcp-kvm-test-remote.sh \
                     scripts/run-gcp-kvm-test.test.sh \
                     scripts/run-cve-2026-80521-gcp.sh \
                     scripts/run-cve-2026-80521-gcp-remote.sh \
                     scripts/run-cve-2026-80521-gcp.test.sh \
                     scripts/check-hvf-oci-allow-host-smoke.sh \
                     scripts/test-hvf-oci-allow-host-smoke.sh \
                     scripts/installer-compat/*.sh \
                     scripts/smoke-fresh-install.sh \
                     scripts/pin-installer-default.sh \
                     .githooks/pre-commit \
                     .githooks/pre-commit.test.sh

      - name: Release-asset verifier gate tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash nix/packaging/release/verify-release-assets.test.sh
          python3 nix/packaging/release/verify-release-assets.auth.test.py
          python3 scripts/test_rust_registry_smoke.py
          python3 scripts/test-sdk-release-preflight.py
          python3 scripts/test_publish_source_host_helpers.py
          python3 scripts/test_resolve_source_helper_commit.py

      - name: Disposable GCP KVM controller tests
        run: |
          bash scripts/run-gcp-kvm-test.test.sh
          bash scripts/run-cve-2026-80521-gcp.test.sh
      - name: HVF OCI smoke harness tests
        run: bash scripts/test-hvf-oci-allow-host-smoke.sh

      # The hook narrows clippy to the packages owning the staged files. When
      # it picked a package cargo cannot address with `-p`, it reported that as
      # "clippy failed" while clippy was fine. These tests pin the scoping
      # decision; they do not run clippy.
      - name: Pre-commit hook scoping tests
        run: bash .githooks/pre-commit.test.sh

      - name: Install just for scoped feedback tests
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Scoped feedback recipe tests
        run: python3 scripts/test_scoped_tests.py

      - name: BDD phase timing recipe tests
        run: python3 scripts/test_bdd_phase_timings.py

      - name: Cargo worker benchmark harness tests
        run: python3 scripts/test_benchmark_cargo_workers.py

      - name: Clippy
        run: ./scripts/cargo-stable.sh clippy --all-targets -- -D warnings

      # The cucumber runner is `harness = false`, so it sits behind the `bdd`
      # feature to keep it out of `cargo nextest run --workspace` — nextest
      # enumerates tests with `--list`, which that target cannot answer. The
      # step above does not reach it either, since `--all-targets` still honors
      # `required-features`. Nothing else in the fast gate builds it,
      # so a struct or signature change anywhere in the workspace can break the
      # BDD suite unnoticed and only surface in a release run. Compile it here.
      - name: Clippy (BDD conformance target)
        run: ./scripts/cargo-stable.sh clippy -p mvm-conformance --tests --features bdd -- -D warnings

  # The fast-gate half of feature coverage. A feature-gated compile break is
  # the commonest deterministic failure, and the feature *test* lanes below
  # are merge-queue only, so this lane makes every pull request type-check
  # and lint the non-default feature combinations. It unifies them into three
  # resolutions instead of one per lane step: everything turned on at once,
  # the build with the release verifier absent, and mvm-sdk with no defaults.
  # Unification can hide an item gated for one feature and used under another;
  # the per-feature test lanes still catch that in the queue.
  lint-feature-clippy:
    name: Lint feature combinations (clippy)
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/rust-cache
        with:
          key: feature-clippy

      # Every non-default feature the queue's feature lanes test, plus the
      # release workflow's mvmctl feature set. `embed-host-bins` is left out:
      # it cross-compiles the embedded Linux payload with zig, which is the
      # queue's embed lane's job. `ebpf-telemetry` needs the bpf toolchain
      # and stays with the eBPF lane.
      - name: Clippy (every feature combination the queue tests)
        run: |
          set -euo pipefail
          release="$(sed -n 's/^  MVMCTL_RELEASE_FEATURES: *//p' .github/workflows/release.yml)"
          if [ -z "$release" ]; then
            echo "::error::could not read MVMCTL_RELEASE_FEATURES from release.yml" >&2
            exit 1
          fi
          features=""
          for feature in ${release//,/ }; do
            [ "$feature" = embed-host-bins ] && continue
            features="${features:+$features,}mvmctl/$feature"
          done
          features="$features,mvm-core/hostd-transport,mvm-core/client-remote"
          features="$features,mvm-client/tracing-bridge,mvm-client/manifest-verify,mvm-client/schema,mvm-client/test-support"
          features="$features,mvm-sdk/schema,mvm-sdk/compiler,mvm-sdk/deploy-remote"
          features="$features,mvm-build/manifest-verify,mvm-build/release-channel,mvm-build/test-support"
          features="$features,mvm-cli/manifest-verify,mvm-cli/release-artifact-bootstrap,mvm-cli/test-support"
          features="$features,mvm-hostd/manifest-verify,mvm-hostd/wasm-backend"
          features="$features,mvm-runtime/wasm-backend,mvm-runtime/test-support"
          features="$features,mvm-backends/test-support,mvm-vmm/test-support,mvm-fs/test-support"
          features="$features,mvm-agentd/addons"
          echo "features: $features"
          ./scripts/cargo-stable.sh clippy --locked --all-targets \
            -p mvmctl -p mvm-core -p mvm-client -p mvm-sdk -p mvm-build -p mvm-cli \
            -p mvm-hostd -p mvm-runtime -p mvm-backends -p mvm-vmm -p mvm-fs -p mvm-agentd \
            --features "$features" -- -D warnings

      # mvmd links mvm-core without the release verifier, so the refusal path
      # is shipped code that the workspace build never compiles: the root
      # package's defaults unify `manifest-verify` in.
      - name: Clippy (release verifier absent)
        run: ./scripts/cargo-stable.sh clippy --locked --all-targets -p mvm-core -p mvm-build -p mvm-client -- -D warnings

      - name: Clippy (mvm-sdk without default features)
        run: ./scripts/cargo-stable.sh clippy --locked --all-targets -p mvm-sdk --no-default-features -- -D warnings

  lint-policy:
    # This policy lane publishes the `Invariant` context. The architecture
    # scan used to occupy a separate workflow; keeping it here preserves the
    # gate without another runner or workflow.
    name: Invariant
    needs: [scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25

      # Policy checks invoke xtask, and the stub/parity checks invoke the
      # pinned Python and TypeScript generators. They are independent of the
      # compiler lint lane, so start them on their own runner.
      - uses: ./.github/actions/apt-deps
        with:
          packages: lld ripgrep shellcheck

      # Nothing else validates the workflow files. A wrong `if:`, a typo'd
      # `needs:` job name, or a bad `${{ }}` reference does not fail a PR — it
      # silently disables the lane, which still reads as covered to anyone
      # auditing the file. Runs over every workflow, not just changed ones,
      # because a changed job can break a reference in a file it did not touch.
      # Placed after shellcheck is installed (actionlint shells out to it) but
      # before the slow toolchain steps, so a workflow error fails fast.
      # Pinned + checksum-verified rather than an installer action: actionlint
      # is a Go binary, so `install-action` has no recipe for it and its
      # cargo-binstall fallback looks for a crate that does not exist.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fL --retry 3 --retry-all-errors --retry-delay 2 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint workflow files
        run: actionlint .github/workflows/*.yml

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.5"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: ./.github/actions/rust-cache

      - name: No orchestration server outside declared substrate categories
        if: needs.scope.outputs.architecture == 'true'
        run: bash scripts/check-no-orchestration-server.sh

      - name: Orchestration-server gate tests
        run: bash scripts/check-no-orchestration-server.test.sh

      - name: Cargo target dir guard tests
        run: bash scripts/cargo-target-dir-guard.test.sh

      - name: Dev-run guard tests
        run: bash scripts/dev-run-guard.test.sh

      - name: ShellCheck added scripts
        if: github.event_name == 'pull_request' && needs.scope.outputs.code == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(mktemp)
          trap 'rm -f "$changed"' EXIT
          if ! MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo "::error::could not resolve the pull-request merge base" >&2
            exit 1
          fi
          if ! git diff --name-only --diff-filter=A -z \
            "$MERGE_BASE" "$HEAD_SHA" -- '*.sh' '.githooks/*' >"$changed"; then
            echo "::error::could not classify added shell scripts" >&2
            exit 1
          fi
          mapfile -d '' scripts <"$changed"
          if [ "${#scripts[@]}" -gt 0 ]; then
            printf 'shellcheck %s\n' "${scripts[@]}"
            shellcheck "${scripts[@]}"
          else
            echo "No added shell scripts."
          fi

      - name: Embedded helper recipe contract
        if: github.event_name == 'pull_request' && needs.scope.outputs.code == 'true'
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --edition=2024 -D warnings --test \
            crates/mvm-cli/tests/embed_recipe.rs \
            -o "$RUNNER_TEMP/embed-recipe-test"
          "$RUNNER_TEMP/embed-recipe-test"

      # The nightly security lanes do not run on a PR, so this is the only
      # place their failure reporting is exercised before it has to work.
      - name: Security lane verdict tests
        run: bash scripts/security-lane-verdict.test.sh

      # installer-compat.yml needs published releases and runs weekly and on
      # installer pull requests, and it is not a required check. What decides
      # its verdicts — release selection, the archive-derived expectations, the
      # tolerated refusal, the docs extraction — runs here on every pull
      # request, against synthetic releases through the real install.sh.
      - name: Installer compat script tests
        run: bash scripts/installer-compat/installer-compat.test.sh

      - name: Architecture scan not required for this diff
        if: needs.scope.outputs.architecture == 'false'
        run: echo "No architecture-relevant paths changed."

      # One driver, not sixty steps. It runs every gate and reports all
      # of them: the old shape stopped at the first failure, so a branch
      # breaking four gates cost four pushes and four full lanes to find
      # that out. `cargo run -p xtask -- <gate>` still runs any one of
      # them on its own.
      - name: Policy gates (check-abi-layout) (single-network-path)
        run: cargo run -p xtask -- check-all

      # `check-fast-cargo` pins the whole nightly-fast / stable-lint split —
      # the toolchain versions, the cranelift and threads settings, and the
      # exact invocations in the Justfile and the pre-commit hook. It is a
      # shell script rather than an xtask gate, so `check-all` above does not
      # reach it, and until now nothing in CI did either: it had gone red on
      # main unnoticed when rust-toolchain.toml was bumped to
      # nightly-2026-08-25 and bdd.yml was left on nightly-2026-08-08.
      - name: Fast/stable toolchain split is pinned
        run: ./scripts/check-fast-cargo.sh

      - name: Every Cargo crate has a detailed README
        run: |
          bash scripts/test-check-crate-readmes.sh
          bash scripts/check-crate-readmes.sh










      # Runs its own self-test first: a gate nobody has watched fail is a gate
      # nobody knows works, and this one is the relief valve for the exclusion
      # that let fabricated witness names live in specs/ for months.
      - name: Claim-bearing prose declares what backs it
        run: |
          cargo run -p xtask -- check-declared-backing --self-test
          cargo run -p xtask -- check-declared-backing






















      # The in-guest toolbox is deliberately ungoverned — the microVM boundary
      # bounds it. What the boundary cannot bound is the guest originating a
      # connection outward, so that is what this checks.

      # The other half of the same rule. The gate above says a guest has only
      # the vsock channel; this one says it speaks exactly one protocol over
      # it. A guest made FlowMux-only while the host still served the old
      # protocol is what killed egress on main with every test green.

      # An image's declared environment is resolved once. The console used to
      # assemble its own, which is why `machine run --image rust:latest -it`
      # opened a shell with the image's own toolchain missing from PATH.
      - name: one workload-env resolver (console and entrypoint agree on the image)
        run: cargo run -p xtask -- check-single-workload-env

      # A wall-clock bound is declared once, as a grant. `exec_secs` is that
      # grant's projection into the plan's older encoding; a second writer is a
      # second declaration of one decision, and the two can disagree.

      # Whether a destination is bound by a secret's `allowed_hosts` is decided
      # by `host_is_bound` and nowhere else. A second copy is a second decision,
      # and the disagreement surfaces as a credential reaching a destination it
      # should not.





      # release.yml runs on tags, so a per-VM binary added to the registry but
      # not to the release job is invisible until a user's downloaded mvmctl
      # fails to spawn it. Resolve it here, on the PR that adds it.




      # Manifest-level sibling to the closure budgets, which resolve trees and
      # therefore cannot see a member pinning a version behind the workspace
      # table's back, or a table entry nobody inherits.

      # Sibling to the default-closure budget: bounds what any *feature* can
      # pull in, which is where an off-by-default tree (wasm-backend's
      # wasmtime/cranelift family) would otherwise grow unobserved.



      - name: Detect fuzz-crate changes
        id: fuzz_changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 || true
          if git diff --name-only "$BASE_SHA" HEAD 2>/dev/null | grep -qE '(^|/)fuzz[^/]*/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo-fuzz crates still compile
        if: steps.fuzz_changed.outputs.changed == 'true'
        run: |
          set -uo pipefail
          fail=0
          for manifest in crates/*/fuzz*/Cargo.toml crates/deps/*/fuzz*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            echo "::group::$manifest"
            cargo check --locked --manifest-path "$manifest" --all-targets || fail=1
            echo "::endgroup::"
          done
          exit "$fail"











  lint-features:
    name: Lint feature coverage (${{ matrix.suite }})
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event_name != 'pull_request'
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # These feature graphs compile independently. Keep signature/refusal
    # coverage off the serial portable-feature critical path.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        suite: [portable, signatures]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/rust-cache

      - name: Clippy (mvm-client tracing-bridge)
        if: matrix.suite == 'portable'
        run: ./scripts/cargo-stable.sh clippy -p mvm-client --all-targets --features tracing-bridge -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: hostd-transport feature tests (mvm-core)
        if: matrix.suite == 'portable'
        run: cargo nextest run -p mvm-core --features hostd-transport

      - name: client facade tests (mvm-core)
        if: matrix.suite == 'portable'
        run: cargo nextest run -p mvm-core --features client-remote

      # `schema` is off by default so the shipped closure carries no schemars;
      # the schema-shape tests and the three emitter bins only exist under it.
      - name: schema feature tests (mvm-sdk)
        if: matrix.suite == 'portable'
        run: |
          cargo nextest run -p mvm-sdk --features schema
          cargo check -p mvm-sdk --features schema --bins

      - name: compiler compatibility and deployment feature tests (mvm-sdk)
        if: matrix.suite == 'portable'
        run: |
          cargo nextest run -p mvm-compiler
          cargo nextest run -p mvm-sdk --no-default-features
          cargo nextest run -p mvm-sdk --features compiler,deploy-remote

      # The release signature verifier only exists under `manifest-verify`.
      # The workspace lane gets it through the root default, but that is
      # feature unification, not something these crates ask for, so this step
      # runs the tests that parse a real Sigstore bundle with the feature named.
      # The claim 20 ledger cites them; this is the lane that runs them.
      - name: release signature tests (manifest-verify)
        if: matrix.suite == 'signatures'
        run: |
          cargo nextest run -p mvm-build --features manifest-verify -E 'test(/release_signature/)'
          cargo nextest run -p mvm-cli --features manifest-verify -E 'test(/^update::|verify_release/)'
          cargo nextest run -p mvm-cli --features manifest-verify --test signed_registry_pack
          cargo nextest run -p mvm-cli --features manifest-verify -E 'test(/scaffold_resolves_an_installed_verified_signed_pack_include/)'
          cargo nextest run -p mvm-hostd --features manifest-verify -E 'test(/real_signed_pack_identity_is_reverified_at_host_admission/)'
          cargo nextest run -p mvm-client --features manifest-verify -E 'test(/signed_pack_identity_is_in_admitted_plan_and_audit_chain/)'

      # The other half: a build without the verifier must refuse every signature
      # and say why. The workspace lane unifies the verifier in, so those tests
      # compile out there; mvmd links mvm-core without it, so the refusal is a
      # shipped path. Run per crate with no features. mvm-client turns the
      # verifier on by default, so it runs on its own with default features
      # off: selected beside mvm-core it would unify the verifier back into
      # mvm-core and compile every refusal test out.
      - name: verifier-absent refusal tests (no manifest-verify)
        if: matrix.suite == 'signatures'
        run: |
          filter='test(/without_the_verifier|cannot_verify|without_manifest_verify|no_feature_build/)'
          cargo nextest run -p mvm-core -p mvm-build -E "$filter"
          cargo nextest run -p mvm-client --no-default-features -E "$filter"

      # The authored-policy schema is generated from the Rust types and
      # published twice (schema/ and the docs reference page); the drift tests
      # and the emitter bin exist only under `schema`.
      - name: policy schema drift (mvm-client schema)
        if: matrix.suite == 'portable'
        run: |
          cargo nextest run -p mvm-client --features schema -E 'test(/policy_profiles::/)'
      # Instruction-file provenance: the keyless half verifies a real Sigstore
      # bundle only under `manifest-verify`, and the committed policy schema is
      # checked against the Rust types only under `schema`. `schema` is off in
      # the default lane, and this step names `manifest-verify` rather than
      # relying on the root default to unify it in.
      - name: instruction provenance tests (manifest-verify + schema)
        if: matrix.suite == 'portable'
        run: |
          cargo nextest run -p mvm-client --features manifest-verify,schema -E 'test(/instruction/)'
          cargo check -p mvm-client --features schema --bins

      # `addons` is off by default so the sealed agent's request path stays
      # synchronous and tokio-free (`check-guest-agent-runtime-free` enforces
      # that, so this must stay a feature rather than move into default). But
      # the feature also gates the entire guest egress data path — `flowmux`,
      # `flowmux_egress`, `egress_client` — which every builder VM's networking
      # runs through. Nothing in the default lane compiles it, and a run of
      # defects shipped inside it as a result, each one only reachable by
      # booting a real VM. `--bins` because the loopback proxy is a `[[bin]]`
      # and a lib-only run would not build its entrypoint.
      - name: addons feature tests (guest egress data path)
        if: matrix.suite == 'portable'
        run: |
          cargo nextest run -p mvm-agentd --features addons
          cargo check -p mvm-agentd --features addons --bins

  # Split out of `lint-features`, which was 35 minutes and the critical path for
  # every code-touching validation run; this step alone was 19 of them. Nothing
  # here shares a cargo fingerprint with the steps it used to sit beside — a
  # different feature resolution rebuilds its own graph either way — so moving
  # it to its own runner costs one checkout and recovers the rest in parallel.
  lint-features-test-support:
    name: Lint feature coverage (test-support)
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      # Not optional, despite `embed-host-bins` being the feature that names
      # zig. `pool_warm_and_the_run_path_resolve_the_same_compat_key` resolves a
      # launch, which builds the universal initramfs through `cargo zigbuild`.
      # Without zig on PATH that build fails, resolution falls back to whatever
      # initramfs the cache already holds, and the test dies on a version
      # mismatch rather than on the missing command — so the real cause appears
      # only in the step's stderr.
      - uses: ./.github/actions/rust-cache
        with:
          key: test-support

      # The trusted-main cache includes ~/.cargo/bin. Restore it before the
      # installer so cargo sees the pinned cargo-zigbuild binary and exits
      # immediately instead of compiling the installer for 7-9 minutes.
      - uses: ./.github/actions/install-zigbuild

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: test-support feature tests (mock backend)
        # One invocation, not one per package. Cargo resolves features per
        # invocation, so selecting a different package each time produced
        # different fingerprints and rebuilt most of the same graph seven
        # times over — 28 of this job's 35 minutes, and the critical path for
        # every code validation. These packages form one feature subtree
        # (mvm-cli -> mvm-runtime -> mvm-backends, mvm-vmm -> mvm-core,
        # mvm-fs), so a single resolution covers all of them and compiles once.
        run: |
          cargo nextest run --features test-support --lib \
            -p mvm-backends -p mvm-runtime -p mvm-client -p mvm-cli -p mvm-vmm \
            -p mvm-fs -p mvm-build
          cargo nextest run -p mvmctl --features test-support --test audit_emissions_live
          cargo check -p mvm-cli --features test-support --example verification_loop

      # These independent feature suites used to extend the main feature lane
      # by about seven minutes. This runner already has the stable toolchain,
      # system linker and nextest, so it can run them without another job.
      # Keep each command's feature selection unchanged: the default workspace
      # build does not prove the Wasm or release-acquisition tiers.
      # `wasm-backend` is off by default so the shipped closure carries no
      # wasmtime. A wasmtime bump once broke the WASI preopen API without
      # failing the default build; the hostd witness exercises the egress seam.
      - name: wasm-backend feature tests (wasmtime tier)
        run: |
          cargo nextest run -p mvm-runtime --features wasm-backend -E 'test(/wasm/)'
          cargo nextest run -p mvm-hostd --features wasm-backend --test wasm_egress_witness

      # End-user release builds enable an acquisition policy that contributor
      # builds deliberately omit: checkout proximity must never select a local
      # compiler. Test both the bootstrap feature alone and combined with
      # manifest verification before the change merges.
      - name: release artifact acquisition contract
        run: |
          cargo check -p mvm-cli --features release-artifact-bootstrap --lib
          cargo check -p mvm-cli --features release-artifact-bootstrap,manifest-verify --lib
          cargo test -p mvm-build --features release-channel --lib \
            artifact_acquisition
          cargo test -p mvm-build --features release-channel --lib \
            official_build_does_not_detect

      - name: Assert auto-detect still picks libkrun off Linux/HVF
        run: |
          cargo test -p mvm-build --lib \
            builder_backend_select::tests::auto_detect_default_for_everything_else_picks_libkrun

      - name: In-process pure ext4 materialize tests
        run: cargo test -p mvm-build --lib rootfs::tests::pure

  # Also split out of `lint-features`. `embed-host-bins` is what turns on
  # `mvm-cli`'s cross-compile of the embedded Linux binaries, so this lane needs
  # the pinned zig.
  #
  # It is not the only one. The comment this replaces claimed it was, and the
  # split falsified that within one run: the test-support lane also shells out
  # to `cargo zigbuild`, from a launch-resolution test that builds the universal
  # initramfs. What the split does establish — because this run is the
  # experiment — is that the remaining `lint-features` lane needs no zig at all,
  # so that install is now paid on two lanes instead of every one.
  lint-features-embed:
    name: Lint feature coverage (embed-host-bins)
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/rust-cache

      # The workspace cache is also the trusted source of the pinned
      # cargo-zigbuild binary; restore it before asking cargo to install.
      - uses: ./.github/actions/install-zigbuild

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # `embed-host-bins` is off by default, so the entire cross-compile leg of
      # `mvm-cli/build.rs` — and every test that inspects the embedded payload —
      # is absent from every other lane in this workflow. Only the tag-push
      # release build turns it on, and a break there is invisible until a
      # release is already being cut. This lane is where an integrated change
      # proves the leg still compiles and still produces the manifest's set.
      #
      # `--bins` matters: the payload is `include_bytes!`d into the binary, so a
      # lib-only check would not link it and would not catch a bad path.
      - name: embed-host-bins feature (cross-compiled payload)
        run: |
          cargo nextest run -p mvm-cli --features embed-host-bins \
            --test embedded_binaries --test host_binaries_extract \
            --test host_binaries_manifest --test dispatch_host_bin_dir
          cargo check -p mvmctl --features embed-host-bins --bins

      # The release workflow builds `mvmctl` with exactly this feature set and
      # nothing else in this workflow does. An item gated for one feature and
      # used under another compiles in every partial combination and breaks
      # only the tag's build — which is how v0.18.0-rc.2 died at its macOS
      # documented-surface lane, after the tag was pushed. Read from
      # release.yml rather than copied, so the two cannot drift apart.
      - name: mvmctl with the release feature set
        run: |
          set -euo pipefail
          features="$(sed -n 's/^  MVMCTL_RELEASE_FEATURES: *//p' .github/workflows/release.yml)"
          if [ -z "$features" ]; then
            echo "::error::could not read MVMCTL_RELEASE_FEATURES from release.yml" >&2
            exit 1
          fi
          echo "release feature set: $features"
          cargo check --locked -p mvmctl --bins --features "$features"

  # mvm does not run on Windows hosts, and nothing here claims it does. What
  # this lane holds is the portable floor a future Windows host would build
  # on: the foundation crates, and the backend crate with its Unix-only
  # drivers compiled out, have to keep compiling for a Windows target. A Unix
  # API used without a platform guard fails here instead of being found by
  # whoever next attempts the port. It is a compile check only: no Windows
  # runner, no tests, and the GNU target so no MSVC toolchain is needed. The
  # crate list is exactly the set that builds without a C cross-compiler;
  # anything reaching `ring` or `aws-lc-sys` needs mingw and is out of scope.
  lint-windows:
    name: Windows compile check (portable crates)
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      # rust-toolchain.toml overrides the action's toolchain, so a target
      # installed through the action is not the one cargo builds with and
      # every crate fails with `can't find crate for core`. Add it to the
      # pinned toolchain instead.
      - name: Install the Windows target for the pinned toolchain
        run: rustup target add x86_64-pc-windows-gnu

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/rust-cache

      - name: cargo check for x86_64-pc-windows-gnu
        run: |
          cargo check --locked --target x86_64-pc-windows-gnu \
            -p mvm-contract -p mvm-core -p mvm-net -p mvm-bundler -p mvm-backends
          cargo check --locked --target x86_64-pc-windows-gnu \
            -p mvm-core --features provenance,client,hostd-transport

  test-windows-identity:
    name: Windows repository identity runtime
    needs: [scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Run supported Windows identity and producer tests
        shell: pwsh
        run: ./.github/scripts/run-windows-identity-tests.ps1

      - name: Retain Windows test inventory and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mvm-windows-identity
          if-no-files-found: error

  # The Gherkin scenarios previously ran only from release-tag workflows, so a
  # PR could break a scenario and merge green. Same reusable workflow the
  # release path calls, gated on the narrower `bdd` scope.
  # The single owner of the Gherkin suite, and gated on `code` rather than the
  # narrower `bdd` scope because it inherited `ci-linux-coverage.sh`'s trigger
  # along with its `just bdd::run`. `bdd` is a strict subset of `code` — `crates/`
  # contains `crates/mvm-cli/`, `tests/` contains `tests/machine-fixtures/`, and
  # both cover `features/` and the Justfile — so this widening admits exactly
  # the runs the Linux lane was already covering and no others.
  #
  # It also runs for `docs`, because the README contract and the
  # documented-example suite read the documentation tree directly. When `code`
  # is false nothing that compiles changed, so only those `@docs` features run;
  # every other scenario would re-prove behaviour the change cannot affect.
  #
  # Merge queue only: at 20-30 minutes including the live PS-11 witness it is
  # the slowest Linux lane, and a scenario failure is an integration result
  # the queue reports against the exact commit that would merge.
  bdd-conformance:
    name: BDD conformance
    needs: [scope]
    if: (needs.scope.outputs.code == 'true' || needs.scope.outputs.docs == 'true') && github.event_name != 'pull_request'
    uses: ./.github/workflows/bdd.yml
    with:
      docs_only: ${{ needs.scope.outputs.code != 'true' }}
      run_ps11_live: ${{ needs.scope.outputs.code == 'true' }}

  test:
    name: Test
    if: ${{ always() }}
    needs: [scope, runners, lint-core, lint-policy, lint-feature-clippy, lint-features, lint-features-test-support, lint-features-embed, lint-windows, test-windows-identity, test-workspace-build, test-workspace, test-workspace-extras, test-workspace-aarch64, test-linux, test-release-witness, test-musl-confinement, test-ebpf-telemetry, bdd-conformance, boot-latency, nix-flake-check]
    # Every admission check runs in an upstream lane; this aggregate only
    # inspects their results, so it needs no checkout or full hosted image.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require CI scope to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo "CI scope did not pass: $SCOPE_RESULT"
            exit 1
          fi

      # Each lane belongs to one tier. Fast-gate lanes must match the scope on
      # every event; full-matrix lanes must skip on a pull request and match
      # the scope in the merge queue and on a manual dispatch. A lane that ran
      # where it should have skipped is refused as firmly as one that skipped
      # where it should have run: either means its `if:` drifted.
      - name: Require every validation lane to pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_CODE: ${{ needs.scope.outputs.code }}
          SCOPE_DOCS: ${{ needs.scope.outputs.docs }}
          SCOPE_NIX: ${{ needs.scope.outputs.nix }}
          RUNNERS_RESULT: ${{ needs.runners.result }}
          WORKSPACE_RUNNER: ${{ needs.runners.outputs.workspace }}
          CORE_RESULT: ${{ needs.lint-core.result }}
          POLICY_RESULT: ${{ needs.lint-policy.result }}
          FEATURE_CLIPPY_RESULT: ${{ needs.lint-feature-clippy.result }}
          FEATURES_RESULT: ${{ needs.lint-features.result }}
          FEATURES_SUPPORT_RESULT: ${{ needs.lint-features-test-support.result }}
          FEATURES_EMBED_RESULT: ${{ needs.lint-features-embed.result }}
          WINDOWS_RESULT: ${{ needs.lint-windows.result }}
          WINDOWS_IDENTITY_RESULT: ${{ needs.test-windows-identity.result }}
          WORKSPACE_BUILD_RESULT: ${{ needs.test-workspace-build.result }}
          WORKSPACE_RESULT: ${{ needs.test-workspace.result }}
          WORKSPACE_EXTRAS_RESULT: ${{ needs.test-workspace-extras.result }}
          WORKSPACE_AARCH64_RESULT: ${{ needs.test-workspace-aarch64.result }}
          LINUX_RESULT: ${{ needs.test-linux.result }}
          RELEASE_WITNESS_RESULT: ${{ needs.test-release-witness.result }}
          MUSL_CONFINEMENT_RESULT: ${{ needs.test-musl-confinement.result }}
          EBPF_RESULT: ${{ needs.test-ebpf-telemetry.result }}
          BDD_RESULT: ${{ needs.bdd-conformance.result }}
          BOOT_RESULT: ${{ needs.boot-latency.result }}
          NIX_RESULT: ${{ needs.nix-flake-check.result }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_RESULT" != success ]; then
            echo "CI scope did not pass: $SCOPE_RESULT"
            exit 1
          fi
          case "$EVENT_NAME" in
            pull_request) full_matrix=false ;;
            merge_group|workflow_dispatch) full_matrix=true ;;
            *) echo "Invalid event: $EVENT_NAME"; exit 1 ;;
          esac
          for scope in "code=$SCOPE_CODE" "docs=$SCOPE_DOCS" "nix=$SCOPE_NIX"; do
            case "${scope#*=}" in
              true|false) ;;
              *) echo "Invalid scope: $scope"; exit 1 ;;
            esac
          done

          # The picker never fails and only ever answers one of two runners.
          # Anything else means the workspace lanes below were wired from a
          # value nobody validated.
          if [ "$RUNNERS_RESULT" != success ]; then
            echo "Pick runners did not pass: $RUNNERS_RESULT"
            exit 1
          fi
          case "$WORKSPACE_RUNNER" in
            github) archive_build=true ;;
            hetzner) archive_build=false ;;
            *) echo "Invalid workspace runner: $WORKSPACE_RUNNER"; exit 1 ;;
          esac

          # `required <tier-runs> <in-scope>` prints the one result a lane may
          # report: success when its tier runs on this event and its scope is
          # in, skipped otherwise.
          required() {
            if [ "$1" = true ] && [ "$2" = true ]; then echo success; else echo skipped; fi
          }
          code_or_docs=false
          if [ "$SCOPE_CODE" = true ] || [ "$SCOPE_DOCS" = true ]; then code_or_docs=true; fi
          gate_required=$(required true "$SCOPE_CODE")
          full_required=$(required "$full_matrix" "$SCOPE_CODE")
          archive_required=$(required "$archive_build" "$SCOPE_CODE")
          bdd_required=$(required "$full_matrix" "$code_or_docs")
          nix_required=$(required "$full_matrix" "$SCOPE_NIX")

          check() {
            local name="$1" result="$2" want="$3"
            if [ "$result" != "$want" ]; then
              echo "$name was $result; event $EVENT_NAME with code=$SCOPE_CODE docs=$SCOPE_DOCS nix=$SCOPE_NIX requires $want"
              exit 1
            fi
          }

          # The policy lane is unscoped: every change passes it on every event.
          check "Invariant" "$POLICY_RESULT" success

          # Fast gate: the same lanes on a pull request and in the queue.
          check "Lint core" "$CORE_RESULT" "$gate_required"
          check "Lint feature combinations" "$FEATURE_CLIPPY_RESULT" "$gate_required"
          check "Windows compile check" "$WINDOWS_RESULT" "$gate_required"
          check "Windows repository identity runtime" "$WINDOWS_IDENTITY_RESULT" "$gate_required"
          # The hosted suite runs from an archive; the self-hosted one does not.
          check "Build workspace tests" "$WORKSPACE_BUILD_RESULT" "$archive_required"
          check "Test workspace" "$WORKSPACE_RESULT" "$gate_required"

          # Full matrix: merge queue and manual dispatch only.
          check "Lint feature coverage" "$FEATURES_RESULT" "$full_required"
          check "Lint feature coverage (test-support)" "$FEATURES_SUPPORT_RESULT" "$full_required"
          check "Lint feature coverage (embed-host-bins)" "$FEATURES_EMBED_RESULT" "$full_required"
          check "Test workspace extras" "$WORKSPACE_EXTRAS_RESULT" "$full_required"
          check "Test workspace (aarch64)" "$WORKSPACE_AARCH64_RESULT" "$full_required"
          check "Test Linux and conformance" "$LINUX_RESULT" "$full_required"
          check "Test release profile" "$RELEASE_WITNESS_RESULT" "$full_required"
          check "Confinement under the release libc" "$MUSL_CONFINEMENT_RESULT" "$full_required"
          check "Test eBPF telemetry" "$EBPF_RESULT" "$full_required"
          check "Boot latency ceiling" "$BOOT_RESULT" "$full_required"
          # The documentation corpus brings BDD, and only BDD, into scope.
          check "BDD conformance" "$BDD_RESULT" "$bdd_required"
          check "Nix flake check" "$NIX_RESULT" "$nix_required"

  # Hosted: two shards run the archive `test-workspace-build` compiled. Self-
  # hosted: one shard builds and runs the whole suite on the box. Checkout
  # cleans its target directory. The archive cannot move to the box: it is
  # linked against the hosted image's newer glibc.
  test-workspace:
    name: Test workspace
    needs: [scope, runners, test-workspace-build]
    if: >-
      !cancelled()
      && needs.scope.outputs.code == 'true'
      && (needs.test-workspace-build.result == 'success'
          || (needs.test-workspace-build.result == 'skipped' && needs.runners.outputs.workspace == 'hetzner'))
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.runners.outputs.workspace == 'hetzner' && '["1"]' || '["1", "2"]') }}
    uses: ./.github/workflows/workspace-shard.yml
    with:
      commit_sha: ${{ github.sha }}
      shard: ${{ matrix.shard }}
      shard_count: ${{ needs.runners.outputs.workspace == 'hetzner' && '1' || '2' }}
      runner_kind: ${{ needs.runners.outputs.workspace == 'hetzner' && 'hetzner' || 'github' }}
      archive_run_id: ${{ needs.runners.outputs.workspace != 'hetzner' && github.run_id || '' }}

  test-workspace-build:
    name: Build workspace tests
    needs: [scope, runners]
    # The self-hosted box builds the suite itself; only the hosted path needs
    # an archive.
    if: needs.scope.outputs.code == 'true' && needs.runners.outputs.workspace != 'hetzner'
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25

      - uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin lld

      - uses: ./.github/actions/rust-cache

      # Guest-binary producer tests build the declared-tool shim and helper.
      - uses: ./.github/actions/install-zigbuild

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Build the workspace test archive
        env:
          ARCHIVE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Some workspace tests clear /tmp on Linux; keep their own binaries safe.
          archive_root="$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"
          mkdir -p -- "$archive_root"
          cp -a "$GITHUB_WORKSPACE/." "$archive_root/"
          cd "$archive_root"
          cargo nextest archive --workspace --all-targets \
            --archive-file "$RUNNER_TEMP/workspace-tests.tar.zst"
          ls -lh "$RUNNER_TEMP/workspace-tests.tar.zst"
          du -sh target
          df -h /

      - name: Upload the workspace test archive
        uses: actions/upload-artifact@v7
        with:
          name: workspace-tests
          path: ${{ runner.temp }}/workspace-tests.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Remove archived workspace
        if: always()
        env:
          ARCHIVE_RUN_ID: ${{ github.run_id }}
        run: rm -rf -- "$RUNNER_TEMP/mvm-workspace-${ARCHIVE_RUN_ID}"

  test-workspace-extras:
    name: Test workspace (doctests + feature suites)
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event_name != 'pull_request'
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25

      - uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin lld

      - uses: ./.github/actions/rust-cache

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: xtask man-page tests
        run: cargo nextest run -p xtask --features man

      - name: Run addon/egress helper tests
        run: cargo nextest run -p mvm-agentd --features addons

      - name: Run doctests
        run: cargo test --workspace --doc

      # Lists the whole workspace suite once per override filter, which cost
      # about eight minutes at the end of the archive build — and the shards
      # cannot start until that job finishes. It reads only
      # `.config/nextest.toml` and test names, so it runs here, in the merge
      # queue, rather than on the pull request's critical path.
      - name: Validate nextest override filters
        run: cargo run -p xtask -- check-nextest-groups

  # The only lane that executes mvm's aarch64 code paths. Everything else in
  # this workflow runs on x86_64, so arch-gated code compiles here for the
  # first time and its tests run for the first time. The sharpest example is
  # `jailer::seccomp::CONFINED_ROLE_SYSCALLS`, which is a *separate table* per
  # architecture: a wrong or missing entry in the aarch64 half SIGSYS-kills a
  # confined role at the moment it starts working, and no x86_64 runner can
  # see it. `GuestArch::host()`, the bundle arch gate, and the aarch64
  # `mvm-seccomp-apply` arm are in the same position.
  #
  # SCOPE, honestly: this proves the suite passes natively on aarch64. It does
  # NOT prove a guest boots — GitHub's arm64 runners expose no nested KVM, so
  # `backend.start()` is unreachable here exactly as it is in every other lane.
  # A green run here is not a Tier-1 boot witness; that still needs real
  # hardware.
  #
  # One job builds the suite and runs it, on one arm64 runner. It used to be
  # an archive build followed by three shards, and in the merge queue each of
  # those shards waited 13-17 minutes for a hosted arm64 runner after the build
  # finished, to run for 3-6 minutes. A merge now needs one arm64 runner, not
  # four, and the test binaries never leave the machine that compiled them.
  test-workspace-aarch64:
    name: Test workspace (aarch64)
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25

      - uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin libcap-ng-dev lld

      - uses: ./.github/actions/rust-cache

      # Producer tests cross-build the guest shim and helper on this runner.
      - uses: ./.github/actions/install-zigbuild

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # `mvm-fs` is excluded, and only on this lane. Its dev-dependency
      # `am-fs-ext4` (the independent ext4 read oracle `tests/oracle.rs` and
      # `tests/xattr.rs` check our writer against) does not compile for
      # aarch64-linux: it assumes `c_char == i8`, which holds on x86_64-linux
      # and on aarch64-*darwin* but not on aarch64-linux, where `c_char` is
      # `u8`. That is upstream's bug, in a dev-only oracle, and it is load
      # bearing on x86_64 — so the oracle stays an x86_64 oracle rather than
      # being dropped. `mvm-fs`'s own library still builds here as a dependency
      # of everything else; it is only its test targets that are skipped.
      #
      # The workspace suite only. The arch-independent extras Test workspace
      # also runs (man pages, the addons feature, doctests) are covered on
      # x86_64 and would only duplicate cost here.
      - name: Run the privileged CRNG reseed helper tests
        # The reseed helper is killed on any syscall outside its seccomp
        # allowlist, and aarch64 is what HVF guests run. The suite below drives
        # the helper unprivileged; these root-only tests add the uid drop, the
        # capability sets and the listening helper on this architecture. Each
        # privilege witness drops its own process for good, so each runs alone,
        # and each must report one test passed — a filter that matched nothing
        # would otherwise pass silently.
        run: |
          set -euo pipefail
          executables=$(cargo test -p mvm-agentd --lib --test crng_reseed_helper --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | "\(.target.kind[0]) \(.executable)"')
          lib=$(awk '$1 == "lib" { print $2 }' <<<"$executables")
          helper=$(awk '$1 == "test" { print $2 }' <<<"$executables")
          sudo -E env MVM_GUEST_PRIVILEGED_TESTS=1 "$helper" --test-threads=1 2>&1 | tee "$RUNNER_TEMP/helper.log"
          grep -q "test result: ok. 4 passed" "$RUNNER_TEMP/helper.log"
          for witness in harden_init_process_narrows_bounding_set_and_sets_no_new_privs \
                         drop_guest_agent_privilege_reaches_the_agent_identity_from_root \
                         drop_crng_reseed_helper_privilege_keeps_only_sys_admin_from_root \
                         the_egress_client_is_spawned_as_its_own_uid_holding_only_net_bind_service; do
            sudo -E env MVM_GUEST_PRIVILEGED_TESTS=1 "$lib" --exact "guest_mount::privilege_tests::$witness" 2>&1 | tee "$RUNNER_TEMP/witness.log"
            grep -q "1 passed" "$RUNNER_TEMP/witness.log"
          done
          sudo -E env MVM_GUEST_PRIVILEGED_TESTS=1 "$lib" \
            --exact tool_attribution::tests::egress_identity_alone_receives_live_attribution_over_unix_credentials \
            2>&1 | tee "$RUNNER_TEMP/attribution.log"
          grep -q "1 passed" "$RUNNER_TEMP/attribution.log"

      # The same per-job HOME, MVM_HOME and TMPDIR the x86_64 shards run under.
      # Set after the root-run witnesses above, so nothing they leave behind
      # is inside the state the suite runs against. Set this before compiling:
      # the CLI build script reads HOME to discover its embedded payload store.
      - name: Isolate test state
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          base="${RUNNER_TEMP}/mvm-w-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-1"
          mkdir -m 700 -- "$base"
          mkdir -m 700 -- "$base/home" "$base/mvm" "$base/tmp"
          {
            printf 'RUNNER_ORIGINAL_HOME=%s\n' "$HOME"
            printf 'CARGO_HOME=%s\nRUSTUP_HOME=%s\n' "${CARGO_HOME:-$HOME/.cargo}" "${RUSTUP_HOME:-$HOME/.rustup}"
            printf 'HOME=%s\nMVM_HOME=%s\nTMPDIR=%s\n' "$base/home" "$base/mvm" "$base/tmp"
          } >> "$GITHUB_ENV"

      - name: Run the aarch64 workspace tests
        run: cargo nextest run --workspace --exclude mvm-fs --all-targets

      # The cache action saves in a post step; hand it the runner's HOME back.
      - name: Restore HOME
        if: always()
        run: |
          if [ -n "${RUNNER_ORIGINAL_HOME:-}" ]; then
            printf 'HOME=%s\n' "$RUNNER_ORIGINAL_HOME" >> "$GITHUB_ENV"
          fi

  test-release-witness:
    name: Test release profile (overflow + no debug assertions)
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event_name != 'pull_request'
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25

      - uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin lld

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests under the release profile
        # Every other lane runs in a debug profile: debug assertions on,
        # integer overflow trapped by the profile default. The shipped binary
        # is neither of those things, so a test suite that only ever runs in
        # debug cannot witness the behaviour users get.
        #
        # `release-witness` is `release` minus fat LTO and single-codegen-unit
        # linking, which keeps the semantics under test (trapping overflow, no
        # debug assertions) without the link times.
        #
        # Deliberately scoped rather than workspace-wide: these are the crates
        # doing length arithmetic over bytes an attacker chooses — the ext4
        # writer and OCI unpacker, the plan/crypto core, the audit-log
        # verifier, the datapath and supervisor, and the vsock frame parser.
        # The rest of the workspace is covered in debug by `test-workspace`;
        # widening this lane costs CI minutes for code that does not parse
        # hostile input.
        run: |
          cargo nextest run --cargo-profile release-witness \
            -p mvm-fs -p mvm-core -p mvm-contract -p mvm-hostd -p mvm-agentd

  test-musl-confinement:
    name: Confinement under the release libc (${{ matrix.target }})
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event_name != 'pull_request'
    # The Linux release ships static musl binaries; every other lane here builds
    # against the runner's glibc. The two libcs reach the kernel through
    # different syscalls for the same call — on x86_64 musl's open() issues the
    # legacy `open` where glibc issues `openat` — and a confined role's seccomp
    # filter kills it for any call it does not list. v0.22.0's network endpoint
    # died that way on every egress grant, with every glibc lane green.
    #
    # So the endpoint's confinement tests run here against the musl target, in
    # the release-witness profile and through the same cargo-zigbuild the
    # release uses: the filter applied in-process under a real self-test, and
    # the endpoint binary itself spawned and driven through a session. aarch64
    # keeps a separate syscall table, so it gets its own leg; neither needs KVM.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/install-zigbuild

      - name: Run the endpoint's confinement tests against the musl build
        env:
          TARGET: ${{ matrix.target }}
          # zig's linker reports an optimisation flag it ignores on stderr, and
          # rustc turns linker stderr into a warning. Every other warning stays
          # an error.
          RUSTFLAGS: -D warnings -A linker-messages
        # `--include-ignored` runs the seccomp property test, which is ignored
        # by default only because a contributor's kernel may predate 5.19.
        run: |
          cargo-zigbuild test --profile release-witness --target "${TARGET}" \
            -p mvm-hostd \
            --test confinement_self_test \
            --test network_endpoint_bin \
            --test seccomp_property \
            -- --include-ignored

  test-linux:
    name: Test Linux and conformance
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event_name != 'pull_request'
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # No uv, Node or `just` here. All three existed for the `just bdd::run` this
      # lane no longer runs — the suite builds the TypeScript SDK, which is what
      # needed Node and uv. What is left is the wasm/no_std targets, the browser
      # demo (wasm-pack plus a system python3) and the ext4 oracle, none of which
      # touch them.
      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25
          targets: wasm32-wasip1

      - uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin lld

      - uses: ./.github/actions/rust-cache

      - name: Install pinned no_std toolchain and targets
        run: |
          rustup toolchain install 1.97.1 --profile minimal \
            --target wasm32-unknown-unknown,wasm32-wasip1,riscv32imac-unknown-none-elf

      - name: Run Linux, no_std, filesystem, and conformance coverage
        run: bash scripts/ci-linux-coverage.sh

      - name: Require exact producer kernel Linux regressions
        if: github.event_name == 'merge_group'
        timeout-minutes: 30
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile
          import os

          def require_one_pass(text, name):
              lines = text.splitlines()
              results = [line for line in lines if re.fullmatch(r"test .+ \.\.\. (ok|FAILED|ignored)", line)]
              summaries = [line for line in lines if line.startswith("test result:")]
              summary = r"test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out; finished in [0-9.]+s"
              if (lines.count("running 1 test") != 1
                      or results != [f"test {name} ... ok"]
                      or len(summaries) != 1
                      or re.fullmatch(summary, summaries[0]) is None):
                  raise RuntimeError(f"missing exact executed single-test success: {name}")

          # Parser self-tests are synthetic, not Linux witness evidence.
          fixture = "running 1 test\ntest fixture ... ok\n\ntest result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 7 filtered out; finished in 0.01s\n"
          require_one_pass(fixture, "fixture")
          for bad in [
              "",
              fixture.replace("running 1 test", "running 0 tests"),
              fixture.replace("test fixture ... ok", "test other ... ok"),
              fixture.replace("test fixture ... ok", "test fixture ... ignored"),
              fixture.replace("1 passed; 0 failed", "0 passed; 1 failed"),
              fixture.replace("0 ignored", "1 ignored"),
              fixture + fixture,
              fixture.replace("test fixture ... ok", "\x1b[32mtest fixture ... ok\x1b[0m"),
          ]:
              try:
                  require_one_pass(bad, "fixture")
              except RuntimeError:
                  pass
              else:
                  raise RuntimeError("single-test parser accepted a negative fixture")

          if sys.platform != "linux":
              raise RuntimeError("producer descriptor regressions must execute on Linux")
          tests = [
              ("mvm-backends", "driver::fc::tests::descriptor_boot_source_reads_held_bytes_after_slot_replacement"),
              ("mvm-runtime", "kernel_custody::tests::producer_kernel_descriptor_survives_replacement_after_final_check"),
              ("mvm-cli", "commands::pack::build::tests::health_backend_requires_an_actual_same_host_descriptor_route"),
          ]
          logs = pathlib.Path(tempfile.mkdtemp(prefix="mvm-producer-linux-", dir=os.environ["RUNNER_TEMP"]))
          print(f"Exact Linux producer regression logs: {logs}", flush=True)
          for package, name in tests:
              log = logs / f"{package}.log"
              subprocess.run([
                  sys.executable, "scripts/run-bounded-command.py",
                  "--timeout", "595", "--grace", "5", "--log", str(log), "--",
                  "cargo", "test", "--locked", "-p", package, "--lib", name,
                  "--", "--exact", "--color", "never",
              ], check=True)
              require_one_pass(log.read_text(), name)
              print(f"EXACT_LINUX_PASS {package}::{name}", flush=True)
          PY

  test-ebpf-telemetry:
    name: Test eBPF telemetry load/attach
    needs: [scope]
    if: needs.scope.outputs.code == 'true' && github.event_name != 'pull_request'
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The one lane that must keep a floating nightly, and not by oversight.
      # `crates/mvm-hostd/ebpf/rust-toolchain.toml` pins `channel = "nightly"`,
      # and both the bpf-linker install below and `just check::ebpf` say
      # `cargo +nightly` — they resolve the toolchain *by that name*. Installing
      # a dated nightly instead leaves `+nightly` pointing at whatever rustup
      # auto-installs, which carries no `rust-src`, and the build dies asking
      # for it. Nothing is lost by staying floating here: this lane takes its
      # own `key: ebpf` cache entry and never reads the shared workspace one, so
      # it is not part of the toolchain/cache-key alignment the rest of this
      # file just gained. `check-fast-cargo.sh` allows exactly this one and ties
      # the exemption to the `cargo +nightly` that causes it.
      - name: Install nightly Rust toolchain for eBPF build
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      # This lane compiles a different crate set from the shared workspace key
      # and builds bpf-linker from source, so it gets its own entry rather than
      # diluting the one every other lane restores.
      - uses: ./.github/actions/rust-cache
        with:
          key: ebpf

      # Pinned deliberately. `--locked` only honors the crate's own bundled
      # lockfile; it does not pin which version gets installed, so an upstream
      # release silently changes this lane's toolchain. 0.11.0 did exactly that
      # on 2026-08-12, requiring an LLVM newer than the runner image ships and
      # breaking the build script. This version must move together with the
      # `aya` version in Cargo.lock.
      - name: Install bpf-linker
        run: cargo +nightly install --locked --version 0.10.4 bpf-linker

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build the eBPF object
        run: just check::ebpf

      - name: Run mvm-hostd eBPF telemetry load/attach test
        run: cargo test -p mvm-hostd --features ebpf-telemetry --lib

  # ── Lane: cold-boot latency ceiling ──────────────────────────────
  # A launch-latency regression is otherwise found by hand, months late:
  # Firecracker guest boot drifted to 447ms against 58.6ms on the same image
  # and was noticed only when someone profiled a launch for another reason.
  #
  # This is the coarse half of the gate deliberately. A shared runner's
  # variance is large, so the budget is loose enough to be immune to it and
  # therefore too loose to catch a 20% drift. It catches the multiple-x class,
  # which is the class that has actually happened. The precise, tight-tolerance
  # comparison belongs on a dedicated host where run-to-run spread is small
  # enough for a percentage to mean something — that is a separate lane, not
  # this one, because one threshold cannot do both jobs: loose enough to
  # survive shared-runner noise is too loose to catch drift, and tight enough
  # to catch drift will flake here and get switched off.
  boot-latency:
    name: Boot latency ceiling
    # Merge queue only. It pins a *published* image on purpose, as a control
    # variable, so a regression it catches is in host-side code; that is an
    # integration property of the merged tree, not a deterministic compile or
    # unit failure the fast gate exists for. The budget is a ceiling with
    # roughly 3x headroom over the observed median, not a tolerance — it
    # exists to catch multiple-x regressions.
    needs: [scope]
    if: >-
      needs.scope.outputs.code == 'true'
      && github.event_name != 'pull_request'
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # `IMAGE_TAG` is resolved from images.lock by a step below, not written
      # here. Pinned, not `latest`: auto-tracking a moving release is how this
      # lane would surprise-break on an unrelated image cut, and it would look
      # like a latency regression when it is not. And the boot image train, not
      # the CLI train — `v0.18.0` was a workspace version bump, never a cut
      # release, so this lane once 404'd on an asset nobody had published.
      # Must track `crates/mvm-core/src/config.rs::FC_VERSION_DEFAULT` so this
      # witness exercises the same VMM release as product boots.
      FC_VERSION: v1.17.0
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      # The guest binaries are static musl, cross-compiled with the pinned
      # toolchain the build script and `mvmctl` both use.
      - uses: ./.github/actions/install-zigbuild

      # This lane anchors on a checksum manifest it downloads. Whoever could
      # swap the artifact could swap its recorded digest too, so the manifest
      # is only worth anchoring on once its signature is checked — which is the
      # same reasoning that made these manifests signed in the first place.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - uses: ./.github/actions/rust-cache
        with:
          key: boot-latency

      - name: Install firecracker
        run: |
          set -euo pipefail
          curl -fL -o firecracker.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          tar -xzf firecracker.tgz
          sudo install -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" /usr/bin/firecracker
          /usr/bin/firecracker --version

      - name: Grant /dev/kvm access for the job
        # ubuntu-latest's /dev/kvm is root:kvm 0660 and the runner user is not
        # in the kvm group. The runner is ephemeral, so the looser mode is
        # confined to this job.
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing on this runner — the boot gate cannot run." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Resolve the locked boot image tag
        # The one pin, read rather than copied. A literal here would be a
        # second copy to keep in step by eye, which is what images.lock exists
        # to end.
        run: |
          set -euo pipefail
          {
            echo "IMAGE_TAG=$(./scripts/locked-image-tag.sh)"
            echo "IMAGE_REPO=$(./scripts/locked-image-tag.sh image_set repository)"
            echo "IMAGE_MANIFEST=$(./scripts/locked-image-tag.sh image_set manifest_asset)"
            echo "IMAGE_MANIFEST_SHA256=$(./scripts/locked-image-tag.sh image_set manifest_sha256)"
            echo "IMAGE_WORKFLOW=$(./scripts/locked-image-tag.sh image_set workflow)"
            echo "IMAGE_TAG_REF=$(./scripts/locked-image-tag.sh image_set tag_ref)"
            echo "IMAGE_BUILDER_CACHE_CONTRACT=$(./scripts/locked-image-tag.sh compatibility builder_cache_contract)"
          } >> "$GITHUB_ENV"

      - name: Fetch and verify the pinned bootable image
        # Signature-verified, then hash-verified against the release's own
        # checksum manifest — the same posture every other artifact fetch in
        # this repo uses. A corrupted download must fail here rather than
        # surface as a boot-time mystery, and a substituted one must fail here
        # rather than boot.
        env:
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          mkdir -p /tmp/boot-image && cd /tmp/boot-image
          base="https://github.com/${IMAGE_REPO}/releases/download/${IMAGE_TAG}"
          curl -fL --retry 3 -o image-set.json "$base/${IMAGE_MANIFEST}"
          curl -fL --retry 3 -o image-set.json.bundle "$base/${IMAGE_MANIFEST}.bundle"
          printf '%s  %s\n' "$IMAGE_MANIFEST_SHA256" image-set.json | sha256sum -c -
          cosign verify-blob \
            --bundle image-set.json.bundle \
            --certificate-identity "https://github.com/${IMAGE_REPO}/${IMAGE_WORKFLOW}@${IMAGE_TAG_REF}" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            image-set.json
          # An absent base-image contract is a set published before the
          # declaration: the legacy contract 0. mvmctl boots 0..=1.
          jq -e --argjson contract "$IMAGE_BUILDER_CACHE_CONTRACT" '
            (.compatibility.base_image_contract // 0) <= 1 and
            .compatibility.builder_cache_contract == $contract
          ' image-set.json >/dev/null
          for f in default-microvm-vmlinux-x86_64 default-microvm-rootfs-x86_64.ext4; do
            curl -fL --retry 3 -o "$f" "$base/$f"
            jq -r --arg name "$f" '
              .members[] | select(.target.arch? == "x86_64") | .artifacts[] |
              select(.name == $name) | "\(.sha256)  \(.name)"
            ' image-set.json > expected.txt
            test -s expected.txt
            sha256sum -c expected.txt
          done
          # The guest agent comes from the overlay this tree assembles, so it
          # speaks this tree's protocol.
          protocol="$(sed -n 's/^pub const PROTOCOL_VERSION: u32 = \([0-9][0-9]*\);$/\1/p' \
            "$GITHUB_WORKSPACE/crates/mvm-agentd/src/vsock/mod.rs")"
          test -n "$protocol"
          jq -n --arg rev "$(jq -r .mvm_source_commit image-set.json)" \
            --argjson protocol "$protocol" \
            '{name:"mvm-default-microvm",accessible:false,sealed:true,entrypointKind:"command",entrypointArgv:[],initSystem:"busybox",expectedBootMs:300,agentBinary:"real",rootlessEntrypoint:true,hypervisor:"firecracker",overlayAware:true,runtimeLean:true,imageTag:"",source:"fetched",builtAt:"",protocolVersion:$protocol,generatorRev:$rev,libc:"unknown"}' \
            > mvm-meta.json
          ls -la

      - name: Assemble the runtime overlay from this tree
        # The base image is the published control variable; the overlay is
        # not an image-set member a launch reads. Every `mvmctl` assembles it
        # on the host from its guest runtime, so this lane assembles it from
        # this tree, in a home of the step's own so no cache stands in for it.
        # The bench step reuses the same home: the launch-time evidence gate
        # verifies the overlay against the checked source cache this build
        # left there, and the version names that cache entry.
        env:
          MVM_HOME: ${{ github.workspace }}/.boot-latency-overlay-home
          MVM_RUNTIME_OVERLAY_ACQUIRE_MODE: build
        run: |
          set -euo pipefail
          mkdir -p "$MVM_HOME" && chmod 0700 "$MVM_HOME"
          cargo run -q --bin mvmctl -- dev runtime-overlay build --source build --arch x86_64
          mapfile -t dirs < <(find "$MVM_HOME/cache/runtime-overlay" -mindepth 2 -maxdepth 2 -type d -name x86_64)
          test "${#dirs[@]}" -eq 1
          mkdir -p /tmp/boot-image/overlay
          for f in overlay.ext4 overlay.verity overlay.roothash; do
            cp -L "${dirs[0]}/$f" "/tmp/boot-image/overlay/$f"
          done
          # The bench step boots with the launch-time evidence gate verifying
          # the overlay against this home's checked source cache, named by the
          # version the cache layout records.
          echo "MVM_RUNTIME_BOOT_RUNTIME_VERSION=$(basename "$(dirname "${dirs[0]}")")" \
            >> "$GITHUB_ENV"
          ls -la /tmp/boot-image/overlay

      - name: Boot within the ceiling
        # The budget is a ceiling, not a target. A dedicated KVM host measures
        # this image cold-boot-to-agent-ready at a median of ~2.1s, so 6s
        # leaves roughly 3x headroom for a shared runner while still failing
        # the multiple-x regressions this lane exists to catch. p50/p95/max are
        # printed on every run, so tightening it later is a reading exercise
        # rather than a guess.
        env:
          MVM_RUNTIME_BOOT_BENCH: "1"
          MVM_RUNTIME_BOOT_BACKEND: firecracker
          MVM_RUNTIME_BOOT_KERNEL: /tmp/boot-image/default-microvm-vmlinux-x86_64
          MVM_RUNTIME_BOOT_ROOTFS: /tmp/boot-image/default-microvm-rootfs-x86_64.ext4
          MVM_RUNTIME_BOOT_OVERLAY: /tmp/boot-image/overlay/overlay.ext4
          MVM_RUNTIME_BOOT_OVERLAY_VERITY: /tmp/boot-image/overlay/overlay.verity
          MVM_RUNTIME_BOOT_READY: guest-agent
          MVM_RUNTIME_BOOT_GRANT: "1"
          MVM_RUNTIME_BOOT_RUNS: "5"
          MVM_RUNTIME_BOOT_CONCURRENT: "3"
          MVM_RUNTIME_BOOT_BUDGET_MS: "6000"
          # The evidence gate verifies the overlay against the checked source
          # cache in the home that assembled it; the version arrives via
          # GITHUB_ENV from the assembly step.
          MVM_HOME: ${{ github.workspace }}/.boot-latency-overlay-home
        run: |
          MVM_RUNTIME_BOOT_OVERLAY_ROOTHASH="$(tr -d '[:space:]' \
            < /tmp/boot-image/overlay/overlay.roothash)" \
          cargo test --test runtime_boot_bench \
            prebuilt_runtime_image_boots_within_budget -- --exact --nocapture

      - name: Dump VMM diagnostics on failure
        if: failure()
        # Firecracker's stderr goes to `firecracker.log` in the per-VM state
        # dir and its console to `console.log`; neither reaches the job output.
        # Without this a launch failure surfaces only as "API socket did not
        # appear", which is a symptom and never the cause.
        run: |
          echo "--- host ---"
          uname -r || true
          systemctl --version | head -1 || true
          findmnt /tmp || true
          id || true
          stat -c '%U %a' /dev/kvm || true
          # The job's own overlay home, the default home, and the per-test
          # temp homes the BDD harness creates all hold VM state dirs.
          for d in "$GITHUB_WORKSPACE"/.boot-latency-overlay-home/vms/*/ \
                   "$HOME"/.mvm/vms/*/ /tmp/.tmp*/vms/*/; do
            [ -d "$d" ] || continue
            echo "===== $d ====="
            ls -la "$d" || true
            for f in firecracker.log console.log; do
              if [ -s "$d$f" ]; then
                echo "--- $f ---"; tail -n 200 "$d$f"
              fi
            done
          done
  guest-image-boot:
    name: Guest image boots (pinned base set, tree guest runtime)
    # The Linux layer comes from the image set images.lock pins: kernels and
    # base root filesystems are built, reproduced and signed in mvm-images.
    # The guest runtime is this tree's, assembled on the host by `mvmctl` the
    # way every source-checkout launch assembles it, so a guest change is
    # booted here without building anything through mvm-images.
    # Dispatch-only: the merge queue boots the locked published image in
    # `boot-latency` instead.
    needs: [scope]
    if: github.event_name == 'workflow_dispatch' && needs.scope.outputs.guest_image == 'true'
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Must track `crates/mvm-core/src/config.rs::FC_VERSION_DEFAULT`.
      FC_VERSION: v1.17.0
      # A home of the job's own, so the overlay below is the one this run
      # assembled and not one a cache restored.
      MVM_HOME: ${{ github.workspace }}/.guest-image-home
      # Launch acquisition defaults to the published pieces even in a checkout;
      # the guest runtime under test is this tree's.
      MVM_RUNTIME_OVERLAY_ACQUIRE_MODE: build
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld e2fsprogs

      # The guest binaries are static musl, cross-compiled with the pinned
      # toolchain the build script and `mvmctl` both use.
      - uses: ./.github/actions/install-zigbuild

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - uses: ./.github/actions/rust-cache
        with:
          key: guest-image-boot

      - name: Resolve the locked image set
        # Read from images.lock, never copied: the set a release of this tree
        # boots is the set this diagnostic boots.
        run: |
          set -euo pipefail
          {
            echo "IMAGE_TAG=$(./scripts/locked-image-tag.sh)"
            echo "IMAGE_REPO=$(./scripts/locked-image-tag.sh image_set repository)"
            echo "IMAGE_MANIFEST=$(./scripts/locked-image-tag.sh image_set manifest_asset)"
            echo "IMAGE_MANIFEST_SHA256=$(./scripts/locked-image-tag.sh image_set manifest_sha256)"
            echo "IMAGE_WORKFLOW=$(./scripts/locked-image-tag.sh image_set workflow)"
            echo "IMAGE_TAG_REF=$(./scripts/locked-image-tag.sh image_set tag_ref)"
          } >> "$GITHUB_ENV"

      - name: Fetch and verify the pinned base image
        # The kernel and the root filesystem only. The set's guest-runtime
        # members are not fetched: the overlay this lane boots is assembled
        # from the tree below.
        env:
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          mkdir -p staging && cd staging
          base="https://github.com/${IMAGE_REPO}/releases/download/${IMAGE_TAG}"
          curl -fL --retry 3 -o image-set.json "$base/${IMAGE_MANIFEST}"
          curl -fL --retry 3 -o image-set.json.bundle "$base/${IMAGE_MANIFEST}.bundle"
          printf '%s  %s\n' "$IMAGE_MANIFEST_SHA256" image-set.json | sha256sum -c -
          cosign verify-blob \
            --bundle image-set.json.bundle \
            --certificate-identity "https://github.com/${IMAGE_REPO}/${IMAGE_WORKFLOW}@${IMAGE_TAG_REF}" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            image-set.json
          for f in default-microvm-vmlinux-x86_64 default-microvm-rootfs-x86_64.ext4; do
            curl -fL --retry 3 -o "$f" "$base/$f"
            jq -r --arg name "$f" '
              .members[] | select(.target.arch? == "x86_64") | .artifacts[] |
              select(.name == $name) | "\(.sha256)  \(.name)"
            ' image-set.json > expected.txt
            test -s expected.txt
            sha256sum -c expected.txt
          done
          mv default-microvm-vmlinux-x86_64 vmlinux
          mv default-microvm-rootfs-x86_64.ext4 rootfs.ext4

      - name: Assert the pinned rootfs has an exec'able /init
        run: |
          set -euo pipefail
          bash nix/packaging/release/assert-init-shebang.sh \
            staging/rootfs.ext4 "pinned x86_64"
          bash nix/packaging/release/assert-kernel-format.sh \
            staging/vmlinux x86_64 "pinned x86_64 kernel"

      - name: Assemble the runtime overlay from this tree
        # `--source build` compiles the guest runtime archive from this
        # checkout and assembles the overlay from it on the host: the pure-Rust
        # ext4 writer and the in-process verity tree, no Nix and no image
        # checkout. A fresh home holds exactly one overlay afterwards.
        run: |
          set -euo pipefail
          mkdir -p "$MVM_HOME" && chmod 0700 "$MVM_HOME"
          cargo run -q --bin mvmctl -- dev runtime-overlay build --source build --arch x86_64
          mapfile -t dirs < <(find "$MVM_HOME/cache/runtime-overlay" -mindepth 2 -maxdepth 2 -type d -name x86_64)
          test "${#dirs[@]}" -eq 1
          mkdir -p overlay-staging
          cp -L "${dirs[0]}/overlay.ext4"     overlay-staging/overlay.ext4
          cp -L "${dirs[0]}/overlay.verity"   overlay-staging/overlay.verity
          cp -L "${dirs[0]}/overlay.roothash" overlay-staging/overlay.roothash
          echo "MVM_RUNTIME_BOOT_OVERLAY_ROOTHASH=$(tr -d '[:space:]' < overlay-staging/overlay.roothash)" \
            >> "$GITHUB_ENV"
          # The bench step boots with the launch-time evidence gate verifying
          # the overlay against this home's checked source cache, named by the
          # version the cache layout records.
          echo "MVM_RUNTIME_BOOT_RUNTIME_VERSION=$(basename "$(dirname "${dirs[0]}")")" \
            >> "$GITHUB_ENV"

      - name: Reassemble the overlay and require identical bytes
        # The overlay's ext4 and dm-verity bytes must not depend on when they
        # were written: a random UUID, hash salt or timestamp would give every
        # assembly its own root hash. `--force` discards the slot and
        # reassembles from the same guest-runtime archive.
        run: |
          set -euo pipefail
          cargo run -q --bin mvmctl -- dev runtime-overlay build --source build --arch x86_64 --force
          dir=$(find "$MVM_HOME/cache/runtime-overlay" -mindepth 2 -maxdepth 2 -type d -name x86_64)
          for f in overlay.ext4 overlay.verity overlay.roothash; do
            cmp "overlay-staging/$f" "$dir/$f"
          done

      - name: Install firecracker
        run: |
          set -euo pipefail
          curl -fL -o firecracker.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          tar -xzf firecracker.tgz
          sudo install -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" /usr/bin/firecracker
          /usr/bin/firecracker --version

      - name: Grant /dev/kvm access for the job
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing on this runner — the boot gate cannot run." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Boot the pinned base image with the tree's guest runtime
        # This is a reach-userspace witness, not a latency assertion. The loose
        # budget and single run keep shared-runner variance out of the result.
        env:
          MVM_RUNTIME_BOOT_BENCH: "1"
          MVM_RUNTIME_BOOT_BACKEND: firecracker
          MVM_RUNTIME_BOOT_KERNEL: staging/vmlinux
          MVM_RUNTIME_BOOT_ROOTFS: staging/rootfs.ext4
          MVM_RUNTIME_BOOT_OVERLAY: overlay-staging/overlay.ext4
          MVM_RUNTIME_BOOT_OVERLAY_VERITY: overlay-staging/overlay.verity
          MVM_RUNTIME_BOOT_READY: guest-agent
          MVM_RUNTIME_BOOT_RUNS: "1"
          MVM_RUNTIME_BOOT_CONCURRENT: "1"
          MVM_RUNTIME_BOOT_BUDGET_MS: "60000"
        run: |
          set -euo pipefail
          cargo test --test runtime_boot_bench \
            prebuilt_runtime_image_boots_within_budget -- --exact --nocapture

      - name: Guest console on failure
        if: failure()
        run: |
          for d in "$MVM_HOME"/vms/*/ "$HOME"/.mvm/vms/*/; do
            [ -d "$d" ] || continue
            echo "===== $d ====="
            ls -la "$d" || true
            if [ -f "$d/console.log" ]; then
              cat "$d/console.log"
            fi
          done

  nix-flake-check:
    name: Nix flake check (Linux eval)
    # This repository still owns the public mkGuest library and host-package
    # flake, so prove its evaluation and lean-rootfs contracts in the merge
    # queue. Canonical image builds and reproducibility belong to mvm-images.
    needs: [scope]
    if: needs.scope.outputs.nix == 'true' && github.event_name != 'pull_request'
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore Nix binary cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ hashFiles('nix/**', 'crates/**/*.rs', 'crates/**/Cargo.toml', 'src/**', 'third_party/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'build.rs') }}
          restore-prefixes-first-match: nix-

      - name: Eval-check every flake
        run: |
          set -euo pipefail
          find nix -name flake.nix -type f -print0 | sort -z | while IFS= read -r -d '' flake; do
            d="$(dirname "$flake")"
            echo "=== $d ==="
            nix flake check --no-build "./$d"
          done

      # The root flake's default dev shell stays lean: Zig, cargo-zigbuild and
      # libclang belong to `.#full`. Evaluation only; nothing is built.
      - name: Dev shell tiers stay split
        run: sh scripts/check-devshell-tiers.sh

      # This runner is x86_64, so only the x86_64-linux check variant builds
      # here; the aarch64-linux variant stays defined for parity and for a
      # future arm64 runner.
      - name: Baked guest rootfs closure stays lean and glibc-free
        run: |
          set -euo pipefail
          nix build --print-build-logs \
            ./nix#checks.x86_64-linux.guest-rootfs-no-glibc \
            ./nix#checks.x86_64-linux.guest-rootfs-package-budget
