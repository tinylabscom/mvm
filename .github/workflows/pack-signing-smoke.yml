name: Pack signing smoke

# Nightly gate that proves the keyless pack signing round-trip works
# against a REAL cosign bundle, not just the offline fixtures the unit
# suite exercises. It produces a throwaway keyless manifest over dummy
# artifacts, signs it with `cosign sign-blob` using this job's own GitHub
# Actions OIDC identity, then feeds the real bundle through the Rust
# sigstore-verify stack the pack verifier uses in production. Signs nothing
# a real user consumes and publishes no artifacts.

on:
  # Ran zero times between being written and 2026-08-21, because
  # workflow_dispatch was its only trigger and nobody dispatched it. A
  # signing round-trip nobody runs proves nothing about the release it is
  # supposed to protect, so it now runs on the same nightly cadence as the
  # rest of the security lanes. Offset from Security's :17 so a slow
  # nightly is not mistaken for a missing one.
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Produce a keyless builder pack manifest over dummy artifacts
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          mkdir -p smoke
          printf 'dummy-kernel' > smoke/vmlinux
          printf 'dummy-rootfs' > smoke/rootfs.ext4
          printf 'dummy-sbom'   > smoke/sbom.txt
          # The SAN cosign embeds in the certificate for a GitHub Actions
          # OIDC-keyless signature is this workflow file bound to the
          # dispatch ref — reconstruct exactly that so the verify step
          # below checks against the identity the signature actually
          # carries.
          IDENTITY="https://github.com/${REPOSITORY}/.github/workflows/pack-signing-smoke.yml@${REF}"
          echo "IDENTITY=${IDENTITY}" >> "$GITHUB_ENV"
          cargo run --release -p mvm-build --example mvm-builder-pack-tool -- \
            --vmlinux smoke/vmlinux --rootfs smoke/rootfs.ext4 --arch x86_64 --channel stable --keyless \
            --identity "${IDENTITY}" --out-dir smoke --sbom smoke/sbom.txt \
            --revocation-channel "https://example.test/rev.json"
          mv smoke/manifest.json smoke/pack-manifest.json

      - name: Keyless-sign the manifest with cosign
        run: |
          set -euo pipefail
          # --new-bundle-format emits the Sigstore bundle (with
          # verificationMaterial) the Rust verifier parses; legacy --bundle is
          # rejected by that stack.
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle smoke/pack-manifest.json.bundle \
            smoke/pack-manifest.json

      - name: Verify the real cosign bundle through the Rust verifier
        # This is the gap a real signature closes: every other pack-signing
        # test signs with an in-process ed25519 key or feeds a synthetic
        # bundle fixture. Here `cosign sign-blob`'s actual bundle output —
        # certificate chain, signature, and transparency-log inclusion
        # proof — is checked by the same `verify_signed_payload` primitive
        # the production pack verifier calls. A nonzero exit here means the
        # Rust sigstore-verify stack and the installed cosign CLI have
        # drifted apart on bundle format, and fails the job.
        run: |
          set -euo pipefail
          cargo run --release -p mvm-core --example verify-pack-signature --features manifest-verify -- \
            --manifest smoke/pack-manifest.json --bundle smoke/pack-manifest.json.bundle \
            --identity "${IDENTITY}" --issuer "https://token.actions.githubusercontent.com"

      - name: Round-trip a runtime pack manifest through the Rust verifier
        # The runtime pack the release pipeline publishes uses a distinct
        # keyless producer (kernel + verity-sealed rootfs + verity/roothash
        # sidecars) from the builder pack above. Produce one over dummy
        # artifacts, sign its manifest with the same real `cosign sign-blob
        # --new-bundle-format`, and verify through the same production
        # primitive — so this smoke guards the runtime-pack signing path too.
        run: |
          set -euo pipefail
          printf 'dummy-verity'   > smoke/rootfs.verity
          printf '%064d' 0        > smoke/rootfs.roothash
          cargo run --release -p mvm-build --example mvm-builder-pack-tool -- \
            --kind runtime \
            --vmlinux smoke/vmlinux --rootfs smoke/rootfs.ext4 \
            --verity smoke/rootfs.verity --roothash smoke/rootfs.roothash \
            --arch x86_64 --channel stable --keyless \
            --identity "${IDENTITY}" --out-dir smoke --sbom smoke/sbom.txt \
            --revocation-channel "https://example.test/rev.json"
          mv smoke/manifest.json smoke/runtime-pack-manifest.json
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle smoke/runtime-pack-manifest.json.bundle \
            smoke/runtime-pack-manifest.json
          cargo run --release -p mvm-core --example verify-pack-signature --features manifest-verify -- \
            --manifest smoke/runtime-pack-manifest.json --bundle smoke/runtime-pack-manifest.json.bundle \
            --identity "${IDENTITY}" --issuer "https://token.actions.githubusercontent.com"

      - name: Round-trip an image manifest through the dev-image verifier
        # The same Rust stack backs the dev-image download signature check
        # (image_verify::verify_manifest), which hard-fails on a bundle it
        # cannot parse. Sign a real image manifest and verify it through that
        # exact entrypoint, so this smoke also guards the dev-image trust path.
        run: |
          set -euo pipefail
          cat > smoke/image-manifest.json <<'JSON'
          {
            "schema_version": 1,
            "version": "0.0.0-smoke",
            "arch": "x86_64",
            "variant": "dev",
            "rootfs_format": "ext4",
            "artifacts": [{"name": "dev-rootfs-x86_64.ext4", "sha256": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}],
            "nix_store_hash": "smoke",
            "source_git_sha": "smoke",
            "flake_locks": {},
            "addressed_advisories": [],
            "built_at": "2026-01-01T00:00:00Z",
            "not_after": "2099-01-01T00:00:00Z"
          }
          JSON
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle smoke/image-manifest.json.bundle \
            smoke/image-manifest.json
          cargo run --release -p mvm-core --example verify-signed-manifest --features manifest-verify -- \
            --manifest smoke/image-manifest.json --bundle smoke/image-manifest.json.bundle \
            --identity "${IDENTITY}" --issuer "https://token.actions.githubusercontent.com"

      - name: Round-trip a pack revocation list through its verifier
        # The revocation list is signed + verified through the same Rust stack.
        # Sign a real list and verify it through the fetch-path entrypoint
        # (pack_revocation::verify_pack_revocation_list), so this smoke also
        # guards the revocation channel's signing format.
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > smoke/pack-revocations.json <<JSON
          {"schema_version":1,"revocations":[],"issued_at":"${now}","not_after":"2099-01-01T00:00:00Z"}
          JSON
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle smoke/pack-revocations.json.bundle \
            smoke/pack-revocations.json
          cargo run --release -p mvm-core --example verify-pack-revocation-list --features manifest-verify -- \
            --list smoke/pack-revocations.json --bundle smoke/pack-revocations.json.bundle \
            --identity "${IDENTITY}" --issuer "https://token.actions.githubusercontent.com"

      - name: Round-trip a release archive through the downloader's verifier
        # The runtime overlay and SDK sidecar are cosign-verified before an
        # installed mvmctl will extract them, and the verifier parses ONLY the
        # Sigstore bundle shape. Offline fixtures cannot cover that contract —
        # a valid signature needs Fulcio and Rekor — so without this step a
        # bundle-format regression in release.yml stays invisible until a real
        # release strands every download, fail-closed, for every user.
        #
        # Scope, stated plainly: this proves the SIGNATURE FORMAT round-trip
        # against a real bundle. Extraction, manifest re-check, atomic install,
        # and resolve are covered by the offline suite; release.yml runs the
        # full ladder over its own artifacts before publishing them.
        run: |
          set -euo pipefail
          # A tarball shaped like the one the release publishes. Contents are
          # irrelevant to a signature check, but keeping the real member set
          # means this fails the same way a real artifact would.
          mkdir -p smoke/sidecar
          printf 'dummy-ext4'   > smoke/sidecar/sdk.ext4
          printf '0.0.0-smoke'  > smoke/sidecar/VERSION
          ( cd smoke/sidecar && sha256sum sdk.ext4 VERSION > checksums-sha256.txt )
          tar -C smoke/sidecar -czf smoke/sdk-sidecar-x86_64.tar.gz \
            sdk.ext4 VERSION checksums-sha256.txt

          # The exact invocation release.yml signs release archives with.
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle smoke/sdk-sidecar-x86_64.tar.gz.bundle \
            smoke/sdk-sidecar-x86_64.tar.gz

          cargo run --release -p mvm-build --example verify-release-archive-signature \
            --features manifest-verify -- \
            --archive smoke/sdk-sidecar-x86_64.tar.gz \
            --bundle smoke/sdk-sidecar-x86_64.tar.gz.bundle \
            --identity "${IDENTITY}" --issuer "https://token.actions.githubusercontent.com"

      - name: A legacy-format bundle must be refused
        # The failure this lane exists to catch, asserted directly: signing
        # without --new-bundle-format must NOT verify. Without this, the step
        # above would still pass if the verifier ever silently accepted both
        # shapes, and the gate would be measuring nothing.
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --bundle smoke/legacy.bundle \
            smoke/sdk-sidecar-x86_64.tar.gz
          if cargo run --release -p mvm-build --example verify-release-archive-signature \
            --features manifest-verify -- \
            --archive smoke/sdk-sidecar-x86_64.tar.gz \
            --bundle smoke/legacy.bundle \
            --identity "${IDENTITY}" --issuer "https://token.actions.githubusercontent.com"; then
            echo "::error::a legacy-format bundle verified — the format gate is not discriminating" >&2
            exit 1
          fi
          echo "ok: legacy-format bundle refused, as the release contract requires"
