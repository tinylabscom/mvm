name: Warm the Rust build cache

# CI runs on `pull_request` and `merge_group`, never on a push to main — so
# without this workflow nothing ever writes a cache entry that another ref can
# read, and every job in every validation cycle compiles the dependency graph
# from scratch.
#
# This is the one writer. It builds the workspace once per merge so that every
# pull-request job and, more importantly, every merge-queue job starts from a
# warm target directory. The queue is the throughput bottleneck and its refs are
# ephemeral, so main is the only place a cache useful to it can come from.
#
# It costs one build per merge and saves several per validation cycle: the
# workspace is compiled by lint-core, lint-features, test-workspace, test-linux
# and test-ebpf-telemetry, each from cold today.

on:
  push:
    branches: [main]
    # Only the inputs that can change what gets compiled. A docs-only merge
    # leaves the previous entry valid, and rewriting it would spend a build to
    # produce a byte-identical cache.
    paths:
      - "crates/**"
      - "src/**"
      - "xtask/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/cache-warm.yml"
      - ".github/actions/rust-cache/**"
  workflow_dispatch: {}

permissions:
  contents: read

# These have to match ci.yml's workflow-level `env:` exactly, and the reason is
# not cosmetic. `Swatinem/rust-cache` folds every environment variable whose
# name begins with CARGO/CC/CFLAGS/CXX/CMAKE/RUST into the hash it keys the
# cache on, and its restore-key list stops at that hash — there is no bare
# prefix to fall back to. So a job that sets `RUSTFLAGS: "-D warnings"` cannot
# restore an entry written by a job that did not, no matter how identical the
# lockfile and toolchain are. This workflow had no `env:` block at all, so the
# one entry every other lane depends on was written under a key none of them
# ever computes, and every CI job cold-built.
#
# It is also the correct cache to write on the merits: `-D warnings` is part of
# how the artifacts are compiled, so an entry built without it is not the one
# the consuming lanes want.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# One warm at a time. Merges can land faster than a build completes, and the
# newest main is the one worth caching — but let an in-flight build finish
# rather than cancelling, since a half-built target dir caches nothing useful.
concurrency:
  group: cache-warm
  cancel-in-progress: false

jobs:
  warm:
    name: Warm
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/free-disk

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore and publish the trusted Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""

      - name: Build Nix outputs to populate the binary cache
        run: |
          set -euo pipefail
          nix build --print-build-logs --no-link \
            ./nix#checks.x86_64-linux.guest-rootfs-no-glibc \
            ./nix#checks.x86_64-linux.guest-rootfs-package-budget
          nix build --print-build-logs --no-link \
            ./nix/images/runtime-overlay#packages.x86_64-linux.default \
            ./nix/images/runtime-overlay#packages.x86_64-linux.sdk-sidecar \
            ./nix/images/runtime-overlay#packages.x86_64-linux.sdk-sidecar-image
          nix build --print-build-logs --impure --no-link \
            ./nix/images/default-tenant#packages.x86_64-linux.default

      # Stable is what the lint lanes use, so warm the exact compiler and
      # Clippy artifacts those required checks restore.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Install system build deps
        uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin lld

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache
        with:
          save: "true"

      # `clippy --all-targets` compiles every crate, every test target, and
      # every dependency — the same artifacts the lint and test lanes each
      # rebuild from cold. Running clippy rather than build also warms the
      # clippy-specific artifacts that lint-core and lint-features need.
      #
      # Failures here are not a merge gate: this runs after the merge that
      # already passed CI, and its only job is to leave a cache behind. A
      # genuine breakage is caught by the lanes that gate.
      - name: Build the workspace to populate the cache
        run: ./scripts/cargo-stable.sh clippy --workspace --all-targets -- -D warnings
