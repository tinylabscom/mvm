name: Warm the Rust build cache

# CI runs on `pull_request` and `merge_group`, never on a push to main — so
# without this workflow nothing ever writes a cache entry that another ref can
# read, and every job in every validation cycle compiles the dependency graph
# from scratch.
#
# This is the trusted-main writer for PR lint caches. Merge groups run only
# scope and the required aggregate, so they do not consume the Rust cache.
#
# It costs one build per merge and saves several per validation cycle. Its
# entries are keyed to the stable 1.100.0 toolchain, so they serve the lanes that
# use the corresponding lint-core and lint-features cache keys. Ordinary test
# lanes now use the same compiler; cache reuse still depends on their key and
# feature/profile selection, not the compiler version alone.
#
# The test-support graph differs enough to rebuild almost every workspace crate
# after restoring the default entry, so it has a dedicated trusted-main key.
# Keeping it separate prevents its feature fingerprints from diluting the entry
# restored by every other Rust lane.

on:
  push:
    branches: [main]
    # Only the inputs that can change what gets compiled. A docs-only merge
    # leaves the previous entry valid, and rewriting it would spend a build to
    # produce a byte-identical cache.
    paths:
      - "crates/**"
      - "src/**"
      - "xtask/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/cache-warm.yml"
      - ".github/actions/rust-cache/**"
  workflow_dispatch: {}

permissions:
  contents: read

# These have to match ci.yml's workflow-level `env:` exactly, and the reason is
# not cosmetic. `Swatinem/rust-cache` folds every environment variable whose
# name begins with CARGO/CC/CFLAGS/CXX/CMAKE/RUST into the hash it keys the
# cache on, and its restore-key list stops at that hash — there is no bare
# prefix to fall back to. So a job that sets `RUSTFLAGS: "-D warnings"` cannot
# restore an entry written by a job that did not, no matter how identical the
# lockfile and toolchain are. This workflow had no `env:` block at all, so the
# one entry every other lane depends on was written under a key none of them
# ever computes, and every CI job cold-built.
#
# It is also the correct cache to write on the merits: `-D warnings` is part of
# how the artifacts are compiled, so an entry built without it is not the one
# the consuming lanes want.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# One warm at a time. Merges can land faster than a build completes, and the
# newest main is the one worth caching — but let an in-flight build finish
# rather than cancelling, since a half-built target dir caches nothing useful.
concurrency:
  group: cache-warm
  cancel-in-progress: false

jobs:
  warm:
    name: Warm
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/free-disk

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Restore and publish the trusted Nix store cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ hashFiles('nix/**', 'crates/**/*.rs', 'crates/**/Cargo.toml', 'src/**', 'third_party/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'build.rs') }}
          restore-prefixes-first-match: nix-
          gc-max-store-size: 2G

      - name: Build Nix outputs to populate the binary cache
        run: |
          set -euo pipefail
          nix build --print-build-logs --out-link "$RUNNER_TEMP/nix-cache-warm" \
            ./nix#checks.x86_64-linux.guest-rootfs-no-glibc \
            ./nix#checks.x86_64-linux.guest-rootfs-package-budget

      # Stable is what the lint lanes use, so warm the exact compiler and
      # Clippy artifacts those required checks restore.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: clippy

      - name: Install system build deps
        uses: ./.github/actions/apt-deps
        with:
          packages: attr cryptsetup-bin lld

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache
        with:
          save: "true"

      # `clippy --all-targets` compiles every crate, every test target, and
      # every dependency — the same artifacts the lint and test lanes each
      # rebuild from cold. Running clippy rather than build also warms the
      # clippy-specific artifacts that lint-core and lint-features need.
      #
      # Failures here are not a merge gate: this runs after the merge that
      # already passed CI, and its only job is to leave a cache behind. A
      # genuine breakage is caught by the lanes that gate.
      - name: Build the workspace to populate the cache
        run: ./scripts/cargo.sh clippy --workspace --all-targets -- -D warnings

  warm-test-support:
    name: Warm test-support
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/install-zigbuild

      - uses: ./.github/actions/rust-cache
        with:
          key: test-support
          save: "true"

      - name: Warm test-support feature tests
        run: |
          cargo test --no-run --features test-support --lib \
            -p mvm-backends -p mvm-runtime -p mvm-client -p mvm-cli -p mvm-vmm \
            -p mvm-fs -p mvm-build
          cargo test --no-run -p mvmctl --features test-support \
            --test audit_emissions_live
          cargo check -p mvm-cli --features test-support \
            --example verification_loop

  # Historical trial, before ordinary tests moved to the common stable pin:
  # those lanes used a nightly this workflow did not write for, so they restored
  # nothing — which looked like the reason `Test workspace` was slow.
  # It was not. A `warm-nightly` job wrote the entry they looked for, and across
  # ten lane-runs the hits halved what they compiled (Test workspace ~495 → ~270
  # crates, Test Linux ~820 → ~518) and saved no wall clock: medians moved by
  # ten to thirty seconds, inside run-to-run noise.
  #
  # Two reasons. What a hit skips is the dependency graph — many small crates
  # that compile quickly. What it cannot skip is the large workspace crates,
  # which any change low in the graph invalidates, plus linking and running the
  # tests; that is where those lanes spend their time. And the entry was 2.9 GB,
  # so unpacking it cost 60–116 s per lane, about what the skipped compilation
  # had saved. Two lockfile generations of it held ~5.8 GB of a 10 GB repository
  # cache that was already over its cap.
  #
  # Before adding one again, measure a lane's wall clock with and without it
  # over several runs. A lower compile count on its own is not a saving.
