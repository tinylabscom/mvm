name: rvproxy gateway parity

# Cross-repo parity gate for the macOS/libkrun egress-gateway default flip from
# upstream gvproxy to first-party rvproxy (ADR-082 / Plan 193 WS-1.5). Builds the
# candidate gateway (rvproxy) from a pinned rev of the private sibling repo and
# runs scripts/rvproxy-gateway-parity.sh against both gvproxy (control) and
# rvproxy (candidate). The gateway is the claim-10 chokepoint, so the default
# must not flip on a binary that diverges from the proven one.
#
# macos-latest is the target platform (libkrun unixgram) and where gvproxy
# installs cleanly, but it is ~10x ubuntu cost (ADR-038), so the expensive
# parity job only runs when gateway-contract files change (or by manual
# dispatch). The final `rvproxy gateway parity` job is the cheap, always-present
# required-check shim: it passes on unrelated PRs and fails if a relevant PR's
# macOS parity run fails or is skipped.
#
# Requires the RVPROXY_CHECKOUT_TOKEN secret: a token with read access to
# tinylabscom/rvproxy. Absent it, the candidate cannot be built and the gate
# fails closed (a parity claim with no candidate is not a pass).

on:
  # The workflow itself must run on every PR and merge-group SHA so branch
  # protection can require a stable context. A cheap changes job below decides
  # whether to pay for the macOS parity run.
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      rvproxy_ref:
        description: "Override the rvproxy ref to build the candidate from (blank = pinned default)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rvproxy main carrying the R2 flow-audit slices (the `Flow` dataplane event
  # the native-enforcement witness reads: kind=flow, verdict, endpoints) plus the
  # R3 fixes (#38 DNS source-IP, #42 EMSGSIZE MTU-segmentation, #53 read-timeout).
  # The prior pin predated the flow-audit event, so native rvproxy enforced
  # deny-by-default but exported a guest-egress record instead of the kind=flow
  # one the witness asserts. Single source for the pin; bump deliberately — a
  # moving ref would make the gate non-reproducible.
  RVPROXY_DEFAULT_REF: "92125e839bb6dce435ce4fccc8358b1f5d317843"

jobs:
  changes:
    name: rvproxy gateway parity changes
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: filter
        name: Detect gateway contract changes
        shell: bash
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "gateway=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            merge_group)
              base="${{ github.event.merge_group.base_sha }}"
              head="${{ github.event.merge_group.head_sha }}"
              ;;
            *)
              echo "unsupported event: ${{ github.event_name }}" >&2
              exit 1
              ;;
          esac

          changed="$RUNNER_TEMP/rvproxy-parity-changed-files.txt"
          git diff --name-only "$base" "$head" | tee "$changed"

          if grep -Eq '^(scripts/rvproxy-gateway-parity\.sh|\.github/workflows/rvproxy-parity\.yml|crates/mvm-hostd/src/supervisor/gateway_bridge\.rs|crates/mvm-hostd/src/supervisor/network/|crates/mvm-hostd/tests/egress_secret_leak_gate\.rs|crates/deps/libkrun-sys/src/gvproxy\.rs|crates/mvm-build/src/libkrun_builder\.rs|crates/mvm-build/src/libkrun_network_provider\.rs)' "$changed"; then
            echo "gateway=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway=false" >> "$GITHUB_OUTPUT"
          fi

  parity:
    name: rvproxy vs gvproxy parity
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # No RUSTFLAGS=-D warnings here on purpose: this lane builds a foreign repo
      # (rvproxy) and only needs the gateway to run, not to satisfy mvm's lint
      # bar — that is ci.yml's job.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rvproxy-parity-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: rvproxy-parity-cargo-

      # gvproxy is the control gateway; libkrun/libkrunfw cover any transitive
      # link need of the mvm-hostd test build on macOS.
      - name: Install gateway host deps
        run: brew install slp/krun/libkrun slp/krun/libkrunfw slp/krun/gvproxy

      - name: Build candidate rvproxy from pinned rev
        env:
          RVPROXY_TOKEN: ${{ secrets.RVPROXY_CHECKOUT_TOKEN }}
          RVPROXY_REF: ${{ github.event.inputs.rvproxy_ref || env.RVPROXY_DEFAULT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${RVPROXY_TOKEN:-}" ]; then
            echo "::error::RVPROXY_CHECKOUT_TOKEN is not set — cannot build the rvproxy candidate; the parity gate fails closed." >&2
            exit 1
          fi
          dest="$RUNNER_TEMP/rvproxy"
          git clone --filter=blob:none \
            "https://x-access-token:${RVPROXY_TOKEN}@github.com/tinylabscom/rvproxy.git" "$dest"
          git -C "$dest" checkout --detach "$RVPROXY_REF"
          echo "rvproxy pinned at $(git -C "$dest" rev-parse HEAD)"
          ( cd "$dest" && cargo build --release -p rvproxy --bin rvproxy )
          echo "RVPROXY_BIN=$dest/target/release/rvproxy" >> "$GITHUB_ENV"

      - name: Run gateway parity gate
        run: |
          set -euo pipefail
          RVPROXY_BIN="$RVPROXY_BIN" GVPROXY_BIN="$(command -v gvproxy)" \
            scripts/rvproxy-gateway-parity.sh

  required:
    name: rvproxy gateway parity
    runs-on: ubuntu-latest
    needs:
      - changes
      - parity
    if: always()
    steps:
      - name: Enforce parity result when relevant
        shell: bash
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          gateway="${{ needs.changes.outputs.gateway }}"
          parity="${{ needs.parity.result }}"

          if [[ "$changes" != "success" ]]; then
            echo "::error::Gateway-contract change detection failed; result was '$changes'."
            exit 1
          fi

          if [[ "$gateway" != "true" ]]; then
            echo "No gateway-contract changes; rvproxy parity is not required for this PR."
            exit 0
          fi

          if [[ "$parity" == "success" ]]; then
            echo "Gateway-contract changes detected; macOS rvproxy parity passed."
            exit 0
          fi

          echo "::error::Gateway-contract changes require the macOS rvproxy parity job to pass; result was '$parity'."
          exit 1
