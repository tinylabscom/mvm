name: rvproxy gateway parity (manual)

# Cross-repo parity gate for the macOS/libkrun egress-gateway default flip from
# upstream gvproxy to first-party rvproxy (ADR-082 / Plan 193 WS-1.5). Builds the
# candidate gateway (rvproxy) from a pinned rev of the private sibling repo and
# runs scripts/rvproxy-gateway-parity.sh against both gvproxy (control) and
# rvproxy (candidate). The gateway is the claim-10 chokepoint, so the default
# must not flip on a binary that diverges from the proven one.
#
# Operator-triggered only: macos-latest is the target platform (libkrun unixgram)
# and where gvproxy installs cleanly, but it is ~10x ubuntu cost (ADR-038), so
# this stays off the day-to-day ci.yml surface. Promote to a paths-filtered
# pull_request trigger once the default flip is on the table and the team accepts
# the macOS minutes — see Plan 193 WS-1.5.
#
# Requires the RVPROXY_CHECKOUT_TOKEN secret: a token with read access to
# tinylabscom/rvproxy. Absent it, the candidate cannot be built and the gate
# fails closed (a parity claim with no candidate is not a pass).

on:
  workflow_dispatch:
    inputs:
      rvproxy_ref:
        description: "rvproxy git ref to build the candidate gateway from"
        required: false
        # rvproxy main carrying the R3 fixes (#38 DNS source-IP, #42 EMSGSIZE
        # MTU-segmentation, #53 read-timeout). Bump deliberately as rvproxy lands
        # gateway changes; a moving ref would make the gate non-reproducible.
        default: "520a5dc6cc1fa5453979bba2fe9b7dc1a4c7aeb7"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  parity:
    name: rvproxy vs gvproxy parity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # No RUSTFLAGS=-D warnings here on purpose: this lane builds a foreign repo
      # (rvproxy) and only needs the gateway to run, not to satisfy mvm's lint
      # bar — that is ci.yml's job.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rvproxy-parity-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: rvproxy-parity-cargo-

      # gvproxy is the control gateway; libkrun/libkrunfw cover any transitive
      # link need of the mvm-hostd test build on macOS.
      - name: Install gateway host deps
        run: brew install slp/krun/libkrun slp/krun/libkrunfw slp/krun/gvproxy

      - name: Build candidate rvproxy from pinned rev
        env:
          RVPROXY_TOKEN: ${{ secrets.RVPROXY_CHECKOUT_TOKEN }}
          RVPROXY_REF: ${{ github.event.inputs.rvproxy_ref }}
        run: |
          set -euo pipefail
          if [ -z "${RVPROXY_TOKEN:-}" ]; then
            echo "::error::RVPROXY_CHECKOUT_TOKEN is not set — cannot build the rvproxy candidate; the parity gate fails closed." >&2
            exit 1
          fi
          dest="$RUNNER_TEMP/rvproxy"
          git clone --filter=blob:none \
            "https://x-access-token:${RVPROXY_TOKEN}@github.com/tinylabscom/rvproxy.git" "$dest"
          git -C "$dest" checkout --detach "$RVPROXY_REF"
          echo "rvproxy pinned at $(git -C "$dest" rev-parse HEAD)"
          ( cd "$dest" && cargo build --release -p rvproxy --bin rvproxy )
          echo "RVPROXY_BIN=$dest/target/release/rvproxy" >> "$GITHUB_ENV"

      - name: Run gateway parity gate
        run: |
          set -euo pipefail
          RVPROXY_BIN="$RVPROXY_BIN" GVPROXY_BIN="$(command -v gvproxy)" \
            scripts/rvproxy-gateway-parity.sh
