name: Security

# ADR-001 §W6.3 — single workflow that hosts every CI-side security
# gate. Lanes correspond to the microVM hardening workstreams and the
# seven claims in CLAUDE.md::Security model. These lanes provide release,
# nightly, and manually requested security evidence; they are not PR checks
# and do not block merge directly.
#
# Triggers: release-tag pushes (final pre-publish gate), a nightly cron,
# and manual dispatch. There is no `pull_request` trigger here; day-to-day
# PR checks live in ci.yml. The nightly cron catches advisory-DB additions
# even on quiet branches. `push: branches: [main]` was dropped in the
# ecosystem-wide CI cost reduction — the nightly cron covers the
# post-merge "did a new advisory land overnight" case at zero
# per-merge cost, so the duplicate post-merge run was pure waste.

on:
  # Per ADR-012: heavy security gates run at release time + nightly
  # cron only. Day-to-day per-push CI feedback comes from ci.yml; the
  # nightly cron picks up new RUSTSEC advisories that landed in the
  # advisory-db without anyone touching the repo.
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# There is no `pull_request` trigger here, so there is no check panel to keep
# free of superseded SHAs. The claim that the nightly cron was never cancelled
# because of a different ref was wrong: a scheduled run and an operator
# dispatch both carry `refs/heads/main` and so shared a group. The mutation
# shards run for over two hours, and cancelling one leaves nine numbered claims
# with a green ledger entry and no evidence behind it.
#
# Tag pushes already sit in their own group by ref. Dispatches now get their
# own by run id, and the nightly keeps the ref, so no run cancels another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Lane 1: Supply chain ──────────────────────────────────────────
  # Maps to ADR-001 §W5.2 — advisories, license allowlist, multi-
  # version bans, and registry source allowlist. Cheap (<2 min).
  cargo-deny:
    name: Supply chain — cargo-deny (ADR-001 §W5.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check
        run: cargo deny check

  cargo-audit:
    name: Supply chain — cargo-audit (ADR-001 §W5.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        # No `--ignore` flags, mirroring deny.toml's empty
        # `[advisories].ignore`. cargo-audit does not read deny.toml, so
        # the two suppression lists can drift apart silently — and did:
        # this step carried ten `--ignore` entries that deny.toml had
        # never held, none of which still matched anything in the graph.
        # A dead ignore is worse than none, because it reads as "we
        # looked at this" when nothing looks at it. An advisory that
        # fires here gets fixed, not listed.
        run: cargo audit

  # ── Lane 2: Guest-agent runtime boundary ─────────────────────────
  # The guest agent is one universal artifact. Its runtime profile and
  # launch-provisioned signed grant enforce DevOnly access, so this lane runs
  # the request-policy, grant, and handler conformance tests directly.
  guest-agent-runtime-boundary:
    name: Guest agent — runtime profile and grant boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-prodagent-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-prodagent-

      - name: Run guest-agent runtime boundary tests
        run: ./scripts/check-prod-agent-no-exec.sh

  # ── Lane 1b.2: No SSH of any kind, anywhere (ADR-001) ─────────────
  # "No SSH in microVMs, ever" is absolute — the tree once carried both a
  # dev-tier ssh-agent-forwarding feature (host SSH_AUTH_SOCK -> vsock
  # 5301 -> guest /run/mvm/ssh-agent.sock) and a legacy in-guest sshd +
  # keypair boot asset; all of it was removed entirely. Pure source-grep
  # regression backstop across every SSH-capability token, no build needed.
  no-ssh-forwarding:
    name: No SSH of any kind, anywhere (ADR-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assert no SSH-capability identifiers in source
        run: ./scripts/check-no-ssh.sh

  # ── Lane 1c: No host-authority symbols in a sealed prod agent ─────
  # The workload agent is the untrusted edge: it must not carry
  # host-side signing-key loading or plan-admission code. Asserts
  # load_host_signing_key / host_signer / admit_for_run are ABSENT
  # (with a handle_run_entrypoint canary against a stripped table).
  prod-agent-no-authority:
    name: prod agent carries no host-authority symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-prodagent-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-prodagent-

      - name: No host-signer / admission symbols in the production agent
        run: ./scripts/check-prod-agent-no-authority.sh

  builderd-no-authority:
    name: builder daemon carries no host-authority symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-builderd-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-builderd-

      - name: No host-signer / admission symbols in the builder daemon
        run: ./scripts/check-builderd-no-authority.sh

  # ── Lane 2b: Seccomp tier functional denial (ADR-001 §W2.4) ───────
  # Tier-structure unit tests in `mvm-security` cover cumulative-subset
  # and serde shapes; they don't exercise the BPF program at runtime.
  # This lane spawns `mvm-seccomp-apply <tier> -- syscall-probe` on
  # Linux and asserts:
  #   • unrestricted / network → socket(AF_INET) succeeds
  #   • standard               → socket(AF_INET) returns EPERM
  # Catches regressions where a syscall list passes structural tests
  # but fails to translate to a working seccomp filter (e.g., wrong
  # syscall number, missing arch coverage, NNP not set).
  seccomp-functional:
    name: Seccomp tier functional denial (ADR-001 §W2.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-seccomp-fn-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-seccomp-fn-

      - name: Run seccomp functional tests
        run: cargo test -p mvm-agentd --test seccomp_apply

  # ── Lane 3: Reproducibility ────────────────────────────────────────
  # ADR-001 §W5.3 — two clean builds must produce byte-identical
  # binaries. Catches build-time non-determinism that could mask
  # supply-chain injection.
  reproducibility:
    name: Reproducibility (ADR-001 §W5.3)
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1700000000"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings --remap-path-prefix=/home/runner/work=."
      # A release build now embeds the Linux host binaries by default, and
      # Build B would restore them from the content store Build A filled —
      # which `cargo clean` does not touch — so the comparison would say
      # nothing about them. Keep this lane's subject what it was.
      MVM_EMBED: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # The release-artifact feature embeds the helper binaries that shipped
      # mvmctl artifacts need at runtime, so this reproducibility check must
      # use the same feature set as the release workflow.
      - uses: ./.github/actions/install-zigbuild

      - name: Build A
        run: cargo build --release --locked --bin mvmctl --features host,user,template-registry-s3,release-artifact-bootstrap,release-channel

      - name: Hash A
        run: sha256sum target/release/mvmctl | tee /tmp/hash-a.txt

      - name: Clean
        run: cargo clean

      - name: Build B
        run: cargo build --release --locked --bin mvmctl --features host,user,template-registry-s3,release-artifact-bootstrap,release-channel

      - name: Hash B
        run: sha256sum target/release/mvmctl | tee /tmp/hash-b.txt

      - name: Compare hashes
        run: |
          set -euo pipefail
          a=$(awk '{print $1}' /tmp/hash-a.txt)
          b=$(awk '{print $1}' /tmp/hash-b.txt)
          if [ "$a" != "$b" ]; then
            echo "::error::Reproducibility mismatch: $a != $b" >&2
            echo "Two builds of the same source produced different binaries." >&2
            echo "Investigate before merging — non-determinism can mask supply-chain injection." >&2
            exit 1
          fi
          echo "ok: matching sha256 across two clean builds: $a"

  # ── Lane 4: Parser fuzzing (best-effort, time-boxed) ───────────────
  # ADR-001 §W4.2 + Plan 85 §R1 — cargo-fuzz harnesses for
  # GuestRequest, the authenticated-frame envelope, the libkrun
  # SupervisorConfig parser, and the OCI layer-unpack ingress.
  # Per-target durations are the `FUZZ_SECS_*` budget below, deliberately
  # not quoted here: they move as targets are added, and a duration named
  # in two places goes stale in one of them.
  fuzz:
    name: Fuzz — parsers (vsock + OCI)
    runs-on: ubuntu-latest
    # Under the six-hour platform cap, so a lane that outgrows its budget
    # is stopped as this job rather than killed as the runner mid-target.
    timeout-minutes: 300
    env:
      # Per-target fuzzing seconds. Literals at job scope rather than inside
      # the script below because `xtask check-workflow-paths` reads them: it
      # multiplies them by the number of targets in this job and refuses a
      # budget that cannot finish inside `timeout-minutes`.
      #
      # 1800 was chosen when this lane had four targets. It has seventeen,
      # and seventeen half-hours do not fit in six. Every nightly run was
      # stopped partway down the list — most recently after eleven targets —
      # so the last six targets had never
      # executed on a cron run at all. The job's conclusion was `cancelled`,
      # which the lane watcher did not count, so nothing said so.
      FUZZ_SECS_SCHEDULE: 720
      FUZZ_SECS_DISPATCH: 300
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        # Pinned dated nightly. cargo-fuzz needs nightly for the -Z sanitizer
        # flags, but a floating nightly let a toolchain or dep change break the
        # lane unseen (only this lane runs nightly). Frozen alongside the
        # committed per-crate fuzz Cargo.locks so the whole lane is
        # deterministic — bump this date deliberately. This is the nightly the
        # lane last passed on. The other security lanes intentionally stay on
        # floating @nightly: they run no sanitizer build and gain little.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-11

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz

      - name: Determine fuzz duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "secs=$FUZZ_SECS_SCHEDULE" >> "$GITHUB_OUTPUT"
          else
            echo "secs=$FUZZ_SECS_DISPATCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Fuzz GuestRequest (fuzz_guest_request)
        working-directory: crates/mvm-agentd
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          # `cargo fuzz` requires nightly (-Z sanitizer flags). The
          # repo-root `rust-toolchain.toml` pins stable, and rustup walks
          # up from this `working-directory` so it would otherwise win.
          # RUSTUP_TOOLCHAIN bypasses the toolchain-file lookup entirely.
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        run: cargo fuzz run fuzz_guest_request -- -max_total_time="$DURATION"

      - name: Fuzz SealedFrame (fuzz_sealed_frame)
        working-directory: crates/mvm-agentd
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        run: cargo fuzz run fuzz_sealed_frame -- -max_total_time="$DURATION"

      - name: Fuzz bounded DNS codec (fuzz_dns_codec)
        working-directory: crates/mvm-agentd
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        run: cargo fuzz run fuzz_dns_codec -- -max_total_time="$DURATION"

      - name: Fuzz workload input frames (fuzz_input_frame)
        working-directory: crates/mvm-agentd
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # The host→guest input plane put `InputFrame` and `CloseInput` on the
        # guest's wire. Both are deserialized before anything inspects them,
        # so the same "never panic on adversarial bytes" contract as
        # fuzz_guest_request applies.
        run: cargo fuzz run fuzz_input_frame -- -max_total_time="$DURATION"

      - name: Fuzz bounded telemetry records
        working-directory: crates/mvm-agentd
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        run: |
          telemetry_corpus=$(mktemp -d)
          cp ../mvm-core/tests/fixtures/telemetry-v1/*.json "$telemetry_corpus/"
          cargo fuzz run fuzz_telemetry_record "$telemetry_corpus" -- -max_total_time="$DURATION" -max_len=40000

      - name: Fuzz authed path (signed-side)
        working-directory: crates/mvm-agentd
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # Drives `verify_authenticated_frame` past sig check, asserting
        # tampered frames never reach the inner deserializer. Catches
        # regressions where a refactor reorders the verify/deserialize
        # steps in vsock.rs.
        run: cargo fuzz run fuzz_authed_path -- -max_total_time="$DURATION"

      - name: Fuzz SupervisorConfig (fuzz_supervisor_config)
        working-directory: crates/deps/libkrun-sys
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # Plan 88 W6 / ADR-055 §"New untrusted-input surfaces" — the
        # `mvm-libkrun-supervisor` binary reads `SupervisorConfig`
        # JSON on stdin before any libkrun call. This target asserts
        # the deserializer never panics on adversarial bytes; same
        # contract as `fuzz_guest_request` for the guest-side
        # `GuestRequest` parser.
        run: cargo fuzz run fuzz_supervisor_config -- -max_total_time="$DURATION"

      - name: Fuzz SupervisorAttachConfig (prelaunch attach)
        working-directory: crates/deps/libkrun-sys
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # Plan 118 WS-1 1a — the prelaunched supervisor reads a
        # `SupervisorAttachConfig` off a same-uid control UDS. It is the
        # only attacker-reachable surface after spawn; any panic is a
        # hard process death before the plan re-verify can fail closed.
        # Same "never panic on any input" contract as fuzz_supervisor_config.
        run: cargo fuzz run fuzz_attach_message -- -max_total_time="$DURATION"

      - name: Fuzz OCI unpack_layer
        working-directory: crates/mvm-fs
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # Plan 85 §R1 — `mvm_oci::unpack::unpack_layer` is the single
        # ingress point for adversarial OCI layer tarballs (path
        # traversal, hardlink chains, device-node sneak-ins, xattr
        # privilege carry, setuid surprise). The Phase A.2 PR landed
        # this harness; A.3 through A.6 added corpus entries. Moved
        # here from ci.yml's per-PR lane (commit 304b5c9c+) so the
        # 30-min budget only burns on release-tag pushes and the
        # nightly cron, not on every mvm-oci PR.
        run: cargo fuzz run --fuzz-dir fuzz-oci unpack_layer -- -max_total_time="$DURATION"

      - name: Fuzz HTTP response head + chunked framing
        working-directory: crates/mvm-http
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # `parse_head` and `next_chunk` are the whole untrusted surface of the
        # in-house HTTP client: every byte a hostile server controls arrives
        # through them, and they decide body framing, which is where HTTP/1.1
        # request smuggling lives. Same "never panic on any input" contract as
        # the other harnesses, plus two span invariants a parse bug would break
        # silently — never consume past the buffer, and never report chunk data
        # outside it (an out-of-range span becomes an OOB slice downstream).
        run: cargo fuzz run fuzz_response_parse -- -max_total_time="$DURATION"

      - name: Fuzz FlowMux frame decode (fuzz_network_flow_decode)
        working-directory: crates/mvm-contract
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # The FlowMux decoder is the first thing on the single workload
        # networking path to touch guest-controlled bytes. Same "never panic
        # on any input" contract as the other harnesses, plus two invariants
        # a parse bug would break silently: never report a payload past the
        # protocol cap, and re-encode a decoded frame to exactly the bytes it
        # decoded from. The second is the interesting one — a decoder that
        # normalizes a malformed field is where the two ends of a connection
        # start disagreeing about what they just exchanged.
        run: cargo fuzz run fuzz_network_flow_decode -- -max_total_time="$DURATION"

      - name: Fuzz FlowMux session state (fuzz_network_flow_state)
        working-directory: crates/mvm-contract
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # A different attack from the decoder's: every frame here is
        # individually well-formed, and the question is whether a *sequence*
        # of them can break the machine that decides what is allowed. Asserts
        # the ceilings hold, a retired stream id is never re-admitted, credit
        # never passes its window, and a refused frame moves nothing.
        run: cargo fuzz run fuzz_network_flow_state -- -max_total_time="$DURATION"

      - name: Fuzz egress routes (fuzz_egress_routes)
        working-directory: crates/mvm-contract
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # A route set arrives in a signed plan and every request on a
        # terminated flow is decided against it with a guest-chosen method and
        # path. Asserts decode/validate/decide never panic, a path that cannot
        # be canonicalised is refused rather than matched, a decision is a
        # function of its inputs, and a parsed `--allow-endpoint` spec always
        # builds a valid route.
        run: cargo fuzz run fuzz_egress_routes -- -max_total_time="$DURATION"

      - name: Fuzz runtime recording (SDK trace)
        working-directory: crates/mvm-sdk
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # Plan 186 — the recording JSON is the Tier-0 promotion input:
        # user-spawned code writes it to a tmpfile the CLI reads back.
        # `deny_unknown_fields` must fail closed on garbage, and every
        # lowering refusal (op limits, duplicate paths, oversize or
        # malformed FilesWrite b64, missing entrypoint) must surface as
        # Err, not a panic. Same "never panic on any input" contract as
        # the other config-parser targets.
        run: cargo fuzz run fuzz_runtime_recording -- -max_total_time="$DURATION"

      - name: Fuzz ext4 build_image (rootfs writer)
        working-directory: crates/mvm-fs
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # The pure-Rust ext4 writer turns an OCI-derived node set into the
        # rootfs image the run path boots. It is forbid(unsafe), so no input
        # can corrupt memory; this target asserts the next guarantee — no node
        # set panics build_image (a run-path DoS), and every image it emits is
        # block-aligned and carries the ext4 superblock magic. Impossible trees
        # must return Err, never abort.
        run: cargo fuzz run --fuzz-dir fuzz-ext4 fuzz_build_image -- -max_total_time="$DURATION"

      - name: Fuzz virtqueue geometry (virtio-vsock ring walk)
        working-directory: crates/mvm-runtime
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly-2026-06-11
        # The guest programs the virtio-vsock queue size, ring base addresses, and
        # descriptor table through untrusted MMIO writes + guest RAM. A hostile
        # geometry (a QueueNum whose low 16 bits are zero, truncating to a zero
        # modulus) or a hostile descriptor chain (cyclic next links, oversized
        # lengths) must not panic the host VMM or drive it into unbounded
        # allocation — both are guest-triggerable host DoS. This target is the
        # regression guard for the validated-geometry gate and the bounded
        # descriptor walk; it stays green once those hold.
        run: cargo fuzz run --fuzz-dir fuzz-backend fuzz_virtqueue_geometry -- -max_total_time="$DURATION"

      - name: Upload corpus on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: |
            crates/mvm-agentd/fuzz/corpus/
            crates/mvm-agentd/fuzz/artifacts/
            crates/deps/libkrun-sys/fuzz/corpus/
            crates/deps/libkrun-sys/fuzz/artifacts/
            crates/mvm-fs/fuzz-oci/corpus/
            crates/mvm-fs/fuzz-oci/artifacts/
            crates/mvm-sdk/fuzz/corpus/
            crates/mvm-sdk/fuzz/artifacts/

  # ── Lane 4b: Claim witnesses are mutation-tested ──────────────────
  # check-claim-catalog (ci.yml) proves a claim's witness EXISTS. This
  # lane asks whether it BITES: cargo-mutants breaks the enforcement
  # code on purpose and a surviving mutant means the witness cannot
  # detect its own property being violated. Sibling to the fuzz lane —
  # fuzzing asks whether bad input is handled, mutation asks whether
  # our own tests would notice the handling going away.
  #
  # The surface is derived from the claims ledger, and its pin is
  # checked on every PR by ci.yml; only the mutation run itself is
  # nightly, because it costs hours.
  mutation-witnesses:
    name: Claim witnesses — mutation-tested (${{ matrix.package }})
    runs-on: ubuntu-latest
    # Under the six-hour platform cap, so a shard that outgrows its budget
    # fails as itself. Reaching the cap instead kills the runner, and the
    # only trace is "The runner has received a shutdown signal" — which
    # names no package, no file, and no claim, and reads identically to
    # infrastructure having a bad night.
    #
    # This has already earned itself: mvm-hostd/2of2 hit it on 2026-08-16 and
    # was reported as a bounded, attributable stop with its partial output
    # kept, which is what said the split was uneven and by how much. Note
    # that GitHub records a timeout kill as `cancelled`, not `failure` —
    # `security-lane-watch.yml` counts `cancelled` for that reason, and
    # before it did, a shard that never finished was the one kind of red
    # this whole lane could not report.
    #
    # The mutation step carries a shorter timeout of its own, so a shard
    # that runs long stops with time left for the step that names the files
    # it never reached. This one stays as the backstop.
    timeout-minutes: 330
    # BLOCKING, and sharded per package.
    #
    # Sharding is structural, not a response to a particular runtime: a
    # GitHub-hosted job is killed at six hours, the surface only grows,
    # and a failure should name the package that owns it rather than
    # arrive as one opaque red job. A lane that cannot reliably finish
    # goes red for reasons unrelated to any claim and stops being read —
    # the failure this lane exists to prevent, reached from the other
    # side.
    #
    # Deliberately no duration quoted here. The first version of this
    # comment cited hours measured before the slowest tests in the tree
    # were fixed, and was wrong by roughly an order of magnitude within a
    # week. `specs/VERIFICATION.md` carries dated, measured per-shard
    # times instead; re-measure rather than re-quote.
    #
    # Every survivor is either closed by a test or carried in
    # xtask/mutation-witness-baseline.json with the mechanism that makes it
    # uncatchable here (a live VMM, a nix build, a feature this run does not
    # compile, or a provable equivalence). The ratchet tolerates only those
    # exact identities, so a NEW hole still fails — including inside the
    # files that carry accepted entries.
    #
    # The matrix is pinned against the baseline by check-mutation-witnesses
    # on every PR, so a package joining the surface cannot silently go
    # unmeasured here.
    #
    # See specs/VERIFICATION.md §"Mutation-tested witnesses" and plan 272 WS-2.
    strategy:
      fail-fast: false
      matrix:
        package:
          - mvm-agentd
          - mvm-backends
          - mvm-build
          - mvm-cli
          - mvm-client
          - mvm-core
          - mvm-fs
          # Six, and the number is measured rather than chosen.
          #
          # Raising the count is the second half of the fix; the first is
          # that xtask now packs shards longest-file-first instead of
          # slicing by stride. Adding shards alone had already been tried:
          # 2 -> 4 on 2026-08-16, on the correct diagnosis that splitting by
          # file count does not split by cost. It recurred, because a
          # cost-blind split of an unequal surface stays unequal at any
          # width — on 2026-08-21 shards 2of4 and 4of4 were both killed at
          # 330 minutes while 3of4 finished in 24.
          #
          # With cost-aware packing the surface splits evenly, and six
          # shards put the worst at ~181 measured minutes, 55% of the
          # budget. That headroom is deliberate: two of the per-file costs
          # behind it are lower bounds, measured on shards that were killed
          # part-way through a file.
          - mvm-hostd/1of6
          - mvm-hostd/2of6
          - mvm-hostd/3of6
          - mvm-hostd/4of6
          - mvm-hostd/5of6
          - mvm-hostd/6of6
          - mvm-contract
          - mvm-runtime
          - mvm-sdk
          - mvm-vmm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-mutation-${{ matrix.package }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-mutation-${{ matrix.package }}-

      - name: Install cargo-mutants and nextest
        # The mutator is pinned in Cargo.toml's [workspace.metadata.mvm.toolchain].
        # `--locked` alone pins the dependency tree of whatever release is
        # newest, not the tool, and the baseline's accepted misses are matched
        # on the description text that release renders. The gate refuses a
        # mutator other than the pin, so this read and that check agree.
        run: |
          set -euo pipefail
          CARGO_MUTANTS_VERSION=$(awk '/^\[workspace\.metadata\.mvm\.toolchain\]/ { t = 1; next }
            /^\[/ { t = 0 }
            t && $1 == "cargo-mutants" { gsub(/"/, "", $3); print $3 }' Cargo.toml)
          if [ -z "$CARGO_MUTANTS_VERSION" ]; then
            echo "::error::no cargo-mutants pin in [workspace.metadata.mvm.toolchain]" >&2
            exit 1
          fi
          cargo install --locked "cargo-mutants@${CARGO_MUTANTS_VERSION}" cargo-nextest

      - name: Install mvm-cli embedded-host toolchain
        if: matrix.package == 'mvm-cli'
        uses: ./.github/actions/install-zigbuild

      - name: Mutate this package's claim surface and ratchet survivors
        # Stopped short of the job's own timeout so the accounting step below
        # still runs: a shard cut off here leaves its unreached files with no
        # output at all, and only that step names them.
        timeout-minutes: 315
        # `--run` mutates the claim-enforcement surface and runs the suite
        # against each mutant — plan verification that no longer verifies, a
        # seccomp filter that no longer filters, the host signer. That is
        # security code with its check removed, so it must not reach a real
        # mvm state root: it could mint a key at the wrong path or mode (the
        # mutation may be *in* the path/mode logic) or leave firewall rules
        # behind.
        #
        # MVM_HOME alone is not enough — `default_mvm_cache_dir` deliberately
        # reads the home directory to seed from the shared cache, which is the
        # leak `check-test-home-isolation` exists to catch. So both roots move.
        #
        # CARGO_HOME/RUSTUP_HOME are pinned to the real home *before* the
        # redirect: `~` follows HOME, so without this the toolchain the earlier
        # steps installed would vanish mid-job and the cache step above would
        # be keyed on a path that only exists here.
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export MVM_HOME="$RUNNER_TEMP/mutants-mvm-home"
          export HOME="$MVM_HOME"
          # The gate writes cargo-mutants output under the system temp dir.
          # Pin that dir so the upload step below has a path it knows rather
          # than one it guesses at.
          export TMPDIR="$RUNNER_TEMP/mutants-out"
          mkdir -p "$TMPDIR"
          mkdir -p "$HOME"
          if [ -e "$HOME/.mvm/keys" ]; then
            echo "::error::refusing to mutate against a reachable keystore at $HOME/.mvm/keys" >&2
            exit 1
          fi
          cargo run -p xtask -- check-mutation-witnesses --run --package '${{ matrix.package }}'

      - name: Account for every surface file this shard owns
        # The step above judges only what it measured, and a shard stopped by
        # its timeout judges nothing: files run in path order, so what goes
        # missing is an alphabetical tail, and the uploaded output simply has
        # no directory for it. Read on its own, that output lists survivors for
        # the files the shard reached and says nothing about the rest, which
        # reads as clean. This re-derives the shard's file set from the pinned
        # surface and fails on each file with no finished result under the
        # pinned mutator, by name, separately from any survivor.
        if: always()
        timeout-minutes: 10
        run: |
          cargo run -p xtask -- check-mutation-witnesses \
            --verify-outcomes "$RUNNER_TEMP/mutants-out/mvm-mutation-witnesses" \
            --package '${{ matrix.package }}'

      - name: Keep the mutation output of a shard that did not finish
        # A shard killed by the timeout above has still measured most of its
        # files, and that work is the only evidence of where it went. Without
        # this the directory dies with the runner and the next person starts
        # from the same blank page.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-${{ strategy.job-index }}
          path: ${{ runner.temp }}/mutants-out/mvm-mutation-witnesses/
          if-no-files-found: ignore
          retention-days: 7

  # ── Lane 5: Hash-verify regression ─────────────────────────────────
  # ADR-001 §W5.1 — the unit tests that exercise the
  # download-and-verify code path live in mvm-cli. Run them in
  # isolation so a regression is visible in this workflow even when
  # the broader test job in ci.yml is skipped.
  hash-verify-tests:
    name: Hash-verify regression (ADR-001 §W5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # build.rs cross-compiles the embedded host-vm binaries (Plan 115 /
      # ADR-065); without zig + cargo-zigbuild the mvmctl build panics.
      - uses: ./.github/actions/install-zigbuild

      - name: Run hash-verify tests
        run: cargo test -p mvm-cli --lib hash_verify_tests

  # ── Lane 6: Verified boot artifact gate ────────────────────────────
  # ADR-001 §W3.4 — the production verity-sealed image must ship its
  # ext4 + `*.verity` + `*.roothash` sidecars, and the roothash must
  # actually authenticate the ext4 through that hash tree. If the seal is
  # disabled or broken on the prod path, this gate fails before the
  # verity claim breaks silently. Images are built and signed in
  # mvm-images, so the subject is the bytes every installed mvmctl boots:
  # the runtime overlay member of the image set `images.lock` pins, which
  # every microVM attaches at boot and which is sealed the same way the
  # rootfs is. The rootfs/OCI seal itself is unit-tested in
  # `mvm_build::oci_to_rootfs::verity`.
  verified-boot-artifacts:
    name: Verified boot artifacts (ADR-001 §W3.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # veritysetup, to check the roothash against the tree rather than
      # only its shape.
      - uses: ./.github/actions/apt-deps
        with:
          packages: cryptsetup-bin

      - name: Resolve the locked image set
        # The one pin, read rather than copied, exactly as ci.yml's
        # boot-latency lane reads it.
        run: |
          set -euo pipefail
          {
            echo "IMAGE_TAG=$(./scripts/locked-image-tag.sh)"
            echo "IMAGE_REPO=$(./scripts/locked-image-tag.sh image_set repository)"
            echo "IMAGE_MANIFEST=$(./scripts/locked-image-tag.sh image_set manifest_asset)"
            echo "IMAGE_MANIFEST_SHA256=$(./scripts/locked-image-tag.sh image_set manifest_sha256)"
            echo "IMAGE_WORKFLOW=$(./scripts/locked-image-tag.sh image_set workflow)"
            echo "IMAGE_TAG_REF=$(./scripts/locked-image-tag.sh image_set tag_ref)"
          } >> "$GITHUB_ENV"

      - name: Fetch and verify the locked runtime overlay
        # Root digest against the lock, root signature against the lock's
        # identity, member digest against the root, then the archive's own
        # manifest — the chain an installed mvmctl walks before it boots these
        # bytes. A substituted overlay fails here rather than being asserted on.
        env:
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          mkdir -p /tmp/locked-overlay && cd /tmp/locked-overlay
          base="https://github.com/${IMAGE_REPO}/releases/download/${IMAGE_TAG}"
          curl -fL --retry 3 -o image-set.json "$base/${IMAGE_MANIFEST}"
          curl -fL --retry 3 -o image-set.json.bundle "$base/${IMAGE_MANIFEST}.bundle"
          printf '%s  %s\n' "$IMAGE_MANIFEST_SHA256" image-set.json | sha256sum -c -
          cosign verify-blob \
            --bundle image-set.json.bundle \
            --certificate-identity "https://github.com/${IMAGE_REPO}/${IMAGE_WORKFLOW}@${IMAGE_TAG_REF}" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            image-set.json
          f=runtime-overlay-x86_64.tar.gz
          curl -fL --retry 3 -o "$f" "$base/$f"
          jq -r --arg name "$f" '
            .members[] | select(.target.arch? == "x86_64") | .artifacts[] |
            select(.name == $name) | "\(.sha256)  \(.name)"
          ' image-set.json > expected.txt
          test -s expected.txt
          sha256sum -c expected.txt
          mkdir -p overlay && tar -C overlay -xzf "$f"
          ( cd overlay && sha256sum -c checksums-sha256.txt )

      - name: Assert the overlay's verity seal authenticates it
        run: |
          set -euo pipefail
          out=/tmp/locked-overlay/overlay
          for f in overlay.ext4 overlay.verity overlay.roothash; do
            if [ ! -s "$out/$f" ]; then
              echo "::error::missing $f in the locked runtime overlay" >&2
              echo "ADR-001 §W3.4 requires the production verity-sealed image" >&2
              echo "to ship {ext4,verity,roothash}; a missing sidecar usually" >&2
              echo "means the dm-verity seal was disabled on the prod path." >&2
              exit 1
            fi
          done
          hash=$(tr -d '[:space:]' < "$out/overlay.roothash")
          if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::roothash is not a 64-char lowercase hex string: ${hash}" >&2
            exit 1
          fi
          # A present-but-wrong sidecar passes every check above. Walking the
          # tree from the roothash down to each data block is what proves the
          # three files are one seal and not three unrelated files.
          sudo veritysetup verify "$out/overlay.ext4" "$out/overlay.verity" "$hash"
          echo "ok: overlay.{ext4,verity,roothash} present and consistent, roothash=${hash:0:12}…"

  # ── Lane 6b: Sealed-prod rootfs has no SSH (plan 76 Phase 8) ──────
  # Plan 76 §Phase 8 + ADR-001 §"No SSH inside microVMs". The vsock-
  # only claim is enforced at runtime by the `mvm-guest-agent`
  # dispatcher (Plan 76 Phase 1 + the `sealed-prod-allowlist` CI
  # lane in `ci.yml`). This lane is the static counterpart: it
  # mounts the verity-sealed runtime overlay (the mvm-controlled
  # filesystem attached to every microVM) — the locked, signed image-set
  # member an installed mvmctl boots — and fails if any SSH artifact is
  # present.
  #
  # No untrusted GitHub event input flows into any step; all
  # commands below are static literals.
  #
  # Out of scope for this lane (named on purpose):
  #   - port 22 not listening — needs a live boot
  #   - agent has no ambient capabilities — needs a live boot
  #   - dev verbs rejected at runtime — already gated by
  #     `ci.yml::sealed-prod-allowlist`
  sealed-prod-no-ssh:
    name: Sealed-prod rootfs has no SSH (plan 76 Phase 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Resolve the locked image set
        # The one pin, read rather than copied, exactly as ci.yml's
        # boot-latency lane reads it.
        run: |
          set -euo pipefail
          {
            echo "IMAGE_TAG=$(./scripts/locked-image-tag.sh)"
            echo "IMAGE_REPO=$(./scripts/locked-image-tag.sh image_set repository)"
            echo "IMAGE_MANIFEST=$(./scripts/locked-image-tag.sh image_set manifest_asset)"
            echo "IMAGE_MANIFEST_SHA256=$(./scripts/locked-image-tag.sh image_set manifest_sha256)"
            echo "IMAGE_WORKFLOW=$(./scripts/locked-image-tag.sh image_set workflow)"
            echo "IMAGE_TAG_REF=$(./scripts/locked-image-tag.sh image_set tag_ref)"
          } >> "$GITHUB_ENV"

      - name: Fetch and verify the locked runtime overlay
        # Root digest against the lock, root signature against the lock's
        # identity, member digest against the root, then the archive's own
        # manifest — the chain an installed mvmctl walks before it boots these
        # bytes. A substituted overlay fails here rather than being asserted on.
        env:
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          mkdir -p /tmp/locked-overlay && cd /tmp/locked-overlay
          base="https://github.com/${IMAGE_REPO}/releases/download/${IMAGE_TAG}"
          curl -fL --retry 3 -o image-set.json "$base/${IMAGE_MANIFEST}"
          curl -fL --retry 3 -o image-set.json.bundle "$base/${IMAGE_MANIFEST}.bundle"
          printf '%s  %s\n' "$IMAGE_MANIFEST_SHA256" image-set.json | sha256sum -c -
          cosign verify-blob \
            --bundle image-set.json.bundle \
            --certificate-identity "https://github.com/${IMAGE_REPO}/${IMAGE_WORKFLOW}@${IMAGE_TAG_REF}" \
            --certificate-oidc-issuer "$COSIGN_OIDC_ISSUER" \
            image-set.json
          f=runtime-overlay-x86_64.tar.gz
          curl -fL --retry 3 -o "$f" "$base/$f"
          jq -r --arg name "$f" '
            .members[] | select(.target.arch? == "x86_64") | .artifacts[] |
            select(.name == $name) | "\(.sha256)  \(.name)"
          ' image-set.json > expected.txt
          test -s expected.txt
          sha256sum -c expected.txt
          mkdir -p overlay && tar -C overlay -xzf "$f"
          ( cd overlay && sha256sum -c checksums-sha256.txt )

      - name: Assert no SSH on the sealed overlay
        run: |
          set -euo pipefail
          rootfs=/tmp/locked-overlay/overlay/overlay.ext4
          if [ ! -f "$rootfs" ]; then
            echo "::error::overlay.ext4 missing from the locked runtime overlay" >&2
            exit 1
          fi

          # Mount read-only and scan the whole tree for SSH artifacts.
          # Read-only is load-bearing: any write would invalidate the
          # dm-verity root hash. A content scan (not fixed paths) keeps
          # the check meaningful regardless of filesystem layout.
          mnt=$(mktemp -d)
          sudo mount -o ro,loop "$rootfs" "$mnt"
          trap 'sudo umount "$mnt" || true; rmdir "$mnt" || true' EXIT

          fail=0

          # Any sshd binary, anywhere in the image.
          if sudo find "$mnt" -type f -name sshd -print -quit | grep -q .; then
            echo "::error::sshd binary present in the sealed image:" >&2
            sudo find "$mnt" -type f -name sshd >&2 || true
            fail=1
          fi

          # SSH host keys (ssh_host_*), anywhere — a ready-to-serve SSH
          # leak per ADR-001 §"No SSH inside microVMs".
          if sudo find "$mnt" -type f -name 'ssh_host_*' -print -quit | grep -q .; then
            echo "::error::SSH host keys present in the sealed image:" >&2
            sudo find "$mnt" -type f -name 'ssh_host_*' >&2 || true
            fail=1
          fi

          # sshd_config, anywhere.
          if sudo find "$mnt" -type f -name sshd_config -print -quit | grep -q .; then
            echo "::error::sshd_config present in the sealed image:" >&2
            sudo find "$mnt" -type f -name sshd_config >&2 || true
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::ADR-001 violated; sealed-prod images must not ship SSH artifacts." >&2
            exit 1
          fi
          echo "ok: sealed image has no sshd / host keys / sshd_config"

  # ── Lane 7: Flake lockfile cleanliness (plan 36 §Layer 0) ──────────
  # Every flake.lock in the repo must be committed and in sync with
  # its flake.nix. A stale lock means the input closure recorded in a
  # signed manifest doesn't match what nix would actually use on
  # rebuild — the trust chain breaks silently. Cheap (eval-only).
  flake-locks-clean:
    name: Flake locks — committed + in sync (plan 36 §Layer 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Assert every flake.lock is committed and in sync
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r flake; do
            d=$(dirname "$flake")
            echo "::group::$d"
            # A flake whose only registry input is this repo's own GitHub
            # URL has no stable remote rev to lock against: a source
            # checkout resolves it at build time with
            # `--override-input mvm path:...`. Detect that property
            # instead of naming the directories — the previous name list
            # went stale the moment a fifth such example was added, and
            # the gate then reported a missing lockfile for a flake that
            # must not have one. Anchored to a real assignment:
            # nix/flake.nix documents this exact line in a comment.
            if grep -qE '^[[:space:]]*inputs\.mvm\.url = "github:tinylabscom/mvm' "$flake"; then
              echo "skipped — self-referential mvm input, resolved at build time"
              echo "::endgroup::"
              continue
            fi
            if [ ! -f "$d/flake.lock" ]; then
              echo "::error::missing $d/flake.lock — every flake must commit its lockfile (plan 36 §Layer 0)" >&2
              fail=1
              echo "::endgroup::"
              continue
            fi
            # `nix flake lock` updates the lockfile if it diverges from
            # flake.nix. If `git diff --quiet` reports nothing changed,
            # the committed lock is authoritative for the current
            # flake.nix inputs.
            cp "$d/flake.lock" "$d/flake.lock.original"
            nix flake lock "$d" 2>&1 || true
            if ! diff -q "$d/flake.lock" "$d/flake.lock.original" > /dev/null; then
              echo "::error::$d/flake.lock is out of sync with $d/flake.nix" >&2
              echo "Run \`nix flake lock $d\` locally and commit the updated lockfile." >&2
              diff -u "$d/flake.lock.original" "$d/flake.lock" | head -40 >&2 || true
              fail=1
            else
              echo "ok"
            fi
            mv "$d/flake.lock.original" "$d/flake.lock"
            echo "::endgroup::"
          # plan-89-baseline is an intentionally input-less throw-at-eval
          # boot-timing fixture (see its flake.nix) — no inputs means no
          # lockfile to keep in sync, so exclude it like template_scaffold.
          # Flakes that pin inputs.mvm to this repo are skipped by the
          # content check above, not by path.
          done < <(find . -name flake.nix \
            -not -path './target/*' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './*/resources/template_scaffold/*' \
            -not -path './tests/fixtures/plan-89-baseline/*')
          exit "$fail"

  # Claim 11's witness. ADR-001's ledger cites this job by name, and until
  # now it lived in ci-full.yml — a workflow-dispatch-only lane that had
  # never been run, not once, since it was written. The ledger row was
  # green the whole time on evidence nobody had ever gathered. It moves
  # here because this is where every other `ci:` witness in that table
  # already lives, and because a nightly is the only trigger that makes a
  # lane's silence detectable.
  app-deps-audit:
    name: app-deps-audit (ADR-047 claim 9 / Plan 73 Followup D)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/install-zigbuild

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-app-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-app-deps-

      - name: Run app-deps-audit smoke
        run: ./scripts/test-app-deps-ci-gate.sh

  # The OCI hardening lanes behind claim 14, likewise never run: they were
  # six separate dispatch-only jobs in ci-full.yml, each a checkout, a
  # toolchain, an apt install, a cache and one or two `cargo test`
  # invocations. The only thing that differed between them was the test
  # selector, so they are one matrix here.
  #
  # Their paths-filter steps are gone rather than ported. Each gated its
  # real work on `steps.filter.outputs.oci == 'true' || github.ref ==
  # 'refs/heads/main'`, and on this workflow's triggers the second arm is
  # always true — the filter decided nothing and cost a step.
  oci-hardening:
    name: OCI hardening — ${{ matrix.lane.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - id: layer-unpack-adversarial
            test: cargo test --test oci_unpack_attacks -p mvm-fs -- --include-ignored
          - id: digest-mismatch-reject
            test: cargo test --test hermetic_registry -p mvm-fs rejects
          - id: malformed-manifest
            test: "cargo test -p mvm-fs -- manifest:: reference::"
          - id: mutable-tag-prod-reject
            zigbuild: true
            test: cargo test -p mvm-cli -- prod_pull_requires_digest_pin prod_run_image_requires_digest_pin
          - id: reproducibility
            test: |
              cargo test -p mvm-fs reproducibility_two_unpacks_match_modulo_inode
              cargo test --test oci_ext4_materialization -p mvm-fs materialize_is_byte_deterministic
          - id: image-runner-smoke
            zigbuild: true
            test: cargo test --test oci_ext4_materialization -p mvm-fs
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/install-zigbuild
        if: matrix.lane.zigbuild

      # The superset of what the individual lanes installed. e2fsprogs is
      # only needed by two of them and costs seconds, which is cheaper than
      # a per-lane package list that drifts out of step with the tests.
      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev lld e2fsprogs

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-oci-${{ matrix.lane.id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-oci-${{ matrix.lane.id }}-

      - name: ${{ matrix.lane.id }}
        run: ${{ matrix.lane.test }}

  # Claim 15's sealed-prod tier, and claims 1/2's confinement primitives.
  #
  # Both lanes were deleted along with ci-full.yml in the first pass of this
  # consolidation, on the reasoning that the workflow had never run. That
  # was the wrong conclusion from the right observation: a security lane
  # that has never run is a lane to start running, not one to remove.
  sealed-prod-allowlist:
    name: Sealed-prod vsock allowlist (plan 76 Phase 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system build deps
        run: sudo apt-get update && sudo apt-get install -y libcap-ng-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sealed-prod-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sealed-prod-

      - name: Assert SealedProd vsock allowlist matches plan 76 §Phase 1
        run: ./scripts/check-sealed-prod-allowlist.sh

  jailer-property:
    name: jailer property tests (seccomp + Landlock) (Plan 113 §Task 9)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcap-ng-dev lld

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-jailer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-jailer-

      # Kept as a probe rather than an assertion because both property
      # suites share `confine_self`, which applies Landlock first: without
      # the LSM active the seccomp half cannot be reached either, and the
      # failure would say nothing about this repo.
      #
      # It is a silent-skip risk and named as one: a skip leaves the job
      # green with nothing exercised, and the watcher reads job
      # conclusions, so it cannot tell that apart from a pass. The step
      # summary below is what a reader has to check. Making the absence
      # fail instead would be the stronger gate, but only once a runner
      # image is pinned that is known to carry Landlock.
      - name: Probe Landlock kernel support
        id: landlock_probe
        run: |
          set -euo pipefail
          uname -r
          echo "active LSMs: $(cat /sys/kernel/security/lsm 2>/dev/null || echo '(unreadable)')"
          if ! grep -qw landlock /sys/kernel/security/lsm 2>/dev/null; then
            echo "::warning::Landlock LSM not active on this runner — the jailer property tests did NOT run."
            echo "- :warning: jailer property tests **skipped**: Landlock LSM not active" >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat /sys/kernel/security/landlock/abi_versions 2>/dev/null \
            || echo "(abi_versions not exposed on this kernel)"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run property tests (seccomp + Landlock)
        if: steps.landlock_probe.outputs.available == 'true'
        run: |
          cargo test -p mvm-hostd \
            --test seccomp_property \
            --test landlock_property \
            -- --ignored --nocapture
