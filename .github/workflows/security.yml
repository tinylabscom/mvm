name: Security

# ADR-002 §W6.3 — single workflow that hosts every CI-side security
# gate. Lanes correspond to the workstreams in
# specs/plans/25-microvm-hardening.md and the seven claims in
# CLAUDE.md::Security model. Failure on any lane blocks merge.
#
# Triggers: PRs against main, release-tag pushes (final pre-publish
# gate), plus a nightly cron so advisory-DB additions get caught even
# on quiet branches. `push: branches: [main]` was dropped in the
# ecosystem-wide CI cost reduction — the nightly cron covers the
# post-merge "did a new advisory land overnight" case at zero
# per-merge cost, so the duplicate post-merge run was pure waste.

on:
  # Per ADR-038: heavy security gates run at release time + nightly
  # cron only. Day-to-day per-push CI feedback comes from ci.yml; the
  # nightly cron picks up new RUSTSEC advisories that landed in the
  # advisory-db without anyone touching the repo.
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Cancel a previous run when a new commit lands on the same branch.
# Same rationale as ci.yml — keep the PR check panel free of stale
# failed runs from superseded SHAs. `main` pushes and the nightly
# cron are never cancelled (different ref → different group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Lane 1: Supply chain ──────────────────────────────────────────
  # Maps to ADR-002 §W5.2 — advisories, license allowlist, multi-
  # version bans, and registry source allowlist. Cheap (<2 min).
  cargo-deny:
    name: Supply chain — cargo-deny (ADR-002 §W5.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check
        run: cargo deny check

  cargo-audit:
    name: Supply chain — cargo-audit (ADR-002 §W5.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        # Ignored advisories must mirror deny.toml's `[advisories].ignore`.
        # cargo-audit doesn't read deny.toml; CLI flags are the
        # discoverable way to keep the two tools in sync.
        run: cargo audit --ignore RUSTSEC-2025-0057 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2025-0119 --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2026-0009 --ignore RUSTSEC-2025-0052 --ignore RUSTSEC-2024-0436

  # ── Lane 2: Production-agent symbol contract ─────────────────────
  # ADR-002 §W4.3 + ADR-007 §W5 — combined contract on the production
  # guest agent binary. ONE build, ONE step, BOTH assertions:
  #   • mvm_guest_agent::do_exec is ABSENT (W4.3 — no dev-shell leak)
  #   • mvm_guest_agent::handle_run_entrypoint is PRESENT (W5 — the
  #     constrained RunEntrypoint handler ships).
  # Asserting both on the *same* binary in a single step prevents
  # feature-flag drift from regressing half the contract silently.
  prod-agent-runentry-contract:
    name: Guest agent — symbol contract (ADR-002 §W4.3 + ADR-007 §W5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-prodagent-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-prodagent-

      - name: Build prod agent and assert symbol contract
        run: ./scripts/check-prod-agent-no-exec.sh

  # ── Lane 1b: No interactive console in a sealed prod agent ────────
  # claim 15 / Plan 165 WS-C. The PTY-over-vsock console is the single
  # dev-only interactive path; it's gated behind `dev-shell`, so a prod
  # agent must not link it. Asserts the relay symbol is ABSENT (with a
  # handle_run_entrypoint canary against a stripped table) and a
  # positive control that it IS detectable WITH dev-shell.
  prod-agent-no-console:
    name: Guest agent — no interactive console (claim 15, Plan 165 WS-C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-prodagent-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-prodagent-

      - name: Build prod agent and assert no console symbols
        run: ./scripts/check-prod-agent-no-console.sh

  # ── Lane 2b: Seccomp tier functional denial (ADR-002 §W2.4) ───────
  # Tier-structure unit tests in `mvm-security` cover cumulative-subset
  # and serde shapes; they don't exercise the BPF program at runtime.
  # This lane spawns `mvm-seccomp-apply <tier> -- syscall-probe` on
  # Linux and asserts:
  #   • unrestricted / network → socket(AF_INET) succeeds
  #   • standard               → socket(AF_INET) returns EPERM
  # Catches regressions where a syscall list passes structural tests
  # but fails to translate to a working seccomp filter (e.g., wrong
  # syscall number, missing arch coverage, NNP not set).
  seccomp-functional:
    name: Seccomp tier functional denial (ADR-002 §W2.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-seccomp-fn-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-seccomp-fn-

      - name: Run seccomp functional tests
        run: cargo test -p mvm-guest --test seccomp_apply

  # ── Lane 3: Reproducibility ────────────────────────────────────────
  # ADR-002 §W5.3 — two clean builds must produce byte-identical
  # binaries. Catches build-time non-determinism that could mask
  # supply-chain injection.
  reproducibility:
    name: Reproducibility (ADR-002 §W5.3)
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1700000000"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-D warnings --remap-path-prefix=/home/runner/work=."
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # build.rs cross-compiles the embedded host-vm binaries (Plan 115 /
      # ADR-065); without zig + cargo-zigbuild the mvmctl build panics.
      - uses: ./.github/actions/install-zigbuild

      - name: Build A
        run: cargo build --release --locked --bin mvmctl --features template-registry-s3,dev-watch,custom-dns,manifest-verify

      - name: Hash A
        run: sha256sum target/release/mvmctl | tee /tmp/hash-a.txt

      - name: Clean
        run: cargo clean

      - name: Build B
        run: cargo build --release --locked --bin mvmctl --features template-registry-s3,dev-watch,custom-dns,manifest-verify

      - name: Hash B
        run: sha256sum target/release/mvmctl | tee /tmp/hash-b.txt

      - name: Compare hashes
        run: |
          set -euo pipefail
          a=$(awk '{print $1}' /tmp/hash-a.txt)
          b=$(awk '{print $1}' /tmp/hash-b.txt)
          if [ "$a" != "$b" ]; then
            echo "::error::Reproducibility mismatch: $a != $b" >&2
            echo "Two builds of the same source produced different binaries." >&2
            echo "Investigate before merging — non-determinism can mask supply-chain injection." >&2
            exit 1
          fi
          echo "ok: matching sha256 across two clean builds: $a"

  # ── Lane 4: Parser fuzzing (best-effort, time-boxed) ───────────────
  # ADR-002 §W4.2 + Plan 85 §R1 — cargo-fuzz harnesses for
  # GuestRequest, the authenticated-frame envelope, the libkrun/Vz
  # SupervisorConfig parsers, and the OCI layer-unpack ingress.
  # Run for 5 minutes per tag-push / dispatch; the nightly cron
  # extends to 30 minutes.
  fuzz:
    name: Fuzz — parsers (vsock + OCI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz

      - name: Determine fuzz duration
        id: duration
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "secs=1800" >> "$GITHUB_OUTPUT"
          else
            echo "secs=300" >> "$GITHUB_OUTPUT"
          fi

      - name: Fuzz GuestRequest
        working-directory: crates/mvm-guest
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          # `cargo fuzz` requires nightly (-Z sanitizer flags). The
          # repo-root `rust-toolchain.toml` pins stable, and rustup walks
          # up from this `working-directory` so it would otherwise win.
          # RUSTUP_TOOLCHAIN bypasses the toolchain-file lookup entirely.
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz run fuzz_guest_request -- -max_total_time="$DURATION"

      - name: Fuzz AuthenticatedFrame
        working-directory: crates/mvm-guest
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz run fuzz_authenticated_frame -- -max_total_time="$DURATION"

      - name: Fuzz authed path (signed-side)
        working-directory: crates/mvm-guest
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        # Drives `verify_authenticated_frame` past sig check, asserting
        # tampered frames never reach the inner deserializer. Catches
        # regressions where a refactor reorders the verify/deserialize
        # steps in vsock.rs.
        run: cargo fuzz run fuzz_authed_path -- -max_total_time="$DURATION"

      - name: Fuzz SupervisorConfig (host-side)
        working-directory: crates/deps/libkrun-sys
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        # Plan 88 W6 / ADR-055 §"New untrusted-input surfaces" — the
        # `mvm-libkrun-supervisor` binary reads `SupervisorConfig`
        # JSON on stdin before any libkrun call. This target asserts
        # the deserializer never panics on adversarial bytes; same
        # contract as `fuzz_guest_request` for the guest-side
        # `GuestRequest` parser.
        run: cargo fuzz run fuzz_supervisor_config -- -max_total_time="$DURATION"

      - name: Fuzz SupervisorAttachConfig (prelaunch attach)
        working-directory: crates/deps/libkrun-sys
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        # Plan 118 WS-1 1a — the prelaunched supervisor reads a
        # `SupervisorAttachConfig` off a same-uid control UDS. It is the
        # only attacker-reachable surface after spawn; any panic is a
        # hard process death before the plan re-verify can fail closed.
        # Same "never panic on any input" contract as fuzz_supervisor_config.
        run: cargo fuzz run fuzz_attach_message -- -max_total_time="$DURATION"

      - name: Fuzz Vz SupervisorConfig (host-side)
        working-directory: crates/mvm-build
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        # Plan 97 / ADR-002 claim 5 / ADR-056 — the Rust-native
        # mvm-vz-supervisor reads this SupervisorConfig JSON on stdin
        # with deny-unknown-fields semantics. A panic-free decoder on
        # arbitrary input is the strict-keys trust boundary (ADR-002
        # claim 5 foundation).
        run: cargo fuzz run fuzz_supervisor_config -- -max_total_time="$DURATION"

      - name: Fuzz OCI unpack_layer
        working-directory: crates/mvm-oci
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        # Plan 85 §R1 — `mvm_oci::unpack::unpack_layer` is the single
        # ingress point for adversarial OCI layer tarballs (path
        # traversal, hardlink chains, device-node sneak-ins, xattr
        # privilege carry, setuid surprise). The Phase A.2 PR landed
        # this harness; A.3 through A.6 added corpus entries. Moved
        # here from ci.yml's per-PR lane (commit 304b5c9c+) so the
        # 30-min budget only burns on release-tag pushes and the
        # nightly cron, not on every mvm-oci PR.
        run: cargo fuzz run unpack_layer -- -max_total_time="$DURATION"

      - name: Fuzz Firecracker bridge — BridgeConfigJson (host-side)
        working-directory: crates/mvm-vm-host
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        # Plan 113 §Task 15 / ADR-064 — the `mvm-firecracker-bridge`
        # sidecar reads a `BridgeConfigJson` document on stdin BEFORE
        # installing `mvm-jailer-lite` confinement or touching the
        # parent-inherited socketpair fds. The producer (Task 13's
        # `FirecrackerBackend`) is trusted, but the bytes traverse a
        # pipe the bridge must defend; a panic here is a hard process
        # death before the parent's watchdog has a sentinel to react
        # to. Same contract as `fuzz_supervisor_config`: "never panic
        # on any input." `#[serde(deny_unknown_fields)]` on
        # `BridgeConfigJson` (Task 12 — `crates/mvm-vm-host/
        # src/parse.rs`) means unknown keys fail-closed inside
        # deserialization.
        run: cargo fuzz run fuzz_bridge_config_json -- -max_total_time="$DURATION"

      - name: Fuzz Firecracker bridge — passt-hashes TOML
        working-directory: crates/mvm-vm-host
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        # Plan 113 §Task 15 / ADR-064 — `verify_passt_hash` reads
        # `~/.mvm/passt-hashes.toml` BEFORE confinement so a missing
        # or malformed allowlist surfaces as a clean operator hint
        # instead of an opaque EACCES. A panic in the TOML parser at
        # this leaf is a hard process death before the FlowEvent
        # pipeline is up; this fuzz target asserts the no-panic
        # complement of the `verify_passt_hash_rejects_*` unit-test
        # suite.
        run: cargo fuzz run fuzz_passt_hashes_toml -- -max_total_time="$DURATION"

      - name: Fuzz gateway packet parse + rebuild (host-side)
        working-directory: crates/mvm-hostd
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        # Plan 141 / ADR-064 — `packet::parse` is the first real parse on
        # the guest's network path (the bridge byte-copied opaquely before
        # this plan); `rebuild_with_payload` re-serializes observer-modified
        # frames. Both run on attacker-influenced bytes (claim 5). "Never
        # panic on any input": parse fails closed to None on garbage, and
        # re-emitting an accepted frame's own payload round-trips without
        # panicking (Err on extension/over-MTU frames is the fail-closed
        # path, not a panic).
        run: cargo fuzz run fuzz_packet_parse -- -max_total_time="$DURATION"

      - name: Fuzz runtime recording (SDK trace)
        working-directory: crates/mvm-sdk
        env:
          DURATION: ${{ steps.duration.outputs.secs }}
          RUSTUP_TOOLCHAIN: nightly
        # Plan 186 — the recording JSON is the Tier-0 promotion input:
        # user-spawned code writes it to a tmpfile the CLI reads back.
        # `deny_unknown_fields` must fail closed on garbage, and every
        # lowering refusal (op limits, duplicate paths, oversize or
        # malformed FilesWrite b64, missing entrypoint) must surface as
        # Err, not a panic. Same "never panic on any input" contract as
        # the other config-parser targets.
        run: cargo fuzz run fuzz_runtime_recording -- -max_total_time="$DURATION"

      - name: Upload corpus on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: |
            crates/mvm-guest/fuzz/corpus/
            crates/mvm-guest/fuzz/artifacts/
            crates/deps/libkrun-sys/fuzz/corpus/
            crates/deps/libkrun-sys/fuzz/artifacts/
            crates/mvm-build/fuzz/corpus/
            crates/mvm-build/fuzz/artifacts/
            crates/mvm-oci/fuzz/corpus/
            crates/mvm-oci/fuzz/artifacts/
            crates/mvm-vm-host/fuzz/corpus/
            crates/mvm-vm-host/fuzz/artifacts/
            crates/mvm-sdk/fuzz/corpus/
            crates/mvm-sdk/fuzz/artifacts/

  # ── Lane 5: Hash-verify regression ─────────────────────────────────
  # ADR-002 §W5.1 — the unit tests that exercise the
  # download-and-verify code path live in mvm-cli. Run them in
  # isolation so a regression is visible in this workflow even when
  # the broader test job in ci.yml is skipped.
  hash-verify-tests:
    name: Hash-verify regression (ADR-002 §W5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      # build.rs cross-compiles the embedded host-vm binaries (Plan 115 /
      # ADR-065); without zig + cargo-zigbuild the mvmctl build panics.
      - uses: ./.github/actions/install-zigbuild

      - name: Run hash-verify tests
        run: cargo test -p mvm-cli --lib hash_verify_tests

  # ── Lane 6: Verified boot artifact gate ────────────────────────────
  # ADR-002 §W3.4 — the production verity-sealed image must emit its
  # ext4 + `*.verity` + `*.roothash` sidecars. If a refactor disables
  # the dm-verity seal on the prod path, this gate fails the merge
  # before the verity claim breaks silently. Witnesses the shipped seal
  # via the runtime overlay (the bundled prod-rootfs image this lane
  # once built was retired by Plan 115; the rootfs/OCI seal itself is
  # unit-tested in `mvm_build::oci_to_rootfs::verity`).
  verified-boot-artifacts:
    name: Verified boot artifacts (ADR-002 §W3.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build runtime overlay and assert verity output
        run: |
          set -euo pipefail
          # Plan 115 retired the bundled default-tenant prod image this lane
          # used to build. The dm-verity sealing pipeline it witnessed —
          # `mvm_build::oci_to_rootfs::verity::seal_with_verity` (veritysetup
          # format + a 64-hex roothash) — is unchanged and unit-tested in
          # mvm-build, and is exercised end-to-end by the verity-sealed
          # runtime overlay (ADR-051: "sealed the same way it seals rootfs"),
          # which every microVM attaches at boot. Assert that sealed image
          # emits its ext4 + verity sidecar + a valid roothash.
          nix build "./nix/images/runtime-overlay#packages.x86_64-linux.default" \
            --no-link --print-out-paths > /tmp/store-path.txt
          out=$(head -1 /tmp/store-path.txt)
          for f in overlay.ext4 overlay.verity overlay.roothash; do
            if [ ! -f "$out/$f" ]; then
              echo "::error::missing $f in $out" >&2
              echo "ADR-002 §W3.4 requires the production verity-sealed image" >&2
              echo "to emit {ext4,verity,roothash}; a missing sidecar usually" >&2
              echo "means the dm-verity seal was disabled on the prod path." >&2
              exit 1
            fi
          done
          # Sanity: roothash must be a 64-char hex string.
          hash=$(tr -d '\n' < "$out/overlay.roothash")
          if [[ ! "$hash" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::roothash is not a 64-char lowercase hex string: ${hash}" >&2
            exit 1
          fi
          echo "ok: overlay.{ext4,verity,roothash} present, roothash=${hash:0:12}…"

  # ── Lane 6b: Sealed-prod rootfs has no SSH (plan 76 Phase 8) ──────
  # Plan 76 §Phase 8 + ADR-002 §"No SSH inside microVMs". The vsock-
  # only claim is enforced at runtime by the `mvm-guest-agent`
  # dispatcher (Plan 76 Phase 1 + the `sealed-prod-allowlist` CI
  # lane in `ci.yml`). This lane is the static counterpart: it
  # mounts the verity-sealed runtime overlay (the mvm-controlled
  # filesystem attached to every microVM) and refuses to merge if any
  # SSH artifact is present.
  #
  # No untrusted GitHub event input flows into any step; all
  # commands below are static literals.
  #
  # Out of scope for this lane (named on purpose):
  #   - port 22 not listening — needs a live boot
  #   - agent has no ambient capabilities — needs a live boot
  #   - dev verbs rejected at runtime — already gated by
  #     `ci.yml::sealed-prod-allowlist`
  sealed-prod-no-ssh:
    name: Sealed-prod rootfs has no SSH (plan 76 Phase 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build runtime overlay and assert no SSH on the sealed image
        run: |
          set -euo pipefail
          # Plan 115 retired the bundled default-tenant rootfs this lane
          # used to mount. The mvm-controlled, verity-sealed runtime overlay
          # is the prod-tier filesystem attached to every microVM; assert it
          # ships no SSH artifacts anywhere. (Workload-rootfs no-SSH is also
          # enforced at runtime by the agent dispatcher + the
          # ci.yml::sealed-prod-allowlist lane.)
          nix build "./nix/images/runtime-overlay#packages.x86_64-linux.default" \
            --no-link --print-out-paths > /tmp/store-path.txt
          out=$(head -1 /tmp/store-path.txt)
          rootfs="$out/overlay.ext4"
          if [ ! -f "$rootfs" ]; then
            echo "::error::overlay.ext4 missing in $out (rebuild verified-boot-artifacts lane)" >&2
            exit 1
          fi

          # Mount read-only and scan the whole tree for SSH artifacts.
          # Read-only is load-bearing: any write would invalidate the
          # dm-verity root hash. A content scan (not fixed paths) keeps
          # the check meaningful regardless of filesystem layout.
          mnt=$(mktemp -d)
          sudo mount -o ro,loop "$rootfs" "$mnt"
          trap 'sudo umount "$mnt" || true; rmdir "$mnt" || true' EXIT

          fail=0

          # Any sshd binary, anywhere in the image.
          if sudo find "$mnt" -type f -name sshd -print -quit | grep -q .; then
            echo "::error::sshd binary present in the sealed image:" >&2
            sudo find "$mnt" -type f -name sshd >&2 || true
            fail=1
          fi

          # SSH host keys (ssh_host_*), anywhere — a ready-to-serve SSH
          # leak per ADR-002 §"No SSH inside microVMs".
          if sudo find "$mnt" -type f -name 'ssh_host_*' -print -quit | grep -q .; then
            echo "::error::SSH host keys present in the sealed image:" >&2
            sudo find "$mnt" -type f -name 'ssh_host_*' >&2 || true
            fail=1
          fi

          # sshd_config, anywhere.
          if sudo find "$mnt" -type f -name sshd_config -print -quit | grep -q .; then
            echo "::error::sshd_config present in the sealed image:" >&2
            sudo find "$mnt" -type f -name sshd_config >&2 || true
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::ADR-002 violated; sealed-prod images must not ship SSH artifacts." >&2
            exit 1
          fi
          echo "ok: sealed image has no sshd / host keys / sshd_config"

  # ── Lane 7: Flake lockfile cleanliness (plan 36 §Layer 0) ──────────
  # Every flake.lock in the repo must be committed and in sync with
  # its flake.nix. A stale lock means the input closure recorded in a
  # signed manifest doesn't match what nix would actually use on
  # rebuild — the trust chain breaks silently. Cheap (eval-only).
  flake-locks-clean:
    name: Flake locks — committed + in sync (plan 36 §Layer 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Assert every flake.lock is committed and in sync
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r flake; do
            d=$(dirname "$flake")
            echo "::group::$d"
            if [ ! -f "$d/flake.lock" ]; then
              echo "::error::missing $d/flake.lock — every flake must commit its lockfile (plan 36 §Layer 0)" >&2
              fail=1
              echo "::endgroup::"
              continue
            fi
            # `nix flake lock` updates the lockfile if it diverges from
            # flake.nix. If `git diff --quiet` reports nothing changed,
            # the committed lock is authoritative for the current
            # flake.nix inputs.
            cp "$d/flake.lock" "$d/flake.lock.original"
            nix flake lock "$d" 2>&1 || true
            if ! diff -q "$d/flake.lock" "$d/flake.lock.original" > /dev/null; then
              echo "::error::$d/flake.lock is out of sync with $d/flake.nix" >&2
              echo "Run \`nix flake lock $d\` locally and commit the updated lockfile." >&2
              diff -u "$d/flake.lock.original" "$d/flake.lock" | head -40 >&2 || true
              fail=1
            else
              echo "ok"
            fi
            mv "$d/flake.lock.original" "$d/flake.lock"
            echo "::endgroup::"
          # plan-89-baseline is an intentionally input-less throw-at-eval
          # boot-timing fixture (see its flake.nix) — no inputs means no
          # lockfile to keep in sync, so exclude it like template_scaffold.
          # examples/exit_code and examples/sleeper pin inputs.mvm to this
          # repo's own GitHub URL; their lock is resolved at build time via
          # --override-input mvm path:... (mvmctl up source-checkout mode),
          # not from a published release. No stable remote rev to lock against.
          done < <(find . -name flake.nix \
            -not -path './target/*' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './*/resources/template_scaffold/*' \
            -not -path './resources/template_scaffold/*' \
            -not -path './tests/fixtures/plan-89-baseline/*' \
            -not -path './examples/exit_code/*' \
            -not -path './examples/sleeper/*')
          exit "$fail"

  # ── Lane 9: Builder-VM image reproducibility (Plan 107 A2.5) ───────
  # Build the `nix/images/builder-vm` image twice and assert the four
  # committed outputs are byte-identical. Plan 25 W5.3 pattern, applied
  # to the symmetric host VM rootfs. Plan 107 A2.1 baked `firecracker`
  # into this rootfs; a non-reproducible firecracker closure (embedded
  # build timestamps, host paths) would surface here rather than as a
  # silent rootfs-hash drift across contributor machines. Heavy (the
  # builder-vm kernel + rootfs double build), so PR-skipped like Lane 8
  # — runs on release-tag pushes, the nightly schedule, and
  # workflow_dispatch. The `builder-vm-image-linux` CI lane prints the
  # single-build hash on every PR for diff-grade visibility.
  builder-vm-image-reproducibility:
    name: Builder-VM image reproducibility (Plan 107 A2.5)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Plan 115 / ADR-065 — the builder-vm rootfs embeds the cross-compiled,
      # statically-musl-linked host-vm binaries, read from MVM_HOST_BIN_DIR at
      # eval time under `--impure`. The runner is x86_64 and the builder VM is
      # same-arch as its host (build.rs §"x86_64 mvmctl embeds x86_64 bins"), so
      # cross-compile to x86_64-unknown-linux-musl. The bins are `[[bin]]`s in
      # mvm-build (not standalone packages), built exactly as `crates/mvm-cli/
      # build.rs::run_cargo_zigbuild` does: `-p mvm-build --bin <name>`.
      - uses: ./.github/actions/install-zigbuild
      - name: Cross-compile host-vm binaries (MVM_HOST_BIN_DIR contract)
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl \
            -p mvm-build --bin mvm-host-vm-init --bin mvm-egress-proxy
          # The flake reads `$MVM_HOST_BIN_DIR/<name>` (flat, by manifest name);
          # the cargo --bin outputs land here under those exact names.
          echo "MVM_HOST_BIN_DIR=$PWD/target/x86_64-unknown-linux-musl/release" >> "$GITHUB_ENV"

      - name: Build A
        run: |
          set -euo pipefail
          nix build "./nix/images/builder-vm#packages.x86_64-linux.default" \
            --impure --no-link --print-out-paths > /tmp/bvm-path-a.txt
          out=$(head -1 /tmp/bvm-path-a.txt)
          # Hash the four outputs the flake commits to under stable
          # relative names so the store-path component (input-hash, not
          # output) doesn't pollute the comparison.
          ( cd "$out" && sha256sum vmlinux rootfs.ext4 cmdline.txt manifest.json ) > /tmp/bvm-hash-a.txt
          cat /tmp/bvm-hash-a.txt

      - name: Build B (force rebuild)
        run: |
          set -euo pipefail
          nix build "./nix/images/builder-vm#packages.x86_64-linux.default" \
            --rebuild --impure --no-link --print-out-paths > /tmp/bvm-path-b.txt
          out=$(head -1 /tmp/bvm-path-b.txt)
          ( cd "$out" && sha256sum vmlinux rootfs.ext4 cmdline.txt manifest.json ) > /tmp/bvm-hash-b.txt
          cat /tmp/bvm-hash-b.txt

      - name: Compare hashes
        run: |
          set -euo pipefail
          if ! diff -q /tmp/bvm-hash-a.txt /tmp/bvm-hash-b.txt > /dev/null; then
            echo "::error::Builder-VM image is non-deterministic — two clean builds produced different artifacts" >&2
            echo "Plan 107 A2.5 requires the builder-vm rootfs (now carrying firecracker, A2.1) to reproduce" >&2
            echo "byte-for-byte so contributors and CI agree on the same rootfs hash. Investigate before merging" >&2
            echo "— non-determinism can mask supply-chain injection (ADR-002 §W5.3)." >&2
            echo >&2
            echo "Build A:" >&2
            cat /tmp/bvm-hash-a.txt >&2
            echo >&2
            echo "Build B:" >&2
            cat /tmp/bvm-hash-b.txt >&2
            echo >&2
            echo "Diff:" >&2
            diff -u /tmp/bvm-hash-a.txt /tmp/bvm-hash-b.txt >&2 || true
            exit 1
          fi
          echo "ok: builder-vm image reproduces byte-identically across two clean builds"
          cat /tmp/bvm-hash-a.txt
