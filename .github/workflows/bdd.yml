name: BDD conformance gate

on:
  workflow_call:
    inputs:
      # CI's scope job sets this when a change touches the documentation corpus
      # and nothing that compiles. Release and publish callers leave it unset
      # and always get the full suite.
      docs_only:
        description: Run only the @docs features and the documented Rust examples
        type: boolean
        default: false
      run_ps11_live:
        description: Run the bounded PS-11 frozen-volume live witness
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  bdd:
    name: BDD conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        if: ${{ !inputs.docs_only }}
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.5"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25
          components: rustc-codegen-cranelift

      - uses: ./.github/actions/apt-deps
        with:
          packages: libcap-ng-dev lld

      # No zig here: `just bdd::run` builds mvmctl without `embed-host-bins`, and the
      # scenarios that would need the payload are `@live`-tagged, which this
      # hermetic lane skips. The live job below does need it.
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # Restore-only, through the shared action, for the reason its own
      # comment gives: the repo cache is capped at 10 GB with LRU eviction, so
      # a lane that writes a whole `target` directory from every merge-group
      # and merge-queue ref evicts the entry every other lane restores.
      #
      # This job used to do exactly that with a raw `actions/cache` over
      # `target` — four surviving entries at ~1.5 GB each, 6.2 GB of a 9.7 GB
      # total. Writing nothing here costs this lane the workspace half of its
      # cache and gives every other lane back the dependency half of theirs.
      #
      # It shares the default `workspace` key rather than taking one of its
      # own: the warm job already builds on nightly, which is this lane's
      # toolchain, so the dependency graph and every unchanged workspace crate
      # come back warm. `--features bdd` adds a handful of crates on top. A
      # `bdd`-keyed entry would need its own writer, and that means a second
      # full build on every merge to save the smaller half of one lane.
      - uses: ./.github/actions/rust-cache

      - name: Run BDD conformance suite
        if: ${{ !inputs.docs_only }}
        run: just bdd::run

      - name: Run the documentation scenarios
        if: ${{ inputs.docs_only }}
        run: just bdd::docs

      # The Python and TypeScript SDKs each carry a unit suite that no cargo
      # target reaches, so until now nothing in CI ran either. They belong on
      # this lane: it is the one already scoped to `crates/mvm-sdk/`, and it
      # already installs uv, Node and the TypeScript dependencies.
      - name: Run the language SDK unit suites
        if: ${{ !inputs.docs_only }}
        run: just sdk::test

  ps11-live:
    name: BDD live PS-11 frozen volume (Linux, Firecracker)
    if: ${{ inputs.run_ps11_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FC_VERSION: v1.17.0
      MVM_KERNEL_SOURCE: download
      MVM_BDD_GUEST_BIN_DIR: ${{ github.workspace }}/dist/staged
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
      - uses: ./.github/actions/apt-deps
        with:
          packages: libcap-ng-dev lld qemu-system-x86 qemu-utils
      - uses: ./.github/actions/install-zigbuild
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: ./.github/actions/rust-cache
        with:
          key: bdd-live-ps11
      - name: Install firecracker
        run: |
          set -euo pipefail
          curl -fL -o firecracker.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          tar -xzf firecracker.tgz
          sudo install -m 0755 \
            "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" \
            /usr/bin/firecracker
          /usr/bin/firecracker --version
      - name: Grant /dev/kvm access for the job
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
      - name: Prepare the pinned workload kernel
        run: just kernel::workload
      - name: Build the pinned guest binaries
        run: |
          cargo run --locked -p mvmctl -- build guest-bins --out dist
          mkdir -p dist/extracted dist/staged
          tar -xzf dist/mvm-guest-bins-v*.tar.gz -C dist/extracted
          cp dist/extracted/x86_64/bin/mvm-* dist/staged/
      - name: Run the PS-11 live witness
        run: just bdd::live-ci ps11_live
