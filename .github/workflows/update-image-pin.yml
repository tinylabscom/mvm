name: Propose image-set pin update

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: sigstore/cosign-installer@v3

      - name: Verify newest complete image set
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REPOSITORY: tinylabscom/mvm-images
        run: |
          set -euo pipefail
          tag="$(gh api "/repos/${IMAGE_REPOSITORY}/releases?per_page=100" \
            --jq '[.[].tag_name | select(test("^image-set/v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first')"
          test -n "$tag"
          mkdir candidate
          gh release download "$tag" --repo "$IMAGE_REPOSITORY" \
            --pattern 'image-set.json*' --dir candidate
          cosign verify-blob \
            --bundle candidate/image-set.json.bundle \
            --certificate-identity "https://github.com/${IMAGE_REPOSITORY}/.github/workflows/release.yml@refs/tags/${tag}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            candidate/image-set.json
          jq -e '
            .schema_version == 2 and
            .producer.repository == "tinylabscom/mvm-images" and
            .producer.workflow == ".github/workflows/release.yml" and
            .producer.release_tag == $tag and
            .compatibility.guest_agent_protocol.min <= 2 and
            .compatibility.guest_agent_protocol.max >= 2 and
            .compatibility.builder_cache_contract == 4
          ' --arg tag "$tag" candidate/image-set.json >/dev/null
          digest="$(sha256sum candidate/image-set.json | cut -d' ' -f1)"
          {
            echo "tag=$tag"
            echo "digest=$digest"
            echo "source_commit=$(jq -r .mvm_source_commit candidate/image-set.json)"
            echo "protocol=$(jq -c .compatibility candidate/image-set.json)"
          } >> "$GITHUB_OUTPUT"

      # The rewrite reads the root through the same types every consumer uses
      # and re-parses the lock it wrote, so a section this step failed to
      # advance refuses here instead of proposing a lock that pins two
      # releases at once.
      - name: Update the single image lock
        run: cargo run --quiet --package xtask -- repin-image-lock candidate/image-set.json

      - name: Open an evidence-bearing pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.image.outputs.tag }}
          NEW_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.image.outputs.source_commit }}
          PROTOCOL: ${{ steps.image.outputs.protocol }}
        run: |
          set -euo pipefail
          if git diff --quiet -- crates/mvm-core/images.lock; then
            echo "images.lock already pins ${NEW_TAG} (${NEW_DIGEST})"
            exit 0
          fi
          safe_tag="${NEW_TAG//\//-}"
          branch="chore/image-pin-${safe_tag}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add crates/mvm-core/images.lock
          git commit -m "chore: propose ${NEW_TAG} image set"
          git push --force-with-lease origin "$branch"
          body="$(cat <<EOF
          Updates the single consumer lock to the newest publisher release.

          Verification evidence:
          - release: \`${NEW_TAG}\`
          - root manifest SHA-256: \`${NEW_DIGEST}\`
          - producer source commit: \`${SOURCE_COMMIT}\`
          - compatibility: \`${PROTOCOL}\`
          - keyless signature: verified against the exact mvm-images release workflow and tag identity
          - merge policy: this workflow only opens or updates a PR; repository review and merge-queue checks remain mandatory
          EOF
          )"
          existing="$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base main --head "$branch" \
              --title "chore: propose ${NEW_TAG} image set" --body "$body"
          fi
