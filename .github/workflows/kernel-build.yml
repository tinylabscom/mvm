name: Kernel build

# Builds the slim custom microVM kernels (builder + workload) on native
# aarch64 and x86_64 runners. The compile arm of `mvmctl kernel build`
# can only build the host's own arch (Stage 0 boots a host-arch VM under
# libkrun), so this workflow is how the *other* arch is produced: it
# realises both kernels on both arches and, on a release tag, publishes
# the hash-verified `vmlinux` artifacts that `mvmctl kernel build
# --source download` fetches.
#
# Pull-request and merge-group validation lives in ci.yml, behind its shared
# fail-closed scope job. This workflow owns explicit diagnostic builds and
# release publication, avoiding a second scope runner for every queue entry.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write # release asset upload on tags

jobs:
  bdd:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/bdd.yml

  kernel:
    # Deliberately NOT "Build kernels (<arch>)": that is ci.yml's job, and
    # it is a required status check. Two workflows publishing one context
    # name is readable only while their triggers stay disjoint — this one
    # is tags and dispatch, ci.yml is pull_request and merge_group — and
    # nothing about the name itself says so. This one publishes; ci.yml
    # validates.
    name: Publish kernels (${{ matrix.arch }})
    needs: [bdd]
    if: ${{ always() && (needs.bdd.result == 'success' || needs.bdd.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    # Narrowed to this job rather than the workflow, so the reusable bdd call
    # above does not also inherit an OIDC token it has no use for. A job-level
    # block replaces the inherited set outright, hence contents: write is
    # repeated here for the release upload.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build builder + workload kernels
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-kernel-artifacts.sh "$ARCH"

      - name: Upload kernel artifacts (CI visibility)
        # `always()` because the budget gate above exits non-zero on a
        # regression, and that is precisely the run whose resolved `.config`
        # you need in order to see which symbol was added. Without it, a budget
        # failure reports a count and discards the only evidence that explains
        # it. Scoped to a run that actually built, since a skipped run has
        # nothing to upload. Partial output is fine: the glob takes what exists.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: kernels-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            staging/vmlinux-${{ matrix.arch }}-builder
            staging/vmlinux-${{ matrix.arch }}-workload
            staging/kernel-${{ matrix.arch }}-checksums-sha256.txt
            staging/kernel-${{ matrix.arch }}.json
            staging/kernel-metrics-${{ matrix.arch }}.json
            staging/workload-config-${{ matrix.arch }}

      # Only on the publish path: a non-tag diagnostic run has nothing to sign,
      # and keyless signing would write that run into the public transparency
      # log for no reason.
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        # `mvmctl kernel build --source download` resolves these by the
        # mvmctl release tag + arch + variant, then SHA-256-verifies each
        # against the checksums manifest before admitting it to the cache.
        #
        # That makes the manifest, not the vmlinux blobs, the thing an attacker
        # has to beat: swap a kernel and its recorded hash together and the
        # download-side check still passes. So the manifest is cosign-signed
        # here and its bundle published beside it, giving the verifier
        # something to anchor on that is not itself swappable.
        #
        # --new-bundle-format is not optional: it is the one Sigstore bundle
        # shape the in-binary Rust verifier parses, and every other signed blob
        # in this project's releases uses it.
        run: |
          set -euo pipefail
          cd staging
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle "kernel-${ARCH}-checksums-sha256.txt.bundle" \
            "kernel-${ARCH}-checksums-sha256.txt"
          gh release upload "$TAG" \
            "vmlinux-${ARCH}-builder" \
            "vmlinux-${ARCH}-workload" \
            "kernel-${ARCH}-checksums-sha256.txt" \
            "kernel-${ARCH}-checksums-sha256.txt.bundle" \
            "kernel-${ARCH}.json" \
            --clobber
