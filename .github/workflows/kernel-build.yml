name: Kernel build

# Builds the slim custom microVM kernels (builder + workload) on native
# aarch64 and x86_64 runners. The compile arm of `mvmctl kernel build`
# can only build the host's own arch (Stage 0 boots a host-arch VM under
# libkrun), so this workflow is how the *other* arch is produced: it
# realises both kernels on both arches and, on a release tag, publishes
# the hash-verified `vmlinux` artifacts that `mvmctl kernel build
# --source download` fetches.
#
# Pull-request and merge-group validation lives in ci.yml, behind its shared
# fail-closed scope job. This workflow owns explicit diagnostic builds and
# release publication, avoiding a second scope runner for every queue entry.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: write # release asset upload on tags

jobs:
  bdd:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/bdd.yml

  kernel:
    name: Build kernels (${{ matrix.arch }})
    needs: [bdd]
    if: ${{ always() && (needs.bdd.result == 'success' || needs.bdd.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build builder + workload kernels
        env:
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-kernel-artifacts.sh "$ARCH"

      - name: Upload kernel artifacts (CI visibility)
        # `always()` because the budget gate above exits non-zero on a
        # regression, and that is precisely the run whose resolved `.config`
        # you need in order to see which symbol was added. Without it, a budget
        # failure reports a count and discards the only evidence that explains
        # it. Scoped to a run that actually built, since a skipped run has
        # nothing to upload. Partial output is fine: the glob takes what exists.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: kernels-${{ matrix.arch }}
          if-no-files-found: ignore
          path: |
            staging/vmlinux-${{ matrix.arch }}-builder
            staging/vmlinux-${{ matrix.arch }}-workload
            staging/kernel-${{ matrix.arch }}-checksums-sha256.txt
            staging/kernel-${{ matrix.arch }}.json
            staging/kernel-metrics-${{ matrix.arch }}.json
            staging/workload-config-${{ matrix.arch }}

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        # `mvmctl kernel build --source download` resolves these by the
        # mvmctl release tag + arch + variant, then SHA-256-verifies each
        # against the checksums manifest before admitting it to the cache.
        run: |
          set -euo pipefail
          cd staging
          gh release upload "$TAG" \
            "vmlinux-${ARCH}-builder" \
            "vmlinux-${ARCH}-workload" \
            "kernel-${ARCH}-checksums-sha256.txt" \
            "kernel-${ARCH}.json" \
            --clobber
