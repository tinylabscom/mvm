name: Composable Python layer signing smoke

on:
  pull_request:
    paths:
      - .github/workflows/composable-python-layer-smoke.yml
      - scripts/build-python-runtime-layer.py
      - scripts/test_build_python_runtime_layer.py
      - crates/mvm-build/src/runtime_layer.rs
      - crates/mvm-build/src/pr_test_synthetic_base.rs
      - crates/mvm-cli/src/commands/vm/exec.rs
      - crates/mvm-cli/src/commands/vm/exec/**
      - crates/mvm-hostd/src/plan_admission/composition.rs
      - crates/mvm-contract/src/plan/bundle.rs
      - crates/mvm-core/src/registry_pack/runtime_layer.rs
      - crates/mvm-core/examples/verify-runtime-layer-fixture.rs
      - crates/mvm-build/src/guest_runtime/**
      - crates/mvm-build/src/guest_runtime.rs
      - crates/mvm-client/src/portable_boot_assets.rs
      - crates/mvm-runtime/src/runtime_evidence.rs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Uses the ordinary unsigned guest builder, not a release signer. Signing
  # happens only in the PR job below and nothing is published as a CLI release.
  pr-guest-bins:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/guest-bins.yml
    permissions:
      contents: read

  pr-cli-bins:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Build unpublished fixture-only CLI and host helpers
        env:
          MVM_EMBED: "0"
        run: |
          set -euo pipefail
          cargo build --locked --profile release-witness --bin mvmctl \
            --features user,pr-test-guest-runtime,mvm-cli/pr-test-synthetic-base
          cargo build --locked --profile release-witness -p mvm-hostd --features pr-test-guest-runtime \
            --bin mvm-host-agent --bin mvm-signer-helper --bin mvm-network-endpoint
          for binary in mvmctl mvm-host-agent mvm-signer-helper mvm-network-endpoint; do
            test -x "target/release-witness/$binary"
          done
          target/release-witness/mvmctl --version
      - name: Retain unpublished CLI for an authorized KVM witness
        uses: actions/upload-artifact@v7
        with:
          name: pr-test-cli-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/release-witness/mvmctl
            target/release-witness/mvm-host-agent
            target/release-witness/mvm-signer-helper
            target/release-witness/mvm-network-endpoint
          if-no-files-found: error
          retention-days: 1

  signed-pr-guest-runtime:
    needs: pr-guest-bins
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v8
        with:
          name: mvm-guest-bins-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-runtime
      - name: Sign and verify PR-only guest runtime inputs
        env:
          MVM_PR_TEST_RUNTIME_DIR: ${{ runner.temp }}/pr-runtime
          MVM_PR_TEST_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          archive="$MVM_PR_TEST_RUNTIME_DIR/mvm-guest-bins-v${version}.tar.gz"
          test -f "$archive" && test ! -L "$archive"
          test -f "${archive}.sha256" && test ! -L "${archive}.sha256"
          (cd "$MVM_PR_TEST_RUNTIME_DIR" && sha256sum --check "$(basename "${archive}.sha256")")
          for blob in "$archive" "${archive}.sha256"; do
            cosign sign-blob --yes --new-bundle-format --bundle "${blob}.bundle" "$blob"
          done
          cargo test --locked -p mvm-build --features pr-test-guest-runtime --lib \
            guest_runtime::evidence::tests::signed_pr_runtime_authenticates_exact_identity_and_refuses_tampering \
            -- --ignored --exact
          cargo test --locked -p mvm-client --features pr-test-guest-runtime --lib \
            portable_boot_assets::tests::pr_test_local_acquisition_checks_assembled_runtime_independently \
            -- --ignored --exact
      - name: Retain synthetic PR quartet for a builder-VM CLI witness
        uses: actions/upload-artifact@v7
        with:
          name: pr-test-guest-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-runtime/mvm-guest-bins-v*.tar.gz*
          if-no-files-found: error
          retention-days: 1

  signed-pr-base-input:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: sigstore/cosign-installer@v3
      - name: Authenticate only the PR's nonbootable synthetic base input
        env:
          MVM_EMBED: "0"
          MVM_PR_TEST_BASE_DIR: ${{ runner.temp }}/pr-base
          MVM_PR_TEST_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cargo test --locked -p mvm-build --features pr-test-synthetic-base --lib \
            pr_test_synthetic_base::tests::write_synthetic_pr_base_fixture_for_ci \
            -- --ignored --exact
          cosign sign-blob --yes --new-bundle-format \
            --bundle "$MVM_PR_TEST_BASE_DIR/image-set.bundle" \
            "$MVM_PR_TEST_BASE_DIR/image-set.json"
          cargo test --locked -p mvm-build --features pr-test-synthetic-base --lib \
            pr_test_synthetic_base::tests::real_pr_signature_accepts_only_unchanged_exact_identity \
            -- --ignored --exact

  signed-pr-bootable-base:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact_id: 13746141841
            artifact_size: 503284622
            artifact_digest: d12a6026d2858f1414f33a7692abf8693a4b158f547abe323fe19170eb301bfd
          - arch: aarch64
            artifact_id: 13745508933
            artifact_size: 498828250
            artifact_digest: fb0458726a70c67fc72e3948d4f9a7801549ab1d8002af0a398f84bbd9db9c5e
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The emitter records this exact clean source checkout; it never builds images.
      - name: Select reviewed test-only Linux source
        id: test-images-ref
        run: echo "ref=$(cat tests/fixtures/composable-images-source.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: tinylabscom/mvm-images
          ref: ${{ steps.test-images-ref.outputs.ref }}
          path: mvm-images
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: sigstore/cosign-installer@v3
      - name: Authenticate prebuilt Linux input and emit a local test set
        env:
          GH_TOKEN: ${{ github.token }}
          MVM_PR_TEST_BASE_DIR: ${{ runner.temp }}/pr-bootable-base
          MVM_PR_TEST_SOURCE_DIR: ${{ runner.temp }}/pr-linux-source
          MVM_PR_TEST_ZIP: ${{ runner.temp }}/linux-layer-${{ matrix.arch }}.zip
        run: |
          set -euo pipefail
          source_sha=$(cat tests/fixtures/composable-images-source.ref)
          arch=${{ matrix.arch }}
          artifact_id=${{ matrix.artifact_id }}
          artifact_size=${{ matrix.artifact_size }}
          artifact_digest=${{ matrix.artifact_digest }}
          test "$(git -C mvm-images rev-parse HEAD)" = "$source_sha"
          gh api repos/tinylabscom/mvm-images/actions/runs/42778535622 |
            jq -e --arg sha "$source_sha" '
              .id == 42778535622 and .repository.full_name == "tinylabscom/mvm-images" and
              .head_repository.full_name == "tinylabscom/mvm-images" and
              .event == "pull_request" and
              (.pull_requests | length == 1 and .[0].number == 78) and
              .path == ".github/workflows/build.yml" and .run_attempt == 1 and
              .head_sha == $sha and .status == "completed" and .conclusion == "success"
            ' >/dev/null
          gh api "repos/tinylabscom/mvm-images/actions/artifacts/$artifact_id" |
            jq -e --arg sha "$source_sha" --arg digest "sha256:$artifact_digest" \
              --arg arch "$arch" --argjson id "$artifact_id" --argjson size "$artifact_size" '
              .id == $id and .name == ("linux-layer-" + $arch) and
              .size_in_bytes == $size and .digest == $digest and .expired == false and
              .workflow_run.id == 42778535622 and .workflow_run.head_sha == $sha and
              .workflow_run.repository_id == 1376194514 and
              .workflow_run.head_repository_id == 1376194514
            ' >/dev/null
          gh api "repos/tinylabscom/mvm-images/actions/artifacts/$artifact_id/zip" > "$MVM_PR_TEST_ZIP"
          printf '%s  %s\n' "$artifact_digest" "$MVM_PR_TEST_ZIP" | sha256sum --check
          mkdir -p "$MVM_PR_TEST_SOURCE_DIR"
          unzip -j "$MVM_PR_TEST_ZIP" \
            "default-microvm-vmlinux-$arch" \
            "default-microvm-rootfs-$arch.ext4" \
            "default-microvm-rootfs-$arch.tar.gz" \
            -d "$MVM_PR_TEST_SOURCE_DIR"
          for name in "default-microvm-vmlinux-$arch" \
              "default-microvm-rootfs-$arch.ext4" "default-microvm-rootfs-$arch.tar.gz"; do
            test -s "$MVM_PR_TEST_SOURCE_DIR/$name" && test ! -L "$MVM_PR_TEST_SOURCE_DIR/$name"
            sha256sum "$MVM_PR_TEST_SOURCE_DIR/$name"
          done
          case "$arch" in
            x86_64) expected_machine='Advanced Micro Devices X86-64' ;;
            aarch64) expected_machine='AArch64' ;;
          esac
          readelf -h "$MVM_PR_TEST_SOURCE_DIR/default-microvm-vmlinux-$arch" |
            grep -q "Machine:.*$expected_machine"
          python3 -m venv "$RUNNER_TEMP/local-manifest-venv"
          PURE=1 "$RUNNER_TEMP/local-manifest-venv/bin/pip" install \
            -r mvm-images/scripts/requirements-local-manifest.txt
          "$RUNNER_TEMP/local-manifest-venv/bin/python" mvm-images/scripts/emit-local-manifest.py \
            --images-checkout mvm-images --arch "$arch" --builder-cache-contract 5 \
            --out "$MVM_PR_TEST_BASE_DIR" \
            --artifact default_tenant_workload_kernel kernel:elf \
              "$MVM_PR_TEST_SOURCE_DIR/default-microvm-vmlinux-$arch" \
            --capability default_tenant_workload_kernel virtio_vsock \
            --artifact default_tenant_workload_rootfs ext4 \
              "$MVM_PR_TEST_SOURCE_DIR/default-microvm-rootfs-$arch.ext4" \
            --artifact default_tenant_workload_rootfs tar_gz \
              "$MVM_PR_TEST_SOURCE_DIR/default-microvm-rootfs-$arch.tar.gz" \
            --capability default_tenant_workload_rootfs virtio_blk
      - name: Sign and verify the bootable PR-only base
        env:
          MVM_EMBED: "0"
          MVM_PR_TEST_BASE_DIR: ${{ runner.temp }}/pr-bootable-base
          MVM_PR_TEST_PULL_REQUEST: ${{ github.event.pull_request.number }}
          MVM_PR_TEST_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --new-bundle-format \
            --bundle "$MVM_PR_TEST_BASE_DIR/image-set.bundle" \
            "$MVM_PR_TEST_BASE_DIR/image-set.json"
          cargo test --locked -p mvm-build --features pr-test-synthetic-base --lib \
            pr_test_synthetic_base::tests::real_pr_signature_accepts_only_unchanged_exact_identity \
            -- --ignored --exact
      - name: Retain the signed PR base for a builder-VM composition witness
        uses: actions/upload-artifact@v7
        with:
          name: pr-test-bootable-base-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-bootable-base/
          if-no-files-found: error
          retention-days: 1

  signed-input:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: sigstore/cosign-installer@v3
      - name: Reproduce and verify an unpublished Python runtime input
        env:
          MVM_EMBED: "0"
          ARCH: ${{ matrix.arch }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/composable-python-layer-smoke.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          python3 -m unittest scripts/test_build_python_runtime_layer.py
          command -v zstd
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          case "$ARCH" in
            x86_64)
              source_url='https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18%2B20261026-x86_64-unknown-linux-musl-lto%2Bstatic-full.tar.zst'
              expected='9f5dfaf983a54a62212184f08f5dfc36d1474052d71a799cdfd3f1a53dc970d4'
              size=63836160
              ;;
            aarch64)
              source_url='https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18%2B20261026-aarch64-unknown-linux-musl-lto%2Bstatic-full.tar.zst'
              expected='2c65e1c400098a3a8141a58f2f2f66a3df667d5f947d86d982f3d115b023b0f2'
              size=64798720
              ;;
          esac
          curl -fLsS --retry 2 --max-time 120 \
            "$source_url" \
            -o "$tmp/source.tar.zst"
          python3 scripts/build-python-runtime-layer.py --arch "$ARCH" "$tmp/source.tar.zst" "$tmp/layer.tar"
          python3 scripts/build-python-runtime-layer.py --arch "$ARCH" "$tmp/source.tar.zst" "$tmp/again.tar"
          cmp "$tmp/layer.tar" "$tmp/again.tar"
          printf '%s  %s\n' "$expected" "$tmp/layer.tar" | sha256sum --check
          test "$(stat -c %s "$tmp/layer.tar")" -eq "$size"

          mkdir -p "$tmp/files/pack"
          printf 'description = "Offline Python runtime"\nrequired = true\n[network]\nblock = true\n' \
            > "$tmp/files/pack/group.toml"
          LAYER_ROOT="$tmp" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["LAYER_ROOT"])
          archive = (root / "layer.tar").read_bytes()
          group = (root / "files/pack/group.toml").read_bytes()
          manifest = {
              "schema_version": 3,
              "kind": "runtime_layer",
              "reference": "runtime/python@1.1.0",
              "description": "Unpublished offline Python input test",
              "runtime_layer": {
                  "schema_version": 1,
                  "guest_arch": os.environ["ARCH"],
                  "dependencies": [],
                  "archive": {
                      "source": "https://example.invalid/unpublished/runtime/python/1.1.0/layer.tar",
                      "archive_sha256": hashlib.sha256(archive).hexdigest(),
                      "archive_size": len(archive),
                  },
              },
              "files": [{
                  "path": "pack/group.toml",
                  "sha256": hashlib.sha256(group).hexdigest(),
                  "size": len(group),
              }],
          }
          (root / "manifest.json").write_bytes(
              json.dumps(manifest, separators=(",", ":"), sort_keys=True).encode()
          )
          PY
          cosign sign-blob --yes --new-bundle-format --bundle "$tmp/manifest.bundle" \
            "$tmp/manifest.json"
          cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/manifest.json" "$tmp/manifest.bundle" "$tmp/layer.tar" \
            "$tmp/files" "$IDENTITY"
          MVM_TEST_PYTHON_LAYER_TAR="$tmp/layer.tar" cargo test --locked -p mvm-build \
            --lib runtime_layer::tests::pinned_python_layer_passes_the_real_runtime_tar_preflight \
            -- --ignored --exact
          cp "$tmp/layer.tar" "$tmp/tampered.tar"
          printf x >> "$tmp/tampered.tar"
          if cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/manifest.json" "$tmp/manifest.bundle" "$tmp/tampered.tar" \
            "$tmp/files" "$IDENTITY"; then
            echo "tampered signed input was accepted" >&2
            exit 1
          fi
          printf '# changed after signing\n' >> "$tmp/files/pack/group.toml"
          if cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/manifest.json" "$tmp/manifest.bundle" "$tmp/layer.tar" \
            "$tmp/files" "$IDENTITY"; then
            echo "tampered signed policy was accepted" >&2
            exit 1
          fi
          printf 'description = "Offline Python runtime"\nrequired = true\n[network]\nblock = true\n' \
            > "$tmp/files/pack/group.toml"
          if cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/manifest.json" "$tmp/manifest.bundle" "$tmp/layer.tar" \
            "$tmp/files" "https://example.invalid/untrusted-publisher"; then
            echo "wrong publisher identity was accepted" >&2
            exit 1
          fi

  signed-base:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: sigstore/cosign-installer@v3
      - name: Authenticate a synthetic development base before materialization
        env:
          MVM_EMBED: "0"
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/composable-python-layer-smoke.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          MVM_TEST_SIGNED_BASE_DIR="$tmp/base" cargo test --locked -p mvm-build \
            --features manifest-verify --lib \
            runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
            -- --exact
          cosign sign-blob --yes --new-bundle-format --bundle "$tmp/base/image-set.bundle" \
            "$tmp/base/image-set.json"
          MVM_TEST_SIGNED_BASE_DIR="$tmp/base" MVM_TEST_SIGNED_BASE_VERIFY=1 \
            MVM_TEST_SIGNED_BASE_IDENTITY="$IDENTITY" cargo test --locked -p mvm-build \
            --features manifest-verify --lib \
            runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
            -- --exact
          if MVM_TEST_SIGNED_BASE_DIR="$tmp/base" MVM_TEST_SIGNED_BASE_VERIFY=1 \
            MVM_TEST_SIGNED_BASE_IDENTITY="https://example.invalid/untrusted-publisher" \
            cargo test --locked -p mvm-build --features manifest-verify --lib \
              runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
              -- --exact; then
            echo "wrong synthetic base publisher was accepted" >&2
            exit 1
          fi
          MVM_TEST_COMPOSITION_TAR="$tmp/base/rootfs.tar.gz" \
            cargo test --locked -p mvm-build --features manifest-verify \
            --lib runtime_layer::tests::nix_generated_base_tar_materializes_with_verity_when_provided \
            -- --exact
          printf x >> "$tmp/base/rootfs.tar.gz"
          if MVM_TEST_SIGNED_BASE_DIR="$tmp/base" MVM_TEST_SIGNED_BASE_VERIFY=1 \
            MVM_TEST_SIGNED_BASE_IDENTITY="$IDENTITY" cargo test --locked -p mvm-build \
              --features manifest-verify --lib \
              runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
              -- --exact; then
            echo "changed synthetic base archive was accepted" >&2
            exit 1
          fi

  composed-base-guest-read:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: signed-base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Select reviewed test-only Linux source
        id: test-images-ref
        run: echo "ref=$(cat tests/fixtures/composable-images-source.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: tinylabscom/mvm-images
          ref: ${{ steps.test-images-ref.outputs.ref }}
          path: mvm-images
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: sigstore/cosign-installer@v3
      - name: Read an authored value in a QEMU guest from a signed-input composition
        env:
          MVM_EMBED: "0"
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/composable-python-layer-smoke.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          result="$(cd mvm-images && nix build '.#legacyPackages.x86_64-linux.default-tenant.default' --no-link --print-out-paths)"
          test -s "$result/rootfs.tar.gz"
          test -s "$result/vmlinux"
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          export MVM_TEST_SIGNED_BASE_DIR="$tmp/base"
          export MVM_TEST_SIGNED_BASE_TAR="$result/rootfs.tar.gz"
          export MVM_TEST_SIGNED_BASE_KERNEL="$result/vmlinux"
          cargo test --locked -p mvm-build --features manifest-verify --lib \
            runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
            -- --exact
          cosign sign-blob --yes --new-bundle-format \
            --bundle "$tmp/base/image-set.bundle" "$tmp/base/image-set.json"
          MVM_TEST_SIGNED_BASE_VERIFY=1 MVM_TEST_SIGNED_BASE_IDENTITY="$IDENTITY" \
            cargo test --locked -p mvm-build --features manifest-verify --lib \
              runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
              -- --exact
          test -s "$tmp/base/composed.ext4"
          for run in first repeat; do
            status=0
            timeout 120s qemu-system-x86_64 -nodefaults -no-user-config \
              -machine q35,accel=tcg -m 512 -smp 1 -display none \
              -monitor none -serial stdio -no-reboot -kernel "$result/vmlinux" \
              -drive "file=$tmp/base/composed.ext4,format=raw,if=none,id=rootfs,readonly=on" \
              -device virtio-blk-pci,drive=rootfs \
              -append 'console=ttyS0 root=/dev/vda ro rootfstype=ext4 rootwait init=/srv/app/probe.sh panic=1 loglevel=4' \
              > "$tmp/$run.log" 2>&1 || status=$?
            if [ "$status" -eq 124 ]; then
              echo "$run guest timed out" >&2
              exit 1
            fi
            python3 - "$tmp/$run.log" "$run" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          marker = "COMPOSED_GUEST_VALUE=print('ready')"
          if marker not in log:
              raise SystemExit(f"{sys.argv[2]} guest did not read the authored file:\n{log[-4000:]}")
          print(f"{sys.argv[2]} guest read: {marker}")
          PY
          done
