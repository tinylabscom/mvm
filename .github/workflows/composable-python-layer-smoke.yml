name: Composable Python layer signing smoke

on:
  pull_request:
    paths:
      - .github/workflows/composable-python-layer-smoke.yml
      - scripts/build-python-runtime-layer.py
      - scripts/test_build_python_runtime_layer.py
      - crates/mvm-build/src/runtime_layer.rs
      - crates/mvm-cli/src/commands/vm/exec/**
      - crates/mvm-hostd/src/plan_admission/composition.rs
      - crates/mvm-contract/src/plan/bundle.rs
      - crates/mvm-core/src/registry_pack/runtime_layer.rs
      - crates/mvm-core/examples/verify-runtime-layer-fixture.rs
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  signed-input:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: sigstore/cosign-installer@v3
      - name: Reproduce and verify an unpublished Python runtime input
        env:
          MVM_EMBED: "0"
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/composable-python-layer-smoke.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          python3 -m unittest scripts/test_build_python_runtime_layer.py
          command -v zstd
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          case "$ARCH" in
            x86_64)
              source_url='https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18%2B20261026-x86_64-unknown-linux-musl-lto%2Bstatic-full.tar.zst'
              expected='9f5dfaf983a54a62212184f08f5dfc36d1474052d71a799cdfd3f1a53dc970d4'
              size=63836160
              ;;
            aarch64)
              source_url='https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.13.18%2B20261026-aarch64-unknown-linux-musl-lto%2Bstatic-full.tar.zst'
              expected='2c65e1c400098a3a8141a58f2f2f66a3df667d5f947d86d982f3d115b023b0f2'
              size=64798720
              ;;
          esac
          curl -fLsS --retry 2 --max-time 120 \
            "$source_url" \
            -o "$tmp/source.tar.zst"
          python3 scripts/build-python-runtime-layer.py --arch "$ARCH" "$tmp/source.tar.zst" "$tmp/layer.tar"
          python3 scripts/build-python-runtime-layer.py --arch "$ARCH" "$tmp/source.tar.zst" "$tmp/again.tar"
          cmp "$tmp/layer.tar" "$tmp/again.tar"
          printf '%s  %s\n' "$expected" "$tmp/layer.tar" | sha256sum --check
          test "$(stat -c %s "$tmp/layer.tar")" -eq "$size"
          mkdir "$tmp/feed"
          gh release download registry-pack-revocations --repo tinylabscom/mvm-packs \
            --pattern revocations.json --pattern revocations.sigstore.json --dir "$tmp/feed"
          test -s "$tmp/feed/revocations.json"
          test -s "$tmp/feed/revocations.sigstore.json"

          mkdir -p "$tmp/files/pack"
          printf 'description = "Offline Python runtime"\nrequired = true\n[network]\nblock = true\n' \
            > "$tmp/files/pack/group.toml"
          LAYER_ROOT="$tmp" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["LAYER_ROOT"])
          archive = (root / "layer.tar").read_bytes()
          group = (root / "files/pack/group.toml").read_bytes()
          manifest = {
              "schema_version": 3,
              "kind": "runtime_layer",
              "reference": "runtime/python@1.1.0",
              "description": "Unpublished offline Python input test",
              "runtime_layer": {
                  "schema_version": 1,
                  "guest_arch": os.environ["ARCH"],
                  "dependencies": [],
                  "archive": {
                      "source": "https://example.invalid/unpublished/runtime/python/1.1.0/layer.tar",
                      "archive_sha256": hashlib.sha256(archive).hexdigest(),
                      "archive_size": len(archive),
                  },
              },
              "files": [{
                  "path": "pack/group.toml",
                  "sha256": hashlib.sha256(group).hexdigest(),
                  "size": len(group),
              }],
          }
          (root / "manifest.json").write_bytes(
              json.dumps(manifest, separators=(",", ":"), sort_keys=True).encode()
          )
          PY
          cosign sign-blob --yes --new-bundle-format --bundle "$tmp/manifest.bundle" \
            "$tmp/manifest.json"
          MVM_HOME="$tmp/home-good" cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/manifest.json" "$tmp/manifest.bundle" "$tmp/layer.tar" \
            "$tmp/files" "$IDENTITY" "$tmp/feed/revocations.json" \
            "$tmp/feed/revocations.sigstore.json"
          MVM_TEST_PYTHON_LAYER_TAR="$tmp/layer.tar" cargo test --locked -p mvm-build \
            --lib runtime_layer::tests::pinned_python_layer_passes_the_real_runtime_tar_preflight \
            -- --ignored --exact
          cp "$tmp/layer.tar" "$tmp/tampered.tar"
          printf x >> "$tmp/tampered.tar"
          if MVM_HOME="$tmp/home-tampered" cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/manifest.json" "$tmp/manifest.bundle" "$tmp/tampered.tar" \
            "$tmp/files" "$IDENTITY" "$tmp/feed/revocations.json" \
            "$tmp/feed/revocations.sigstore.json"; then
            echo "tampered signed input was accepted" >&2
            exit 1
          fi
          printf '# changed after signing\n' >> "$tmp/files/pack/group.toml"
          if MVM_HOME="$tmp/home-policy" cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/manifest.json" "$tmp/manifest.bundle" "$tmp/layer.tar" \
            "$tmp/files" "$IDENTITY" "$tmp/feed/revocations.json" \
            "$tmp/feed/revocations.sigstore.json"; then
            echo "tampered signed policy was accepted" >&2
            exit 1
          fi
          printf 'description = "Offline Python runtime"\nrequired = true\n[network]\nblock = true\n' \
            > "$tmp/files/pack/group.toml"
          if MVM_HOME="$tmp/home-wrong-publisher" cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/manifest.json" "$tmp/manifest.bundle" "$tmp/layer.tar" \
            "$tmp/files" "https://example.invalid/untrusted-publisher" \
            "$tmp/feed/revocations.json" "$tmp/feed/revocations.sigstore.json"; then
            echo "wrong publisher identity was accepted" >&2
            exit 1
          fi
          python3 - "$tmp/manifest.json" "$tmp/wrong-arch.json" "$ARCH" <<'PY'
          import json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_bytes())
          manifest["runtime_layer"]["guest_arch"] = (
              "aarch64" if sys.argv[3] == "x86_64" else "x86_64"
          )
          Path(sys.argv[2]).write_bytes(
              json.dumps(manifest, separators=(",", ":"), sort_keys=True).encode()
          )
          PY
          cosign sign-blob --yes --new-bundle-format --bundle "$tmp/wrong-arch.bundle" \
            "$tmp/wrong-arch.json"
          if MVM_HOME="$tmp/home-wrong-arch" cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/wrong-arch.json" "$tmp/wrong-arch.bundle" "$tmp/layer.tar" \
            "$tmp/files" "$IDENTITY" "$tmp/feed/revocations.json" \
            "$tmp/feed/revocations.sigstore.json" > "$tmp/wrong-arch.log" 2>&1; then
            echo "wrong signed runtime architecture was accepted" >&2
            exit 1
          fi
          grep -F "declares architecture" "$tmp/wrong-arch.log"

          mkdir -p "$tmp/bad-files/pack"
          printf 'description = "Offline Python runtime"\nrequired = false\n[network]\nblock = true\n' \
            > "$tmp/bad-files/pack/group.toml"
          python3 - "$tmp/manifest.json" "$tmp/bad-group.json" "$tmp/bad-files/pack/group.toml" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          manifest = json.loads(Path(sys.argv[1]).read_bytes())
          policy = Path(sys.argv[3]).read_bytes()
          manifest["files"][0]["sha256"] = hashlib.sha256(policy).hexdigest()
          manifest["files"][0]["size"] = len(policy)
          Path(sys.argv[2]).write_bytes(
              json.dumps(manifest, separators=(",", ":"), sort_keys=True).encode()
          )
          PY
          cosign sign-blob --yes --new-bundle-format --bundle "$tmp/bad-group.bundle" \
            "$tmp/bad-group.json"
          if MVM_HOME="$tmp/home-bad-group" cargo run --locked -p mvm-core --example verify-runtime-layer-fixture \
            --features host-state,manifest-verify -- \
            "$tmp/bad-group.json" "$tmp/bad-group.bundle" "$tmp/layer.tar" \
            "$tmp/bad-files" "$IDENTITY" "$tmp/feed/revocations.json" \
            "$tmp/feed/revocations.sigstore.json" > "$tmp/bad-group.log" 2>&1; then
            echo "signed optional runtime policy was accepted" >&2
            exit 1
          fi
          grep -F "requires a signed, required deny-all group" "$tmp/bad-group.log"

  signed-base:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: sigstore/cosign-installer@v3
      - name: Authenticate a synthetic development base before materialization
        env:
          MVM_EMBED: "0"
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/composable-python-layer-smoke.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          MVM_TEST_SIGNED_BASE_DIR="$tmp/base" cargo test --locked -p mvm-build \
            --features manifest-verify --lib \
            runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
            -- --exact
          cosign sign-blob --yes --new-bundle-format --bundle "$tmp/base/image-set.bundle" \
            "$tmp/base/image-set.json"
          MVM_TEST_SIGNED_BASE_DIR="$tmp/base" MVM_TEST_SIGNED_BASE_VERIFY=1 \
            MVM_TEST_SIGNED_BASE_IDENTITY="$IDENTITY" cargo test --locked -p mvm-build \
            --features manifest-verify --lib \
            runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
            -- --exact
          if MVM_TEST_SIGNED_BASE_DIR="$tmp/base" MVM_TEST_SIGNED_BASE_VERIFY=1 \
            MVM_TEST_SIGNED_BASE_IDENTITY="https://example.invalid/untrusted-publisher" \
            cargo test --locked -p mvm-build --features manifest-verify --lib \
              runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
              -- --exact; then
            echo "wrong synthetic base publisher was accepted" >&2
            exit 1
          fi
          MVM_TEST_COMPOSITION_TAR="$tmp/base/rootfs.tar.gz" \
            cargo test --locked -p mvm-build --features manifest-verify \
            --lib runtime_layer::tests::nix_generated_base_tar_materializes_with_verity_when_provided \
            -- --exact
          printf x >> "$tmp/base/rootfs.tar.gz"
          if MVM_TEST_SIGNED_BASE_DIR="$tmp/base" MVM_TEST_SIGNED_BASE_VERIFY=1 \
            MVM_TEST_SIGNED_BASE_IDENTITY="$IDENTITY" cargo test --locked -p mvm-build \
              --features manifest-verify --lib \
              runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
              -- --exact; then
            echo "changed synthetic base archive was accepted" >&2
            exit 1
          fi

  composed-base-guest-read:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: signed-base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Select reviewed test-only Linux source
        id: test-images-ref
        run: echo "ref=$(cat tests/fixtures/composable-images-source.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: tinylabscom/mvm-images
          ref: ${{ steps.test-images-ref.outputs.ref }}
          path: mvm-images
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: sigstore/cosign-installer@v3
      - name: Read an authored value in a QEMU guest from a signed-input composition
        env:
          MVM_EMBED: "0"
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/composable-python-layer-smoke.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          result="$(cd mvm-images && nix build '.#legacyPackages.x86_64-linux.default-tenant.default' --no-link --print-out-paths)"
          test -s "$result/rootfs.tar.gz"
          test -s "$result/vmlinux"
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          export MVM_TEST_SIGNED_BASE_DIR="$tmp/base"
          export MVM_TEST_SIGNED_BASE_TAR="$result/rootfs.tar.gz"
          export MVM_TEST_SIGNED_BASE_KERNEL="$result/vmlinux"
          cargo test --locked -p mvm-build --features manifest-verify --lib \
            runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
            -- --exact
          cosign sign-blob --yes --new-bundle-format \
            --bundle "$tmp/base/image-set.bundle" "$tmp/base/image-set.json"
          MVM_TEST_SIGNED_BASE_VERIFY=1 MVM_TEST_SIGNED_BASE_IDENTITY="$IDENTITY" \
            cargo test --locked -p mvm-build --features manifest-verify --lib \
              runtime_layer::tests::signed_set_composition_fetches_and_checks_the_production_base \
              -- --exact
          test -s "$tmp/base/composed.ext4"
          for run in first repeat; do
            status=0
            timeout 120s qemu-system-x86_64 -nodefaults -no-user-config \
              -machine q35,accel=tcg -m 512 -smp 1 -display none \
              -monitor none -serial stdio -no-reboot -kernel "$result/vmlinux" \
              -drive "file=$tmp/base/composed.ext4,format=raw,if=none,id=rootfs,readonly=on" \
              -device virtio-blk-pci,drive=rootfs \
              -append 'console=ttyS0 root=/dev/vda ro rootfstype=ext4 rootwait init=/srv/app/probe.sh panic=1 loglevel=4' \
              > "$tmp/$run.log" 2>&1 || status=$?
            if [ "$status" -eq 124 ]; then
              echo "$run guest timed out" >&2
              exit 1
            fi
            python3 - "$tmp/$run.log" "$run" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          marker = "COMPOSED_GUEST_VALUE=print('ready')"
          if marker not in log:
              raise SystemExit(f"{sys.argv[2]} guest did not read the authored file:\n{log[-4000:]}")
          print(f"{sys.argv[2]} guest read: {marker}")
          PY
          done

  # Capability probes only. A VM creation is not a guest boot, and neither
  # result qualifies a .mvmpkg or substitutes for the exact-file witness.
  native-arm-kvm-unix-transport-capability:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Native ARM KVM host capability (self-hosted)
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Require native aarch64 KVM and Unix transport for Firecracker
        run: |
          python3 - <<'PY'
          import fcntl
          import json
          import os
          import platform
          import shutil
          import socket
          import sys
          import tempfile

          evidence = {
              "scope": "KVM and host Unix transport only; no guest-vsock or package boot",
              "system": platform.system(),
              "architecture": platform.machine(),
              "firecracker_binary": shutil.which("firecracker"),
          }
          try:
              if evidence["system"] != "Linux" or evidence["architecture"] not in ("aarch64", "arm64"):
                  raise RuntimeError("runner is not native aarch64 Linux")
              with open("/dev/kvm", "rb+", buffering=0) as kvm:
                  api = fcntl.ioctl(kvm.fileno(), 0xAE00, 0)  # KVM_GET_API_VERSION
                  if api != 12:
                      raise RuntimeError(f"KVM API version {api}, expected 12")
                  evidence["kvm_api_version"] = api
                  vm = fcntl.ioctl(kvm.fileno(), 0xAE01, 0)  # KVM_CREATE_VM
                  os.close(vm)
                  evidence["kvm_vm_created_and_closed"] = True
              with tempfile.TemporaryDirectory(prefix="fc-host-", dir=os.environ["RUNNER_TEMP"]) as root:
                  path = os.path.join(root, "vsock.sock")
                  with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as listener:
                      listener.bind(path)
                      listener.listen(1)
                      with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as client:
                          client.connect(path)
                          with listener.accept()[0] as accepted:
                              client.sendall(b"v")
                              if accepted.recv(1) != b"v":
                                  raise RuntimeError("Firecracker host Unix transport did not round-trip")
                  evidence["firecracker_host_unix_transport"] = True
              evidence["result"] = "host-capability-confirmed; guest-vsock-unproven"
          except (OSError, RuntimeError, KeyError) as error:
              evidence["result"] = "host-capability-unavailable"
              evidence["reason"] = str(error)
          # Direct-QEMU vhost-vsock is a separate privilege requirement;
          # its absence cannot invalidate Firecracker's Unix-backed route.
          try:
              vsock = os.open("/dev/vhost-vsock", os.O_RDWR | os.O_CLOEXEC)
              os.close(vsock)
              evidence["qemu_vhost_vsock_opened"] = True
          except OSError as error:
              evidence["qemu_vhost_vsock"] = str(error)
          try:
              with socket.socket(socket.AF_VSOCK, socket.SOCK_STREAM):
                  evidence["host_af_vsock_socket_created"] = True
          except (AttributeError, OSError) as error:
              evidence["host_af_vsock"] = str(error)
          print(json.dumps(evidence, sort_keys=True))
          sys.exit(0 if evidence["result"].startswith("host-capability-confirmed") else 1)
          PY

  native-macos-hvf-capability:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, m1]
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Create and destroy an entitled native Apple Silicon HVF VM
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(sysctl -n kern.hv_support)" = 1
          scratch="$(mktemp -d "$RUNNER_TEMP/hvf-capability-XXXXXX")"
          trap 'rm -rf -- "$scratch"' EXIT
          cat > "$scratch/hvf.c" <<'C'
          #include <Hypervisor/hv_error.h>
          #include <Hypervisor/hv_vm.h>
          #include <stdio.h>
          int main(void) {
              hv_return_t status = hv_vm_create(NULL);
              if (status != HV_SUCCESS) {
                  fprintf(stderr, "hv_vm_create refused: %d\n", status);
                  return 1;
              }
              status = hv_vm_destroy();
              if (status != HV_SUCCESS) {
                  fprintf(stderr, "hv_vm_destroy refused: %d\n", status);
                  return 1;
              }
              puts("HVF_VM_CREATE_DESTROY_OK (no guest or package boot)");
              return 0;
          }
          C
          cat > "$scratch/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>com.apple.security.hypervisor</key><true/></dict></plist>
          PLIST
          clang -arch arm64 -framework Hypervisor -o "$scratch/hvf" "$scratch/hvf.c"
          codesign --force --sign - --entitlements "$scratch/entitlements.plist" "$scratch/hvf"
          codesign --verify --strict "$scratch/hvf"
          printf 'runner: %s %s macOS %s\n' "$(uname -s)" "$(uname -m)" "$(sw_vers -productVersion)"
          "$scratch/hvf"
