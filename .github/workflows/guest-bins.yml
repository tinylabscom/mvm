name: Guest bins

# Builds the mvm-guest-bins artifact (the static guest executables, the
# initramfs agent, the host-services and GPU shared objects for glibc and musl,
# for aarch64 and x86_64, plus the Python SDK and the manifest pinning them)
# from the dispatched ref, and uploads it with its `.sha256` sidecar as a
# workflow artifact. The archive is the guest runtime each CLI release
# publishes for mvmctl: release.yml calls this workflow, and its release job
# signs, attests and publishes what was uploaded. Dispatched on its own, the
# lane produces an unsigned copy for inspection. Nothing here publishes or
# signs.
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      unsigned_artifact_id:
        description: Exact same-run unsigned guest runtime upload ID
        value: ${{ jobs.guest-bins.outputs.unsigned_artifact_id }}
      unsigned_artifact_digest:
        description: SHA256 of the uploaded unsigned artifact ZIP
        value: ${{ jobs.guest-bins.outputs.unsigned_artifact_digest }}

permissions:
  contents: read

# Dispatch-only, so a second dispatch queues behind the first instead of
# killing a build that is already most of the way through.
concurrency:
  group: guest-bins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guest-bins:
    outputs:
      unsigned_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      unsigned_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    # ubuntu-24.04 until the 26.04 runner failures are fixed
    runs-on: ubuntu-24.04
    # A cold debug build of mvmctl plus every guest cross-compile for both
    # arches: two overlay builds, the OCI set, setpriv, the initramfs agent and
    # eight shared objects per arch.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      # The guest artifacts are cross-compiled with cargo-zigbuild under the
      # pinned toolchain, for the musl and glibc targets of both arches; this
      # action installs zig, cargo-zigbuild and all four targets.
      - uses: ./.github/actions/install-zigbuild

      - name: Build the guest-bins artifact
        run: cargo run --locked -p mvmctl -- dev guest-bins --out dist

      - name: Retain the already-built canonical reader for pre-signing checks
        shell: bash
        run: |
          set -euo pipefail
          install -m 0700 "${CARGO_TARGET_DIR:-target}/debug/mvmctl" dist/mvmctl
          strip --strip-debug dist/mvmctl

      - name: Bind the upload to its actual producer attempt
        run: python3 scripts/runtime-proof-candidate.py emit-upload-context --kind unsigned --directory dist

      - name: Upload the artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: mvm-guest-bins-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
