name: Documented surface e2e

# Every documented example, executed against a real host on both backends mvm
# ships: Firecracker on Linux/KVM and HVF on macOS.
#
# Reusable rather than inlined, because two callers need the *same* lane and had
# been getting different ones. Extended CI runs it nightly. `release.yml` waits
# on it before it will cut a tag — until then a release blocked only on the
# hermetic BDD gate, which drives `--help` and refusal paths and boots nothing.
# That is how `machine run -it`, printed in the README, shipped for as long as
# it did with a guest console that failed on every OCI image: no lane that could
# see it ran before a release, and the lane that could see it ran at 04:51 and
# gated nothing.
#
# Both backends, deliberately. That defect reproduced on HVF, the macOS default,
# and a Linux-only gate would have shipped it.

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  e2e-docs-linux:
    name: Documented surface e2e (Linux, Firecracker)
    runs-on: ubuntu-latest
    # 120, not 60. At 60 this job never once finished: it died at exactly
    # 60m00s on three consecutive runs, which GitHub reports as `cancelled`
    # rather than as a timeout — so it read as an infrastructure hiccup instead
    # of a budget that was too small, and the Linux half of the release gate
    # went unproven for as long as that was true.
    #
    # The arithmetic was never going to work: `e2e-documented-surface.sh` gives
    # the cucumber suite alone a 3600s deadline, and the job must also check
    # out, install the toolchain, build `mvmctl`, install Firecracker and warm
    # the artifact home before the suite starts. The job budget has to exceed
    # the suite budget by the whole of setup, and it did not exceed it at all.
    #
    # Keeping the suite's own deadline below the job's also means a genuine
    # hang produces the script's "TIMEOUT after Ns — killing the suite" message,
    # naming the scenario it stopped on, rather than an opaque cancellation.
    timeout-minutes: 120
    env:
      # Must track `FC_VERSION_DEFAULT` in mvm-core. The workload launch path
      # passes flags older Firecracker releases reject before opening the API
      # socket, which otherwise surfaces as an unhelpful socket timeout.
      FC_VERSION: v1.14.1
      # The published builder/default-image paths fail closed unless the
      # source-built binary can verify their signed checksum manifests.
      MVM_E2E_FEATURES: user,release-artifact-bootstrap
      # Hosted runners protect their distro kernel under /boot. Use the
      # published, hash-verified workload kernel rather than a Stage 0 source
      # build that attempts to boot that unreadable host file.
      MVM_KERNEL_SOURCE: download
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/free-disk

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/apt-deps
        with:
          packages: libcap-ng-dev lld qemu-system-x86 qemu-utils virtiofsd

      - uses: ./.github/actions/install-zigbuild

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: ./.github/actions/rust-cache
        with:
          key: e2e-docs-linux

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.5"

      - name: Install firecracker
        run: |
          set -euo pipefail
          curl -fL -o firecracker.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          tar -xzf firecracker.tgz
          sudo install -m 0755 \
            "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" \
            /usr/bin/firecracker
          /usr/bin/firecracker --version

      - name: Grant /dev/kvm access for the job
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing on this runner — the documented surface cannot boot." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm

      - name: Grant unprivileged ICMP sockets to the runner group
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          read -r ping_gid_min ping_gid_max < <(sysctl -n net.ipv4.ping_group_range)
          test "$ping_gid_min" = "0"
          test "$ping_gid_max" = "2147483647"

      - name: Grant QEMU Stage 0 access to vhost-vsock
        run: |
          set -euo pipefail
          test -c /dev/vhost-vsock
          sudo chown "$(id -u):$(id -g)" /dev/vhost-vsock
          sudo chmod 0600 /dev/vhost-vsock
          test -r /dev/vhost-vsock && test -w /dev/vhost-vsock

      - name: Grant QEMU Stage 0 read access to the hosted kernel
        run: |
          set -euo pipefail
          KERNEL_RELEASE="$(uname -r)"
          sudo chmod a+r \
            "/boot/vmlinuz-${KERNEL_RELEASE}" \
            "/boot/initrd.img-${KERNEL_RELEASE}"

      - name: Run the documented surface end to end
        run: just e2e-docs

      - name: Dump VMM diagnostics on failure
        if: failure()
        run: |
          for d in "$HOME"/.mvm/vms/*/; do
            echo "===== $d ====="
            ls -la "$d" || true
            for f in firecracker.log console.log; do
              if [ -s "$d$f" ]; then
                echo "--- $f ---"
                tail -50 "$d$f"
              fi
            done
          done

  e2e-docs-macos:
    name: Documented surface e2e (macOS, HVF)
    # Run on Apple Silicon runners only. The macOS default backend is HVF,
    # and every guest-booting BDD scenario before this one carried `@firecracker`
    # — so the backend most users run had no lane that booted anything. This is
    # that lane.
    #
    # On Apple Silicon (arm64): HVF works, run the e2e.
    # On Intel (x86_64): HVF is not available (mvm-hvf-supervisor is Apple-Silicon-only),
    # so skip this lane and let the Linux lane cover the documented surface.
    runs-on: [macos-latest, arm64]
    timeout-minutes: 90
    env:
      # The documented surface includes signed release downloads. Build the
      # exact binary under test with their verifier enabled.
      MVM_E2E_FEATURES: user,release-artifact-bootstrap
      # The source-checkout kernel build depends on the same Stage 0 image this
      # witness deliberately fetches. Use the separately published, verified
      # workload kernel so the live lane never falls back into that cycle.
      MVM_KERNEL_SOURCE: download
      # Intel cannot install ARM-only libkrun. The fetched builder image is
      # self-contained, so source artifact jobs run inside it under HVF.
      MVM_BUILDER_BACKEND: hvf
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/install-zigbuild

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - uses: ./.github/actions/rust-cache
        with:
          key: e2e-docs-macos

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.12.5"

      - name: Run the documented surface end to end
        # HVF reports snapshot tier `save-restore`, so the pause/resume and
        # checkpoint scenarios can run here. The Linux lane leaves this unset:
        # Firecracker reports `unsupported` and those verbs refuse by capability.
        #
        # HVF also carries `WallClockControl::SupervisorTimer` — a per-VM
        # supervisor of ours outlives the launch and can hold a deadline — so
        # `--timeout` is admitted here rather than refused as an unenforceable
        # grant. The Linux lane leaves this unset too: Firecracker detaches its
        # session and is orphaned to init before the launch returns, leaving no
        # process of ours to fire a timer.
        env:
          MVM_BDD_SNAPSHOT: "1"
          MVM_BDD_WALL_CLOCK: "1"
        run: just e2e-docs

      - name: Dump VMM diagnostics on failure
        if: failure()
        run: |
          for d in "$HOME"/.mvm/vms/*/; do
            echo "===== $d ====="
            ls -la "$d" || true
            # HVF flushes console.log only when the supervisor exits, so an
            # empty file here is not evidence of a silent guest.
            for f in console.log supervisor.log; do
              if [ -s "$d$f" ]; then
                echo "--- $f ---"
                tail -50 "$d$f"
              fi
            done
          done
