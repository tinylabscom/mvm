name: Sign instruction files

# Keyless-signs this repository's agent instruction files (CLAUDE.md,
# AGENTS.md, SKILL.md, .claude/**/*.md, .cursor/rules/**, ...) under this
# workflow's own GitHub Actions OIDC identity, verifies every fresh bundle
# through mvmctl's in-process Sigstore verifier, and uploads the bundles as an
# artifact.
#
# It never commits. The job holds no write access to the repository: a
# maintainer downloads the artifact, reviews it, and lands the
# `<file>.sigstore.json` bundles through a pull request. A workflow that
# pushed its own signatures to `main` would let anything able to trigger it
# decide what `main` vouches for.
#
# To sign another repository's instruction files, copy this file into that
# repository rather than calling it as a reusable workflow. A keyless
# certificate names the workflow file that ran; for a called workflow that is
# this file in this repository whoever called it, so a policy trusting it
# would trust every repository able to call it. A copy signs under its own
# repository's identity, which is what a publisher entry should pin:
#
#   [[publishers]]
#   kind = "keyless"
#   name = "mvm-instructions"
#   issuer = "https://token.actions.githubusercontent.com"
#   repository = "tinylabscom/mvm"
#   workflow = ".github/workflows/sign-instructions.yml"
#   ref = "refs/heads/main"

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Mirrors the built-in instruction-file includes
    # (`mvm_client::instruction_trust::policy::DEFAULT_INCLUDES`); a test in
    # that module fails if the two drift.
    paths:
      - "**/CLAUDE.md"
      - "**/CLAUDE.local.md"
      - "**/AGENTS.md"
      - "**/AGENT.md"
      - "**/GEMINI.md"
      - "**/SKILL.md"
      - "**/.claude/**/*.md"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - ".github/workflows/sign-instructions.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: sign-instructions-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  sign:
    name: Sign and verify instruction files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Keep mvmctl's state out of the runner's home.
      - name: Isolate mvmctl state
        run: echo "MVM_HOME=$RUNNER_TEMP/mvm-home" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/rust-cache

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # `user` carries the Sigstore verifier; a default build reports every
      # keyless signature as uncheckable.
      - name: Build mvmctl with the Sigstore verifier
        run: cargo build --locked -p mvmctl --features user --bin mvmctl

      - name: List the instruction files
        run: |
          set -euo pipefail
          ./target/debug/mvmctl trust instructions sign --dry-run . \
            > "$RUNNER_TEMP/instruction-files.txt"
          echo "instruction files:"
          cat "$RUNNER_TEMP/instruction-files.txt"

      # --new-bundle-format writes the Sigstore bundle the in-process verifier
      # parses, at the sidecar name it looks for.
      - name: Keyless-sign each file
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${file}.sigstore.json" \
              "${file}"
          done < "$RUNNER_TEMP/instruction-files.txt"

      # The round trip that matters: the bundles cosign just wrote, checked by
      # the verifier admission uses, under a policy that trusts exactly this
      # workflow on this ref and refuses anything else.
      - name: Verify the bundles under this workflow's identity
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The ref is interpolated into TOML below; refuse one that could
          # carry anything but a plain ref name.
          if ! printf '%s' "$REF" | grep -Eq '^refs/[A-Za-z0-9._/-]+$'; then
            echo "refusing to build a policy for ref ${REF}" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/instruction-trust.toml" <<EOF
          enforcement = "deny"

          [[publishers]]
          kind = "keyless"
          name = "sign-instructions"
          issuer = "https://token.actions.githubusercontent.com"
          repository = "${REPOSITORY}"
          workflow = ".github/workflows/sign-instructions.yml"
          ref = "${REF}"
          EOF
          ./target/debug/mvmctl trust instructions verify . \
            --policy "$RUNNER_TEMP/instruction-trust.toml"

      - name: Collect the bundles
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bundles"
          while IFS= read -r file; do
            cp --parents "${file}.sigstore.json" "$RUNNER_TEMP/bundles/"
          done < "$RUNNER_TEMP/instruction-files.txt"

      - name: Upload the bundles for review
        uses: actions/upload-artifact@v7
        with:
          name: instruction-signatures
          path: ${{ runner.temp }}/bundles/
          if-no-files-found: error
          retention-days: 30
