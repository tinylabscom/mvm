name: Sign instruction files

# Keyless-signs this repository's agent instruction files (CLAUDE.md,
# AGENTS.md, SKILL.md, .claude/**/*.md, .cursor/rules/**, ...) under this
# workflow's own GitHub Actions OIDC identity, verifies every fresh bundle
# through mvmctl's in-process Sigstore verifier, and uploads the bundles as an
# artifact. The steps live in `.github/actions/sign-instructions`, which other
# repositories call from a workflow of their own.
#
# It never commits. The job holds no write access to the repository, and
# GitHub Actions is not permitted to open pull requests here. The artifact is
# where the bundles are published: to verify a checkout, download the artifact
# of the run that signed its instruction files into it and run
# `mvmctl trust instructions verify` (see the instruction-provenance guide).
#
# This file must never gain a `workflow_call` trigger. A called workflow signs
# under this file's identity whoever called it, and this repository is public,
# so any repository on GitHub could then mint a signature the publisher entry
# below accepts:
#
#   [[publishers]]
#   kind = "keyless"
#   name = "mvm-instructions"
#   issuer = "https://token.actions.githubusercontent.com"
#   repository = "tinylabscom/mvm"
#   workflow = ".github/workflows/sign-instructions.yml"
#   ref = "refs/heads/main"

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Mirrors the built-in instruction-file includes
    # (`mvm_client::instruction_trust::policy::DEFAULT_INCLUDES`); a test in
    # that module fails if the two drift.
    paths:
      - "**/CLAUDE.md"
      - "**/CLAUDE.local.md"
      - "**/AGENTS.md"
      - "**/AGENT.md"
      - "**/GEMINI.md"
      - "**/SKILL.md"
      - "**/.claude/**/*.md"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - ".github/workflows/sign-instructions.yml"
      - ".github/actions/sign-instructions/**"

permissions:
  contents: read
  id-token: write

# Serialize rather than cancel: pull requests never trigger this workflow, so
# cancelling could only kill a signing run already in flight, leaving a
# `cancelled` run with no bundles.
concurrency:
  group: sign-instructions-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  sign:
    name: Sign and verify instruction files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - uses: ./.github/actions/sign-instructions
        with:
          cache-key: workspace
