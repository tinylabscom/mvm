name: HVF native

# The only lane that runs HVF code on a host that can boot a guest: no hosted
# macOS image exposes Hypervisor.framework, so this runs on the self-hosted
# Apple Silicon runner. It runs the host-side HVF tests of the crates that own
# the backend. It never runs on a pull request: the runner is a persistent
# physical machine and the repository is public, so only trusted events may
# reach it (`tests/github_actions_self_hosted_runner.rs`). It runs on pushes to
# main that touch those crates, and on demand against any branch:
# `gh workflow run hvf-native.yml --ref <branch>`. Tests marked `#[ignore]`
# stay ignored.

on:
  push:
    branches: [main]
    paths:
      - "crates/mvm-hostd/src/supervisor/**"
      - "crates/mvm-runtime/src/backends/hvf/**"
      - "crates/mvm-backends/src/driver/hvf*"
      - "crates/mvm-vmm/**"
      - ".github/workflows/hvf-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hvf-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hvf-native:
    name: HVF host tests (Apple Silicon)
    runs-on: [self-hosted, macOS, ARM64, m1]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - uses: ./.github/actions/rust-cache
        with:
          key: hvf-native

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Preflight — this host can run HVF
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sysctl -n kern.hv_support | grep -qx 1

      - name: Run the HVF tests
        run: >-
          cargo nextest run --profile ci
          -p mvm-hostd -p mvm-runtime -p mvm-backends -p mvm-vmm
          -E 'test(/hvf/)'
