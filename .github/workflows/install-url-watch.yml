name: Install URL watch

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check published installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check HTTP 200, shell content type, and installer marker
        id: check
        continue-on-error: true
        env:
          INSTALL_URL: https://runmvm.com/install.sh
        run: sh ./scripts/check-published-installer.sh "$INSTALL_URL"

      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ steps.check.outcome }}
          TITLE: "Published install URL is unhealthy"
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$REPO" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')"

          if [ "$STATUS" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" \
                --comment "The published installer is healthy again. Watcher run: $RUN_URL"
            fi
            exit 0
          fi

          body="The published installer failed its HTTP status, content-type, or marker check.\n\nWatcher run: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body"
          fi
          exit 1
