name: Architecture invariants

# The required architecture scan runs in ci.yml's policy lane so queue entries
# do not allocate this workflow plus an aggregate runner. This manual workflow
# remains a focused diagnostic surface for maintainers.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  invariant:
    name: Architecture diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: No orchestration server outside declared substrate categories
        run: bash scripts/check-no-orchestration-server.sh
