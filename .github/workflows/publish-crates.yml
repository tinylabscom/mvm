name: Publish to crates.io

on:
  # The `release: published` auto-trigger is intentionally disabled: crates.io
  # publishing of this workspace isn't wired yet (scripts/deploy-guard.sh is
  # absent and not every workspace crate is publish-ready), so a release tag
  # would fail this workflow on every cut. Publish manually via workflow_dispatch
  # once the deploy guard + dependency-ordered publish are built out.
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Run cargo publish --dry-run instead of actually publishing"
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      TAG_NAME: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Check token
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "Missing CRATES_IO_TOKEN secret."
            exit 1
          fi

      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure tag exists locally
        run: |
          git fetch --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/${TAG_NAME}"; then
            echo "Tag ${TAG_NAME} not found"
            exit 1
          fi
          git checkout "refs/tags/${TAG_NAME}"

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Run Deploy Guard
        shell: bash
        run: |
          chmod +x scripts/deploy-guard.sh
          ./scripts/deploy-guard.sh

      - name: Publish crates in dependency order
        shell: bash
        run: |
          set -euo pipefail

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Running dry-run publishes (no crates will be uploaded)"
            PUBLISH_FLAG="--dry-run"
          else
            PUBLISH_FLAG=""
          fi

          # Publish in dependency order: leaf crates first, root facade last.
          # mvm-apple-container is versioned independently — list it before
          # mvm, which depends on it.
          CRATES=(
            mvm-core
            mvm-apple-container
            mvm-guest
            mvm-security
            mvm-build
            mvm
            mvm-cli
            mvmctl
          )

          # Read [package].version from a crate's Cargo.toml. Falls back to the
          # workspace version (for crates that use version.workspace = true).
          crate_target_version() {
            local crate="$1"
            local cargo_toml="crates/${crate}/Cargo.toml"
            if [ "$crate" = "mvmctl" ]; then
              cargo_toml="Cargo.toml"
            fi
            local pkg_version
            pkg_version=$(awk '/^\[package\]/{p=1; next} /^\[/{p=0} p && /^version *= */{
              gsub(/^version *= *"|".*$/, ""); print; exit }' "$cargo_toml")
            if [ -n "$pkg_version" ]; then
              echo "$pkg_version"
              return
            fi
            grep -A 5 '^\[workspace\.package\]' Cargo.toml | grep '^version' | head -1 | cut -d '"' -f 2
          }

          # True if exact version is already published — makes this loop
          # idempotent so a partial run (mvm onwards left to do) can
          # be resumed by re-dispatching without "already exists" failures.
          # crates.io rejects empty User-Agent with 403, so set one explicitly.
          crate_already_published() {
            local crate="$1" wanted="$2"
            local response
            response=$(curl -fsSL \
              -A "mvm-publish-crates (https://github.com/${GITHUB_REPOSITORY:-tinylabscom/mvm})" \
              "https://crates.io/api/v1/crates/${crate}/${wanted}" 2>/dev/null || true)
            [ -n "$response" ] && echo "$response" | grep -q "\"num\":\"${wanted}\""
          }

          for CRATE in "${CRATES[@]}"; do
            echo "::group::Publishing ${CRATE}"
            TARGET_VERSION=$(crate_target_version "$CRATE")
            if [ -z "${PUBLISH_FLAG}" ] && crate_already_published "$CRATE" "$TARGET_VERSION"; then
              echo "${CRATE} ${TARGET_VERSION} already on crates.io — skipping"
              echo "::endgroup::"
              continue
            fi
            cargo publish -p "${CRATE}" ${PUBLISH_FLAG}
            echo "::endgroup::"

            # Give crates.io index a moment to catch up so dependents can publish.
            if [ -z "${PUBLISH_FLAG}" ]; then
              sleep 20
            fi
          done

      - name: Summary
        if: always()
        run: |
          echo "Published crates from tag ${TAG_NAME}."
          echo "Dry run: ${DRY_RUN}"
