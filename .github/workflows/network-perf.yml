name: Network performance evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-x86-64-host-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - uses: ./.github/actions/apt-deps
        with:
          packages: lld

      - name: Build release probe and harness
        run: |
          cargo build --release -p mvm-hostd --features network-perf --example network_perf_probe
          cargo build -p xtask

      - name: Record paired reports
        env:
          MVM_NETWORK_PERF_HOST_ID: github-hosted-ubuntu-24.04-x86_64
          MVM_NETWORK_PERF_STORAGE: github-hosted-ephemeral-ssd
          MVM_NETWORK_PERF_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p network-perf-results
          export MVM_NETWORK_PERF_CPU
          MVM_NETWORK_PERF_CPU="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"

          MVM_NETWORK_PERF_IMPLEMENTATION=legacy_l3 \
            target/debug/xtask network-perf run-probe \
              --backend host-loopback \
              --output network-perf-results/legacy-l3-linux-x86_64-host-loopback.json \
              -- target/release/examples/network_perf_probe

          MVM_NETWORK_PERF_IMPLEMENTATION=flow_mux \
            target/debug/xtask network-perf run-probe \
              --backend host-loopback \
              --output network-perf-results/flow-mux-linux-x86_64-host-loopback.json \
              -- target/release/examples/network_perf_probe

          set +e
          target/debug/xtask network-perf compare \
            --baseline network-perf-results/legacy-l3-linux-x86_64-host-loopback.json \
            --candidate network-perf-results/flow-mux-linux-x86_64-host-loopback.json \
            --output network-perf-results/comparison-linux-x86_64-host-loopback.json
          comparison_status=$?
          set -e
          test -s network-perf-results/comparison-linux-x86_64-host-loopback.json
          echo "comparison exit status: ${comparison_status} (the raw result is evidence, not a workflow override)"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-perf-linux-x86-64-${{ github.sha }}
          path: network-perf-results/
          if-no-files-found: error
