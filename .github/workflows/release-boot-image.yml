name: Release boot image

# The boot image ships on its own counter, `boot-image/vN`, so a rootfs or
# kernel fix does not need a CLI release and a CLI release does not need to
# rebuild an unchanged image. The two trains cannot fire each other by
# accident: GitHub tag globs anchor at the start and do not cross `/`, so
# `boot-image/v0.1.0` misses release.yml's `v*` and `v0.18.0` misses the
# pattern below. `tests/release_assets.rs` asserts both patterns rather than
# trusting that sentence.
#
# The flakes stay in `nix/images/`. That is what keeps a source checkout
# honest for free — a contributor editing `nix/images/builder-vm/flake.nix`
# sees the change on the next boot, with no release round-trip.

on:
  push:
    tags:
      - "boot-image/v*"
  # Manual dry-run: `dry_run=true` (the default) runs nothing but the job
  # skeleton — the Nix image builds are slow and there is nothing to validate
  # without publishing. An explicit `dry_run=false` dispatch builds and
  # publishes (escape hatch), matching release.yml's dispatch semantics.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip the image builds and the publish (no GitHub release)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write   # Required for cosign keyless signing via OIDC

env:
  CARGO_TERM_COLOR: always

jobs:
  # Plan 72 W5 / ADR-046: the Layer-1 builder VM image that
  # `LibkrunBuilderVm::run_build` boots into to run `nix build` on
  # behalf of mvmctl. Plan 72 W2 ships the flake at
  # `nix/images/builder-vm/`; this job publishes the per-arch
  # artifacts so installed-binary users (no source checkout) can
  # download them via `download_builder_vm_image`.
  #
  # This is the development-time builder VM that runs `nix build`
  # against the user's dev-shell flake. (Plan 115 / ADR-064 folded the
  # old separate dev-shell + sealed-builder images — `nix/images/builder`
  # — into this one; the sealed runtime builder for mvmd's pool-build
  # pipeline, if still needed, is sourced from mvmd, not built here.)
  builder-vm-image:
    # Skipped on a dry-run dispatch — Nix image builds are slow and unchanged by
    # the binary-packaging path a dry-run validates. Runs on tag push / dry_run=false.
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    # This job mints a keyless (OIDC/Fulcio) signature over the attested
    # builder pack manifest, and the resulting certificate's SAN is derived
    # from the workflow ref that ran it. Gating the job on a protected
    # environment means the ref that can produce a valid signing identity is
    # constrained by the environment's deployment branch/tag rule (restricted
    # to boot-image version tags in repo settings), with an optional required-reviewer
    # gate on top of the tag-push trigger already enforced above — so the
    # identity a released binary trusts can't be minted from an arbitrary
    # branch or workflow_dispatch run.
    # The CLI release environment is restricted to v* tags; boot-image/v*
    # releases use the matching protected environment instead.
    environment: boot-image-signing
    strategy:
      # One arch's build must not cancel the other's. The sibling is a separate
      # artifact, and a transient failure on one runner used to take the other
      # down before it produced anything — which then read as two broken arches.
      # Publishing is still all-or-nothing: the completeness gate below refuses
      # a partial set, so letting both finish costs nothing and tells the truth
      # about which one actually failed.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            musl_target: aarch64-unknown-linux-musl
          - arch: x86_64
            runner: ubuntu-latest
            musl_target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - uses: ./.github/actions/install-zigbuild

      # The builder-vm rootfs embeds the cross-compiled, statically
      # musl-linked host-vm binaries, which the flake reads out of
      # MVM_HOST_BIN_DIR at eval time under `--impure`. mvmctl normally
      # extracts its embedded copy before invoking nix; nothing does that
      # here, so the build has to produce them. Without this the eval dies
      # with "MVM_HOST_BIN_DIR is not set" and the job publishes nothing —
      # which is how the first boot-image release shipped with no builder-vm
      # assets at all. Same recipe the reproducibility lanes in security.yml
      # use, and the same one crates/mvm-cli/build.rs runs.
      - name: Cross-compile host-vm binaries (MVM_HOST_BIN_DIR contract)
        env:
          MUSL_TARGET: ${{ matrix.musl_target }}
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked --target "$MUSL_TARGET" \
            -p mvm-build --bin mvm-host-vm-init --bin mvm-egress-proxy \
            --bin mvm-builderd
          echo "MVM_HOST_BIN_DIR=$PWD/target/${MUSL_TARGET}/release" >> "$GITHUB_ENV"

      - name: Build builder VM image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/builder-vm#packages.${SYSTEM}.default" \
            --impure --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          mkdir -p staging
          cp "$STORE_PATH/vmlinux"       "staging/builder-vm-vmlinux-${ARCH}"
          cp "$STORE_PATH/rootfs.ext4"   "staging/builder-vm-rootfs-${ARCH}.ext4"
          # Optional sidecars the flake emits. `cp -L` so symlinks
          # resolve; ignore-missing so older flake snapshots that
          # predate these outputs still produce a valid release.
          if [ -f "$STORE_PATH/cmdline.txt" ]; then
            cp -L "$STORE_PATH/cmdline.txt" "staging/builder-vm-${ARCH}.cmdline.txt"
          fi
          if [ -f "$STORE_PATH/manifest.json" ]; then
            cp -L "$STORE_PATH/manifest.json" "staging/builder-vm-${ARCH}.manifest.json"
          fi

      - name: Generate builder image SBOM
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Real store-path bill of materials for the builder image closure —
          # not a stub. The attested pack manifest's SBOM reference hashes
          # this file's bytes.
          nix-store --query --requisites "$STORE_PATH" > "staging/builder-vm-${ARCH}.sbom.txt"

      # Dormant under this workflow's tag namespace, on purpose. The version
      # check inside refuses any ref that is not `refs/tags/v<crate version>`,
      # and a boot image tag never is — so no pack ships from here today. That
      # is the correct outcome rather than an oversight: a pack's whole value
      # is an identity an installed binary can reconstruct, and installed
      # binaries reconstruct the CLI release workflow at a version tag.
      # Producing one under a boot image identity would ship a pack every
      # consumer silently fails open on. This wakes up when the consumer side
      # learns to reconstruct this identity. The same applies to the runtime
      # pack in the default-microvm job below.
      - name: Produce and keyless-sign attested builder pack manifest
        # The pack is an accelerator, never a hard dependency. A Fulcio/Rekor/OIDC
        # hiccup must not block the plain vmlinux/rootfs publish below, so a
        # signing failure here is tolerated: the job continues, no pack ships, and
        # installed binaries fall back to the plain checksum download.
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # On a tag push, REF is refs/tags/vX.Y.Z — exactly the SAN cosign
          # embeds in the certificate and exactly what a released mvmctl
          # (version X.Y.Z) reconstructs when verifying the pack. Skip pack
          # production unless the ref is a version tag whose version equals the
          # crate version; anything else yields an identity no installed binary
          # can reconstruct, so it would silently fail-open to the plain download.
          # Skipping keeps that outcome explicit and still ships the plain image.
          if [[ "${REF}" != refs/tags/v* ]]; then
            echo "::notice::${REF} is not a version tag; skipping attested builder pack."
            exit 0
          fi
          TAG_VERSION="${REF#refs/tags/v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="mvm-cli") | .version')"
          if [[ "${TAG_VERSION}" != "${CRATE_VERSION}" ]]; then
            echo "::warning::tag ${REF} does not match crate version v${CRATE_VERSION}; installed binaries could not verify this pack — skipping attested builder pack."
            exit 0
          fi
          IDENTITY="https://github.com/${REPOSITORY}/.github/workflows/release.yml@${REF}"
          REVOCATION_CHANNEL="https://github.com/${REPOSITORY}/releases/download/revocations/builder-vm-revocations.json"
          # The published location of the SBOM this release ships, so the
          # manifest's SBOM reference points at a real download instead of a
          # path that only exists on the runner that built it.
          SBOM_URI="https://github.com/${REPOSITORY}/releases/download/${REF#refs/tags/}/builder-vm-${ARCH}.sbom.txt"
          cargo run --release -p mvm-build --example mvm-builder-pack-tool -- \
            --vmlinux "$STORE_PATH/vmlinux" --rootfs "$STORE_PATH/rootfs.ext4" \
            --arch "$ARCH" --channel stable --keyless \
            --identity "$IDENTITY" \
            --out-dir staging \
            --sbom "staging/builder-vm-${ARCH}.sbom.txt" \
            --sbom-uri "$SBOM_URI" \
            --revocation-channel "$REVOCATION_CHANNEL"
          mv staging/manifest.json "staging/builder-vm-${ARCH}.pack-manifest.json"

          # Keyless OIDC sign — no secret key needed. --new-bundle-format emits
          # the Sigstore bundle (with verificationMaterial) that the installed
          # binary's Rust verifier parses; the legacy --bundle format is not
          # accepted by that stack. The bundle carries the signature, the
          # short-lived cert, and the transparency-log inclusion proof.
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle "staging/builder-vm-${ARCH}.pack-manifest.json.bundle" \
            "staging/builder-vm-${ARCH}.pack-manifest.json"

      - name: Generate builder VM checksums
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd staging
          # Build the checksums list dynamically — sidecars are
          # optional, so only include what's actually present.
          # An array, not a space-joined string: the string form relies on word
          # splitting to become arguments, so a name containing a space would
          # split into two paths that do not exist.
          FILES=("builder-vm-vmlinux-${ARCH}" "builder-vm-rootfs-${ARCH}.ext4")
          [ -f "builder-vm-${ARCH}.cmdline.txt" ]   && FILES+=("builder-vm-${ARCH}.cmdline.txt")
          [ -f "builder-vm-${ARCH}.manifest.json" ] && FILES+=("builder-vm-${ARCH}.manifest.json")
          # The attested pack is optional (signing may be skipped or fail); only
          # checksum its files when they are actually present.
          if [ -f "builder-vm-${ARCH}.pack-manifest.json.bundle" ]; then
            FILES+=("builder-vm-${ARCH}.pack-manifest.json" "builder-vm-${ARCH}.pack-manifest.json.bundle" "builder-vm-${ARCH}.sbom.txt")
          fi
          sha256sum "${FILES[@]}" > "builder-vm-${ARCH}-checksums-sha256.txt"

      - name: Upload builder VM image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: builder-vm-image-${{ matrix.arch }}
          path: |
            staging/builder-vm-vmlinux-${{ matrix.arch }}
            staging/builder-vm-rootfs-${{ matrix.arch }}.ext4
            staging/builder-vm-${{ matrix.arch }}.cmdline.txt
            staging/builder-vm-${{ matrix.arch }}.manifest.json
            staging/builder-vm-${{ matrix.arch }}.pack-manifest.json
            staging/builder-vm-${{ matrix.arch }}.pack-manifest.json.bundle
            staging/builder-vm-${{ matrix.arch }}.sbom.txt
            staging/builder-vm-${{ matrix.arch }}-checksums-sha256.txt

  # Plan 74 W1.4b / ADR-018: the verity-sealed mvm runtime overlay
  # disk. Attached as `/dev/vdc` at every microVM boot;
  # `mvm-verity-init` mounts it at `/mvm/runtime` so the guest agent,
  # seccomp shim, and per-language SDK runtime libraries live in a
  # single mvm-controlled blob instead of being baked into every
  # per-image rootfs. Built per-arch from `nix/images/runtime-overlay/`.
  #
  # The host-side `RuntimeOverlayResolver`
  # (`crates/mvm-build/src/runtime_overlay.rs`) downloads one
  # arch-qualified tarball plus a tarball sha256 sidecar, then
  # installs the overlay's canonical files into
  # `~/.mvm/cache/runtime-overlay/<mvmctl-version>/<arch>/` and the six
  # verified OCI materialization shims into the versioned OCI guest cache.
  runtime-overlay-image:
    # Skipped on a dry-run dispatch (see builder-vm-image).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    strategy:
      # One arch's build must not cancel the other's. The sibling is a separate
      # artifact, and a transient failure on one runner used to take the other
      # down before it produced anything — which then read as two broken arches.
      # Publishing is still all-or-nothing: the completeness gate below refuses
      # a partial set, so letting both finish costs nothing and tells the truth
      # about which one actually failed.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build runtime overlay image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/runtime-overlay#packages.${SYSTEM}.default" \
            --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          mkdir -p "staging/runtime-overlay-${ARCH}"
          # cp -L so `overlay.*` resolve through nix-store symlinks
          # into the actual blobs; the artifact uploader doesn't
          # follow symlinks.
          cp -L "$STORE_PATH/overlay.ext4"     "staging/runtime-overlay-${ARCH}/overlay.ext4"
          cp -L "$STORE_PATH/overlay.verity"   "staging/runtime-overlay-${ARCH}/overlay.verity"
          cp -L "$STORE_PATH/overlay.roothash" "staging/runtime-overlay-${ARCH}/overlay.roothash"
          cp -L "$STORE_PATH/VERSION"          "staging/runtime-overlay-${ARCH}/VERSION"
          for bin in \
            mvm-oci-init mvm-guest-agent mvm-guest-netinit \
            mvm-egress-client mvm-oci-entrypoint mvm-verity-init; do
            cp -L "$STORE_PATH/guest-runtime/$bin" "staging/runtime-overlay-${ARCH}/$bin"
          done
          (
            cd "staging/runtime-overlay-${ARCH}"
            sha256sum \
              overlay.ext4 overlay.verity overlay.roothash VERSION \
              mvm-oci-init mvm-guest-agent mvm-guest-netinit \
              mvm-egress-client mvm-oci-entrypoint mvm-verity-init \
              > checksums-sha256.txt
          )
          tar -C "staging/runtime-overlay-${ARCH}" \
            -czf "staging/runtime-overlay-${ARCH}.tar.gz" \
            overlay.ext4 overlay.verity overlay.roothash VERSION \
            mvm-oci-init mvm-guest-agent mvm-guest-netinit \
            mvm-egress-client mvm-oci-entrypoint mvm-verity-init \
            checksums-sha256.txt
          (
            cd staging
            sha256sum "runtime-overlay-${ARCH}.tar.gz" \
              > "runtime-overlay-${ARCH}.tar.gz.sha256"
          )

      - name: Upload runtime overlay image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: runtime-overlay-image-${{ matrix.arch }}
          path: |
            staging/runtime-overlay-${{ matrix.arch }}.tar.gz
            staging/runtime-overlay-${{ matrix.arch }}.tar.gz.sha256

  # ADR-018: the optional glibc SDK-sidecar disk. Mounted read-only at
  # /mvm/sdk, and only for workloads whose signed plan binds an SDK-served
  # host service — so a workload that never calls one never pays for the glibc
  # closure. Built per-arch from the same `nix/images/runtime-overlay/` flake
  # as the overlay.
  #
  # The host-side downloader (`mvm_build::sdk_sidecar::download_sdk_sidecar`)
  # fetches one arch-qualified tarball plus its sha256 sidecar, and installs the
  # extracted canonical names (`sdk.ext4`, `VERSION`, `checksums-sha256.txt`)
  # into `~/.mvm/cache/sdk-sidecar/<mvmctl-version>/<arch>/`. The asset names
  # here are pinned against that Rust constructor by `tests/release_assets.rs`.
  #
  # Unlike the overlay job this does NOT regenerate the manifest: the
  # `sdk-sidecar-image` derivation writes its own `checksums-sha256.txt`, so
  # copying it through keeps the bytes the resolver verifies byte-identical to
  # the bytes Nix produced.
  sdk-sidecar-image:
    # Skipped on a dry-run dispatch (see builder-vm-image).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    strategy:
      # One arch's build must not cancel the other's. The sibling is a separate
      # artifact, and a transient failure on one runner used to take the other
      # down before it produced anything — which then read as two broken arches.
      # Publishing is still all-or-nothing: the completeness gate below refuses
      # a partial set, so letting both finish costs nothing and tells the truth
      # about which one actually failed.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build SDK sidecar image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/runtime-overlay#packages.${SYSTEM}.sdk-sidecar-image" \
            --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          mkdir -p "staging/sdk-sidecar-${ARCH}"
          # cp -L so the payload resolves through nix-store symlinks into the
          # actual blobs; the artifact uploader doesn't follow symlinks.
          cp -L "$STORE_PATH/sdk.ext4"             "staging/sdk-sidecar-${ARCH}/sdk.ext4"
          cp -L "$STORE_PATH/VERSION"              "staging/sdk-sidecar-${ARCH}/VERSION"
          cp -L "$STORE_PATH/checksums-sha256.txt" "staging/sdk-sidecar-${ARCH}/checksums-sha256.txt"
          tar -C "staging/sdk-sidecar-${ARCH}" \
            -czf "staging/sdk-sidecar-${ARCH}.tar.gz" \
            sdk.ext4 VERSION checksums-sha256.txt
          (
            cd staging
            sha256sum "sdk-sidecar-${ARCH}.tar.gz" \
              > "sdk-sidecar-${ARCH}.tar.gz.sha256"
          )

      - name: Upload SDK sidecar image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sdk-sidecar-image-${{ matrix.arch }}
          path: |
            staging/sdk-sidecar-${{ matrix.arch }}.tar.gz
            staging/sdk-sidecar-${{ matrix.arch }}.tar.gz.sha256

  # Plan 158: the bundled default microVM image `mvmctl up`/`exec` boots when
  # no --flake/--template/--image is given. Ships the PROD variant only
  # (sealed + verity-sealed rootfs); the dev variant is built locally in dev
  # mode, never published. `download_default_microvm_image` fetches these five
  # assets + the checksums.
  default-microvm:
    # Skipped on a dry-run dispatch (see builder-vm-image).
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    # This job mints a keyless (OIDC/Fulcio) signature over the attested
    # runtime pack manifest under the same release.yml@<tag> identity class as
    # builder-vm-image — gating it behind the same protected environment
    # constrains which ref can mint a valid signing identity.
    environment: boot-image-signing
    strategy:
      # One arch's build must not cancel the other's. The sibling is a separate
      # artifact, and a transient failure on one runner used to take the other
      # down before it produced anything — which then read as two broken arches.
      # Publishing is still all-or-nothing: the completeness gate below refuses
      # a partial set, so letting both finish costs nothing and tells the truth
      # about which one actually failed.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Build default microVM image (prod variant)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SYSTEM="${ARCH}-linux"
          nix build "./nix/images/default-tenant#packages.${SYSTEM}.default" \
            --impure --no-link --print-out-paths > /tmp/store-path.txt
          STORE_PATH=$(head -1 /tmp/store-path.txt)
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          mkdir -p staging
          cp -L "$STORE_PATH/vmlinux"         "staging/default-microvm-vmlinux-${ARCH}"
          cp -L "$STORE_PATH/rootfs.ext4"     "staging/default-microvm-rootfs-${ARCH}.ext4"
          cp -L "$STORE_PATH/rootfs.verity"   "staging/default-microvm-rootfs-${ARCH}.verity"
          cp -L "$STORE_PATH/rootfs.roothash" "staging/default-microvm-rootfs-${ARCH}.roothash"
          cp -L "$STORE_PATH/mvm-meta.json"   "staging/default-microvm-meta-${ARCH}.json"

      - name: Assert the staged rootfs has an exec'able /init
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # The publish path is checksums all the way down, and a checksum
          # cannot tell a good image from a faithfully-copied broken one. This
          # is the only step that opens the rootfs and reads the bytes the
          # kernel will exec. Runs before the image is uploaded, so a rootfs
          # that cannot boot never becomes a release asset.
          # debugfs ships in e2fsprogs, preinstalled on both runner images.
          # Install only if that ever stops being true: an apt round-trip on
          # the release critical path is a flake that fails the publish for a
          # reason having nothing to do with the image.
          command -v debugfs >/dev/null 2>&1 \
            || { sudo apt-get update && sudo apt-get install -y e2fsprogs; }
          bash nix/packaging/release/assert-init-shebang.sh \
            "staging/default-microvm-rootfs-${ARCH}.ext4" "staged ${ARCH}"
          bash nix/packaging/release/assert-kernel-format.sh \
            "staging/default-microvm-vmlinux-${ARCH}" "${ARCH}" "staged ${ARCH} kernel"
          # Runs on BOTH legs, unlike the boot gate below. Reading JSON needs no
          # KVM, so the one defect class that has actually shipped through the
          # aarch64 leg's blind spot — an incoherent sidecar — is caught on both.
          bash nix/packaging/release/assert-sidecar-coherent.sh \
            "staging/default-microvm-meta-${ARCH}.json" "staged ${ARCH} sidecar"

      # Nothing in this job ever started the image. Every gate below the build
      # is a checksum, a signature or a byte-level read, and none of those can
      # answer the only question a user asks of a boot image: does it boot. A
      # release shipped for five weeks whose guest panicked before userspace,
      # with every checksum verifying clean the whole time.
      #
      # x86_64 only: the aarch64 leg runs on ubuntu-24.04-arm, which has no
      # nested KVM and cannot boot a guest at all. That leg's coverage is the
      # static reads above — the /init shebang, the kernel format, and the
      # sidecar coherence check, each catching a class that has actually shipped
      # — and remains a stated compromise rather than a claim of equivalence: an
      # aarch64-only regression outside those classes still gets past. Closing
      # it needs an arm64 runner with KVM, which is infrastructure rather than
      # anything this file can express.
      # The boot gate runs `cargo test`, which builds mvmctl, whose build.rs
      # cross-compiles the embedded host binaries as static musl and needs the
      # pinned zig. Without it the gate fails before it ever starts a guest —
      # which reads as "the image does not boot" and is nothing of the kind.
      - uses: ./.github/actions/install-zigbuild
        if: matrix.arch == 'x86_64'

      - name: Install firecracker for the boot gate
        if: matrix.arch == 'x86_64'
        env:
          # Tracks `crates/mvm-core/src/config.rs::FC_VERSION_DEFAULT`. The
          # launch path passes `--enable-pci`, which older Firecracker rejects
          # before it creates its API socket.
          FC_VERSION: v1.14.1
        run: |
          set -euo pipefail
          curl -fL -o firecracker.tgz \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          tar -xzf firecracker.tgz
          sudo install -m 0755 "release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" /usr/bin/firecracker
          /usr/bin/firecracker --version

      - name: Grant /dev/kvm access for the boot gate
        if: matrix.arch == 'x86_64'
        # ubuntu-latest's /dev/kvm is root:kvm 0660 and the runner user is not
        # in the kvm group. The runner is ephemeral, so the looser mode is
        # confined to this job.
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm missing on this runner — the boot gate cannot run." >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      # Building the root package runs crates/mvm-cli/build.rs, which
      # cross-compiles the embedded host binaries and needs the pinned zig.
      # Without it the boot gate below dies at compile time, before it starts
      # a VM — which is how the first boot-image release shipped with no
      # x86_64 default-microvm assets while every static check passed.
      - uses: ./.github/actions/install-zigbuild
        if: matrix.arch == 'x86_64'

      # The prod rootfs resolves its agent from /mvm/runtime, which is the
      # runtime overlay attached as a second virtio-blk drive. It is built by a
      # sibling job on a different runner, so this one has to build its own
      # copy — the nix store is already warm from the image build above, so
      # this is a store lookup far more often than a build. Without it the
      # guest panics at `Attempted to kill init!` and the gate reports a broken
      # image when the image is fine and the harness was incomplete.
      - name: Build the runtime overlay for the boot gate
        if: matrix.arch == 'x86_64'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SYSTEM="${ARCH}-linux"
          OVERLAY_PATH=$(nix build "./nix/images/runtime-overlay#packages.${SYSTEM}.default" \
            --no-link --print-out-paths | head -1)
          mkdir -p overlay-staging
          # cp -L so `overlay.*` resolve through nix-store symlinks.
          cp -L "$OVERLAY_PATH/overlay.ext4"     overlay-staging/overlay.ext4
          cp -L "$OVERLAY_PATH/overlay.verity"   overlay-staging/overlay.verity
          cp -L "$OVERLAY_PATH/overlay.roothash" overlay-staging/overlay.roothash
          echo "MVM_RUNTIME_BOOT_OVERLAY_ROOTHASH=$(tr -d '[:space:]' < overlay-staging/overlay.roothash)" \
            >> "$GITHUB_ENV"

      # Build the raw initramfs from the same source revision as the staged
      # image. Publication belongs to release.yml's version train; this local
      # copy exists only so the pre-publish gate can exercise the sealed path.
      - name: Build the universal initramfs for the boot gate
        if: matrix.arch == 'x86_64'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          SYSTEM="${ARCH}-linux"
          INITRAMFS_PATH=$(nix build "./nix/images/initramfs#packages.${SYSTEM}.default" \
            --no-link --print-out-paths | head -1)
          # The runtime identifies the universal initramfs by its location in
          # the mvm cache. Keep the staged witness on that production path so
          # WorkloadRunner sends ActivateEnvironment instead of treating this
          # as a legacy per-rootfs initramfs.
          mkdir -p "$HOME/.mvm/cache/initramfs"
          cp -L "$INITRAMFS_PATH/initramfs.cpio.gz" \
            "$HOME/.mvm/cache/initramfs/initramfs.cpio.gz"

      - name: Boot the staged image before it becomes a release asset
        if: matrix.arch == 'x86_64'
        # Boots the artifact in `staging/`, never a published one — the whole
        # point is to refuse the upload rather than diagnose it afterwards.
        #
        # This is not a latency assertion. The budget is an order of magnitude
        # above the observed median and RUNS/CONCURRENT are 1, because the
        # question here is "does it reach userspace". Latency belongs to the
        # `boot-latency` lane, which has its own threshold and its own argument.
        env:
          ARCH: ${{ matrix.arch }}
          MVM_RUNTIME_BOOT_BENCH: "1"
          MVM_RUNTIME_BOOT_BACKEND: firecracker
          MVM_RUNTIME_BOOT_KERNEL: staging/default-microvm-vmlinux-x86_64
          MVM_RUNTIME_BOOT_ROOTFS: staging/default-microvm-rootfs-x86_64.ext4
          MVM_RUNTIME_BOOT_OVERLAY: overlay-staging/overlay.ext4
          MVM_RUNTIME_BOOT_OVERLAY_VERITY: overlay-staging/overlay.verity
          MVM_RUNTIME_BOOT_READY: guest-agent
          MVM_RUNTIME_BOOT_RUNS: "1"
          MVM_RUNTIME_BOOT_CONCURRENT: "1"
          MVM_RUNTIME_BOOT_BUDGET_MS: "60000"
        run: |
          set -euo pipefail
          # The runtime-overlay admission gate reads `mvm-meta.json` from the
          # rootfs's own directory and refuses to boot without it. The build
          # stages that sidecar under its arch-qualified asset name, so put a
          # copy back under the name the gate looks for.
          cp "staging/default-microvm-meta-${ARCH}.json" staging/mvm-meta.json
          cargo test --test runtime_boot_bench \
            prebuilt_runtime_image_boots_within_budget -- --exact --nocapture
          MVM_RUNTIME_BOOT_INITRD="$HOME/.mvm/cache/initramfs/initramfs.cpio.gz" \
          MVM_RUNTIME_BOOT_ROOTFS_VERITY="staging/default-microvm-rootfs-${ARCH}.verity" \
          MVM_RUNTIME_BOOT_ROOTFS_ROOTHASH="$(tr -d '[:space:]' < "staging/default-microvm-rootfs-${ARCH}.roothash")" \
            cargo test --test runtime_boot_bench \
              prebuilt_runtime_image_boots_within_budget -- --exact --nocapture

      - name: Dump VMM diagnostics on failure
        if: ${{ failure() && matrix.arch == 'x86_64' }}
        # Firecracker's stderr goes to `firecracker.log` in the per-VM state dir
        # and its console to `console.log`; neither reaches the job output.
        # Without this a refused publish surfaces only as "API socket did not
        # appear", which is a symptom and never the cause.
        run: |
          for d in "$HOME"/.mvm/vms/*/; do
            echo "===== $d ====="
            ls -la "$d" || true
            for f in firecracker.log console.log; do
              if [ -s "$d$f" ]; then
                echo "--- $f ---"; tail -50 "$d$f"
              fi
            done
          done

      - name: Generate default microVM SBOM
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Real store-path bill of materials for the default microVM closure —
          # the attested runtime pack manifest's SBOM reference hashes this
          # file's bytes.
          nix-store --query --requisites "$STORE_PATH" > "staging/default-microvm-${ARCH}.sbom.txt"

      - name: Produce and keyless-sign attested runtime pack manifest
        # The runtime pack is an instant-launch accelerator, never a hard
        # dependency. A Fulcio/Rekor/OIDC hiccup must not block the plain
        # vmlinux/rootfs/verity publish above, so a signing failure here is
        # tolerated: the job continues, no pack ships, and installed binaries
        # fall back to the plain hash-verified download + verity-sealed boot.
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # A runtime pack's keyless identity is the version tag ref cosign
          # embeds in the certificate SAN and a released mvmctl reconstructs
          # when verifying. Skip production unless the ref is a version tag
          # whose version equals the crate version; anything else yields an
          # identity no installed binary can reconstruct, so it would fail-open
          # to the plain download. Skipping keeps that explicit.
          if [[ "${REF}" != refs/tags/v* ]]; then
            echo "::notice::${REF} is not a version tag; skipping attested runtime pack."
            exit 0
          fi
          TAG_VERSION="${REF#refs/tags/v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="mvm-cli") | .version')"
          if [[ "${TAG_VERSION}" != "${CRATE_VERSION}" ]]; then
            echo "::warning::tag ${REF} does not match crate version v${CRATE_VERSION}; installed binaries could not verify this pack — skipping attested runtime pack."
            exit 0
          fi
          IDENTITY="https://github.com/${REPOSITORY}/.github/workflows/release.yml@${REF}"
          REVOCATION_CHANNEL="https://github.com/${REPOSITORY}/releases/download/revocations/runtime-pack-revocations.json"
          SBOM_URI="https://github.com/${REPOSITORY}/releases/download/${REF#refs/tags/}/default-microvm-${ARCH}.sbom.txt"
          cargo run --release -p mvm-build --example mvm-builder-pack-tool -- \
            --kind runtime \
            --vmlinux "$STORE_PATH/vmlinux" --rootfs "$STORE_PATH/rootfs.ext4" \
            --verity "$STORE_PATH/rootfs.verity" --roothash "$STORE_PATH/rootfs.roothash" \
            --arch "$ARCH" --channel stable --keyless \
            --identity "$IDENTITY" \
            --out-dir staging \
            --sbom "staging/default-microvm-${ARCH}.sbom.txt" \
            --sbom-uri "$SBOM_URI" \
            --revocation-channel "$REVOCATION_CHANNEL"
          mv staging/manifest.json "staging/default-microvm-${ARCH}.pack-manifest.json"

          # Keyless OIDC sign — --new-bundle-format emits the Sigstore bundle
          # (with verificationMaterial) the installed binary's Rust verifier
          # parses; the legacy --bundle format is not accepted by that stack.
          cosign sign-blob \
            --yes \
            --new-bundle-format \
            --bundle "staging/default-microvm-${ARCH}.pack-manifest.json.bundle" \
            "staging/default-microvm-${ARCH}.pack-manifest.json"

      - name: Generate default microVM checksums
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd staging
          FILES=(
            "default-microvm-vmlinux-${ARCH}"
            "default-microvm-rootfs-${ARCH}.ext4"
            "default-microvm-rootfs-${ARCH}.verity"
            "default-microvm-rootfs-${ARCH}.roothash"
            "default-microvm-meta-${ARCH}.json"
          )
          # The attested pack is optional (signing may be skipped or fail); only
          # checksum its files when they are actually present.
          if [ -f "default-microvm-${ARCH}.pack-manifest.json.bundle" ]; then
            FILES+=("default-microvm-${ARCH}.pack-manifest.json" "default-microvm-${ARCH}.pack-manifest.json.bundle" "default-microvm-${ARCH}.sbom.txt")
          fi
          sha256sum "${FILES[@]}" > "default-microvm-${ARCH}-checksums-sha256.txt"

      - name: Upload default microVM image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: default-microvm-${{ matrix.arch }}
          path: |
            staging/default-microvm-vmlinux-${{ matrix.arch }}
            staging/default-microvm-rootfs-${{ matrix.arch }}.ext4
            staging/default-microvm-rootfs-${{ matrix.arch }}.verity
            staging/default-microvm-rootfs-${{ matrix.arch }}.roothash
            staging/default-microvm-meta-${{ matrix.arch }}.json
            staging/default-microvm-${{ matrix.arch }}.pack-manifest.json
            staging/default-microvm-${{ matrix.arch }}.pack-manifest.json.bundle
            staging/default-microvm-${{ matrix.arch }}.sbom.txt
            staging/default-microvm-${{ matrix.arch }}-checksums-sha256.txt

  # Browser QEMU is an immutable runtime pack, not a website build input. Build
  # it on the boot-image release cadence so a docs-only publish only downloads
  # and verifies these bytes instead of compiling QEMU through Emscripten again.
  qemu-wasm-site-pack:
    if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build QEMU-WASM browser pack
        run: |
          set -euo pipefail
          nix build ./nix#qemu-wasm-smoke-pack
          mkdir -p staging
          tar -C result -czf staging/qemu-wasm-smoke-pack.tar.gz .
          (
            cd staging
            sha256sum qemu-wasm-smoke-pack.tar.gz \
              > qemu-wasm-smoke-pack.tar.gz.sha256
          )

      - name: Upload QEMU-WASM browser pack
        uses: actions/upload-artifact@v7
        with:
          name: qemu-wasm-site-pack
          path: |
            staging/qemu-wasm-smoke-pack.tar.gz
            staging/qemu-wasm-smoke-pack.tar.gz.sha256

  publish-boot-image:
    needs: [builder-vm-image, runtime-overlay-image, sdk-sidecar-image, default-microvm, qemu-wasm-site-pack]
    # `!cancelled()` rather than plain success: the five image jobs are
    # independent artifacts and one arch's Nix build failing must not strand
    # the others, exactly as it does not strand the binary release next door.
    # It reaches this job so the completeness check below can name every
    # missing asset in one report instead of one job conclusion at a time —
    # it does NOT mean a partial set publishes. It used to: the first
    # boot-image release went out carrying one arch and no builder VM, and
    # the CLI release next door then treated its existence as sufficient.
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.inputs.dry_run == 'false') }}
    environment: boot-image-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Sign the boot image archives and checksum manifests
        shell: bash
        # A checksum manifest is what every downloader anchors on: it hashes
        # the artifact and compares against the manifest, so an unsigned
        # manifest lets whoever can swap an artifact swap its recorded digest
        # too. The image blobs (kernel, rootfs, verity sidecar) are not
        # tarballs and carry no signature of their own — the manifest is their
        # only anchor.
        #
        # These bundles carry THIS workflow's keyless identity, which no
        # shipped binary trusts yet: the compiled-in trust list still names
        # the CLI release workflow at a `v*` tag. They are provenance for the
        # boot-image train. The bytes an installed mvmctl actually verifies
        # are the copies the CLI release re-signs under the identity it does
        # trust — see the dual-publish step in release.yml.
        #
        # One bundle format everywhere: --new-bundle-format, the Sigstore
        # bundle carrying verificationMaterial, which is the only shape the
        # in-binary Rust sigstore stack parses.
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Globs, not literals: every one of these comes from a best-effort
          # image job, so nullglob drops what did not build instead of failing
          # the publish on a name that was never written.
          for blob in \
            artifacts/runtime-overlay-*.tar.gz \
            artifacts/sdk-sidecar-*.tar.gz \
            artifacts/qemu-wasm-smoke-pack.tar.gz.sha256 \
            artifacts/builder-vm-*-checksums-sha256.txt \
            artifacts/default-microvm-*-checksums-sha256.txt; do
            cosign sign-blob \
              --yes \
              --new-bundle-format \
              --bundle "${blob}.bundle" \
              "${blob}"
            echo "Signed: ${blob}"
          done

      # release.yml attaches the newest boot-image release's assets to the CLI
      # release and hard-fails when no such release exists — but it checks only
      # that one EXISTS, not that it is complete. So a partial release here
      # publishes a CLI release that is green and unusable: no x86_64 image
      # means every x86_64 fresh install 404s on first boot, and no builder-vm
      # assets means download_builder_vm_image 404s for everyone. Refuse here,
      # where the missing pieces are still named, rather than downstream where
      # they are silence.
      - name: Assert every arch produced its full asset set
        run: |
          set -euo pipefail
          missing=()
          for arch in aarch64 x86_64; do
            for f in \
              "default-microvm-vmlinux-${arch}" \
              "default-microvm-rootfs-${arch}.ext4" \
              "default-microvm-meta-${arch}.json" \
              "default-microvm-${arch}-checksums-sha256.txt" \
              "builder-vm-vmlinux-${arch}" \
              "builder-vm-rootfs-${arch}.ext4" \
              "builder-vm-${arch}-checksums-sha256.txt" \
              "runtime-overlay-${arch}.tar.gz" \
              "sdk-sidecar-${arch}.tar.gz"; do
              [ -s "artifacts/${f}" ] || missing+=("${f}")
            done
          done
          for f in \
            qemu-wasm-smoke-pack.tar.gz \
            qemu-wasm-smoke-pack.tar.gz.sha256; do
            [ -s "artifacts/${f}" ] || missing+=("${f}")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::boot image release is incomplete — refusing to publish. Missing: ${missing[*]}" >&2
            echo "Re-run the failed image job(s); the successful ones are already uploaded as run artifacts." >&2
            exit 1
          fi
          echo "All required boot image assets present for both arches."

      - name: Create boot image release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # nullglob: an image job that failed contributes no files, and its
          # unmatched globs drop out of the list rather than reaching
          # `gh release create` literally and erroring.
          shopt -s nullglob
          assets=(
            artifacts/builder-vm-vmlinux-*
            artifacts/builder-vm-rootfs-*
            artifacts/builder-vm-*.cmdline.txt
            artifacts/builder-vm-*.manifest.json
            artifacts/builder-vm-*.pack-manifest.json
            artifacts/builder-vm-*.pack-manifest.json.bundle
            artifacts/builder-vm-*.sbom.txt
            artifacts/builder-vm-*-checksums-sha256.txt
            artifacts/builder-vm-*-checksums-sha256.txt.bundle
            artifacts/runtime-overlay-*.tar.gz
            artifacts/runtime-overlay-*.tar.gz.sha256
            artifacts/runtime-overlay-*.tar.gz.bundle
            artifacts/sdk-sidecar-*.tar.gz
            artifacts/sdk-sidecar-*.tar.gz.sha256
            artifacts/sdk-sidecar-*.tar.gz.bundle
            artifacts/qemu-wasm-smoke-pack.tar.gz
            artifacts/qemu-wasm-smoke-pack.tar.gz.sha256
            artifacts/qemu-wasm-smoke-pack.tar.gz.sha256.bundle
            artifacts/default-microvm-vmlinux-*
            artifacts/default-microvm-rootfs-*
            artifacts/default-microvm-meta-*
            artifacts/default-microvm-*.pack-manifest.json
            artifacts/default-microvm-*.pack-manifest.json.bundle
            artifacts/default-microvm-*.sbom.txt
            artifacts/default-microvm-*-checksums-sha256.txt
            artifacts/default-microvm-*-checksums-sha256.txt.bundle
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::every image job failed — there is nothing to publish under ${TAG_NAME}" >&2
            exit 1
          fi
          RELEASE_NOTES_PREFIX="$(cat nix/packaging/release/runtime-overlay-operational-note.md)"
          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            --notes "${RELEASE_NOTES_PREFIX}" \
            "${assets[@]}"
