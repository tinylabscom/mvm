name: Publish SDK to npm

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Build + smoke only; skip the npm upload"
        required: true
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false

jobs:
  hostlib:
    # The package's native/ directory carries the host library for every
    # supported platform file name, and the loader picks by platform — so
    # each runner builds its own library and the pack job assembles them.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the in-process host library for this platform
        shell: bash
        run: |
          set -euo pipefail
          HOSTLIB_EXT="so"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            HOSTLIB_EXT="dylib"
          fi
          cargo build --release -p mvm-hostlib
          SRC="$(find target/release -maxdepth 1 -name "libmvm_hostlib.${HOSTLIB_EXT}" -print -quit)"
          test -n "${SRC}" || { echo "::error::libmvm_hostlib.${HOSTLIB_EXT} was not built" >&2; exit 1; }
          echo "built ${SRC}"

      - name: Upload the platform library
        uses: actions/upload-artifact@v7
        with:
          name: hostlib-${{ matrix.runner }}
          path: target/release/libmvm_hostlib.*
          retention-days: 1

  build:
    needs: hostlib
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: crates/mvm-sdk/sdks/typescript
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SDK release manifest and package metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path(".").resolve().parents[1]
          release = tomllib.loads((root / "sdks" / "release.toml").read_text())
          package = json.loads((root / "sdks" / "typescript" / "package.json").read_text())

          manifest_version = release["version"]
          package_version = package["version"]
          package_name = package["name"]
          package_path = "sdks/typescript"

          assert release["typescript"]["name"] == package_name, (
              f"sdks/release.toml typescript.name ({release['typescript']['name']}) != "
              f"package.json name ({package_name})"
          )
          assert release["typescript"]["path"] == package_path, (
              f"sdks/release.toml typescript.path ({release['typescript']['path']}) != {package_path}"
          )
          assert manifest_version == package_version, (
              f"sdks/release.toml version ({manifest_version}) != "
              f"sdks/typescript/package.json version ({package_version})"
          )
          PY

      # An action's `path` resolves against the workspace root, not the
      # job's default working directory, so it names the package directory
      # the run steps below read from.
      - name: Download the platform libraries
        uses: actions/download-artifact@v8
        with:
          pattern: hostlib-*
          path: crates/mvm-sdk/sdks/typescript/native-downloads
          merge-multiple: true

      - name: Place the libraries in native/ and verify both platforms
        run: |
          set -euo pipefail
          mkdir -p native
          cp native-downloads/libmvm_hostlib.* native/
          test -f native/libmvm_hostlib.so || { echo "::error::the Linux host library is missing" >&2; exit 1; }
          test -f native/libmvm_hostlib.dylib || { echo "::error::the macOS host library is missing" >&2; exit 1; }
          ls -la native/

      - name: Install + build
        run: |
          npm ci
          npm run build

      - name: Pack npm artifact
        # native/ was assembled from both platform artifacts above; npm
        # pack fails closed here if a library is missing because the
        # place step already refused to continue without both.
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      - name: Smoke install packed artifact
        run: |
          TARBALL="$(find "$PWD/dist" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"
          npm init -y >/dev/null 2>&1
          npm install "$TARBALL" >/dev/null
          node --input-type=module - <<'EOF'
          import { createRequire } from "node:module";
          import { existsSync } from "node:fs";
          import { fileURLToPath } from "node:url";
          import path from "node:path";
          import { Sandbox } from "@runmvm/mvm";
          if (typeof Sandbox?.create !== "function") {
            throw new Error("packed SDK did not expose Sandbox.create");
          }
          // The packed package must carry this platform's host library.
          const require = createRequire(import.meta.url);
          const pkgRoot = path.dirname(path.dirname(require.resolve("@runmvm/mvm/package.json")));
          const libName = process.platform === "darwin" ? "libmvm_hostlib.dylib" : "libmvm_hostlib.so";
          const libPath = path.join(pkgRoot, "native", libName);
          if (!existsSync(libPath)) {
            throw new Error(`packed SDK is missing ${libPath}`);
          }
          EOF

      - name: Upload packed artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-dist
          path: crates/mvm-sdk/sdks/typescript/dist/*.tgz
          retention-days: 1

  publish:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check token
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing NPM_TOKEN secret."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Download packed artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-dist
          path: dist

      - name: Publish to npm
        run: npm publish dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
