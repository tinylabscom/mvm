name: Publish SDK to PyPI

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Build + smoke only; skip the PyPI upload"
        required: true
        type: boolean

jobs:
  build:
    # One wheel per platform: the wheel embeds the platform's host
    # library, so its tag must match the machine that built it. The sdist
    # is built once, on Linux.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate SDK release manifest and package metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path("crates/mvm-sdk")
          release = tomllib.loads((root / "sdks" / "release.toml").read_text())
          project = tomllib.loads((root / "sdks" / "python" / "pyproject.toml").read_text())

          manifest_version = release["version"]
          package_version = project["project"]["version"]
          package_name = project["project"]["name"]
          package_path = "sdks/python"

          assert release["python"]["name"] == package_name, (
              f"sdks/release.toml python.name ({release['python']['name']}) != "
              f"pyproject project.name ({package_name})"
          )
          assert release["python"]["path"] == package_path, (
              f"sdks/release.toml python.path ({release['python']['path']}) != {package_path}"
          )
          assert manifest_version == package_version, (
              f"sdks/release.toml version ({manifest_version}) != "
              f"sdks/python/pyproject.toml version ({package_version})"
          )
          PY

      - name: Build the in-process host library and embed it in the package
        shell: bash
        run: |
          set -euo pipefail
          HOSTLIB_EXT="so"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            HOSTLIB_EXT="dylib"
          fi
          cargo build --release -p mvm-hostlib
          SRC="$(find target/release -maxdepth 1 -name "libmvm_hostlib.${HOSTLIB_EXT}" -print -quit)"
          test -n "${SRC}" || { echo "::error::libmvm_hostlib.${HOSTLIB_EXT} was not built" >&2; exit 1; }
          mkdir -p crates/mvm-sdk/sdks/python/mvm/_native
          cp "${SRC}" crates/mvm-sdk/sdks/python/mvm/_native/
          echo "embedded ${SRC}"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            python -m build crates/mvm-sdk/sdks/python --outdir dist
          else
            # One sdist, from Linux; every runner builds its own wheel.
            python -m build --wheel crates/mvm-sdk/sdks/python --outdir dist
          fi
          python -m twine check dist/*

      - name: Smoke install built wheel
        shell: bash
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import pathlib
          import mvm
          assert mvm.__name__ == "mvm"
          # The wheel must carry the host library: a platform wheel that
          # installed without it would leave the SDK without its transport.
          native = pathlib.Path(mvm.__file__).parent / "_native"
          libs = [p for p in native.iterdir() if p.name.startswith("libmvm_hostlib")]
          assert libs, f"wheel installed without a host library in {native}"
          print("smoke install passed; packaged library:", libs[0].name)
          PY

      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/*
          retention-days: 1

  publish:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
