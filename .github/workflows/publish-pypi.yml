name: Publish SDK to PyPI

on:
  workflow_call:
    inputs:
      dry_run:
        description: "Build + smoke only; skip the PyPI upload"
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SDK release manifest and package metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          import tomllib

          root = pathlib.Path("crates/mvm-sdk")
          release = tomllib.loads((root / "sdks" / "release.toml").read_text())
          project = tomllib.loads((root / "sdks" / "python" / "pyproject.toml").read_text())

          manifest_version = release["version"]
          package_version = project["project"]["version"]
          package_name = project["project"]["name"]
          package_path = "sdks/python"

          assert release["python"]["name"] == package_name, (
              f"sdks/release.toml python.name ({release['python']['name']}) != "
              f"pyproject project.name ({package_name})"
          )
          assert release["python"]["path"] == package_path, (
              f"sdks/release.toml python.path ({release['python']['path']}) != {package_path}"
          )
          assert manifest_version == package_version, (
              f"sdks/release.toml version ({manifest_version}) != "
              f"sdks/python/pyproject.toml version ({package_version})"
          )
          PY

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build crates/mvm-sdk/sdks/python --outdir dist
          python -m twine check dist/*

      - name: Smoke install built wheel
        run: |
          python -m venv .venv-smoke
          . .venv-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'PY'
          import mvm
          assert mvm.__name__ == "mvm"
          PY

      - name: Upload built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: dist/*
          retention-days: 1

  publish:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: dist

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
