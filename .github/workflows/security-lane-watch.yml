name: Security lane watch

# The Security workflow runs on release tags, a nightly cron, and manual
# dispatch — never on a pull request. Nothing surfaces a failure, so a red
# lane is invisible until somebody thinks to read run history. That is not
# hypothetical: cargo-deny, cargo-audit, the fuzz lane, the flake-lock check
# and builder-VM reproducibility were all red for six consecutive nights
# before anyone noticed, and three of those five back numbered security
# claims (ADR-001). A claim keeps a green ledger entry while its only
# evidence is failing.
#
# This watches Security instead of living inside it. Two reasons:
#
#   1. `workflow_run` fires after the whole run completes, so there is no
#      20-entry `needs:` list to keep in sync with the job graph.
#   2. It reads each job's real conclusion from the API rather than the
#      workflow's aggregate status. A job marked `continue-on-error: true`
#      never fails the workflow, so an `if: failure()` guard would not fire
#      for it. The API still reports that job as failed, and this reports it
#      too. No job in security.yml carries that marking today — the
#      mutation-witness lane used to and this comment went on naming it for
#      months after it stopped — but the API-reading approach costs nothing
#      and does not have to be revisited when one does.
#
# Reading the API was necessary and, for a fortnight, not sufficient: a
# guard above the read short-circuited whenever the run concluded
# `cancelled`, which Actions does whenever any one job is cancelled — a
# timed-out mutation shard included. The verdict now lives in
# scripts/security-lane-verdict.sh, under test, because that contradiction
# was invisible in the YAML and no assertion on the workflow text would
# have found it.
#
# Failure opens or updates one tracking issue; a clean run closes it. The
# issue is the enforcement surface, not a merge block: these lanes do not
# run on PRs, so there is nothing to block.

on:
  workflow_run:
    workflows: ["Security"]
    types: [completed]

permissions:
  contents: read
  issues: write # opens/updates/closes the tracking issue
  actions: read # reads the watched run's per-job conclusions

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: Report failing security lanes
    # Manual dispatch has an operator watching the run; the cron and the
    # release-tag gate do not.
    if: >-
      github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # `workflow_run` checks out the default branch, not the triggering
      # run's ref, so the verdict logic is always the reviewed copy.
      - uses: actions/checkout@v6

      - name: Collect failing jobs and open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TITLE: "Security lane is red"
        run: |
          set -euo pipefail

          # Per-job conclusions, not the run's aggregate. Two reasons, and
          # the second cost this lane a fortnight of silence:
          #
          #   1. A continue-on-error job leaves the run green while
          #      reporting its own failure here.
          #   2. Actions concludes the whole RUN `cancelled` when any single
          #      job is — including a job killed by its own
          #      `timeout-minutes`. Reading the run's conclusion therefore
          #      throws away every verdict its other thirty jobs reached.
          #
          # scripts/security-lane-verdict.sh owns that decision and is
          # tested against the real payloads of the runs that went
          # unreported. Exit 3 means no job reached a verdict at all, which
          # is what an operator cancelling the run looks like.
          set +e
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            | scripts/security-lane-verdict.sh > failing.md
          verdict=$?
          set -e

          if [ "$verdict" -eq 3 ]; then
            echo "Security run $RUN_ID collected no per-job verdict; nothing to report."
            exit 0
          fi
          if [ "$verdict" -ne 0 ]; then
            echo "::error::could not read the verdict of Security run $RUN_ID" >&2
            exit 1
          fi

          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ ! -s failing.md ]; then
            if [ -n "$EXISTING" ]; then
              # Backticks here are markdown, not command substitution; %s carries the values.
              # shellcheck disable=SC2016
              printf 'Security run [%s](%s) on `%s` is green again — closing.\n' \
                "$RUN_ID" "$RUN_URL" "$HEAD_SHA" > body.md
              gh issue comment "$EXISTING" --repo "$REPO" --body-file body.md
              gh issue close "$EXISTING" --repo "$REPO"
            fi
            echo "Security run $RUN_ID: all jobs green."
            exit 0
          fi

          {
            # Backticks here are markdown, not command substitution; %s carries the values.
            # shellcheck disable=SC2016
            printf 'The `Security` workflow (%s) failed on `%s`.\n\n' "$RUN_EVENT" "$HEAD_SHA"
            printf 'Run: %s\n\n' "$RUN_URL"
            printf 'Failing or unfinished jobs:\n\n'
            cat failing.md
            printf '\nThese lanes do not run on pull requests, so a failure here is\n'
            printf 'invisible until someone reads run history. Several of them are the\n'
            # Backticks here are markdown, not command substitution; %s carries the values.
            # shellcheck disable=SC2016
            printf 'only witness for a numbered claim in `specs/adrs/001-microvm-security-posture.md`\n'
            printf '— while a lane is red, that claim has no live evidence behind it.\n'
          } > body.md

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file body.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file body.md
          fi
