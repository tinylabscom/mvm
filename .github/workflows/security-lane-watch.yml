name: Security lane watch

# These workflows run on tags, cron and dispatch, never on a pull request, so
# a red lane is otherwise invisible while its claim keeps a green ledger entry.
# This reads each job's real conclusion (scripts/security-lane-verdict.sh, under
# test) from `workflow_run`, so continue-on-error jobs and runs concluded
# `cancelled` by one timed-out job are still reported. Failure opens or updates
# one tracking issue and a clean run comments on it. It never blocks a merge.

on:
  workflow_run:
    workflows: ["Security", "Pack signing smoke"]
    types: [completed]

permissions:
  contents: read
  issues: write # opens/updates the tracking issue; a pull request closes it
  actions: read # reads the watched run's per-job conclusions

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    name: Report failing security lanes
    # A feature-branch dispatch is exploratory and must not reconcile the
    # repository-wide alert. A default-branch dispatch is the supported
    # recovery run after a fix lands, so it carries the same authority as the
    # schedule and release-tag gate.
    if: >-
      github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # `workflow_run` checks out the default branch, not the triggering
      # run's ref, so the verdict logic is always the reviewed copy.
      - uses: actions/checkout@v6

      - name: Collect failing jobs and open or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WATCHED: ${{ github.event.workflow_run.name }}
          TITLE: "${{ github.event.workflow_run.name }} lane is red"
        run: |
          set -euo pipefail

          # Actions expressions compare strings without case sensitivity, but
          # Git refs are case-sensitive. Keep this trust decision in the shell:
          # `Main` must not gain the authority of default branch `main`.
          if [ "$RUN_EVENT" = workflow_dispatch ] && [ "$HEAD_BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "$WATCHED manual run on non-default branch $HEAD_BRANCH; not reconciling the repository alert."
            exit 0
          fi

          # Per-job conclusions, not the run's aggregate. Two reasons, and
          # the second cost this lane a fortnight of silence:
          #
          #   1. A continue-on-error job leaves the run green while
          #      reporting its own failure here.
          #   2. Actions concludes the whole RUN `cancelled` when any single
          #      job is — including a job killed by its own
          #      `timeout-minutes`. Reading the run's conclusion therefore
          #      throws away every verdict its other thirty jobs reached.
          #
          # scripts/security-lane-verdict.sh owns that decision and is
          # tested against the real payloads of the runs that went
          # unreported. Exit 3 means no job reached a verdict at all, which
          # is what an operator cancelling the run looks like.
          set +e
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            | scripts/security-lane-verdict.sh > failing.md
          verdict=$?
          set -e

          if [ "$verdict" -eq 3 ]; then
            echo "$WATCHED run $RUN_ID collected no per-job verdict; nothing to report."
            exit 0
          fi
          if [ "$verdict" -ne 0 ]; then
            echo "::error::could not read the verdict of $WATCHED run $RUN_ID" >&2
            exit 1
          fi

          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')

          if [ ! -s failing.md ]; then
            if [ -n "$EXISTING" ]; then
              # Backticks here are markdown, not command substitution; %s carries the values.
              # shellcheck disable=SC2016
              printf '%s run [%s](%s) on `%s` is green again. Close this issue with a pull request.\n' \
                "$WATCHED" "$RUN_ID" "$RUN_URL" "$HEAD_SHA" > body.md
              gh issue comment "$EXISTING" --repo "$REPO" --body-file body.md
            fi
            echo "$WATCHED run $RUN_ID: all jobs green."
            exit 0
          fi

          {
            # Backticks here are markdown, not command substitution; %s carries the values.
            # shellcheck disable=SC2016
            printf 'The `%s` workflow (%s) failed on `%s`.\n\n' "$WATCHED" "$RUN_EVENT" "$HEAD_SHA"
            printf 'Run: %s\n\n' "$RUN_URL"
            printf 'Failing or unfinished jobs:\n\n'
            cat failing.md
            printf '\nThese lanes do not run on pull requests, so a failure here is\n'
            printf 'invisible until someone reads run history. Several of them are the\n'
            # Backticks here are markdown, not command substitution; %s carries the values.
            # shellcheck disable=SC2016
            printf 'only witness for a numbered claim in `specs/adrs/001-microvm-security-posture.md`\n'
            printf '— while a lane is red, that claim has no live evidence behind it.\n'
          } > body.md

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file body.md
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file body.md
          fi
