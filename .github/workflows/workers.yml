name: Deploy site to Cloudflare Workers

# Deploy after website source lands on main. Published releases and manual
# dispatch remain supported so release publishing and operator retries keep the
# same deployment path. Product tag pushes are dispatched by release.yml only
# after the release assets exist.
on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "web/mvm-demo/**"
      - "web/mvm-demo-guest/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:
    inputs:
      install_version:
        description: Stable product release to bake into the deployed installer
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cloudflare-account:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare account credentials
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.0"
          command: whoami

  deploy:
    needs: cloudflare-account
    environment:
      name: cloudflare-workers
      url: ${{ steps.deployment.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Bake the published installer version and trust anchors
        if: ${{ inputs.install_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_VERSION: ${{ inputs.install_version }}
        run: |
          set -euo pipefail
          if [[ ! "${INSTALL_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::installer default must be a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          sed -i -E \
            "s/^DEFAULT_VERSION=\"v[^\"]+\"/DEFAULT_VERSION=\"${INSTALL_VERSION}\"/" \
            install.sh
          grep -qxF "DEFAULT_VERSION=\"${INSTALL_VERSION}\"" install.sh

          trust_dir="$(mktemp -d)"
          trap 'rm -rf "${trust_dir}"' EXIT
          gh release download "${INSTALL_VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'checksums-sha256.txt*' \
            --dir "${trust_dir}"
          cosign verify-blob \
            --bundle "${trust_dir}/checksums-sha256.txt.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${INSTALL_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${trust_dir}/checksums-sha256.txt"

          for target_and_variable in \
            "aarch64-apple-darwin:DEFAULT_ARCHIVE_SHA256_AARCH64_APPLE_DARWIN" \
            "x86_64-unknown-linux-gnu:DEFAULT_ARCHIVE_SHA256_X86_64_UNKNOWN_LINUX_GNU" \
            "aarch64-unknown-linux-gnu:DEFAULT_ARCHIVE_SHA256_AARCH64_UNKNOWN_LINUX_GNU"
          do
            target="${target_and_variable%%:*}"
            variable="${target_and_variable#*:}"
            archive="mvmctl-${target}.tar.gz"
            digest="$(awk -v archive="${archive}" '$2 == archive { print $1 }' "${trust_dir}/checksums-sha256.txt")"
            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::release ${INSTALL_VERSION} has no valid SHA-256 for ${archive}" >&2
              exit 1
            fi
            sed -i -E "s/^${variable}=\"[0-9a-f]*\"/${variable}=\"${digest}\"/" install.sh
            grep -qxF "${variable}=\"${digest}\"" install.sh
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: public/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: public/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          # Two targets, two crates: `wasm-pack` builds the browser shim for
          # wasm32-unknown-unknown, and `web/mvm-demo-guest/build.sh` builds the
          # demo guest for wasm32-wasip1. Installing only the first fails the
          # second with `can't find crate for std`, which reads like a toolchain
          # problem rather than a missing target.
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Download verified WebLinux runtime pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_IDENTITY_REGEXP: "^https://github.com/${{ github.repository }}/.github/workflows/release-boot-image.yml@refs/tags/boot-image/v.*$"
          COSIGN_OIDC_ISSUER: "https://token.actions.githubusercontent.com"
        run: |
          set -euo pipefail
          # The locked pin, not the newest published release. Scanning the
          # release list and taking the highest version made what this site
          # deploys a property of whoever published last, which is exactly the
          # selection images.lock exists to remove.
          BOOT_TAG="$(./scripts/locked-image-tag.sh)"

          # A boot-image release cut before the pack job existed carries every
          # other asset and none of these. `gh release download` reports that as
          # `no assets match the file pattern`, which reads like a typo in the
          # pattern rather than a release that needs re-cutting.
          #
          # No `-r` on `gh --jq`: it already prints a string result raw, and gh
          # has no such flag. Passing one consumes `--jq`'s value, demoting the
          # real expression to a positional argument, and gh rejects the whole
          # invocation with `unknown command "<the entire jq program>"`.
          ASSETS="$(gh release view "${BOOT_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name')"
          if ! printf '%s\n' "${ASSETS}" | grep -qxF 'qemu-wasm-smoke-pack.tar.gz'; then
            echo "::error::${BOOT_TAG} is the tag pinned by images.lock and carries no qemu-wasm-smoke-pack.tar.gz, so the WebLinux demo cannot be staged. Cut a new image tag from a commit whose release-boot-image.yml builds the pack, advance crates/mvm-core/images.lock to it, then re-run this deploy." >&2
            exit 1
          fi

          gh release download "${BOOT_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'qemu-wasm-smoke-pack.tar.gz*'
          cosign verify-blob \
            --bundle qemu-wasm-smoke-pack.tar.gz.sha256.bundle \
            --certificate-identity-regexp "${COSIGN_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "${COSIGN_OIDC_ISSUER}" \
            qemu-wasm-smoke-pack.tar.gz.sha256
          sha256sum -c qemu-wasm-smoke-pack.tar.gz.sha256
          mkdir qemu-wasm-smoke-pack
          tar -xzf qemu-wasm-smoke-pack.tar.gz -C qemu-wasm-smoke-pack
          ./web/weblinux-demo/build.sh qemu-wasm-smoke-pack

      - name: Build wasm demo
        working-directory: web/mvm-demo
        run: ./build.sh

      - name: Install dependencies
        working-directory: public
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        working-directory: public
        run: pnpm build

      - name: Verify WebLinux bundle is complete
        run: node public/scripts/check-weblinux-deploy-assets.mjs public/dist

      - name: Verify cross-origin isolation headers are staged
        run: |
          if [ ! -f public/dist/_headers ]; then
            echo "ERROR: public/dist/_headers is missing; Cloudflare Workers will not send COOP/COEP headers." >&2
            exit 1
          fi
          echo "OK: public/dist/_headers present"

      - name: Deploy to Cloudflare Workers
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: public
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # `_headers` is inert unless the host reads it, so the only proof that
      # this deployment is cross-origin isolated — and therefore that the
      # WebLinux demo has a SharedArrayBuffer — is the wire. Checked against
      # the deployment URL rather than the production domain: this step can
      # only speak for what it just published. Whether users reach it is a DNS
      # question, which "Site isolation watch" answers on its own schedule.
      - name: Verify the deployment is cross-origin isolated
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: ./scripts/check-site-isolation-headers.sh "$DEPLOYMENT_URL"

      - name: Verify the production installer
        env:
          INSTALL_URL: https://runmvm.com/install.sh
        run: sh ./scripts/check-published-installer.sh "$INSTALL_URL"
