name: Deploy site to Cloudflare Workers

# Deploy after website source lands on main. Published releases and manual
# dispatch remain supported so release publishing and operator retries keep the
# same deployment path. Product tag pushes are dispatched by release.yml only
# after the release assets exist.
on:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "web/mvm-demo/**"
      - "web/mvm-demo-guest/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:
    inputs:
      install_version:
        description: Stable product release to bake into the deployed installer
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cloudflare-account:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloudflare account credentials
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.127.0"
          command: whoami

  deploy:
    needs: cloudflare-account
    environment:
      name: cloudflare-workers
      url: ${{ steps.deployment.outputs.deployment-url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Dispatched by release.yml's `promote-release` once a fresh install of
      # the tag has booted a microVM. The script refuses anything else: a
      # prerelease, a tag that is not vMAJOR.MINOR.PATCH, or a checksum
      # manifest its release workflow did not sign.
      - name: Bake the published installer version and trust anchors
        if: ${{ inputs.install_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_VERSION: ${{ inputs.install_version }}
        run: sh scripts/pin-installer-default.sh "${INSTALL_VERSION}" install.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: public/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: public/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          # Two targets, two crates: `wasm-pack` builds the browser shim for
          # wasm32-unknown-unknown, and `web/mvm-demo-guest/build.sh` builds the
          # demo guest for wasm32-wasip1. Installing only the first fails the
          # second with `can't find crate for std`, which reads like a toolchain
          # problem rather than a missing target.
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Download verified WebLinux runtime pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/download-qemu-wasm-smoke-pack.sh qemu-wasm-smoke-pack
          ./web/weblinux-demo/build.sh qemu-wasm-smoke-pack

      - name: Build wasm demo
        working-directory: web/mvm-demo
        run: ./build.sh

      - name: Install dependencies
        working-directory: public
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        working-directory: public
        run: pnpm build

      - name: Verify WebLinux bundle is complete
        run: node public/scripts/check-weblinux-deploy-assets.mjs public/dist

      - name: Verify cross-origin isolation headers are staged
        run: |
          if [ ! -f public/dist/_headers ]; then
            echo "ERROR: public/dist/_headers is missing; Cloudflare Workers will not send COOP/COEP headers." >&2
            exit 1
          fi
          echo "OK: public/dist/_headers present"

      - name: Deploy to Cloudflare Workers
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: public
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # `_headers` is inert unless the host reads it, so the only proof that
      # this deployment is cross-origin isolated — and therefore that the
      # WebLinux demo has a SharedArrayBuffer — is the wire. Checked against
      # the deployment URL rather than the production domain: this step can
      # only speak for what it just published. Whether users reach it is a DNS
      # question, which "Site isolation watch" answers on its own schedule.
      - name: Verify the deployment is cross-origin isolated
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: ./scripts/check-site-isolation-headers.sh "$DEPLOYMENT_URL"

      - name: Verify the production installer
        env:
          INSTALL_URL: https://runmvm.com/install.sh
        run: sh ./scripts/check-published-installer.sh "$INSTALL_URL"
