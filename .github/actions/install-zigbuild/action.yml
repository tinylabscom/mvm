name: Install zig + cargo-zigbuild
description: |
  Plan 115 / ADR-065 — install the pinned cross-compile toolchain that
  mvm-cli's build.rs needs to embed the host-vm binaries
  (mvm-host-vm-init, mvm-builderd, mvm-setpriv) for Linux musl targets
  (static; the builder VM rootfs has no FHS dynamic loader).
  Versions are pinned in [workspace.metadata.mvm.toolchain] in the root
  Cargo.toml; keep this action in lockstep.

outputs:
  rust_version:
    description: Rust version from workspace.metadata.mvm.toolchain
    value: ${{ steps.install_rust.outputs.rust_version }}

runs:
  using: composite
  steps:
    - name: Install zig
      shell: bash
      run: |
        set -euxo pipefail
        ZIG_VERSION=0.13.0
        # A self-hosted runner keeps its tools between jobs and its user has no
        # sudo, so the install below would stop at a password prompt. An
        # operator installs the pinned zig once; every later job finds it here.
        if command -v zig >/dev/null 2>&1 && [ "$(zig version)" = "$ZIG_VERSION" ]; then
          echo "zig $ZIG_VERSION already installed at $(command -v zig)"
          exit 0
        fi
        OS=$(uname -s)
        ARCH=$(uname -m)
        # macOS `uname -m` reports arm64; zig's release tarballs are named aarch64.
        [ "$ARCH" = "arm64" ] && ARCH=aarch64
        case "$OS:$ARCH" in
          Linux:x86_64)
            TARGET=linux-x86_64
            SHA256=d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
            ;;
          Linux:aarch64)
            TARGET=linux-aarch64
            SHA256=041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556
            ;;
          Darwin:x86_64)
            TARGET=macos-x86_64
            SHA256=8b06ed1091b2269b700b3b07f8e3be3b833000841bae5aa6a09b1a8b4773effd
            ;;
          Darwin:aarch64)
            TARGET=macos-aarch64
            SHA256=46fae219656545dfaf4dce12fb4e8685cec5b51d721beee9389ab4194d43394c
            ;;
          *)
            echo "::error::no pinned zig binary for $OS/$ARCH" >&2
            exit 1
            ;;
        esac
        TARBALL="zig-${TARGET}-${ZIG_VERSION}.tar.xz"
        WORK=$(mktemp -d)
        trap 'rm -rf "$WORK"' EXIT
        curl -fL --retry 3 --retry-all-errors --retry-delay 2 \
          --connect-timeout 10 --max-time 120 --retry-max-time 300 \
          -o "$WORK/$TARBALL" "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}"
        if [ "$OS" = Darwin ]; then
          printf '%s  %s\n' "$SHA256" "$WORK/$TARBALL" | shasum -a 256 -c -
        else
          printf '%s  %s\n' "$SHA256" "$WORK/$TARBALL" | sha256sum -c -
        fi
        sudo mkdir -p /opt
        sudo tar -xJf "$WORK/$TARBALL" -C /opt
        DIR="${TARBALL%.tar.xz}"
        sudo ln -sf "/opt/${DIR}/zig" /usr/local/bin/zig
        zig version

    - name: Install cargo-zigbuild
      shell: bash
      run: |
        set -euo pipefail
        VERSION=0.23.0
        if command -v cargo-zigbuild >/dev/null 2>&1 \
          && cargo-zigbuild --version | grep -q " ${VERSION}$"; then
          echo "cargo-zigbuild $VERSION already installed at $(command -v cargo-zigbuild)"
          exit 0
        fi

        OS=$(uname -s)
        ARCH=$(uname -m)
        case "$OS:$ARCH" in
          Linux:x86_64)
            TARGET=x86_64-unknown-linux-gnu
            SHA256=c636e4f72b6f40a40ddf0414c8c6056f78b87eea3be0edf01f08d65fa028a373
            ;;
          Linux:aarch64|Linux:arm64)
            TARGET=aarch64-unknown-linux-gnu
            SHA256=5917d5416884cba0f23c2653016f7f2df2ec04e74eb6b259598fecc066f8c429
            ;;
          Darwin:x86_64)
            TARGET=x86_64-apple-darwin
            SHA256=f8c746d12dfae79ac0704c5aa13631a05b24c3e4ee7216eb40f70943bd8ca7b1
            ;;
          Darwin:arm64|Darwin:aarch64)
            TARGET=aarch64-apple-darwin
            SHA256=3d8f1ad296d3f3e97122607f7c972393c6329801027acb71bb7d17a4e30ef092
            ;;
          *)
            echo "::error::no pinned cargo-zigbuild binary for $OS/$ARCH" >&2
            exit 1
            ;;
        esac

        ARCHIVE="cargo-zigbuild-${TARGET}.tar.xz"
        URL="https://github.com/rust-cross/cargo-zigbuild/releases/download/v${VERSION}/${ARCHIVE}"
        WORK=$(mktemp -d)
        trap 'rm -rf "$WORK"' EXIT
        curl -fL --retry 3 --retry-all-errors --retry-delay 2 \
          -o "$WORK/$ARCHIVE" "$URL"
        if [ "$OS" = Darwin ]; then
          printf '%s  %s\n' "$SHA256" "$WORK/$ARCHIVE" | shasum -a 256 -c -
        else
          printf '%s  %s\n' "$SHA256" "$WORK/$ARCHIVE" | sha256sum -c -
        fi
        tar -xJf "$WORK/$ARCHIVE" -C "$WORK"
        mkdir -p "${CARGO_HOME:-$HOME/.cargo}/bin"
        install -m 0755 \
          "$WORK/cargo-zigbuild-${TARGET}/cargo-zigbuild" \
          "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-zigbuild"
        cargo-zigbuild --version

    - name: Install embedded Rust toolchain and guest targets
      id: install_rust
      shell: bash
      # Plan 164 — mvm-cli/build.rs picks the embed target by
      # CARGO_CFG_TARGET_ARCH. On an x86_64 runner it builds the bins
      # natively for x86_64-musl (no zig); a cross path zigbuilds. Add both
      # musl targets so either path resolves regardless of runner arch, and
      # both glibc targets for the guest shared objects that
      # `mvmctl dev guest-bins` cross-compiles.
      #
      # Read without Python: `tomllib` needs 3.11, and the system python3 on
      # macOS is 3.9, so a self-hosted Mac without a newer Python would stop
      # here before installing anything.
      run: |
        set -euo pipefail
        RUST_VERSION=$(awk '/^\[workspace\.metadata\.mvm\.toolchain\]/ { t = 1; next }
          /^\[/ { t = 0 }
          t && $1 == "rust" { gsub(/"/, "", $3); print $3 }' Cargo.toml)
        if [ -z "$RUST_VERSION" ]; then
          echo "::error::no rust pin in [workspace.metadata.mvm.toolchain]" >&2
          exit 1
        fi
        echo "rust_version=${RUST_VERSION}" >> "$GITHUB_OUTPUT"
        rustup toolchain install "${RUST_VERSION}" --profile minimal
        rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl \
          aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu \
          --toolchain "${RUST_VERSION}"
