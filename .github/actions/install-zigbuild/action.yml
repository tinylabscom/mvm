name: Install zig + cargo-zigbuild
description: |
  Plan 115 / ADR-065 — install the pinned cross-compile toolchain that
  mvm-cli's build.rs needs to embed the host-vm binaries
  (mvm-host-vm-init, mvm-egress-proxy) for aarch64-unknown-linux-musl
  (static; the builder VM rootfs has no FHS dynamic loader).
  Versions are pinned in [workspace.metadata.mvm.toolchain] in the root
  Cargo.toml; keep this action in lockstep.

runs:
  using: composite
  steps:
    - name: Install zig
      shell: bash
      run: |
        set -euxo pipefail
        ZIG_VERSION=0.13.0
        # A self-hosted runner keeps its tools between jobs and its user has no
        # sudo, so the install below would stop at a password prompt. An
        # operator installs the pinned zig once; every later job finds it here.
        if command -v zig >/dev/null 2>&1 && [ "$(zig version)" = "$ZIG_VERSION" ]; then
          echo "zig $ZIG_VERSION already installed at $(command -v zig)"
          exit 0
        fi
        OS=$(uname -s)
        ARCH=$(uname -m)
        # macOS `uname -m` reports arm64; zig's release tarballs are named aarch64.
        [ "$ARCH" = "arm64" ] && ARCH=aarch64
        if [ "$OS" = "Darwin" ]; then
          TARBALL="zig-macos-${ARCH}-${ZIG_VERSION}.tar.xz"
        else
          TARBALL="zig-linux-${ARCH}-${ZIG_VERSION}.tar.xz"
        fi
        sudo mkdir -p /opt
        curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" \
          | sudo tar xJ -C /opt
        DIR="${TARBALL%.tar.xz}"
        sudo ln -sf "/opt/${DIR}/zig" /usr/local/bin/zig
        zig version

    - name: Install cargo-zigbuild
      shell: bash
      run: |
        set -euo pipefail

        # crates.io occasionally returns partial downloads on hosted runners.
        # Retry the pinned install instead of failing CI before fmt/clippy run.
        for attempt in 1 2 3; do
          if CARGO_NET_RETRY=10 cargo install cargo-zigbuild --version 0.23.0 --locked; then
            exit 0
          fi

          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi

          sleep "$((attempt * 10))"
        done

    - name: Install embedded Rust toolchain and musl targets
      shell: bash
      # Plan 164 — mvm-cli/build.rs picks the embed target by
      # CARGO_CFG_TARGET_ARCH. On an x86_64 runner it builds the bins
      # natively for x86_64-musl (no zig); a cross path zigbuilds. Add both
      # musl targets so either path resolves regardless of runner arch.
      #
      # Read without Python: `tomllib` needs 3.11, and the system python3 on
      # macOS is 3.9, so a self-hosted Mac without a newer Python would stop
      # here before installing anything.
      run: |
        set -euo pipefail
        RUST_VERSION=$(awk '/^\[workspace\.metadata\.mvm\.toolchain\]/ { t = 1; next }
          /^\[/ { t = 0 }
          t && $1 == "rust" { gsub(/"/, "", $3); print $3 }' Cargo.toml)
        if [ -z "$RUST_VERSION" ]; then
          echo "::error::no rust pin in [workspace.metadata.mvm.toolchain]" >&2
          exit 1
        fi
        rustup toolchain install "${RUST_VERSION}" --profile minimal
        rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl \
          --toolchain "${RUST_VERSION}"
