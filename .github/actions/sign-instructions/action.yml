name: Sign instruction files
description: >
  Prepare, sign, or verify instruction bundles in three separate caller jobs.
  Only the sign job may hold OIDC authority. The caller's workflow identity
  remains the signing identity; this must not become a reusable workflow.

inputs:
  phase:
    description: Required phase (prepare, sign, verify), each in a fresh job.
    required: true
  artifact-name:
    description: Final verified artifact name and intermediate artifact prefix.
    default: instruction-signatures
  retention-days:
    description: Days to retain the final verified artifact.
    default: "90"
  cache-key:
    description: Rust cache key for the unprivileged prepare and verify jobs.
    default: instruction-signing
  cache-save:
    description: Whether an unprivileged job may save its Rust build cache.
    default: "false"

runs:
  using: composite
  steps:
    - name: Refuse the legacy combined mode and misplaced signing authority
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
          echo "::notice::Attempt-bound artifacts require Re-run all jobs; partial retries cannot reuse earlier requests."
        fi
        case "$PHASE" in
          prepare|verify)
            test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
              echo "prepare and verify must run in jobs without id-token: write" >&2
              exit 1
            }
            ;;
          sign)
            test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || {
              echo "sign requires its own job with id-token: write" >&2
              exit 1
            }
            ;;
          *)
            echo "Use phase: prepare, sign, verify in three separate jobs; combined mode is removed." >&2
            exit 1
            ;;
        esac
        state="$(mktemp -d "$RUNNER_TEMP/instruction-signing.XXXXXX")"
        {
          echo "MVM_SIGN_STATE=$state"
          echo "MVM_HOME=$state/mvm"
          echo "MVM_SIGN_SRC=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        } >> "$GITHUB_ENV"

    - name: Install lld for the unprivileged verifier build
      if: ${{ inputs.phase != 'sign' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v ld.lld >/dev/null; then
          timeout 300 sudo apt-get update
          timeout 300 sudo apt-get install -y --no-install-recommends lld
        fi

    - name: Install the pinned Rust toolchain
      if: ${{ inputs.phase != 'sign' }}
      shell: bash
      run: cd "$MVM_SIGN_SRC" && rustc --version

    - name: Restore the Rust build cache
      if: ${{ inputs.phase != 'sign' }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        prefix-key: v1-rust
        shared-key: ${{ inputs.cache-key }}
        workspaces: ${{ env.MVM_SIGN_SRC }} -> target
        save-if: ${{ inputs.cache-save }}

    - name: Build mvmctl without signing authority
      if: ${{ inputs.phase != 'sign' }}
      shell: bash
      run: |
        set -euo pipefail
        cd "$MVM_SIGN_SRC"
        cargo build --locked -p mvmctl --features user --bin mvmctl
        echo "MVM_SIGN_MVMCTL=$MVM_SIGN_SRC/target/debug/mvmctl" >> "$GITHUB_ENV"

    - name: Prepare the source-bound request
      if: ${{ inputs.phase == 'prepare' }}
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/instruction-signing.py" prepare

    - name: Upload the request
      if: ${{ inputs.phase == 'prepare' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.artifact-name }}-request-${{ github.run_attempt }}
        path: ${{ env.MVM_SIGN_STATE }}/request/
        if-no-files-found: error
        retention-days: 1

    - name: Download this attempt's request
      if: ${{ inputs.phase != 'prepare' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.artifact-name }}-request-${{ github.run_attempt }}
        path: ${{ env.MVM_SIGN_STATE }}/request/

    - name: Install cosign only in the signing job
      if: ${{ inputs.phase == 'sign' }}
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      with:
        cosign-release: v2.5.2

    - name: Sign only original tracked source bytes
      if: ${{ inputs.phase == 'sign' }}
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/instruction-signing.py" sign

    - name: Upload candidate bundles (not the verified publication)
      if: ${{ inputs.phase == 'sign' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.artifact-name }}-candidate-${{ github.run_attempt }}
        path: ${{ env.MVM_SIGN_STATE }}/candidate/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1

    - name: Download this attempt's candidate bundles
      if: ${{ inputs.phase == 'verify' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.artifact-name }}-candidate-${{ github.run_attempt }}
        path: ${{ env.MVM_SIGN_STATE }}/candidate/

    - name: Verify the bundles under the calling workflow's identity
      if: ${{ inputs.phase == 'verify' }}
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/instruction-signing.py" verify

    - name: Upload only verified bundles
      if: ${{ inputs.phase == 'verify' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ env.MVM_SIGN_STATE }}/verified/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
