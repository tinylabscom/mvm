# Nightly-only contributor build settings. Keep these separate from
# `.cargo/config.toml`: release, MSRV, and compatibility lanes explicitly use
# stable toolchains and must remain able to load the workspace configuration.

[build]
rustflags = ["-Z", "threads=8"]

# Target-specific rustflags take precedence over `[build].rustflags`, so the
# Linux targets repeat the frontend setting while retaining the fast linker.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-Z", "threads=8", "-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-Z", "threads=8", "-C", "link-arg=-fuse-ld=lld"]

[unstable]
codegen-backend = true

# Cranelift is for the edit/build/run loop only. Test and release artifacts keep
# LLVM so panic unwinding and optimized shipped binaries retain their existing
# behavior.
[profile.dev]
codegen-backend = "cranelift"

[profile.test]
codegen-backend = "llvm"

[profile.release]
codegen-backend = "llvm"

# Bindgen declares aws-lc's C functions with a `\u{1}` link name, which LLVM
# reads as "use this symbol verbatim" and Cranelift does not: on macOS it adds a
# second leading underscore, so a Cranelift-compiled caller asks the linker for
# a symbol aws-lc does not define, and on Linux the reference is left
# unresolved. The image-set signature verifier in the default build reaches
# aws-lc through these crates, so they compile with LLVM here too. `rustls` is
# among them because aws-lc-rs's generic and inline functions are instantiated
# in the calling crate's own codegen units. A new undefined `aws_lc_*` symbol at
# link time names the next crate to add: the linker's `>>>` lines name the
# object file that referenced it.
[profile.dev.package.aws-lc-sys]
codegen-backend = "llvm"

[profile.dev.package.aws-lc-rs]
codegen-backend = "llvm"

[profile.dev.package.sigstore-crypto]
codegen-backend = "llvm"

[profile.dev.package.rustls]
codegen-backend = "llvm"
