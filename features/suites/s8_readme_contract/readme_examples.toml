# What proves each README example works.
#
# One entry per distinct `mvmctl` invocation the README prints. Exactly one of:
#
#   witness           a @live scenario that boots a guest running this shape
#   hermetic_witness  a scenario that really executes it but boots no guest,
#                     because there is no guest to boot; needs `reason`
#   exempt            why it cannot be executed at all
#
# The witness is checked, not trusted: it must resolve to the same verb and
# carry at least the same flags, with short and long spellings reconciled
# against the real command. Naming a scenario that happens to mention the verb
# is what the per-command-path tier already did, and it is how `machine run
# --image alpine -it -- /bin/sh` sat in this README while its guest console
# failed on every OCI image.
#
# `witness` additionally has to be @live. A hermetic refusal scenario matches
# the same verb and flags while proving the command does *not* work — the `-it`
# example matched "machine run refuses an interactive PTY without a terminal"
# before that rule existed.

# ── Transient machines ───────────────────────────────────────────────────────

[[example]]
command = "mvmctl image pull alpine"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented preparation commands populate images and standbys explicitly"

[[example]]
command = "mvmctl image pull python:3.12"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented preparation commands populate images and standbys explicitly"

[[example]]
command = "mvmctl machine run --name local-demo --profile dev --image \"${MVM_DEMO_IMAGE:?Run preparation in this terminal first}\" --cpus 1 --memory 256M --timeout 30 -- /bin/sh -c 'printf \"hello from a microVM\\n\"; /bin/uname -s'"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented local demo run boots a cached image and leaves no record"

[[example]]
command = 'mvmctl machine run --image python:3.12 --mount "$PWD/examples/python/hello-app:/work:ro" -- python /work/app.py'
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::--mount shares a host directory the workload can read"

[[example]]
command = "mvmctl machine run --image alpine -it -- ls /"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::an interactive run resolves a bare command from the image path"

[[example]]
command = "mvmctl machine run --image alpine --cpus 2 --memory 512M --allow-host api.example.com:443 -- ./fetch"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::--cpus, --memory and --allow-host on one launch"

[[example]]
command = "mvmctl machine run --flake . -- ./app"
witness = "suites/s5_lifecycle/transient_sandbox_boot.feature::machine run boots a transient sandbox from a Nix flake"

# ── Persistent machines ──────────────────────────────────────────────────────

[[example]]
command = "mvmctl image pull nginx"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented preparation commands populate images and standbys explicitly"

[[example]]
command = "mvmctl machine create web --image nginx --cpus 2 --memory 512M"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented persistent machine lifecycle operates one guest"

[[example]]
command = "mvmctl machine start web"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented persistent machine lifecycle operates one guest"

[[example]]
command = "mvmctl machine exec web -- nginx -v"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented persistent machine lifecycle operates one guest"

[[example]]
command = "mvmctl machine logs web"
witness = "suites/s32_documented_surface/machine_journey.feature::the guest reports its own state"

[[example]]
command = "mvmctl machine reconfigure web --memory 1G"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented persistent machine lifecycle operates one guest"

[[example]]
command = "mvmctl machine stop web"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented persistent machine lifecycle operates one guest"

[[example]]
command = "mvmctl machine rm web"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented persistent machine lifecycle operates one guest"

[[example]]
command = "mvmctl machine ps"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented persistent machine lifecycle operates one guest"

[[example]]
command = "mvmctl machine inspect web"
witness = "suites/s31_launch_e2e/cli_launch_modes.feature::the documented persistent machine lifecycle operates one guest"

# ── Host setup ───────────────────────────────────────────────────────────────

[[example]]
command = "mvmctl bootstrap"
witness = "suites/s31_launch_e2e/documented_setup.feature::bootstrap succeeds and reports a ready host"

[[example]]
command = "mvmctl doctor --workflow cli-run"
witness = "suites/s31_launch_e2e/documented_setup.feature::doctor --workflow cli-run reports the host ready for the documented demo"

[[example]]
command = "mvmctl machine build --flake ."
witness = "suites/s29_doc_examples/documented_build_live.feature::the documented flake build produces an image"

[[example]]
command = "mvmctl machine build --flake ./out"
witness = "suites/s29_doc_examples/documented_build_live.feature::the documented flake build produces an image"

[[example]]
command = "mvmctl dev compile app.py --out ./out"
witness = "suites/s31_launch_e2e/sdk_and_library_modes.feature::a decorator workload compiles from its source file"

[[example]]
command = "mvmctl machine run --entrypoint --flake ./out"
witness = "suites/s29_doc_examples/documented_build_live.feature::the documented entrypoint launch runs the compiled workload"

[[example]]
command = "mvmctl run --mode plan ./script.py"
witness = "suites/s31_launch_e2e/sdk_and_library_modes.feature::a runtime-SDK script admits as a signed plan without booting"
