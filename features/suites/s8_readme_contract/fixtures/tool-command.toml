[overrides.tools]
allow = ["shell"]

[overrides.tools.detail.shell]
executable = "/bin/sh"
argv = ["/bin/sh -c *"]
# A bare `id` command line is denied even though the argv pattern above
# admits it: the live lane exercises both an allowed and a denied
# workload-origin invocation through the in-guest shim.
deny = ["/bin/sh -c id"]
# A declared route makes every allowed invocation bound, so the live lane
# exercises the guest starting the command in its own attributed session.
routes = ["example.com:443"]
