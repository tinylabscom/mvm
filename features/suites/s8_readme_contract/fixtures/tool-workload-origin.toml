[overrides.network]
allow = ["httpbingo.org:443"]

[[overrides.secrets.bind]]
name = "tool-live"
hosts = ["httpbingo.org"]

[overrides.tools]
allow = ["python"]

[overrides.tools.detail.python]
executable = "/usr/local/bin/python3"
argv = ["/usr/local/bin/python3 -c *", "/usr/local/bin/python3 -h"]
deny = ["/usr/local/bin/python3 -h"]
routes = ["httpbingo.org:443"]
secrets = ["tool-live"]
