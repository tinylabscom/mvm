# Verification tier for every command path the documentation uses.
#
#   parse  the real clap tree parses the invocation, with full argument
#          validation. Every documented example gets at least this.
#   exec   additionally executed for real against an isolated MVM_HOME.
#          Only for commands that touch nothing outside that home, reach no
#          network, and boot no VM.
#   live   additionally boots a real microVM (the @live scenarios).
#
# A lookup falls back to the longest registered prefix, so a group entry
# covers its leaves unless a leaf overrides it. The assignment is total: a
# documented path with no entry here fails the coverage scenario by name.

[[command]]
path = "bootstrap"
tier = "parse"

[[command]]
path = "build compile"
tier = "parse"

[[command]]
path = "build kernel build"
tier = "parse"

