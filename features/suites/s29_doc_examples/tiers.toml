# Documented as future syntax. Each entry must stay absent from the CLI: the
# suite fails if one ships, so the docs get updated when it does.
[[planned]]
path = "manifest push"
reason = "registry sharing is designed but unimplemented; the docs mark the section planned"

[[planned]]
path = "manifest pull"
reason = "registry sharing is designed but unimplemented; the docs mark the section planned"

# Commands the docs name while correctly describing them as gone or not yet
# built. Each must stay absent: the suite fails if one ships, so a doc that
# says "the former X" cannot outlive X's removal.
[[absent]]
path = "security"
reason = "folded into `doctor`; the CLI reference documents the fold in the past tense"

[[absent]]
path = "flake"
reason = "renamed to `build validate`; the reference records the rename"

[[absent]]
path = "dev"
reason = "removed with `dev import-image`; the airgap and release guides describe its removal"

[[absent]]
path = "policy"
reason = "deliberately not a public verb — the reference says policy authoring lives in mvmd"

[[absent]]
path = "addon"
reason = "the addon CLI is unbuilt; the migration guide says 'once the addon CLI lands'"

[[absent]]
path = "exec"
reason = "the bare verb was merged into `run`; the CLI reference records the merge in the past tense"

# mkGuest attributes the docs teach that its argument set does not accept.
# Declared rather than deleted: these describe intended surface, and removing
# the sections would lose the design. Each must stay absent — the suite fails
# if one lands, so the docs get their "not implemented" note removed when it
# becomes untrue.
[[nix_attribute]]
name = "healthChecks"
reason = "per-service health probes are documented in the mkGuest guide but absent from nix/lib/mk-guest.nix"

[[nix_attribute]]
name = "volumeMounts"
reason = "declared virtio-fs mounts are documented with a passthru.volumeMounts contract that mk-guest.nix never emits"

[[nix_attribute]]
name = "serviceGroup"
reason = "service grouping is documented in the mkGuest guide but absent from nix/lib/mk-guest.nix"
